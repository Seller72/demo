<head>

<title>Дзам — автомойка, Сургут</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--c1:#0b5d3f;--c2:#3cc47c;--c1d:#08452f;--tint:#eaf7f0;--ink:#16211c;--muted:#5f6b66;--line:#e2e8e5;--bg:#f7f9f8;--star:#f2a20c;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.15;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:700 16px Manrope,sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-main{background:var(--c2);color:var(--c1d)}
.btn-line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn-wa{background:#25d366;color:#fff}
.btn-soft{background:var(--tint);color:var(--c1)}
.sec{padding:72px 0}
.sec h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin-bottom:10px}
.lead{color:var(--muted);font-size:17px;max-width:680px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c1);margin-bottom:10px}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo .mk{width:40px;height:40px;border-radius:12px;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.logo b{display:block;font-size:19px;font-weight:800;color:var(--c1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:600}
nav{display:flex;gap:20px;margin-left:auto}
nav a{text-decoration:none;font-size:15px;font-weight:600;color:#33403a}
nav a:hover{color:var(--c1)}
.hd-call{text-decoration:none;font-weight:800;font-size:17px;white-space:nowrap;color:var(--c1);text-align:right}
.hd-call small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.hd-call small b{color:#1a9b55}
.hd-call small b.cl{color:#d0482f}

.hero{background:radial-gradient(900px 420px at 85% 0,rgba(255,255,255,.14) 0,transparent 60%),linear-gradient(160deg,var(--c1d),var(--c1));color:#fff;padding:60px 0 70px}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;margin-bottom:18px}
.tag .st{color:#ffd166}
.hero .ext{font-size:16px;font-weight:600;opacity:.85;margin-bottom:6px}
.hero .ext::first-letter{text-transform:uppercase}
.hero h1{font-size:clamp(36px,5.4vw,60px);font-weight:800;margin-bottom:16px}
.rub{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.rub span{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
.hero-card{background:#fff;color:var(--ink);border-radius:22px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.22)}
.hc-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hc-row:last-child{border-bottom:0}
.hc-row .ic{font-size:20px;width:26px;flex:none}
.hc-row small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.hc-row a{text-decoration:none;font-weight:700}

/* prices */
.ptools{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;align-items:center}
.ptools input{flex:1 1 240px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:15px Manrope,sans-serif;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.plist{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcat{padding:12px 20px;background:var(--tint);font-weight:800;font-size:15px;color:var(--c1)}
.prow{display:flex;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
.prow b{font-weight:700;display:block}
.prow small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;white-space:pre-line}
.prow .pv{font-weight:800;white-space:nowrap;color:var(--c1)}
.pnote{font-size:13px;color:var(--muted);margin-top:12px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;font-weight:700;display:flex;gap:12px;align-items:center}
.svc .dot{width:12px;height:12px;border-radius:50%;background:var(--c2);flex:none}

/* info */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.box h3{font-size:18px;font-weight:800;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right;font-weight:700}
.hours tr.today td{color:var(--c1)}
.attrs h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px}
.attrs h4:first-child{margin-top:0}
.attrs .t{display:flex;flex-wrap:wrap;gap:6px}
.attrs .t span{background:var(--tint);color:var(--c1);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}

/* reviews */
.rv-top{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;margin-top:24px}
.score b{font-size:56px;font-weight:800;color:var(--c1);line-height:1}
.score .st{color:var(--star);font-size:18px;letter-spacing:2px}
.score small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.bars{display:grid;gap:6px;max-width:440px;font-size:14px}
.bar{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center}
.tr{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.tr span{display:block;height:100%;background:var(--star);border-radius:99px}
.rv-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.rv-tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.rv-tabs button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.rv-grid{columns:3 300px;column-gap:16px;margin-top:20px}
.rv{break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.rv.neg{border-color:#f0d3cb;background:#fffaf8}
.rv .rs{color:var(--star);letter-spacing:1px}
.rv .rs i{font-style:normal;color:#d7ddda}
.rv p{margin:8px 0 12px;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.rv .who{font-size:14px;font-weight:700}
.rv .who small{color:var(--muted);font-weight:500}
.rv .ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:14px;white-space:pre-line}
.rv .ans b{display:block;font-size:12.5px;color:var(--c1);margin-bottom:4px}
.more{text-align:center;margin-top:8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* contacts */
.ct-sec{background:linear-gradient(160deg,var(--c1d),var(--c1));color:#fff}
.ct-sec .eyebrow{color:#fff;opacity:.8}
.ct-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;margin-top:28px}
.ct{display:grid;gap:12px;align-content:start}
.ct-item{display:flex;gap:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:16px 18px}
.ct-item .ic{font-size:22px;flex:none}
.ct-item small{display:block;opacity:.75;font-size:12.5px;font-weight:600}
.ct-item a{text-decoration:none;font-weight:700}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.14);text-decoration:none;font-size:14px;font-weight:600}
.map{border-radius:var(--r);overflow:hidden;min-height:400px;background:rgba(255,255,255,.1)}
.map iframe{width:100%;height:100%;min-height:400px;border:0;display:block}

footer{background:#0d1512;color:#9aa9a2;padding:26px 0;font-size:13.5px}
.ft{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:16px;z-index:60;display:none;gap:10px}
.fab a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);text-decoration:none;font-size:24px;background:var(--c2)}
.fab a.w{background:#25d366}
.fab svg{width:28px;height:28px;fill:#fff}

@media(max-width:980px){
 nav{display:none}
 .hero-grid,.info-grid,.ct-grid{grid-template-columns:1fr}
 .svc-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
 .wrap{padding:0 16px}
 .sec{padding:52px 0}
 .hero{padding:38px 0 50px}
 .hd{gap:10px;height:62px}
 .logo small{display:none}
 .hd-call{margin-left:auto;font-size:15px}
 .svc-grid{grid-template-columns:1fr}
 .hero-btns .btn{flex:1 1 100%}
 .hero-card{padding:18px 16px}
 .rv-top{grid-template-columns:1fr;gap:16px}
 .prow{flex-direction:column;gap:4px}
 .fab{display:flex}
}
</style>
</head>

: "14 июня 2026", "n": "Зухра З.", "a": null}, {"r": 5, "t": "Мойка супер. Моют быстро и качественно", "d": "14 июня 2026", "n": "Гульнара", "a": null}, {"r": 5, "t": "Отличная мойка, есть с чем сравнивать, рекомендую👍", "d": "14 июня 2026", "n": "Зу", "a": null}, {"r": 5, "t": "Являюсь постоянным клиентом, всё устраивает.", "d": "14 июня 2026", "n": "Руслан Б.", "a": null}, {"r": 1, "t": "Просто издевательское отношение!\nПриехала на мойку, сказала что нужно помыть…. В итоге с моей машиной работал 1 человек, а в соседнем павильоне 1 машину обрабатывали аж 3 человека!!! А потом дружно сидели на лавочке, пока все тот же 1 человек занимался моей машиной….. попросила помочь товарищу наконец домыть мою машину потому что на мытье кузова и ковриков уже и так было слишком много времени затрачено…. Ребята конечно с лавки встали, но вот помощи я не увидела! Через недолгое время мне сообщили что машина готова….\nПодхожу к готовой машине, а она вся мокрая, лобовое стекло дворниками протерла - сбоку грязь собралась и всё тот же 1 бедолага вокруг нее ходит!\nПришлось взять СВОЮ тряпку и САМОЙ протирать свою машину после мойки, за которую были уплачены деньги!\nВ это время ребята спокойно ходили вокруг, администратор вообще сделал вид, как будто ни при чем….\nВ общем, хотите чтобы к вам максимально неуважительно отнеслись, плохо и долго мыли машину - вам сюда!", "d": "13 июня 2026", "n": "Наталья М.", "a": {"t": "Обязательно примем меры по этому замечанию.Приносим извинения .", "d": "22 июня 2026"}}, {"r": 1, "t": "Помыли машину 11.06 на 3 тысячи\nТряпка после того как \"протерли\"\nПродули машину, ответ убил да она все равно будет с брызгами😡😡", "d": "11 июня 2026", "n": "Азалия Б.", "a": {"t": "Азалия,надо чаще мыть машину.Не один раз в год а хотя бы два раза.", "d": "22 июня 2026"}}, {"r": 5, "t": "Добрый день не давно был на вашам мойке,помыли качественно николай предложил воск и сделал чернениее резины бесплатно хороша мойка всем советую", "d": "11 июня 2026", "n": "Городско "r": 5, "t": "Сегодня заехал на мойку,мойщик Николай казах,отмыл машину отлично,постелил коврик перед машиной,чернение резины в подарок.отличная мойка.спасибо отличная мойка", "d": "9 марта 2026", "n": "Рустам Х.", "a": null}, {"r": 5, "t": "Мойка дзам отличная всем советую, отдельное спасибо Николаю и молодому парнишке Роману , замечали каждую часть машины , уехал с отличным настроением и чистой машиной, буду ездить только на автомойку Дзам , огромное спасибо", "d": "21 февраля 2026", "n": "Рома", "a": null}, {"r": 5, "t": "Мойка Дзам супер, недавно ездила помыть машину, очень хорошо помыл машину Роман, уделял внимание каждой капельке, наблюдала за мойкой .Будем чаще заезжать и просить именно романа помыть, цены вообще шикарные , очередь к Роману не занимать пожалуйста , молодой красивый парнишка😁", "d": "21 февраля 2026", "n": "Алина А.", "a": null}, {"r": 5, "t": "Четкая мойка моют машины очень хорошо отдельно хотел сказать спасибо работнику Роману все сделал четко побольше бы таких работников", "d": "21 февраля 2026", "n": "Ахмедушка ж.", "a": null}, {"r": 5, "t": "отличная автомойка,все быстро и качественно,работнику роману особенно спасибо,часто к нему заезжаю,еще не разу не огорчил,всем советую", "d": "21 февраля 2026", "n": "Артем ж.", "a": null}, {"r": 5, "t": "всё четко был не давно помыли с кайфом и цены адекват", "d": "21 февраля 2026", "n": "Это-Что И.", "a": null}, {"r": 5, "t": "Третий раз попадаю к Николаю в 4 й бокс,помыл от души ,постелил коврик под ноги,мелочь а приятно.советую всем мойку дзам .Всем добра.", "d": "16 февраля 2026", "n": "Мавлуд Ш.", "a": null}, {"r": 5, "t": "Помыли быстро и качественно, отдельное спасибо мойщику Антону", "d": "12 февраля 2026", "n": "Городской ж.", "a": null}, {"r": 5, "t": "Вчера был на Мойке попал к Николаю за 30 минут сделал комплекс,помыл идеально,даже постелил коврик под ноги .Очень понравилась его работа. Спасибо.Всем советую Мойку Дзам", "d": "11 февраля 2026", "n": "Абдуразак С.", "a": null}, {"r": 5, "t": "Мойка расположена удобно. Много боксов рабают. Отлично помыл мне машину работник Николай. Есть помещение, где можно посмотреть телевизор и выпить кофе.", "d": "7 февраля 2026", "n": "Аркадий Г.", "a": null}, {"r": 5, "t": "4 бокс , Николай помыл хорошо , коврик постелил. Все ок.", "d": "6 февраля 2026", "n": "Алексей И.", "a": null}, {"r": 5, "t": "Очень понравилась автомойка быстро и качественно. Отдельное спасибо автомойщику Коле казаху очень ответственно подошел к своей работе.", "d": "5 февраля 2026", "n": "Павел П.", "a": null}, {"r": 5, "t": "Четвертый год езжу на эту мойку .Попал первый раз к Николаю казаху,не успел с ходить в кафе Барака, машина стала как новая,спасибо ему незнаю откуда они его взяли такого шустрого,все сделал по высшему классу,даже коарик постелил под ноги.Мойка шикарная.", "d": "2 февраля 2026", "n": "Георги", "a": null}, {"r": 5, "t": "Четвертый год езжу на эту мойку .Попал первый раз к Николаю казаху,не успел с ходить в кафе Барака, машина стала как новая,спасибо ему незнаю откуда они его взяли такого шустрого,все сделал по высшему классу,даже коарик постелил под ноги.Мойка шикарная.", "d": "2 февраля 2026", "n": "Георги", "a": null}, {"r": 5, "t": "\"Отличная автомойка! Порадовало, что здесь уделяют внимание каждой мелочи – от качества воды до вежливости персонала. Машина теперь блестит, как новая. Буду приезжать снова и снова!\"", "d": "26 января 2026", "n": "Городской ж.", "a": null}, {"r": 5, "t": "Езжу на эту мойку не один год уже, очень хороший коллектив, работают шустро, по-настоящему качественная работа, мойка в чистоте . Стараюсь попасть к Николаю в 4 й бокс. Советую всем автомойку Дзам", "d": "26 января 2026", "n": "Савелий Р.", "a": null}, {"r": 5, "t": "Николай казах, мойщик из 4го бокса, совместно со стажёром, помыли Прадо150 на отлично!!!\nЦена в 1000 рублей за кузов и коврики, немного куснула… Правда разрешение хозяина комплекса Дзам, покурить в тёплом помещении (на улице было -34С), компенсировало моё расстройство :)", "d": "23 января 2026", "n": "Mikhail B.", "a": null}, {"r": 5, "t": "Быстро и хорошо отмыли машину, комфортная зона ожидания, спасибо за работу! Рекомендую 👍🏻", "d": "11 января 2026", "n": "Ксения О.", "a": null}, {"r": 5, "t": "Отличная автомойка!\nСпасибо персоналу - работают быстро и качественно! Если есть клинты в очереди- работают сверхурочно.", "d": "18 декабря 2025", "n": "Наталия А.", "a": null}, {"r": 5, "t": "Азамат а ты точно на этой автомойке был или может что нибудь путаешь?!!это единственная автомойка где моют тёплой водой и моют в любое время года и в дождь и холод лютый более 10 лет именно там все свои автомобили мыл и не разу мне там не отказали вымыть и бывало даже такое что под закрытие загонял автомобиль!зачем наговаривать на сервис?", "d": "17 декабря 2025", "n": "Константин С.", "a": null}, {"r": 5, "t": "Отличная автомойка!!! Машина вышла блестящей — грязь, соль и пятна исчезли полностью. Работают аккуратно. Персонал вежливый, ждать пришлось совсем немного. Цены адекватные, а результат — выше всяких похвал. Теперь только сюда!", "d": "17 декабря 2025", "n": "Александра О.", "a": null}, {"r": 5, "t": "Очень хорошая мойка. Постоянно мою там машину. Результатом доволен. Рекомендую данную мойку. Бережное отношение к автомобилю.", "d": "27 ноября 2025", "n": "Городской ж.", "a": null}, {"r": 5, "t": "Моют быстро и хорошо! Много лет приезжаем на эту мойку.", "d": "24 ноября 2025", "n": "Кристина Ц.", "a": null}, {"r": 5, "t": "Здравствуйте!\nБольше 10 лет приезжаю мыть машину на автомойку Дзам. Пока находишься в комнате ожидания, ребята быстро и при этом хорошо моют автомобиль. Всегда учитывают пожелания клиента, вежливы и приветливы. Ни разу не слышала никаких скандалов здесь. В таком деле, как и в любом другом, важно правильно организовать, научить и контролировать рабочий процесс. Удачи вам, ребята, работать в команде и хороших клиентов! Сохраняйте качество работы.", "d": "23 ноября 2025", "n": "Ольга В.", "a": null}, {"r": 5, "t": "Несколько ле ": "Хорошая автомойка 👍 и цены адекватные 👍", "d": "23 октября 2024", "n": "Илья", "a": null}, {"r": 5, "t": "Быстро (около 15-20 минут) комфортно, по приятной цене! В след. раз приеду к вам! Советую данную мойку!", "d": "15 октября 2024", "n": "Богдан А.", "a": null}, {"r": 5, "t": "Цена качество супер", "d": "3 августа 2024", "n": "Артём Б.", "a": null}, {"r": 5, "t": "Хороший сервис. Внимательные сотрудники. Отличная работа", "d": "3 августа 2024", "n": "Евген и.", "a": null}, {"r": 5, "t": "Хорошо моют и относительно не долго!", "d": "6 июля 2024", "n": "Сергей С.", "a": null}, {"r": 5, "t": "Ребята работают отлично! Двигатель как новый! Молодцы! Только здесь обслживаюсь!", "d": "5 июля 2024", "n": "Оксана С.", "a": null}, {"r": 5, "t": "Не дорого, быстро, качественно, рекомендую!! Ребята знают свое дело!!!", "d": "2 июля 2024", "n": "Mixes P.", "a": null}, {"r": 5, "t": "Благодарю за качественный и быстрый сервис👍👍👍", "d": "27 июня 2024", "n": "Любовь В.", "a": null}, {"r": 5, "t": "Отличная мойка, вежливый персонал, отлично моют машины, не экономят средст и времени, заинтересованы в качестве оказываемых услуг, рекомендую эту мойку", "d": "25 июня 2024", "n": "Ася А.", "a": null}, {"r": 5, "t": "Мыла автомобиль после зимы, отлично все отмыли, пропылисосили. Вежливый персонал, комната ожидания с кондиционером, что немаловажно в жаркие дни)) все понравилось, спасибо!!! Рекомендую всем!))", "d": "25 июня 2024", "n": "Наталья К.", "a": null}, {"r": 5, "t": "Спасибо огромное мастеру Али за грамотную и быструю работу!", "d": "24 июня 2024", "n": "Роман С.", "a": null}, {"r": 5, "t": "В целом хорошая автомойка, и моют тоже не плохо.\nИ самое главное без каких либо накруток цен! Рекомендую!", "d": "20 июня 2024", "n": "Павел К.", "a": null}, {"r": 5, "t": "Одна из лучших моек авто. Ребята молодцы,работу свою делают быстро и на совесть. После мойки всё протёрли насухо без каких либо разводов.Нет никаких претензий.", "d": "20 июня 2024", "n": "Прасковья К.", "a": null},  "Одна из лучших моек в городе. Машину моют в две руки, от этого быстрее, плюс несколько боксов, что сокращает ожидание и цены, оптимальные на мой взгляд. Ну и конечно результат, после мойки всегда осматриваю машину, проверяю труднодоступные места и машина чистая, уезжаю довольная и без нареканий.", "d": "10 мая 2023", "n": "Эльмира Н.", "a": null}, {"r": 5, "t": "Хорошая и качественная мойка автомобиля. Всегда быстрое и вежливое обслуживание.", "d": "10 мая 2023", "n": "Анна З.", "a": null}, {"r": 5, "t": "Ребята молодцы! Стараются, работают на совесть и стоимость адекватная. В Сити Молле дороже и помыли машину так, что больше туда не ногой. Рекомендую однозначно!", "d": "9 мая 2023", "n": "Ольга Ж.", "a": null}, {"r": 5, "t": "Хорошая мойка) вежливый персонал,быстро и качественно)советую", "d": "6 мая 2023", "n": "Антон Ф.", "a": null}, {"r": 5, "t": "Мойка норм. Претензий не было", "d": "5 мая 2023", "n": "Алексей В.", "a": null}, {"r": 5, "t": "Всё норм, близко с домом.", "d": "5 мая 2023", "n": "Ильнур З.", "a": null}, {"r": 3, "t": "Мойка норм.. Но... Стоишь около часа в очереди .. И вдруг откуда не возьмись перед твоим носом.. Когда подошла моя очередь выруливает самый торопливый. просто отдает ключи админу..загнали и помыли..\nА вы подождите.. Неприятно и противно.", "d": "4 мая 2023", "n": "Татьяна К.", "a": null}, {"r": 5, "t": "Огромное спасибо ребятам за то, что приняли меня после окончания рабочего дня!! Помыли мою машину быстро и качественно! Улыбчивый и добрый персонал. Благодарю, приеду еще!!", "d": "4 мая 2023", "n": "Кристина А.", "a": null}, {"r": 5, "t": "Автомойка на четыре бокса,моют быстро качественно,мне понравилось.Сейчас хочу двигатель помыть,поеду к ребятам.", "d": "2 мая 2023", "n": "Олег Б.", "a": null}, {"r": 5, "t": "Молодцы!!! Моют быстро, чётко!!! Тряпочки бы поменять , а так очень хорошая мойка, уже лет 15 сюда постоянно езжу!!! Каждая 6 мойка бесплатная!!! Рекомендую!!!!", "d": "1 мая 2023", "n": "Евгений Д.", "a": null}, {"r": 5, "t": "Ребята молодцы работу свою делают быстро и на совесть. После мойки всё протёрли насухо без каких либо разводов, салон идеально. Ни каких притензий, только положительные эмоции. Молодцы!", "d": "1 мая 2023", "n": "Артур Р.", "a": null}, {"r": 5, "t": "Быстро, качественно", "d": "1 мая 2023", "n": "Ilya I.", "a": null}, {"r": 5, "t": "Оказывается можно занять очередь без наличия Машины 😨 обидно когда стоишь час… а тут приезжает орёл и перед тобой заезжает- ему видите ли заняли🫤 Короче чтобы не будоражить очередь- просто нужно искоренить такую возможность занимать без машины, каждый должен отстоять своё🖐️ А так Мойка Норм👍", "d": "29 апреля 2023", "n": "Вадим Л.", "a": null}, {"r": 2, "t": "Если пусто и срочно надо помыть машину то кое как сойдет. Ценник дикий.", "d": "14 апреля 2023", "n": "Честный О.", "a": null}, {"r": 2, "t": "Судя по вывеске, заведение работает до 22:00. Но в 21:30 избушка, что называется, была на клюшке. Предлагаю владельцам поменять заявленный режим работы, дабы не вводить потенциальных клиентов в заблуждение. Особенно тех, кто ехал к ним специально… Или хотя бы свой номер телефона в 2 ГИС оставить для уточнения графика (записи, и тд)", "d": "5 апреля 2023", "n": "Светлана К.", "a": null}, {"r": 1, "t": "Очень плохая мойка за 700 рублей помыли кузов очень плохо, не пылесосили внутри салона.", "d": "24 марта 2023", "n": "сергей п.", "a": null}, {"r": 1, "t": "Отвратительно помыли. Не советую", "d": "21 марта 2023", "n": "Пользователь С.", "a": null}, {"r": 1, "t": "Был 4 раза, машину не домывают: пена грязь не разъедает, всë в разводах. Колёса грязные. Мойщики ходят с недовольными ********. Половину оплаченных услуг не делают.", "d": "16 марта 2023", "n": "Jeka", "a": null}, {"r": 3, "t": "Отдали машину на мойку, помыли ужасно, ходила показывала на Косяки, вышел администратор, и говорит недовольным тоном, если нам тут каждый клиент будет показывать на все косяки...Вам тут не автосалон, где помыть должны идеально! Я считаю если я заплатила за Вашу работу, то будьте добры делайте свою работу качественно.", "d": "15 февраля 2023", "n": "Елена К.", "a": null}, {"r": 2, "t": "Очень дорого, комплекс на гранту 1150!", "d": "26 декабря 2022", "n": "Контер Х.", "a": null}, {"r": 1, "t": "Подъехал 20:15 мертвая тишина, все на распашку", "d": "26 ноября 2022", "n": "Руслан Б.", "a": null}, {"r": 5, "t": "Простая, хорошая мойка, быстро, посидеть есть где, единственно очереди очень большие...", "d": "23 ноября 2022", "n": "Алексей В.", "a": null}, {"r": 1, "t": "Крайне не советую.", "d": "25 октября 2022", "n": "Максим Т.", "a": null}, {"r": 1, "t": "Подъехал в 20:45, закрываются в 22:00. Все боксы открыты, заезжай в любой. Медленно проехал, никого. Развернулся, мордой встал в бокс, типа хочу заехать. Выбежал один и стал объяснять, что мойка не работает, сделали генеральную уборку и поэтому не моют. Уже почти уехал, вернулся. Спросил, почему тогда боксы открыты, в ответ только улыбаются. Бригадир им сказал генералить и не принимать.\r\nНе хотят работать. Больше не поеду.", "d": "12 сентября 2022", "n": "sergey s.", "a": null}, {"r": 1, "t": "Космические цены, VESTA 1100₽ Комплекс 🤣🤣", "d": "9 сентября 2022", "n": "Курбан М.", "a": null}, {"r": 1, "t": "Всегда мыли машину здесь . На этой недели приехала поздно вечером , был занят один бокс, заехала . Какой то новый чувак ( впервые его вижу) с такой мордой и взглядом встретил как будто я ему что то должна ни здрасьте , не до свидания… сели в комнату ожидания мин 5 машину даже не начинали мыть сидели на лавочке толпой , помимо этого салон сделали вид что протерли, как были разводы так и остались . После окончании мойки я ещё не выехала с бокса , тот самый с недовольной м… начал керхером спаласкивать стены и забрызгал мне машину.. меняю мойку, благодаря такому отношению . Так держать", "d": "13 августа 2022", "n": "Юлия Ж.", "a": null}, {"r": 5, "t": "Хорошая автомойка, отмыли, протерли. Никаких нареканий. Чисто и быстро", "d": "22 июня 2022", "n": "Lenka L.", "a": null}, {"r": 1, "t": "Приехал в 19, в очереди никого, все боксы свободны, передо мной только выехала машина. Спрашиваю у уходящих мойщиков - работают вообще или нет. Сказали, что мойка работает, и ушли. Захожу, никого нет. Пошел в их подсобку, кричу - не отзываются. Крикнул громче и тут рядом со мной в комнате откликнулись - нэ, нэ, не работаем, сидит в телефоне \"работник\". Спрашиваю - не работаете? Нэт. Нормально, думаю, собирался уехать, сижу в машине, через несколько минут пришел другой работник и сказал заезжать. Офигенный сервис. Гнать в шею таких \"мойщиков\", что сидят там, штаны протирают.", "d": "9 июня 2022", "n": "Sergey I.", "a": null}, {"r": 1, "t": "Приехал к 21.00 а они работают до 22.00 больше не приеду", "d": "4 июня 2022", "n": "Опа", "a": null}, {"r": 1, "t": "Х$йня, а не мойка. Пропихивают своих дружков без очереди. Занял очередь 4м, а оказался 8м. Моют вроде норм, но вот протирают хреново, вся машина в каплях. Больше туда не поеду и никому не советую.", "d": "18 апреля 2022", "n": "EnoT", "a": null}, {"r": 1, "t": "Конченная мойка. Заезжаю потому что рядом с домом. Но с каждым разом я убеждаюсь, что хуже мойки у нас в городе нету. Явно показываю грязь на машине которую помыли.Тот кто принимает оплату подходит и тряпкой вытирает всю эту грязь😂😂. Я объясняю ему что не нужно царапать, нет он все равно дальше трёт. Поменяйте уже вы свою бригаду", "d": "22 марта 2022", "n": "Валерий Р.", "a": null}, {"r": 1, "t": "Ужасная Мойка, хамское поведение. Отродье хачей", "d": "13 марта 2022", "n": "Сергей М.", "a": null}, {"r": 1, "t": "Заехал на мойку, чтобы сделать влажную уборку салона, один предложил 2000 рублей, другой предлагает 1500, за что такие цены не понятно, качества обслуживания не соответствует той цене которая заявленна, все сотрудники очень грубо относиться, уточняю какие то моменты отвечают хамством. Кому некуда девать свои деньги и нервы приезжайте сюда… помыли так, что пришлось брать тряпку самому и доделывать работу за 1500рублей…", "d": "12 марта 2022", "n": "Дима", "a": null}, {"r": 1, "t": "Отвратительное место, где все сотрудники очень грубы, цены меняются каждую секунду, им лишь бы развести людей на деньги, место не советую… \nКачество обслуживания не соответствует цене.", "d": "12 марта 2022", "n": "Уточка М.", "a": null}, {"r": 2, "t": "Кто теперь мыться будет за такие деньги?!", "d": "9 марта 2022", "n": "Max X.", "a": null}, {"r": 1, "t": "Автомойка GARAGE 17 хорошая мойка дешевле чем тут отзовы дают о себе знать возможна предварительная запись", "d": "2 марта 2022", "n": "Мансур Х.", "a": null}, {"r": 1, "t": "Обычная Экспресс мойка без протирки Инфинити ЕХ и 4 коврика вышло 560 рублей!!!", "d": "23 февраля 2022", "n": "Александр А.", "a": null}, {"r": 1, "t": "Качество мойки оставляет ждать лучшего, делают на отъе****. Нет даже книжки ( жалоб и предложений) не говоря об уголке потребителя. Крайне не советую", "d": "21 января 2022", "n": "Тимур Т.", "a": null}, {"r": 1, "t": "Стоял в очереди, сказали что обед уезжай или жди, про обед ни слово нигде", "d": "15 января 2022", "n": "Андрей", "a": null}, {"r": 1, "t": "Помыли отвратительно, весь кузов в разводах, салон протёрт как попало, давно такова не встречал...... Не советую данную мойку, второй раз уже ожогся!", "d": "10 января 2022", "n": "Владимир М.", "a": null}, {"r": 1, "t": "Не рекомендую данную автомойку! \nПо мимо того, что моют посредственно, РАБОТАТЬ НЕ ХОТЯТ!!! \nКУДА СМОТРИТ РУКОВОДСТВО!? \nПриехал в начале десятого вечера, говорят: \"мы уже не работаем! \", хотя официально до 22:00! \nЗаметьте, моё замечание, на эту тему не единственное!!!", "d": "8 января 2022", "n": "Denis Y.", "a": null}, {"r": 1, "t": "Разочарована. Больше туда не поеду мыть машину. На улице -20, помыли внутри мокрой тряпкой, не просушили, вода бежала отовсюду. Коврики положили мокрые, весь ковролин превратился в мокрую тряпку под ковриками. Всю машину и окна протирают одной грязной тряпкой. Замки не продули. На мои замечания ответили: \"Приезжаете все с утра, только настроение портите\". Кстати, рядом мыли авто, пену наносили прямо на снег. Вот вам и всё отношение к клиентам.", "d": "26 ноября 2021", "n": "Алёнушка И.", "a": null}, {"r": 1, "t": "Не хотят мыть машину в 21:30. Хотя ещё работают", "d": "25 июня 2021", "n": "Ж Д.", "a": null}, {"r": 1, "t": "Заезжал переобуть резину на мотоцикле ,погнули тормозной диск стоимостью 20 тыс рублей ,не советую никому !!!!", "d": "20 июня 2021", "n": "Сергей Л.", "a": null}, {"r": 4, "t": "Моют не плохо, быстро, на твёрдую четверочку!!!\nВ основном живая очередь! Каждая 6 мойка в подарок!", "d": "28 апреля 2021", "n": "Спартак Б.", "a": null}, {"r": 1, "t": "29.03.2021 Не правильно указаны часы работы. Приехал в 21.00 работники в грубой форме ответили , что уже не работают.", "d": "29 марта 2021", "n": "Александр С.", "a": null}, {"r": 1, "t": "Отвратительная мойка моют плохо непонятно что с графиком работы", "d": "29 марта 2021", "n": "Антон А.", "a": null}, {"r": 1, "t": "Была недавно на заправке, по мимо хамства со стороны кассира, еще и заправила будто специально другую колонку, а не ту что сказали. Пришлось 20 мин стоять и ждать пока всё исправит... Не рекомендую данную заправку", "d": "22 февраля 2021", "n": "Кристина К.", "a": null}, {"r": 1, "t": "По каким дням работает эта автомойка?", "d": "20 февраля 2021", "n": "Александр О.", "a": null}, {"r": 1, "t": "Отвратительная мойка, машина вся в разводах, окна мокрые, люк грязный. Теперь понятно почему нет очереди 🤞", "d": "23 ноября 2020", "n": "Наталья Г.", "a": null}, {"r": 2, "t": "Моют на тройку,в межсезонье за то чтобы просто отбить грязь водой зарядили ценник 500р🤦‍♂️Ни ногой ни колесом больше", "d": "30 октября 2020", "n": "Андрей П.", "a": null}, {"r": 4, "t": "Не плохая мойка, мою машину несколько лет. Качество не плохое, молодцы. Конечно не без греха, но твердая 4-ка👍. Молодцы. Советую.", "d": "29 октября 2020", "n": "Александр", "a": null}, {"r": 5, "t": "Только у этой автомойки есть возможность нормального ожидания своей очереди на парковке. Сегодня проехала по всему городу в поисках мойки, т.к. эта была не по пути. Нигде нет парковки, машины стоят на дороге. Ещё и въезды-выезды неудобные. Либо одно место для мойки. Поехала свою любимую автомойку. Здесь и быстро, и ожидание удобное.", "d": "24 октября 2020", "n": "Наталия П.", "a": null}, {"r": 1, "t": "Отвратительная мойка, за полную мойку авто, 1150 стекло внутри даже не протёрли, ноги моей больше не будет", "d": "18 октября 2020", "n": "Александр П.", "a": null}, {"r": 1, "t": "Грубость, хамство...", "d": "18 октября 2020", "n": "Сергей Л.", "a": null}, {"r": 1, "t": "простоял с 8:30 до 9:00, подошла моя очереди и мне говорят ЗАВТРАК ЗАВТРАКАЮТ ПИЗ...Ц. ПРИЯТНОГО ОПЕТИТА.", "d": "17 октября 2020", "n": "Дима С.", "a": null}, {"r": 1, "t": "Не счёт мойки ничего особенного, а вот сервис просто ужасный, элемннтарного нет туалета для посетителей, есть чай кофе а вот в туалет сказали идти в лес за мойку.", "d": "9 октября 2020", "n": "Макс Г.", "a": null}, {"r": 1, "t": "Приезжаю занимаю очередь, приходит мой черед заезжать влетает другая тачка, потом оказывается что там образовалась вторая очередь", "d": "12 сентября 2020", "n": "Kirill S.", "a": null}, {"r": 2, "t": "Приехал в 8:30 - всё ещё закрыто", "d": "27 июля 2020", "n": "xcomishe", "a": null}, {"r": 5, "t": "Расположение очень удобное, подьезд к мойке просторный. Были бы двери по выше, газель бы сюда возил.\nПомыли быстро и качественно. Пена, губка, протирка на сухо.\nВзяли всего 360 руб. Дешевле не встречал.\nБуду заезжать еще.\nСпасибо!", "d": "16 июля 2020", "n": "Sr S.", "a": null}, {"r": 1, "t": "Был два раза моют отвратительно моют натье бизь вообще не советую ездить на эту мойку потому что г****", "d": "27 мая 2020", "n": "Александр А.", "a": null}, {"r": 1, "t": "в 2 гис работают до 24, по факту до 22", "d": "17 апреля 2020", "n": "Sergey C.", "a": null}, {"r": 1, "t": "Отвратительная мойка. Плохо моют абсолютно все, даже коврики.", "d": "30 марта 2020", "n": "Hellen R.", "a": null}, {"r": 1, "t": "Моют ужасно вся машина осталась грязная. Качество оставляет желать лучшего. Моют на количество, а не качество!!!", "d": "22 марта 2020", "n": "Бозигит Б.", "a": null}, {"r": 4, "t": "Моют не на отлично. Но машина все равно быстро пачкается поэтому все нормально.", "d": "17 мая 2019", "n": "Ildar G.", "a": null}, {"r": 1, "t": "Моют ужасно. Облили пеной и водой, а смылась грязь или нет неважно.", "d": "2 декабря 2018", "n": "В Д.", "a": null}], "prices": null, "gis": "https://2gis.ru/surgut/firm/5489290326886374", "theme": {"c1": "#035e8a", "c1d": "#023e5c", "c2": "#3ad1f0", "tint": "#e8f5fb"}};

var T=D.theme; ['c1','c2','c1d','tint'].forEach(function(k){if(T[k])document.documentElement.style.setProperty('--'+k,T[k])});
var WA_SVG='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>';
function wa(t){return D.whatsapp?'https://wa.me/'+D.whatsapp+(t?'?text='+encodeURIComponent(t):''):null}
var tel=D.phones.length?'tel:'+D.phones[0].value:null;
var route='https://yandex.ru/maps/?rtext=~'+D.point.lat+','+D.point.lon+'&rtt=auto';

/* шапка */
$('mk').textContent=D.name.charAt(0).toUpperCase();
$('hName').textContent=D.name; $('hExt').textContent=D.ext||D.rubrics[0]||'';
var navItems=[['#prices',D.prices?'Цены':'Услуги'],['#info','Режим работы'],['#reviews','Отзывы'],['#contacts','Контакты']];
$('nav').innerHTML=navItems.map(function(n){return '<a href="'+n[0]+'">'+n[1]+'</a>'}).join('');

/* открыто сейчас (время Сургута) */
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], RU=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
var parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Yekaterinburg',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
var g=function(t){return (parts.find(function(p){return p.type===t})||{}).value};
var today=DAYS.indexOf(g('weekday')), now=(g('hour')==='24'?'00':g('hour'))+':'+g('minute');
function openNow(){
 if(D.schedule.is24)return [true,'круглосуточно'];
 var di=today, sh=D.schedule.days[DAYS[di]]||[];
 for(var i=0;i<sh.length;i++){var f=sh[i][0],t=sh[i][1];
  if(t<=f){ if(now>=f)return [true,'до '+t]; } else if(now>=f&&now<t)return [true,'до '+t]; }
 var prev=D.schedule.days[DAYS[(di+6)%7]]||[];
 for(i=0;i<prev.length;i++){if(prev[i][1]<=prev[i][0]&&now<prev[i][1])return [true,'до '+prev[i][1]]}
 for(i=0;i<sh.length;i++){if(now<sh[i][0])return [false,'откроется в '+sh[i][0]]}
 return [false,''];
}
var on=openNow();
if(tel){$('hdCall').href=tel;$('hdCall').innerHTML=esc(D.phones[0].text)+'<small><b'+(on[0]?'':' class="cl"')+'>'+(on[0]?'Открыто':'Закрыто')+'</b> '+esc(on[1])+'</small>'}else $('hdCall').classList.add('hidden');

/* первый экран */
var stars=function(n){var s='';for(var i=1;i<=5;i++)s+=i<=Math.round(n)?'★':'<i>★</i>';return s};
$('rTag').innerHTML=D.rating?'<span class="st">★</span> '+String(D.rating).replace('.',',')+' · '+D.ratingCount+' оценок в 2ГИС':'2ГИС';
$('ext').textContent=D.ext||''; $('h1').textContent=D.name;
$('rub').innerHTML=D.rubrics.slice(0,6).map(function(r){return '<span>'+esc(r)+'</span>'}).join('');
var hb=[]; if(tel)hb.push('<a class="btn btn-main" href="'+tel+'">Позвонить</a>');
if(D.whatsapp)hb.push('<a class="btn btn-line" href="'+wa('Здравствуйте! Пишу с сайта.')+'" target="_blank" rel="noopener">Написать в WhatsApp</a>');
hb.push('<a class="btn btn-line" href="'+route+'" target="_blank" rel="noopener">Маршрут</a>');
$('heroBtns').innerHTML=hb.join('');
function hoursShort(){if(D.schedule.is24)return 'Круглосуточно';var a=DAYS.map(function(d){var h=D.schedule.days[d];return h&&h.length?h.map(function(x){return x[0]+'–'+x[1]}).join(', '):'выходной'});
 if(a.every(function(x){return x===a[0]}))return 'Ежедневно '+a[0]; return 'Сегодня: '+a[today]}
$('heroCard').innerHTML=
 '<div class="hc-row"><span class="ic">📍</span><div><small>Адрес</small>'+esc(D.city+', '+D.address)+(D.addressComment?'<small>'+esc(D.addressComment)+'</small>':'')+'</div></div>'+
 '<div class="hc-row"><span class="ic">🕘</span><div><small>Режим работы</small>'+esc(hoursShort())+'<small>'+(on[0]?'Сейчас открыто ':'Сейчас закрыто ')+esc(on[1])+'</small></div></div>'+
 (D.phones.length?'<div class="hc-row"><span class="ic">📞</span><div><small>Телефон</small>'+D.phones.map(function(p){return '<a href="tel:'+p.value+'">'+esc(p.text)+'</a>'}).join('<br>')+'</div></div>':'');

/* цены или услуги */
if(D.prices&&D.prices.items.length){
 $('pLead').textContent='Прайс компании из 2ГИС: '+D.prices.items.length+' позиций. Точную стоимость уточняйте у администратора.';
 var cats=[]; D.prices.items.forEach(function(i){if(i.c&&cats.indexOf(i.c)<0)cats.push(i.c)});
 var cur='all';
 $('pChips').innerHTML=cats.length>1?'<button type="button" data-c="all" class="on">Все</button>'+cats.map(function(c){return '<button type="button" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join(''):'';
 function drawP(){var q=$('pSearch').value.trim().toLowerCase(),html='',last=null;
  D.prices.items.forEach(function(i){if(cur!=='all'&&i.c!==cur)return;if(q&&(i.n+' '+i.d).toLowerCase().indexOf(q)<0)return;
   if(i.c&&i.c!==last){html+='<div class="pcat">'+esc(i.c)+'</div>';last=i.c}
   html+='<div class="prow"><div><b>'+esc(i.n)+'</b>'+(i.d?'<small>'+esc(i.d)+'</small>':'')+'</div><div class="pv">'+esc(i.p)+'</div></div>'});
  $('pList').innerHTML=html||'<div class="prow"><div>Ничего не найдено</div></div>'}
 $('pChips').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;cur=b.dataset.c;[].forEach.call($('pChips').children,function(x){x.classList.toggle('on',x===b)});drawP()});
 $('pSearch').addEventListener('input',drawP); drawP();
 $('pNote').textContent=(D.prices.head?D.prices.head+'. ':'')+'Информация о ценах не является публичной офертой.';
 if(D.prices.items.length<8)$('pBlock').querySelector('.ptools').classList.add('hidden');
}else{
 $('pEyebrow').textContent='Услуги'; $('pTitle').textContent='Чем мы занимаемся';
 $('pLead').textContent='Стоимость зависит от задачи — уточняйте по телефону'+(D.whatsapp?' или в WhatsApp.':'.');
 $('pBlock').classList.add('hidden'); $('svcGrid').classList.remove('hidden');
 $('svcGrid').innerHTML=D.rubrics.map(function(r){return '<div class="svc"><span class="dot"></span>'+esc(r)+'</div>'}).join('');
}

/* режим работы и условия */
$('hours').innerHTML=D.schedule.is24?'<tr><td>Ежедневно</td><td>Круглосуточно</td></tr>':DAYS.map(function(d,i){var h=D.schedule.days[d];return '<tr'+(i===today?' class="today"':'')+'><td>'+RU[i]+'</td><td>'+(h&&h.length?h.map(function(x){return x[0]+'–'+x[1]}).join(', '):'Выходной')+'</td></tr>'}).join('');
$('hNote').textContent=D.schedule.comment||'';
if(D.attrs.length)$('attrs').innerHTML+=D.attrs.map(function(g){return '<h4>'+esc(g.name)+'</h4><div class="t">'+g.items.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>'}).join('');
else $('attrs').innerHTML+='<p class="pnote">Подробности уточняйте по телефону.</p>';

/* отзывы */
var R=D.reviews, S=D.stats, tot=0; for(var k in S)tot+=S[k];
$('sc').textContent=D.rating?String(D.rating).replace('.',','):'—'; $('scSt').innerHTML=stars(D.rating||0);
$('scCnt').textContent=D.ratingCount+' оценок · '+R.length+' отзывов с текстом';
$('bars').innerHTML=[5,4,3,2,1].map(function(s){return '<div class="bar"><span>'+s+' ★</span><div class="tr"><span style="width:'+(tot?S[s]/tot*100:0)+'%"></span></div><span>'+S[s]+'</span></div>'}).join('')+
 '<small style="color:var(--muted);font-size:12.5px">Оценки '+tot+' отзывов в 2ГИС</small>';
var nPos=R.filter(function(r){return r.r>=4}).length, nNeg=R.filter(function(r){return r.r<=3}).length, filt='all', shown=12;
$('rvTabs').innerHTML='<button type="button" data-f="all">Все ('+R.length+')</button><button type="button" data-f="pos">Положительные ('+nPos+')</button><button type="button" data-f="neg">Отрицательные ('+nNeg+')</button>';
function list(){return R.filter(function(r){return filt==='all'||(filt==='pos'?r.r>=4:r.r<=3)})}
function drawR(){var L=list();
 $('rvGrid').innerHTML=L.slice(0,shown).map(function(r){
  return '<div class="rv'+(r.r<=3?' neg':'')+'"><div class="rs">'+stars(r.r)+'</div><p>'+esc(r.t)+'</p><div class="who">'+esc(r.n)+' <small>· '+esc(r.d)+'</small></div>'+
   (r.a?'<div class="ans"><b>Ответ компании · '+esc(r.a.d)+'</b>'+esc(r.a.t)+'</div>':'')+'</div>'}).join('');
 $('rvMore').classList.toggle('hidden',L.length<=shown);
 [].forEach.call($('rvTabs').children,function(b){b.classList.toggle('on',b.dataset.f===filt)});
}
$('rvTabs').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(!b)return;filt=b.dataset.f;shown=12;drawR()});
$('rvMore').addEventListener('click',function(){shown+=24;drawR()});
$('rvAll').href=D.gis+'/tab/reviews'; drawR();

/* контакты */
var c='';
c+='<div class="ct-item"><span class="ic">📍</span><div><small>Адрес</small>'+esc(D.city+', '+D.address)+(D.addressComment?'<small>'+esc(D.addressComment)+'</small>':'')+'<br><a href="'+route+'" target="_blank" rel="noopener">Построить маршрут →</a></div></div>';
if(D.phones.length)c+='<div class="ct-item"><span class="ic">📞</span><div><small>Телефон</small>'+D.phones.map(function(p){return '<a href="tel:'+p.value+'">'+esc(p.text)+'</a>'}).join('<br>')+'</div></div>';
if(D.email)c+='<div class="ct-item"><span class="ic">✉️</span><div><small>Почта</small><a href="mailto:'+esc(D.email)+'">'+esc(D.email)+'</a></div></div>';
var soc=D.links.map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'}).join('');
if(soc)c+='<div class="soc">'+soc+'</div>';
$('ct').innerHTML=c;
$('map').src='https://yandex.ru/map-widget/v1/?ll='+D.point.lon+','+D.point.lat+'&z=16&pt='+D.point.lon+','+D.point.lat+',pm2rdm';
$('ftL').textContent='© '+new Date().getFullYear()+' '+D.fullName+', '+D.city;
var fab=''; if(tel)fab+='<a href="'+tel+'" aria-label="Позвонить">📞</a>'; if(D.whatsapp)fab+='<a class="w" href="'+wa('Здравствуйте! Пишу с сайта.')+'" target="_blank" rel="noopener" aria-label="WhatsApp">'+WA_SVG+'</a>';
$('fab').innerHTML=fab;
})();
</script>
</body>
</html>
