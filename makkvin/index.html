<head>

<title>МакКвин — автомойка, Сургут</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--c1:#0b5d3f;--c2:#3cc47c;--c1d:#08452f;--tint:#eaf7f0;--ink:#16211c;--muted:#5f6b66;--line:#e2e8e5;--bg:#f7f9f8;--star:#f2a20c;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.15;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:700 16px Manrope,sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-main{background:var(--c2);color:var(--c1d)}
.btn-line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn-wa{background:#25d366;color:#fff}
.btn-soft{background:var(--tint);color:var(--c1)}
.sec{padding:72px 0}
.sec h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin-bottom:10px}
.lead{color:var(--muted);font-size:17px;max-width:680px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c1);margin-bottom:10px}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo .mk{width:40px;height:40px;border-radius:12px;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.logo b{display:block;font-size:19px;font-weight:800;color:var(--c1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:600}
nav{display:flex;gap:20px;margin-left:auto}
nav a{text-decoration:none;font-size:15px;font-weight:600;color:#33403a}
nav a:hover{color:var(--c1)}
.hd-call{text-decoration:none;font-weight:800;font-size:17px;white-space:nowrap;color:var(--c1);text-align:right}
.hd-call small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.hd-call small b{color:#1a9b55}
.hd-call small b.cl{color:#d0482f}

.hero{background:radial-gradient(900px 420px at 85% 0,rgba(255,255,255,.14) 0,transparent 60%),linear-gradient(160deg,var(--c1d),var(--c1));color:#fff;padding:60px 0 70px}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;margin-bottom:18px}
.tag .st{color:#ffd166}
.hero .ext{font-size:16px;font-weight:600;opacity:.85;margin-bottom:6px}
.hero .ext::first-letter{text-transform:uppercase}
.hero h1{font-size:clamp(36px,5.4vw,60px);font-weight:800;margin-bottom:16px}
.rub{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.rub span{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
.hero-card{background:#fff;color:var(--ink);border-radius:22px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.22)}
.hc-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hc-row:last-child{border-bottom:0}
.hc-row .ic{font-size:20px;width:26px;flex:none}
.hc-row small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.hc-row a{text-decoration:none;font-weight:700}

/* prices */
.ptools{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;align-items:center}
.ptools input{flex:1 1 240px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:15px Manrope,sans-serif;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.plist{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcat{padding:12px 20px;background:var(--tint);font-weight:800;font-size:15px;color:var(--c1)}
.prow{display:flex;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
.prow b{font-weight:700;display:block}
.prow small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;white-space:pre-line}
.prow .pv{font-weight:800;white-space:nowrap;color:var(--c1)}
.pnote{font-size:13px;color:var(--muted);margin-top:12px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;font-weight:700;display:flex;gap:12px;align-items:center}
.svc .dot{width:12px;height:12px;border-radius:50%;background:var(--c2);flex:none}

/* info */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.box h3{font-size:18px;font-weight:800;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right;font-weight:700}
.hours tr.today td{color:var(--c1)}
.attrs h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px}
.attrs h4:first-child{margin-top:0}
.attrs .t{display:flex;flex-wrap:wrap;gap:6px}
.attrs .t span{background:var(--tint);color:var(--c1);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}

/* reviews */
.rv-top{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;margin-top:24px}
.score b{font-size:56px;font-weight:800;color:var(--c1);line-height:1}
.score .st{color:var(--star);font-size:18px;letter-spacing:2px}
.score small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.bars{display:grid;gap:6px;max-width:440px;font-size:14px}
.bar{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center}
.tr{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.tr span{display:block;height:100%;background:var(--star);border-radius:99px}
.rv-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.rv-tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.rv-tabs button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.rv-grid{columns:3 300px;column-gap:16px;margin-top:20px}
.rv{break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.rv.neg{border-color:#f0d3cb;background:#fffaf8}
.rv .rs{color:var(--star);letter-spacing:1px}
.rv .rs i{font-style:normal;color:#d7ddda}
.rv p{margin:8px 0 12px;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.rv .who{font-size:14px;font-weight:700}
.rv .who small{color:var(--muted);font-weight:500}
.rv .ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:14px;white-space:pre-line}
.rv .ans b{display:block;font-size:12.5px;color:var(--c1);margin-bottom:4px}
.more{text-align:center;margin-top:8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* contacts */
.ct-sec{background:linear-gradient(160deg,var(--c1d),var(--c1));color:#fff}
.ct-sec .eyebrow{color:#fff;opacity:.8}
.ct-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;margin-top:28px}
.ct{display:grid;gap:12px;align-content:start}
.ct-item{display:flex;gap:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:16px 18px}
.ct-item .ic{font-size:22px;flex:none}
.ct-item small{display:block;opacity:.75;font-size:12.5px;font-weight:600}
.ct-item a{text-decoration:none;font-weight:700}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.14);text-decoration:none;font-size:14px;font-weight:600}
.map{border-radius:var(--r);overflow:hidden;min-height:400px;background:rgba(255,255,255,.1)}
.map iframe{width:100%;height:100%;min-height:400px;border:0;display:block}

footer{background:#0d1512;color:#9aa9a2;padding:26px 0;font-size:13.5px}
.ft{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:16px;z-index:60;display:none;gap:10px}
.fab a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);text-decoration:none;font-size:24px;background:var(--c2)}
.fab a.w{background:#25d366}
.fab svg{width:28px;height:28px;fill:#fff}

@media(max-width:980px){
 nav{display:none}
 .hero-grid,.info-grid,.ct-grid{grid-template-columns:1fr}
 .svc-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
 .wrap{padding:0 16px}
 .sec{padding:52px 0}
 .hero{padding:38px 0 50px}
 .hd{gap:10px;height:62px}
 .logo small{display:none}
 .hd-call{margin-left:auto;font-size:15px}
 .svc-grid{grid-template-columns:1fr}
 .hero-btns .btn{flex:1 1 100%}
 .hero-card{padding:18px 16px}
 .rv-top{grid-template-columns:1fr;gap:16px}
 .prow{flex-direction:column;gap:4px}
 .fab{display:flex}
}
</style>
</head>

ноября 2023"}}, {"r": 1, "t": "Ранее несколько раз были на этой мойке и всегда печаль! то мойка по непонятным причинам не работает, то не кому мыть машину! И вот недавно были наши знакомые которые, также приехали, постояли и уехали, оказалось не кому мыть машину! Что за обслуживание и сервис ??", "d": "10 ноября 2023", "n": "Олеся К.", "a": {"t": "Здравствуйте мойка работает 24 часа в сутки в полном цикле и мойщиками проблем нет вы полностью дезинформированы", "d": "10 ноября 2023"}}, {"r": 1, "t": "Раньше постоянно пользовалась их услугами, сегодня случилась неприятная ситуация, 2 часа стояла в очереди , но приехал человек , встал в очереди самый последний , но проехал перед всеми остальными , так как оказался их знакомым , если так будут всех по знакомству пропускать , так можно и до вечера простоять , остался осадок , навпятли к ним еще поеду 😐", "d": "21 октября 2023", "n": "Mila L.", "a": null}, {"r": 5, "t": "Моют хорошо ,стораются ребята !", "d": "20 октября 2023", "n": "Евгений С.", "a": {"t": "Добрый вечер. Большое спасибо за отзыв и оценку 😉 Приходите ещё", "d": "20 октября 2023"}}, {"r": 1, "t": "Не советуют моют не качественно 👎за такие деньги могли бы и ответственно подходить к своей работе👎👎👎", "d": "19 октября 2023", "n": "Лилия Х.", "a": null}, {"r": 5, "t": "Отличные ребята, моют качественно, есть где подождать. Работают круглосуточно, что очень удобно. Рекомендую", "d": "5 сентября 2023", "n": "Максим", "a": null}, {"r": 1, "t": "Приехал в 6:00 помыть машину, но никого не нашел, двери не закрыты - мойщик отсутствует. На призывы никто не ответил.", "d": "26 августа 2023", "n": "Юрий К.", "a": null}, {"r": 5, "t": "Доброе отношения качественная мойка отличная цена спасибо ребята.", "d": "24 августа 2023", "n": "Майил В.", "a": {"t": "Спасибо за ваш положительный отзыв мы стараемся для вас !!!!", "d": "24 августа 2023"}}, {"r": 5, "t": "Отличная мойка,хорошие мойшики спасибо", "d": "17 августа 2023", "n": "Гасан С.", "a": {"t": "Спасибо за положительный отзыв мы стараемся для вас !!!", "d": "17 августа 2023"}}, {"r": 1, "t": "Персонал в какашку пьяный!", "d": "12 августа 2023", "n": "Ivanona", "a": {"t": "Добрый день скажите Марку машины и время посещения", "d": "15 августа 2023"}}, {"r": 1, "t": "Раньше была хорошая мойка. Недорого брали. Сейчас набрали наглых и запойных алкашей которые постоянно с перегаром и трясущимися руками не пойми как моют и вытирают авто. Ценник неоправданно вырос на 15-20%.", "d": "31 июля 2023", "n": "Артём Е.", "a": null}, {"r": 1, "t": "Ужасная мойка, отдал 700 рублей, за кузов коврики, пылесос и влажную уборку, по этогу кузов местами грязный, в салоне протёр какой то вонючей\n тряпкой и то только панель и все,фото салона прилагаю, цена качество не соответствует", "d": "19 июня 2023", "n": "Александр В.", "a": {"t": "Добрый день! Просьба написать марку автомобиля и дату посещения! Обязательно разберемся. Спасибо", "d": "29 июня 2023"}}, {"r": 1, "t": "Несколько лет пользовалась услугами данной автомойки. Очень нравилось. Вчера заехала - ужас и кошмар! Цены подняли, оплаты по терминалу не стало, просят переводом. Списать бонусы стало нельзя. Но это мелочи. Персонал - в хламину пьяный! Доверять машину, конечно не стала. буду искать другую автомойку.", "d": "19 июня 2023", "n": "Анна Г.", "a": {"t": "Добрый день! Просьба написать марку авто и дату посещения. Обязательно разберемся. Спасибо.", "d": "29 июня 2023"}}, {"r": 1, "t": "Ранее заезжал, было все хорошо, но сейчас мне очень не понравилось как помыли это просто ужас, я разочарован в этой мойке 👎\nБольше не буду никому советовать!", "d": "7 мая 2023", "n": "ВСЁ П.", "a": null}, {"r": 1, "t": "Сегодня мыла машину, комплекс без багажника. Пропылисосили ужасно (песок весь оказался на дверном пластике), под сидением очень много песка осталось. Дверной пластик на задних дверях вообще не протирали. Отдала 800 рублей не понятно за что. После них пачку влажных салфеток потратила для того что бы протереть пластиковые изделия в салоне. Диски у машины тоже были очень грязные. От женщины которая убиралась в салоне машины был очень сильный запах алкоголя. Вообщем не советую эту мойку.", "d": "4 мая 2023", "n": "Татьяна", "a": null}, {"r": 1, "t": "Очень, очень долго, качество так себе. Два раза был там, на разных машинах, оба раза долбанулся на выезде, чуть порог снизу даже замял.", "d": "1 мая 2023", "n": "Nik N.", "a": null}, {"r": 5, "t": "Хорошая мойка моют классна советую всем", "d": "7 апреля 2023", "n": "Эльман Я.", "a": null}, {"r": 2, "t": "Необоснованно космический ценник \n1100 за комплекс \nПосле мойки на утро машину открыть не мог \nЗеркала позамерзали \nТакое ощущение что совсем не продували", "d": "20 февраля 2023", "n": "Антон С.", "a": null}, {"r": 1, "t": "Мойка 24 часа в 9:00 приехал никого нет, на телефон не отвечают, помыть невозможно. Работает наугад.", "d": "29 декабря 2022", "n": "Максим Ш.", "a": {"t": "Были технические проблемы .Извините", "d": "29 декабря 2022"}}, {"r": 2, "t": "Раньше нет нет сам заезжал, за 700 комплекс был. В последний раз времени не было, племянника отправил, с него 1000 взяли. За что??? Не самая лучшая мойка, только из за цены заезжал, теперь то уж точно не буду", "d": "22 декабря 2022", "n": "Рамиль К.", "a": {"t": "Здравствуйте! Спасибо за обратную связь! Скажите когда посещали автомойку и гос номер автомобиля?", "d": "22 декабря 2022"}}, {"r": 5, "t": "Мойщики норм)", "d": "8 декабря 2022", "n": "Альбина З.", "a": null}, {"r": 5, "t": "Отличная мойка на 5 +", "d": "8 декабря 2022", "n": "Александр К.", "a": {"t": "Спасибо за положительный отзыв нашей работы !Мы трудимся для Вас!Всегда рады видеть Вас в числе клиентов нашей автомойки «МакКвин»,с уважением администрация!) Рекомендуем к использованию приложение UDS получайте кэшбек,узнавайте о наших акциях и новостях !", "d": "14 декабря 2022"}}, {"r": 5, "t": "Ночная смена работает на совесть, молодцы. Днем не заезжала, ничего не могу сказать пока", "d": "6 декабря 2022", "n": "Елена Р.", "a": {"t": "Спасибо за положительный отзыв нашей работы !Мы трудимся для Вас!Всегда рады видеть Вас в числе клиентов нашей автомойки «МакКвин»,с уважением администрация!) Рекомендуем к использованию приложение UDS получайте кэшбек,узнавайте о наших акциях и новостях !", "d": "6 декабря 2022"}}, {"r": 1, "t": "Моют автомобиль так же плохо как и в большинстве автомоек Сургута. От сотрудников чувствуется крепкий запах алкоголя. Директор это вообще отдельная история... такое ощущение, что папа ему дал порулить бизнесом. Отвратительное отношение к посетителям. Очень высок риск порчи авто, осматривайте авто после мойки внимательно! Единственный адекватный человек в этой шарашке - это администратор женщина.", "d": "24 ноября 2022", "n": "Сергей Б.", "a": {"t": "Здравствуйте! Пожалуйста напишите марку авто и государственный номер автомобиля?мы проверим информацию. Работают у нас молодые парни…", "d": "24 ноября 2022"}}, {"r": 1, "t": "Используют некачественные средства и неспособны урегулировать проблемы по своим косякам!\nЯ воспользовался услугами данной автомойки, после того как авто помыли, мне предложили обработать уплотнительные резинки дверей силиконом, ранее в других автомойках регулярно пользовался этой услугой и всё было хорошо, НО не в этот раз! На следующий день после я начал замечать пятна на верхней одежде, таким образом я  испачкал две куртки, а жена шубу, так как мы не могли понять откуда берутся эти пятна, а когда поняли было уже поздно… Начал звонить в автомойку, изложил что произошло, на что мне ответили что посмотрят по камерам и перезвонят. В итоге никто не перезвонил, на следующий день дозванивался сам, дозвонился и мне  ответили что они обрабатывают силиконом по 20 машин в день и никогда таких проблем не было, могут сделать скидку на следующую мойку. Спасибо конечно, но я больше никогда не воспользуюсь услугами данной мойки, это раз! Во вторых мне придётся сдавать в химчистку всю верхнюю одежду, так как эти пятна не отмываются в домашних условиях! Химчистка одного пуховика стоит примерно - 1500/2000 ₽. В третьих очень странное отношение к своим клиентам, клиентоориентированности - НОЛЬ! Мало того что Я не воспользуюсь вашими услугами, так ещё и всем своим знакомым посоветую не обращаться к вам. Если всё же хотите решить данную ситуацию, жду обратной связи.", "d": "20 ноября 2022", "n": "Карпов П.", "a": {"t": "Здравствуйте!Спасибо за обратную связь)\nскажите пожалуйста: дату посещения и государственный номер автомобиля?\nМы обязательно разберемся в ситуации.", "d": "20 ноября 2022"}}, {"r": 5, "t": "качественно моют автомобиль, идеально убрали салон🔥🔥🔥", "d": "18 ноября 2022", "n": "Альберт А.", "a": {"t": "Спасибо за положительный отзыв нашей работы !Мы трудимся для Вас!Всегда рады видеть Вас в числе клиентов нашей автомойки «МакКвин»,с уважением администрация!) Рекомендуем к использованию приложение UDS получайте кэшбек,узнавайте о наших акциях и новостях !", "d": "18 ноября 2022"}}, {"r": 5, "t": "Эта мойка имеет большой потенциал завладеть сердцами автовладельцев нашего города. Спасибо", "d": "15 ноября 2022", "n": "Дима М.", "a": {"t": "Спасибо за положительный отзыв нашей работы !Мы трудимся для Вас!Всегда рады видеть Вас в числе клиентов нашей автомойки «МакКвин»,с уважением администрация!) Рекомендуем к использованию приложение UDS получайте кэшбек,узнавайте о наших акциях и новостях !", "d": "15 ноября 2022"}}, {"r": 5, "t": "Пользуюсь услугами мойки не первый год , цены хорошие качество не хуже дорогих моек . спасибо ребята", "d": "9 ноября 2022", "n": "Алла ч.", "a": {"t": "Спасибо за положительный отзыв нашей работы !Мы трудимся для Вас!Всегда рады видеть Вас в числе клиентов нашей автомойки «МакКвин»,с уважением администрация!) Рекомендуем к использованию приложение UDS получайте кэшбек,узнавайте о наших акциях и новостях !", "d": "10 ноября 2022"}}, {"r": 5, "t": "Просто супер 🔥🔥🔥", "d": "7 ноября 2022", "n": "Амрах Х.", "a": {"t": "Спасибо за положительный отзыв нашей работы !Мы трудимся для Вас!Всегда рады видеть </script>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var T=D.theme; ['c1','c2','c1d','tint'].forEach(function(k){if(T[k])document.documentElement.style.setProperty('--'+k,T[k])});

/* открыто сейчас (время Сургута) */

var parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Yekaterinburg',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
var g=function(t){return (parts.find(function(p){return p.type===t})||{}).value};
var today=DAYS.indexOf(g('weekday')), now=(g('hour')==='24'?'00':g('hour'))+':'+g('minute');
function openNow(){
 if(D.schedule.is24)return [true,'круглосуточно'];
 var di=today, sh=D.schedule.days[DAYS[di]]||[];
 for(var i=0;i<sh.length;i++){var f=sh[i][0],t=sh[i][1];
  if(t<=f){ if(now>=f)return [true,'до '+t]; } else if(now>=f&&now<t)return [true,'до '+t]; }
 var prev=D.schedule.days[DAYS[(di+6)%7]]||[];
 for(i=0;i<prev.length;i++){if(prev[i][1]<=prev[i][0]&&now<prev[i][1])return [true,'до '+prev[i][1]]}
 for(i=0;i<sh.length;i++){if(now<sh[i][0])return [false,'откроется в '+sh[i][0]]}
 return [false,''];
}
var on=openNow();
if(tel){$('hdCall').href=tel;$('hdCall').innerHTML=esc(D.phones[0].text)+'<small><b'+(on[0]?'':' class="cl"')+'>'+(on[0]?'Открыто':'Закрыто')+'</b> '+esc(on[1])+'</small>'}else $('hdCall').classList.add('hidden');

$('rub').innerHTML=D.rubrics.slice(0,6).map(function(r){return '<span>'+esc(r)+'</span>'}).join('');

hb.push('<a class="btn btn-line" href="'+route+'" target="_blank" rel="noopener">Маршрут</a>');
$('heroBtns').innerHTML=hb.join('');
function hoursShort(){if(D.schedule.is24)return 'Круглосуточно';var a=DAYS.map(function(d){var h=D.schedule.days[d];return h&&h.length?h.map(function(x){return x[0]+'–'+x[1]}).join(', '):'выходной'});
 if(a.every(function(x){return x===a[0]}))return 'Ежедневно '+a[0]; return 'Сегодня: '+a[today]}
$('heroCard').innerHTML=
 '<div class="hc-row"><span class="ic">📍</span><div><small>Адрес</small>'+esc(D.city+', '+D.address)+(D.addressComment?'<small>'+esc(D.addressComment)+'</small>':'')+'</div></div>'+
 '<div class="hc-row"><span class="ic">🕘</span><div><small>Режим работы</small>'+esc(hoursShort())+'<small>'+(on[0]?'Сейчас открыто ':'Сейчас закрыто ')+esc(on[1])+'</small></div></div>'+
 (D.phones.length?'<div class="hc-row"><span class="ic">📞</span><div><small>Телефон</small>'+D.phones.map(function(p){return '<a href="tel:'+p.value+'">'+esc(p.text)+'</a>'}).join('<br>')+'</div></div>':'');

/* цены или услуги */
if(D.prices&&D.prices.items.length){
 $('pLead').textContent='Прайс компании из 2ГИС: '+D.prices.items.length+' позиций. Точную стоимость уточняйте у администратора.';
 var cats=[]; D.prices.items.forEach(function(i){if(i.c&&cats.indexOf(i.c)<0)cats.push(i.c)});

 $('pChips').innerHTML=cats.length>1?'<button type="button" data-c="all" class="on">Все</button>'+cats.map(function(c){return '<button type="button" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join(''):'';
 function drawP(){var q=$('pSearch').value.trim().toLowerCase(),html='',last=null;
  D.prices.items.forEach(function(i){if(cur!=='all'&&i.c!==cur)return;if(q&&(i.n+' '+i.d).toLowerCase().indexOf(q)<0)return;
   if(i.c&&i.c!==last){html+='<div class="pcat">'+esc(i.c)+'</div>';last=i.c}

  $('pList').innerHTML=html||'<div class="prow"><div>Ничего не найдено</div></div>'}
 $('pChips').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;cur=b.dataset.c;[].forEach.call($('pChips').children,function(x){x.classList.toggle('on',x===b)});drawP()});
 $('pSearch').addEventListener('input',drawP); drawP();
 $('pNote').textContent=(D.prices.head?D.prices.head+'. ':'')+'Информация о ценах не является публичной офертой.';
 if(D.prices.items.length<8)$('pBlock').querySelector('.ptools').classList.add('hidden');
}else{
 $('pEyebrow').textContent='Услуги'; $('pTitle').textContent='Чем мы занимаемся';

 $('pBlock').classList.add('hidden'); $('svcGrid').classList.remove('hidden');
 $('svcGrid').innerHTML=D.rubrics.map(function(r){return '<div class="svc"><span class="dot"></span>'+esc(r)+'</div>'}).join('');
}

/* режим работы и условия */
$('hours').innerHTML=D.schedule.is24?'<tr><td>Ежедневно</td><td>Круглосуточно</td></tr>':DAYS.map(function(d,i){var h=D.schedule.days[d];return '<tr'+(i===today?' class="today"':'')+'><td>'+RU[i]+'</td><td>'+(h&&h.length?h.map(function(x){return x[0]+'–'+x[1]}).join(', '):'Выходной')+'</td></tr>'}).join('');

if(D.attrs.length)$('attrs').innerHTML+=D.attrs.map(function(g){return '<h4>'+esc(g.name)+'</h4><div class="t">'+g.items.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>'}).join('');

function drawR(){var L=list();

 [].forEach.call($('rvTabs').children,function(b){b.classList.toggle('on',b.dataset.f===filt)});
}
