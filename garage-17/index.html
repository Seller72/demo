<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Garage 17 — автокомплекс, Сургут</title>
<meta name="description" content="Garage 17: Шины и диски, Автомойки, Шиномонтаж. Быстринская улица, 17, Сургут.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#0b5d3f;--c2:#3cc47c;--c1d:#08452f;--tint:#eaf7f0;--ink:#16211c;--muted:#5f6b66;--line:#e2e8e5;--bg:#f7f9f8;--star:#f2a20c;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.15;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:700 16px Manrope,sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-main{background:var(--c2);color:var(--c1d)}
.btn-line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn-wa{background:#25d366;color:#fff}
.btn-soft{background:var(--tint);color:var(--c1)}
.sec{padding:72px 0}
.sec h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin-bottom:10px}
.lead{color:var(--muted);font-size:17px;max-width:680px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c1);margin-bottom:10px}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo .mk{width:40px;height:40px;border-radius:12px;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.logo b{display:block;font-size:19px;font-weight:800;color:var(--c1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:600}
nav{display:flex;gap:20px;margin-left:auto}
nav a{text-decoration:none;font-size:15px;font-weight:600;color:#33403a}
nav a:hover{color:var(--c1)}
.hd-call{text-decoration:none;font-weight:800;font-size:17px;white-space:nowrap;color:var(--c1);text-align:right}
.hd-call small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.hd-call small b{color:#1a9b55}
.hd-call small b.cl{color:#d0482f}

.hero{background:radial-gradient(900px 420px at 85% 0,rgba(255,255,255,.14) 0,transparent 60%),linear-gradient(160deg,var(--c1d),var(--c1));color:#fff;padding:60px 0 70px}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;margin-bottom:18px}
.tag .st{color:#ffd166}
.hero .ext{font-size:16px;font-weight:600;opacity:.85;margin-bottom:6px}
.hero .ext::first-letter{text-transform:uppercase}
.hero h1{font-size:clamp(36px,5.4vw,60px);font-weight:800;margin-bottom:16px}
.rub{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.rub span{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
.hero-card{background:#fff;color:var(--ink);border-radius:22px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.22)}
.hc-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hc-row:last-child{border-bottom:0}
.hc-row .ic{font-size:20px;width:26px;flex:none}
.hc-row small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.hc-row a{text-decoration:none;font-weight:700}

/* prices */
.ptools{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;align-items:center}
.ptools input{flex:1 1 240px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:15px Manrope,sans-serif;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.plist{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcat{padding:12px 20px;background:var(--tint);font-weight:800;font-size:15px;color:var(--c1)}
.prow{display:flex;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
.prow b{font-weight:700;display:block}
.prow small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;white-space:pre-line}
.prow .pv{font-weight:800;white-space:nowrap;color:var(--c1)}
.pnote{font-size:13px;color:var(--muted);margin-top:12px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;font-weight:700;display:flex;gap:12px;align-items:center}
.svc .dot{width:12px;height:12px;border-radius:50%;background:var(--c2);flex:none}

/* info */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.box h3{font-size:18px;font-weight:800;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right;font-weight:700}
.hours tr.today td{color:var(--c1)}
.attrs h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px}
.attrs h4:first-child{margin-top:0}
.attrs .t{display:flex;flex-wrap:wrap;gap:6px}
.attrs .t span{background:var(--tint);color:var(--c1);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}

/* reviews */
.rv-top{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;margin-top:24px}
.score b{font-size:56px;font-weight:800;color:var(--c1);line-height:1}
.score .st{color:var(--star);font-size:18px;letter-spacing:2px}
.score small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.bars{display:grid;gap:6px;max-width:440px;font-size:14px}
.bar{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center}
.tr{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.tr span{display:block;height:100%;background:var(--star);border-radius:99px}
.rv-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.rv-tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.rv-tabs button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.rv-grid{columns:3 300px;column-gap:16px;margin-top:20px}
.rv{break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.rv.neg{border-color:#f0d3cb;background:#fffaf8}
.rv .rs{color:var(--star);letter-spacing:1px}
.rv .rs i{font-style:normal;color:#d7ddda}
.rv p{margin:8px 0 12px;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.rv .who{font-size:14px;font-weight:700}
.rv .who small{color:var(--muted);font-weight:500}
.rv .ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:14px;white-space:pre-line}
.rv .ans b{display:block;font-size:12.5px;color:var(--c1);margin-bottom:4px}
.more{text-align:center;margin-top:8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* contacts */
.ct-sec{background:linear-gradient(160deg,var(--c1d),var(--c1));color:#fff}
.ct-sec .eyebrow{color:#fff;opacity:.8}
.ct-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;margin-top:28px}
.ct{display:grid;gap:12px;align-content:start}
.ct-item{display:flex;gap:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:16px 18px}
.ct-item .ic{font-size:22px;flex:none}
.ct-item small{display:block;opacity:.75;font-size:12.5px;font-weight:600}
.ct-item a{text-decoration:none;font-weight:700}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.14);text-decoration:none;font-size:14px;font-weight:600}
.map{border-radius:var(--r);overflow:hidden;min-height:400px;background:rgba(255,255,255,.1)}
.map iframe{width:100%;height:100%;min-height:400px;border:0;display:block}

footer{background:#0d1512;color:#9aa9a2;padding:26px 0;font-size:13.5px}
.ft{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:16px;z-index:60;display:none;gap:10px}
.fab a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);text-decoration:none;font-size:24px;background:var(--c2)}
.fab a.w{background:#25d366}
.fab svg{width:28px;height:28px;fill:#fff}

@media(max-width:980px){
 nav{display:none}
 .hero-grid,.info-grid,.ct-grid{grid-template-columns:1fr}
 .svc-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
 .wrap{padding:0 16px}
 .sec{padding:52px 0}
 .hero{padding:38px 0 50px}
 .hd{gap:10px;height:62px}
 .logo small{display:none}
 .hd-call{margin-left:auto;font-size:15px}
 .svc-grid{grid-template-columns:1fr}
 .hero-btns .btn{flex:1 1 100%}
 .hero-card{padding:18px 16px}
 .rv-top{grid-template-columns:1fr;gap:16px}
 .prow{flex-direction:column;gap:4px}
 .fab{display:flex}
}
</style>
</head>

<header><div class="wrap hd">

</div></section>

роги моют в начале, а не в конце, что он в салоне остается. Цена возросла - качество сильно упало. Раньше садишься в машину, приятно пахло профсредствами. Сейчас пахнет пылью) Не поеду больше сюда и вам не рекомендую если хотите нормальный помыв авто. Буду искать нормальную автомойку.", "d": "28 августа 2024", "n": "Анастасия Л.", "a": null}, {"r": 5, "t": "Мою машину только здесь,Закир лучший авто мойщик", "d": "27 августа 2024", "n": "Ольга С.", "a": {"t": "Здравствуйте, Ольга! Спасибо вам большое за добрые слова. Очень приятно!", "d": "23 ноября 2024"}}, {"r": 5, "t": "Очень качественно помыли👍🏼", "d": "18 августа 2024", "n": "Ivan", "a": {"t": "Спасибо большое, что выбрали нас 🔥 Ждём снова!", "d": "23 ноября 2024"}}, {"r": 1, "t": "Грязную машину в песке покрыли пенной и сразу начали тереть губкой, минус лак, больше не приеду.", "d": "16 августа 2024", "n": "Владимир К.", "a": null}, {"r": 5, "t": "Мойка норм, куда дели Леху😁", "d": "30 июля 2024", "n": "Фаниль Т.", "a": null}, {"r": 5, "t": "Отличная автомойка 👍\nРекомендую)\nБыстро, качественно и не дорого!!!", "d": "26 июля 2024", "n": "Светлана С.", "a": null}, {"r": 5, "t": "Спасибо за хорошее обслуживание", "d": "24 июля 2024", "n": "Матбий Д.", "a": null}, {"r": 5, "t": "Спасибо огромное за обслужевание и за мойку", "d": "22 июля 2024", "n": "Хайрулло Б.", "a": null}, {"r": 5, "t": "Благодарю от всей души🙏 работников за приветливое отношение как клиенту,что немаловажно, за качественную уборку и мойку машины. Желаю дальнейшего продвижения 🙌", "d": "11 июля 2024", "n": "Наиля Г.", "a": {"t": "Наиля, здравствуйте, большое спасибо за отзыв и высокую оценку. Мы работаем для вас !", "d": "26 ноября 2024"}}, {"r": 5, "t": "В данном сервисе обслуживаюсь не первый год,все устраивает,сотрудники аыполняют свою работу на 5,советую.,вот и сегодня в очередной раз помыл свою машину,результатом доволен!", "d": "29 мая 2024", "n": "Василий К.", "a": null}, {"r": 5, "t": "Закир Красавчик 🤙🏻 Хороший мойщик ✊🏼", "d": "25 мая 2024", "n": "Сергей П.", "a": null}, {"r": 5, "t": "Пользуюсь услугами автомойки и шиномонтажа данного автокомплекса не первый год. Качеством услуг очень довольна: быстро и качественно. Очень удобно, что есть комната для клиентов, в которой установлен телевизор.\nОтношение к клиенту доброжелательное. Рекомендую!", "d": "12 мая 2024", "n": "Светлана С.", "a": null}, {"r": 4, "t": "Записался на шиномонтаж без проблем, всё сделали хорошо, ценник только ощутимо вырос почему то с прошлого года", "d": "9 мая 2024", "n": "Сергей Б.", "a": null}, {"r": 5, "t": "Давно пользуюсь услугами данного шиномонтажа и мойки, также оставляю колеса там на хранении. Реально были проблемы с оказание услуг и их качеством, но радует, что были приняты меры и недочёты устранены. Сейчас работает прекрасная девушка администратор и только из-за неё хочется возвращаться, парень (Саломон кажется зовут) машину помыл отлично, а в предыдущий раз помыли машину отвратительно, просила перемывать. Чувствуется отношение к клиенту! Молодцы ребята, с таким отношением я продожаю оставаться постоянным клиентом и рекомендовать вас!", "d": "30 апреля 2024", "n": "Лилия Х.", "a": null}, {"r": 5, "t": "Хочу оставить отзыв про кассира администратора Катерину,милая добрая, отзывчивая.На мойку начал ездить с весны того года,пока Катя работала,была у меня скидка,и чернение в подарок,как она ушла,на кассе была черная девушка,которая не делала мне скидку и чернение,объяснив это,что нужно мне наклейку приклеить на стекло,и чернение тоже отдельно оплачивать,с этой барышней Вы далеко не уедете,если она с каждого будет требовать наклейку,и подарки не будет делать клиентам.", "d": "30 марта 2024", "n": "Борис Н.", "a": null}, {"r": 1, "t": "Когда то одна из лучших автомоек города совсем испортилась. Был 15.03.24 до обеда на комплексе. Так ужасно и просто безобразно помыть машину, нужно еще постараться. На претензии, разводят руками. Все за доплату. Администратора пол дня нет, с кем разговаривать непонятно, терминал не работает. В общем в колхоз заведение превратилось.", "d": "16 марта 2024", "n": "Иван Н.", "a": null}, {"r": 5, "t": "Удобно, все по месту!👍", "d": "22 февраля 2024", "n": "Родион К.", "a": null}, {"r": 5, "t": "Отличный сервис, хорошие ребята!", "d": "31 декабря 2023", "n": "Явуш М.", "a": null}, {"r": 5, "t": "Отличная автомойка. Хорошая и приятная команда. Моют быстро и качественно, теперь только сюда. Удобное расположение. Можно заранее позвонить и записаться и вас примут без очереди", "d": "22 декабря 2023", "n": "Венера Ф.", "a": null}, {"r": 5, "t": "Крутая автомойка ! Быстро и чисто обслуживают, вопросов никогда не возникает ! На мой взгляд самые адекватные цены на этой мойке !", "d": "14 декабря 2023", "n": "Александр С.", "a": null}, {"r": 5, "t": "Суперская мойка. Езжу только сюда. Уборка качественная, сервис отличный. Ребята молодцы, так держать👍", "d": "10 декабря 2023", "n": "Денис К.", "a": null}, {"r": 1, "t": "Года 4 точно ездил только к вам, все было хорошо. Но теперь больше никогда в жизни к вам не приеду на мойку!!! Раньше за 550руб в комплексе было все(мойка кузова, уборка салона, стекла внутри, полироль пластика салона) и все было классно, мыли прям от души. Но сегодня заехав к вам на кузов с ковриками мойщик сказал за 300-400 руб я вам мыть не буду, тока комплекс, окей, давай комплекс, цена 700 руб, окей, все дорожает, хорошо вопросов нет. Когда начал мыть, говорит за 700руб в комплекс не входит уже мытье стекл внутри, полироль пластика, это отдельно надо платить, говорит тока влажная уборка. Вообщем фиг с ним, давай влажную делай и я поехал. И тут самое интересное, помыли на от..е.!!бись, так же и пылесос с влажной уборкой, в машине куча грязи и пыли, кузов с косяками, про диски вообще молчу, как будто и не мыли, и за это 700 руб. Вообщем никому не советую.", "d": "6 декабря 2023", "n": "Виталий В.", "a": null}, {"r": 5, "t": "Была рядом , заехала на мойку впервые. Ребята молодцы ,быстро и хорошо помыли, приветливые. Рекомендация маленькая☝️ тряпочки для протирки авто почаще менять , поистрепались . \nРекомендую 😉", "d": "27 ноября 2023", "n": "Ольга С.", "a": null}, {"r": 5, "t": "Мою машину давно моют 👍 рекомендую.", "d": "19 ноября 2023", "n": "Максим М.", "a": null}, {"r": 5, "t": "Хороший отзывчивый персонал.Переобувка машина и мойка заняла чуть меньше 2хчасов!\nПользуюсь услугами уже 4й год все на уровне.\nРекомендую👌🏼", "d": "25 октября 2023", "n": "Влад К.", "a": {"t": "Благодарим за выбор!", "d": "26 октября 2023"}}, {"r": 1, "t": "Абсолютное неуважение к клиентам.", "d": "19 октября 2023", "n": "Семен Ж.", "a": {"t": "Приносим свои извинения, что данной ситуацией расстроили Вас!\nна данный момент работаем над этой проблемой,и обязательно исправимся!\n\nс Уважением команда Garage 17", "d": "26 октября 2023"}}, {"r": 5, "t": "👍👍👍все супер", "d": "19 сентября 2023", "n": "Наталья Я.", "a": {"t": "Благодарим Вас! за высокую оценку нашей работы!\nс Уважением команда Garage 17", "d": "25 сентября 2023"}}, {"r": 5, "t": "Хорошая автомойка. Быстро, качественно. Рекомендую мыть машину по предварительной записи, чтобы не ждать очереди.", "d": "18 сентября 2023", "n": "Валерий У.", "a": {"t": "Благодарим Вас! за высокую оценку нашей работы!\nс Уважением команда Garage 17", "d": "25 сентября 2023"}}, {"r": 1, "t": "Время 7 часов вечера автомойка уже закрыта", "d": "21 июня 2023", "n": "Денис Б.", "a": {"t": "Добрый день!\nВ такую погоду как \"дождь\" мы закрываемся раньше,так как не целесообразно сидеть без работы до 22.00\nПриносим свои извинения, что данной ситуацией расстроили Вас!\nна данный момент работаем над этой проблемой,и обязательно исправимся!\n\nс Уважением команда Garage 17", "d": "25 сентября 2023"}}, {"r": 5, "t": "Благодарю за отличную работу! Результат превзашел ожидания🤗", "d": "4 июня 2023", "n": "Мария Ч.", "a": {"t": "Благодарим Вас! за высокую оценку нашей работы!\nс Уважением команда Garage 17", "d": "25 сентября 2023"}}, {"r": 1, "t": "Разочарован", "d": "4 июня 2023", "n": "Алексей Д а Garage 17", "d": "25 сентября 2023"}}, {"r": 5, "t": "Хорошая автомойка. Есть запись по телефону, можно оставить машину и уйти, тогда будут дольше мыть в порядке очереди, зато помоют. \nПопросил нанести воском, уже три дня машина блестит, хороший воск мне понравился. Цена не завышена, что не маловажно.  Буду мыть здесь машину чаще", "d": "3 мая 2023", "n": "Иван И.", "a": {"t": "Благодарим Вас! за высокую оценку нашей работы!\nБудем рады Вас видеть в списке наших постоянных клиентов!\nс Уважением команда Garage 17", "d": "25 сентября 2023"}}, {"r": 5, "t": "Уже более 5 лет на шиномонтаж ездим только сюда. Предварительная запись очень экономит время, а оно бесценно! Переобувают очень быстро. Сегодня даже помыли покрышки, может потому, что не в пакетах, а в тканевых чехлах :))", "d": "21 апреля 2023", "n": "Olga O.", "a": {"t": "Благодарим Вас! за высокую оценку нашей работы!\nБудем рады Вас видеть в списке наших постоянных клиентов!\nс Уважением команда Garage 17", "d": "25 сентября 2023"}}, {"r": 5, "t": "10 покрышек из 10, разрази меня гром. Это самая быстрая переобувка к востоку от Уральских гор!!! Все четко и быстро как всегда", "d": "21 апреля 2023", "n": "Eugene i.", "a": {"t": "Благодарим Вас! за высокую оценку нашей работы!\nБудем рады Вас видеть в списке наших постоянных клиентов!\nс Уважением команда Garage 17", "d": "25 сентября 2023"}}, {"r": 5, "t": "Езжу сюда не первый раз, все как всегда на высшем уровне, спасибо", "d": "3 апреля 2023", "n": "Георгий Н.", "a": {"t": "Благодарим Вас! за высокую оценку нашей работы!\nБудем рады Вас видеть в списке наших постоянных клиентов!\nс Уважением команда Garage 17", "d": "25 сентября 2023"}}, {"r": 5, "t": "Отлично помыли авто, остался доволен👍", "d": "3 апреля 2023", "n": "Иван А.", "a": {"t": "Благодарим Вас! за высокую оценку нашей работы!\nБудем рады Вас видеть в списке наших постоянных клиентов!\nс Уважением команда Garage 17", "d": "25 сентября 2023"}}, {"r": 5, "t": "Отличная мойка. Сажусь как в новый авт зательно исправимся!\n\nс Уважением команда Garage 17", "d": "25 сентября 2023"}}, {"r": 1, "t": "РАБОТАЕТ ХАМЛО! У МЕНЯ ВЗОРВАЛОСЬ КОЛЕСО НЕ ДАЛЕКО ОТ ЭТОЙ ШАРАЖКИНОЙ КАНТОРЫ! ЗАШЛА К НЕМУ, СПРОСИЛА БОЛЬШАЯ ЛИ ОЧЕРЕДЬ, МОЖНО ЛИ ЗАПИСАТЬСЯ, МНЕ НА ХАМИЛИ, ПОСЛАЛИ ОБРАЗНО ГОВОРЯ, СНАЧАЛА ЗАПИСЫВАТЬ ВООБЩЕ НЕ ХОТЕЛ. ХОТЯ ВСЕ ВРЕМЯ МАШИНУ К НИМ ЗАГОНЯЛА И ПОПАДАЛСЯ МНЕ ХОРОШИЙ ПАРНИША НЕ РУССКОЙ ВНЕШНОСТИ. А ЭТОТ ТОЛИ ХАХОЛ ТОЛИ ПРОСТО ПОСЛЕДНИЙ ЧЕЛОВЕК.\nЗАПИСАЛ МЕНЯ С БОЕМ НА СЛЕДУЮЩИЙ ДЕНЬ НА 10:30. НЕ ПРИВЛА ЕЗДИТЬ НА ТАКСИ, ЗАДЕРЖАЛАСЬ НА ПИНУТ 5-7, ЗАХОЖУ К НЕМУ, ГОВОРЮ, ЧТО ПОНИМАЮ ЧТО ОНОЗДАЛА. НА ЧТО ОН МНЕ В ГРУБОЙ ФОРМЕ ОТВЕТИЛ \" Я В 10:30 ВЫШЕЛ, ТЕБЯ НЕБЫЛР, ЗНАЧИТ ВСЕ!\" ПРИ ЭТОМ НЕТ БОЛЬШЕ МАШИН КРОМЕ МОЕЙ. ГОВОРЮ \"ПЕПЕОБУЙ ХОТЯ БЫ ОДНО КОЛЕСО КОТОРОЕ ВЗОРВАЛОСЬ\" НА ЧТО ЭТО ЗАМНО НАШЁЛ 33 ОТМАЗКИ.\nВ ОБЩЕМ, РУКОВОДСТВО ЭТОЙ ШИНКИ ОБРАТИТЕ ВНИМАНИЕ НА СВОИХ СОТРУДНИКОВ.", "d": "24 октября 2022", "n": "Татьяна Г.", "a": null}, {"r": 1, "t": "Потраченное время и нервы", "d": "23 октября 2022", "n": "Ivan Z.", "a": null}, {"r": 5, "t": "Всё хорошо", "d": "15 сентября 2022", "n": "Андрей", "a": null}, {"r": 1, "t": "приехал на шиномонтаж, а шиномонтажника нет", "d": "15 сентября 2022", "n": "Артём Х.", "a": null}, {"r": 1, "t": "Простоял в очереди с 19.00 и заехал на мойку только в 21.10, хотя в очереди было 3 машины! то велосипедисты подкочать колеса, то чуваки тряпочки помыть, мойщик отвлекается постоянно, тем более что он один. Испортились совсем. Поставил бы -5 звёзд если были бы", "d": "27 мая 2022", "n": "Евгений Т.", "a": null}, {"r": 5, "t": "Шиномонтаж по записи. По этому с очередями проблем и ожидания нет. Приехал к нужному времени, и вуаля, через 20-30 минут свободен. Быстро и качественно. А вот мойка уже в порядке живой очереди. Но моют тоже неплохо.", "d": "10 мая 2022", "n": "Андрей Б.", "a": null}, {"r": 5, "t": "Крутая мойка, быстро, качественно и цены приятные", "d": "9 мая 2022", "n": "Tina T.", "a": null}, {"r": 1, "t": "Были по записи на    (r.a?'<div class="ans"><b>Ответ компании · '+esc(r.a.d)+'</b>'+esc(r.a.t)+'</div>':'')+'</div>'}).join('');
 $('rvMore').classList.toggle('hidden',L.length<=shown);
 [].forEach.call($('rvTabs').children,function(b){b.classList.toggle('on',b.dataset.f===filt)});

c+='<div class="ct-item"><span class="ic">📍</span><div><small>Адрес</small>'+esc(D.city+', '+D.address)+(D.addressComment?'<small>'+esc(D.addressComment)+'</small>':'')+'<br><a href="'+route+'" target="_blank" rel="noopener">Построить маршрут →</a></div></div>';
if(D.phones.length)c+='<div class="ct-item"><span class="ic">📞</span><div><small>Телефон</small>'+D.phones.map(function(p){return '<a href="tel:'+p.value+'">'+esc(p.text)+'</a>'}).join('<br>')+'</div></div>';

$('fab').innerHTML=fab;
