ад отдавал в ремонт генератор, проплатил полный ремонт, с заменой всех изношенных частей. И вот на днях на трассе откзал тот самый генератор, пришлось заночевать в екате, при вскрытии обнаружилось что с генератором ничего не делали, только лишь устранили причину неисправности, а вот оплаченная замена подшипников и щеток и прочие мелочи остались на совести новой энегрии... больше к ним ни ногой...", "d": "8 января 2019", "n": "Иван К.", "a": null}, {"r": 1, "t": "Проблема была, не всегда стартер схватывал. Сказали провели диагностику взяли 4тр но проблема не ушла.\nПонял одно \"мастера брать деньги\"", "d": "2 января 2019", "n": "Sergey T.", "a": {"t": "Здравствуйте, нет ничего хуже гуляющей неисправности, 04.01.19 мы начинаем работать и постараемся решить данную проблему", "d": "3 января 2019"}}, {"r": 1, "t": "отвратительный сервис, халатное отношение к клиенту", "d": "28 декабря 2018", "n": "Деня Б.", "a": {"t": "Здравствуйте. Меня зовут Вадим Петрович, тел.89044674716,наберите меня и я постараюсь изменить Ваше мнение", "d": "3 января 2019"}}, {"r": 5, "t": "Отдавал ребятам свой отказавшийся работать 8 летний генератор, перебрали, почистили, вернули как новый. Хорошо и быстро сработали. Рекомендкю", "d": "21 декабря 2018", "n": "Игорь К.", "a": null}, {"r": 5, "t": "Реквизировали мой стартер, лишнего не навязывали,по моей просьбе делали фото стартера, молодцы,да ещё и гарантия.", "d": "1 декабря 2018", "n": "Леша П.", "a": null}, {"r": 5, "t": "Молодцы ребята бистро качественно", "d": "17 ноября 2018", "n": "Ибрагим К.", "a": null}, {"r": 5, "t": "Была проблема со стартером - на горячую перестал заводиться. Посоветовали этот сервис, обслуживанием остались очень довольны. Несмотря на сложную конструкцию и очень неудобное расположения стартера - все получилось, по хорошей цене. МВ А-150 замена стартера и по-моему втягивающего - 3500р. И это с вывешиванием двигателя", "d": "5 сентября 2018", "n": "Илья К.", "a": null}, {"r": 5, "t": "Все делают качественно! Спасибо.", "d": "29 апреля 2018", "n": "эдуард р.", "a": null}, {"r": 5, "t": "Мне качество работы понравилось, перебрали генератор, все детали есть в наличии, очень удобно, один минус большая очередь, надо расширяться！！！", "d": "31 марта 2018", "n": "slava8201", "a": null}, {"r": 1, "t": "Никому не советую эту компанию.Загнал к ним авто сняли стартер (может и не сняли так как одна гайка была не тронута) сказали что со стартером все впорядке посоветовали мне проверить двигатель заплатил им 2400 р и поехал на диагностику там сказали  все отлично проверяйте стартер.Сняли стартер поменяли счётки все стало отлично.Званю в новую энергию чтобы вернули деньги они нашли кучу отмазок  что-бы  их  не отдать.", "d": "19 сентября 2017", "n": "zhidkovs", "a": null}, {"r": 1, "t": "Для начала клюнул на их рекламу в интернете, тем более, что позиционируют себя как профессионалы в электрике. Оставил заявку на сайте - обещали перезвонить через 20 минут. Не перезвонили вообще! Это первый \"минус\". Затем приехал к ним наткнулся в офисе на недовольного клиента - что-то они \"накосячили\" и он забрал свою Cerato как есть. Это был \"второй\" минус. Ну думал, что в любом случае - будет бесплатная диагностика, которая была обещана на сайте. Но вся диагностика  была сведена - к моей просьбе подойти к машине и посмотреть. Мультиметром замеряли напряжение и диагностировали \"поломку\" генератора. Слава богу, что решил съездить еще на пару станций к электрикам. Оказалось генератор исправен. Все электрики опровергли заключение \"новой энергии\". В итоге я определился с мастером. Не буду его рекламировать - машину отремонтировали. Ремонт обошелся в 300 рублей диагностика и ремонт проводки 200 рублей. За ремонт в \"новой энергии\" с меня просили 2500 рублей и тем более, что настоящую причину они увидеть не смогли. Я свои выводы сделал. Может быть Вам повезет? Единственное что мне у них понравилось - это сайт. Пожалуй все.", "d": "9 сентября 2016", "n": "Гаюс", "a": null}, {"r": 1, "t": "Отдавал аккумулят  $('pSearch').addEventListener('input',drawP); drawP();
 $('pNote').textContent=(D.prices.head?D.prices.head+'. ':'')+'Информация о ценах не является публичной офертой.';
 if(D.prices.items.length<8)$('pBlock').querySelector('.ptools').classList.add('hidden');
}else{
 $('pEyebrow').textContent='Услуги'; $('pTitle').textContent='Чем мы занимаемся';
 $('pLead').textContent='Стоимость зависит от задачи — уточняйте по телефону'+(D.whatsapp?' или в WhatsApp.':'.');
 $('pBlock').classList.add('hidden'); $('svcGrid').classList.remove('hidden');
 $('svcGrid').innerHTML=D.rubrics.map(function(r){return '<div class="svc"><span class="dot"></span>'+esc(r)+'</div>'}).join('');
}

/* режим работы и условия */
$('hours').innerHTML=D.schedule.is24?'<tr><td>Ежедневно</td><td>Круглосуточно</td></tr>':DAYS.map(function(d,i){var h=D.schedule.days[d];return '<tr'+(i===today?' class="today"':'')+'><td>'+RU[i]+'</td><td>'+(h&&h.length?h.map(function(x){return x[0]+'–'+x[1]}).join(', '):'Выходной')+'</td></tr>'}).join('');
$('hNote').textContent=D.schedule.comment||'';
if(D.attrs.length)$('attrs').innerHTML+=D.attrs.map(function(g){return '<h4>'+esc(g.name)+'</h4><div class="t">'+g.items.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>'}).join('');
else $('attrs').innerHTML+='<p class="pnote">Подробности уточняйте по телефону.</p>';

/* отзывы */
var R=D.reviews, S=D.stats, tot=0; for(var k in S)tot+=S[k];
$('sc').textContent=D.rating?String(D.rating).replace('.',','):'—'; $('scSt').innerHTML=stars(D.rating||0);
$('scCnt').textContent=D.ratingCount+' оценок · '+R.length+' отзывов с текстом';
$('bars').innerHTML=[5,4,3,2,1].map(function(s){return '<div class="bar"><span>'+s+' ★</span><div class="tr"><span style="width:'+(tot?S[s]/tot*100:0)+'%"></span></div><span>'+S[s]+'</span></div>'}).join('')+
 '<small style="color:var(--muted);font-size:12.5px">Оценки '+tot+' отзывов в 2ГИС</small>';
var nPos=R.filter(function(r){return r.r>=4}).length, nNeg=R.filter(function(r){return r.r<=3}).length, filt='all', shown=12;
$('rvTabs').innerHTML='<button type="button" data-f="all">Все ('+R.length+')</button><button type="button" data-f="pos">Положительные ('+nPos+')</button><button type="button" data-f="neg">Отрицательные ('+nNeg+')</button>';
function list(){return R.filter(function(r){return filt==='all'||(filt==='pos'?r.r>=4:r.r<=3)})}
function drawR(){var L=list();
 $('rvGrid').innerHTML=L.slice(0,shown).map(function(r){
  return '<div class="rv'+(r.r<=3?' neg':'')+'"><div class="rs">'+stars(r.r)+'</div><p>'+esc(r.t)+'</p><div class="who">'+esc(r.n)+' <small>· '+esc(r.d)+'</small></div>'+
   (r.a?'<div class="ans"><b>Ответ компании · '+esc(r.a.d)+'</b>'+esc(r.a.t)+'</div>':'')+'</div>'}).join('');
 $('rvMore').classList.toggle('hidden',L.length<=shown);
 [].forEach.call($('rvTabs').children,function(b){b.classList.toggle('on',b.dataset.f===filt)});
}
$('rvTabs').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(!b)return;filt=b.dataset.f;shown=12;drawR()});
$('rvMore').addEventListener('click',function(){shown+=24;drawR()});
$('rvAll').href=D.gis+'/tab/reviews'; drawR();

/* контакты */
var c='';
c+='<div class="ct-item"><span class="ic">📍</span><div><small>Адрес</small>'+esc(D.city+', '+D.address)+(D.addressComment?'<small>'+esc(D.addressComment)+'</small>':'')+'<br><a href="'+route+'" target="_blank" rel="noopener">Построить маршрут →</a></div></div>';
if(D.phones.length)c+='<div class="ct-item"><span class="ic">📞</span><div><small>Телефон</small>'+D.phones.map(function(p){return '<a href="tel:'+p.value+'">'+esc(p.text)+'</a>'}).join('<br>')+'</div></div>';
if(D.email)c+='<div class="ct-item"><span class="ic">✉️</span><div><small>Почта</small><a href="mailto:'+esc(D.email)+'">'+esc(D.email)+'</a></div></div>';
var soc=D.links.map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'}).join('');
if(soc)c+='<div class="soc">'+soc+'</div>';
$('ct').innerHTML=c;
$('map').src='https://yandex.ru/map-widget/v1/?ll='+D.point.lon+','+D.point.lat+'&z=16&pt='+D.point.lon+','+D.point.lat+',pm2rdm';
$('ftL').textContent='© '+new Date().getFullYear()+' '+D.fullName+', '+D.city;
var fab=''; if(tel)fab+='<a href="'+tel+'" aria-label="Позвонить">📞</a>'; if(D.whatsapp)fab+='<a class="w" href="'+wa('Здравствуйте! Пишу с сайта.')+'" target="_blank" rel="noopener" aria-label="WhatsApp">'+WA_SVG+'</a>';
$('fab').innerHTML=fab;
})();
</script>
</body>
</html>
