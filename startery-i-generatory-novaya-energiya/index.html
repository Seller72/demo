лся доволен результатом работы. Произвели ревизию и дефектовку генератора с последующей заменой комплектующих, все работает теперь как часы!", "d": "19 января 2026", "n": "Михаил И.", "a": {"t": "Здравствуйте, Михаил. Спасибо вам большое за ваш отзыв 💛 Мы старались 🤝", "d": "28 января 2026"}}, {"r": 5, "t": "Обратилась 16 января зашумел генератор при осмотре выявили течь переднего сальника коленвала машину сделали за один день спасибо огромное специалистам своего дела моей ласточке 26 лет", "d": "17 января 2026", "n": "Olga P.", "a": {"t": "Olga, благодарим вас за теплые слова 😉!!!!", "d": "17 января 2026"}}, {"r": 4, "t": "Ремонт генератора, всё сделано быстро, запчасти в наличии. Спасибо", "d": "14 января 2026", "n": "Рустам И.", "a": null}, {"r": 5, "t": "Заменили двигатель, быстро и качественно. Всем рекомендую особенно большая благодарность Авто слесарю Евгению Калеснику. Обращаюсь не первый раз. Ремонт генераторов на высшем уровне.", "d": "11 января 2026", "n": "Мурат А.", "a": {"t": "Благодарим вас, что выбрали нас 😌 Мы всегда вам рады.", "d": "11 января 2026"}}, {"r": 5, "t": "Автовладельцам рекомендую!\nХочу отметить высокий уровень работы команды: внимательные, компетентные специалисты, которые оперативно решают любые задачи. Быстро, чётко, без лишних вопросов.\nСПАСИБО!!!", "d": "30 декабря 2025", "n": "Татьяна", "a": null}, {"r": 5, "t": "Добрый день,ремонтировал 25.12.25 генератор Бош(демонтаж монтаж диагностика ремонт) на лада-хаски-гранта 127 мотор, замена подшипников, колектора , щеток,и плюс внеплановая замена ролика ремня генератора(по рекомендации),не снятый,загонял машину, при полной загрузки бокса время ожидания с 11утра до 18 часов, цена вопроса без малого 12₽(работа+запчасти), благодарю ребят за оперативный ремонт,коллектив молодцы,всем Спасибо. P.S.в такой мороз очень не хватало чашки горячего кофе).", "d": "26 декабря 2025", "n": "Денис Г.", "a": null}, {"r": 5, "t": "Парни молодцы, Алексей и Вадим. Третий раз обращаюсь, сейчас менял вентилятор на печке. По времени заняло три часа!:) Сервис рекомендую!:)))", "d": "24 декабря 2025", "n": "Алексей Ф.", "a": null}, {"r": 5, "t": "Все оперативно и качественно! Предложили ремонт и альтернативный вариант. Стоимость согласовали и все в срок отремонтировали. Ребятам огромное спасибо! Сервису успехов и процветания!", "d": "23 декабря 2025", "n": "Иван Д.", "a": null}, {"r": 5, "t": "Быстро качественно и удобно, парни на ресепшен молодцы знают свое дело, машину на следующий день забрал хотя у них завал был из-за морозов", "d": "23 декабря 2025", "n": "Юра Ч.", "a": null}, {"r": 5, "t": "Обращаюсь , к ребятам не первый раз , сначала делали стартер все отлично , потом делали не больше то ! Рекомендую быстро качественно и по адекватной цене", "d": "22 декабря 2025", "n": "Danil G.", "a": null}, {"r": 5, "t": "Пожалуй лучшая компания в городе которая очень быстро реагирует и выполняет ремонт любой сложности в очень короткие сроки в моем случае в обед привёз вечером уже забрал машину ребята опытные никаких лишних движений делают все по уму всем рекомендую!", "d": "21 декабря 2025", "n": "Денис Т.", "a": null}, {"r": 5, "t": "Отличный сервис .", "d": "21 декабря 2025", "n": "Равиль Б.", "a": null}, {"r": 5, "t": "Делают всё быстро и качественно, профессионалы своего дела!!!!!", "d": "20 декабря 2025", "n": "Андрей К.", "a": null}, {"r": 5, "t": "Вчера был там мастера все отлично👍", "d": "15 декабря 2025", "n": "Анатолий Ш.", "a": null}, {"r": 5, "t": "Всё быстро и по цене дешевле. В следующий раз обращусь обязательно туда", "d": "8 декабря 2025", "n": "Сергей Г.", "a": null}, {"r": 5, "t": "Отличный сервис! Ребята выполнили работу на высшем уровне. Отдавал стартер на ремонт, выявили неисправные детали, заказали в кратчайшие сроки и заменили. Всем доволен. Советую👍👍👍", "d": "30 ноября 2025", "n": "Rinat M.", "a": null}, {"r": 5, "t": "Пацаны просто красавцы!!! Загнал БМВ Х5, вечером, в воскресенье, были ошибки «аккумулятор не заряжается» МОЛНИЕНОСНО С УТРА РАЗОБРАЛИ, поменяли все что нужно в одном месте, еще и попутно заменил ролик кондиционера, вдвое дешевле чем отдельно менять! Вообщем рекомендую!", "d": "27 ноября 2025", "n": "Иаан С.", "a": null}, {"r": 5, "t": "Отличный сервис, рекомендую", "d": "26 ноября 2025", "n": "Николай Г.", "a": null}, {"r": 5, "t": "Обращаюсь не в первый, делают очень быстро и качественно, ценник доступный, рекомендую🤝", "d": "25 ноября 2025", "n": "Victor N.", "a": null}, {"r": 5, "t": "Пользуюсь услугами данного сервиса. Там не надо стоять и контролировать, что где-то, что-то не прикрутят или сделают криво. Ребята мастера своего дела и подходят максимально ответственно, делая как себе. Смело рекомендую обращаться!", "d": "18 ноября 2025", "n": "Евгений Х.", "a": null}, {"r": 5, "t": "Быстро,качественно,не дорого,спасибо", "d": "17 ноября 2025", "n": "Роман Г.", "a": null}, {"r": 5, "t": "В автосервис Новая Энергия обращаюсь не первый раз. В этот раз вышла из строя механическая коробка передач. Ребята оперативно взялись за работу, даже порекомендовали услуги эвакуатора (подешевле), автомобиль поступил днем, а вечером моя машинка уже была на ходу, переключается плавно и уверенно едет вперед. Спасибо большое мастерам данного сервиса за профессионализм и доброжелательность!!! Буду вас рекомендовать друзья и знакомым!!!", "d": "16 ноября 2025", "n": "Ольга О.", "a": null}, {"r": 5, "t": "Не запускался автомобиль, оперативно сделали , устранили проблему. Быстро , четко , не дорого. Заменили втягивающее реле стартера. Рекомендую!", "d": "16 ноября 2025", "n": "Валерия С.", "a": null}, {"r": 5, "t": "Хороший автосервис. Делают быстро и качественно. Не первый раз приезжаю. Делали генератор, меняли вентилятор отопителя (форд мондео 4). Дают гарантию на работы.", "d": "15 ноября 2025", "n": "Максим Т.", "a": null}, {"r": 5, "t": "Вежливый персонал. Выполнили качественно и быстро свою работу", "d": "15 ноября 2025", "n": "Сергей", "a": null}, {"r": 1, "t": "Не советую данное СТО. У отца на фиате поменяли радиатор охлаждения. Он не глядя забрал машину. Через два месяца начал уходить антифриз. Я начал смотреть где уходит, а они поставили ему старый заклееный радиатор. Поехал уже я разбираться. Поменяли на новый. Говорят что это мастер сам замутил. Больше в это не до СТО не нагой и не кому не советую.", "d": "14 ноября 2025", "n": "Иван Р.", "a": {"t": "Напишите номер заказ-наряда?", "d": "14 ноября 2025"}}, {"r": 5, "t": "Оперативно сделали молодцы стартер пока ставлю пять звезд посмотрим на KIA cerato по поводу сигнализации не так уж у нас и много сигнализаций чтобы не знать какими пользоваться включили мне тут валет а мастер материал в машине видимо когда камера видеорегистратора записывал не знает как отключить любой Шерхан который отключается или через 2 минуты или концевик нажать двери или капота что открыл тогда она заглохнет сразу пользуйтесь лайфхаком", "d": "15 октября 2025", "n": "АЛЕКСАНДР А.", "a": null}, {"r": 1, "t": "Перед тем как отдать им генератор лично сам проверил на люфт подшипников, было всё в идеале, только не заряжала. Сказали замена щеток подшипников обоих, оплатил сумму получил гену с запчастями которые типо поменяли, от щеток какой то мусор непонятны, подшипники нашли с мусорки с люфтами в хлам который глухой услышал гул гены, короче подшипники не с нашего генератора, хотел разобрать и доказать что их не меняли, поменяли только щетки, а этот мастер думает он самый умный он умеет разбирать и обманывать, просто такое отношение с клиентами, ЭТО ЭТОМУ МАСТЕРУ ПИШУ ВСЁ ЧТО ТЫ ПОМЕНЯЛ ВЕРНИ ДЛЯ ДОКАЗАТЕЛЬСТВА А НЕ С МУСОРКИ ПОДБИРАЙ РЖАВЫЕ ЗАПЧАСТИ", "d": "14 октября 2025", "n": "Муслим Э.", "a": null}, {"r": 2, "t": "Долгие", "d": "8 октября 2025", "n": "Risab T.", "a": null}, {"r": 1, "t": "Вообще не умеют работать деньги взяли через месяц зашумел за то гарантия год 17590 за ремонт отдал", "d": "24 сентября 2025", "n": "Игорь К.", "a": {"t": "Игорь (Виталий М.), приезжайте на осмотр, будем разбираться!", "d": "27 сентября 2025"}}, {"r": 5, "t": "Всем добра! у меня сломалась ласточка Volkswagen Jetta, захрустело че то справа ) когда руль влево, я им показал, загнали поменяли шрус, обнаружили, что течь мачла с лобовой крышкии поддон в масле... показали мне , я поседел... пробега почти 360 тыс, не обращал внимания..вообщем я и грм цепь поменял и масло двс и колодки в путь дорогу. все детали были в наличии, некоторые привезли доставкой, все сделали и дали гарантию 6 месяцев или 5000 км от пробега. в течении дня сделали, вечером я ее уже забрал. очень хороший сервис. Мастер приёмщик Алексей на каждом этапе звонил все рассказывал и объяснял... показал мне все замененные детальки :цепочку, прокладки...колодки Ну вообщем супер! рекомендую...", "d": "16 сентября 2025", "n": "Олег В.", "a": null}, {"r": 1, "t": "Отвратительная фирма, после ремонта стартера где то оборвали, провода, машина начала дымить и троить, вызвали авто электрика тот сбросил адаптации вроде начала работать но до дому доехать не смог, так же дымит и троит, машина 2007 года старая но лень было достать стартер с низу вытащили с верху, где то повредив проводку, сейчас ищу авто электрика что бы починил, позже сделаю Дефиктовку о том что испортили и поеду разбираться! \nНикому не советую, ремонт стартера вышел дороже нового, и ещё 1500 р отдал за авто электрика который не решил проблему!", "d": "8 сентября 2025", "n": "Владимир С.", "a": null}, {"r": 5, "t": "Спасибо, большое менеджеру Алексею, за помощь. Обратился по поводу мало выдаваймой зарядки генератором. Алексей все замерил, обьяснил, подсказал.", "d": "20 августа 2025", "n": "Дмитрий Т.", "a": null}, {"r": 5, "t": "Обслуживают два года. Меняю расходники,проверяют ходовку,аккумулятор.он у меня уже более 7 лет. Его состояние и прослужит ли ещё зиму,ответ получил. Обслуживанием доволен", "d": "14 августа 2025", "n": "Сергей Ч.", "a": {"t": "Сергей, добрый день, большое спасибо за отзыв и высокую оценку 😉", "d": "14 августа 2025"}}, {"r": 5, "t": "Быстро, качественно решают проблему. Респект коллективу! И самое главное - всё работает! Цены не дешёвые но адекватные, все услуги стоят своих денег. Обращался несколько раз с разными авто и не один не вернулся по гарантии", "d": "14 августа 2025", "n": "Владислав К.", "a": {"t": "Здравствуйте. Спасибо за приятный отзыв, рады стараться 💛", "d": "14 августа 2025"}}, {"r": 5, "t": "Все качественно и в срок", "d": "7 августа 2025", "n": "Дато М.", "a": null}, {"r": 5, "t": "Спасибо Алексею и Владимиру, быстро определили и устранили неисправность, подробно обо всём проинформировали, отзвонились, заменили втягивающее реле стартера. Рекомендую данную станцию как по скорости ремонта, так и его стоимости.", "d": "6 августа 2025", "n": "олег с.", "a": null}, {"r": 5, "t": "Классный сервис, машинка старенькая иногда по месяцу жду запчасти, с генератором быстро решили вопрос за , что очень благодарна.", "d": "4 августа 2025", "n": "Д К.", "a": null}, {"r": 1, "t": "Качество на нуле. Делали авенсиса в прошлом году . Сегодня побежала «их» хваленая помпа. Не советую . Помпа прослужила 8 месяцев. Антифриз который залили потерял все свой свойства и превратился в бесцветную жидкость. Можно было б 0 поставить . Поставил бы.", "d": "3 августа 2025", "n": "Мистер К.", "a": null}, {"r": 5, "t": "В декабре 2021 г., сломался генератор автомобильный, на Киа Рио 2014 г., отдал в ремонт сюда. 🚘 Сделали быстро и недорого, до сих пор работает, спасибо автомастерской «Новая Энергия». 👍", "d": "1 августа 2025", "n": "V@DiM", "a": null}, {"r": 5, "t": "Хорошая компания, обслуживаюсь у ребят уже 5 лет.", "d": "25 июля 2025", "n": "Владимир Г.", "a": null}, {"r": 1, "t": "Здравствуйте. Обратился в данную фирму пропала зарядка. Диагностику не провели, сняли генератор, поменяли все детали. А промблема не ушла был обрыв провода. Думаю ладно сделали генератор все таки пробег 100 тыс не помешает нашли обрыв,молодцы.Отдал за работу 16500р. Но спустя 2 месяца приезжаю с этой же проблемой,оказывается у них нет своего электрика, сделать они не могут, электрик приходящий . Обратился в другую фирму оказалось что провод протерся,не качественно была выполнена работа,да к тому же реле генератора вышло из строя(брак). Прежде чем поедете в новую энергию, подумайте стоит туда обращаться или нет. Обдираловка за некачественный ремонт. Данную мастерсую не рекомендую,надо её обходить стороной.", "d": "2 июня 2025", "n": "Александр К.", "a": null}, {"r": 5, "t": "Отличный сервис, добрые и отзывчивые ребята, за 10 минут помогли решить вопрос по машине. Всем рекомендую", "d": "24 мая 2025", "n": "Boris", "a": null}, {"r": 5, "t": "Ребята знают свою работу на все 💯", "d": "23 мая 2025", "n": "Алексей К.", "a": null}, {"r": 5, "t": "Хорошая фирма , знают толк в деле, привез авто( даже предложили услуги эвакуатора) проблема была у меня в стартере, все выясняли , позвонили сказали в чем проблемы были и цену сразу сказали, меня все устроило и плюс ко всему по времени сделали все четко 👍и еще гарантию дали", "d": "21 мая 2025", "n": "Алиф Г.", "a": null}, {"r": 1, "t": "Не рекомендую. Обратился со стартером от мотоцикла. Ремонт не нужен был, нужны были щетки примерно подходящие по размеру, понятно что точных я бы не нашел. Позвонил по телефону сказали приезжайте надо смотреть, приехал. Мужчина за стойкой сходу даже не поздоровался, \"мы это не делаем, мы колхозом не занимаемся\". За речью следить надо как минимум. И хоть немного вникнуть в проблему прежде чем с порога отправлять. Щетки купил в другом магазине, стартер работает. Как то так.", "d": "18 мая 2025", "n": "Антон Г.", "a": {"t": "Добрый вечер!!!Да, в автосервисе есть такое понятие , как «Колхозить», значит нарушить технологию ремонта!!!!Мы делаем все по технологии, и даем гарантию на свою работу 6 мес или 5000 км!", "d": "18 мая 2025"}}, {"r": 1, "t": "Приехал на хонде приговорили генератор \nПо итогу это помпа \nМетодом тыка работают", "d": "15 мая 2025", "n": "Виктор М.", "a": null}, {"r": 5, "t": "Хочу выразить огромную благодарность профессионалам своего дела Владимиру и Алексею! \nДоволен работой, все доходчиво объяснили!\nВсем советую, молодцы!", "d": "4 мая 2025", "n": "Nikita N.", "a": null}, {"r": 1, "t": "Отвратительная шарага другим словом не назвать. Приезжал делать генератор насчитали на 9.5 т все как положенно вроде дали бумагу где отметили гарантию пол года. Прошло 5 месяцев нарисовалась та же проблема которую по гарантии отказались устранить. Ссылаясь на свой стенд на котором они проверяют генератор. Купил новую реле и все стало работать. Вроде запчасть все может быть, но вот эту запчасть у них же и брал которую они отказали менять. Вернее предлагали поменять только за 7.5 т. Хотя эта же реле в другом месте купил за 4.5 т.", "d": "22 апреля 2025", "n": "Анатолий т.", "a": null}, {"r": 1, "t": "В ноябре 2024 заезжал с вопросом неисправности стартера. \nПри повороте ключа частое отсутствие реакции стартера или же, при срабатывании, пробуксовка бендикса.\nПричем после 3-4 пробуксовок, стартер входил в зацепление с маховиком (изношенным) и двс запускался.\nСтартер сняли, проверили на стенде, никаких проблем в работе не нашли и установили обратно.\nТипа, проблема в износе венца маховика, про который я и так знал.\nОк, хорошо, заменил маховик и сцепление в сборе, а проблема не ушла.\nГрешил на замок зажигания, заменил.\nА проблема не ушла.\n\nСегодня, 18.04.2025, в стелсе дефектовали сам стартер, чего я и хотел в ноябре-месяце от вашей фирмы.\nИ вот сюрприз, а стартер-то внутри устал. Возрастной износ и люфт. А машинке, на секунду, уже 20+ лет.\n\nПросто в никуда потратил ~3,5к.", "d": "18 апреля 2025", "n": "Алексей Р.", "a": null}, {"r": 2, "t": "Крик души🥲 с 7 го февраля не могу сделать машину в 10 сто была! Приехала на это сто, объяснила, что да как, записали, завтра утром протестируем. Ок. Звонят- все нормально, ничего не стучит, не звенит, двигатель работает хорошо. Ну как так, блин. Я 20 лет за рулем и наверно знаю как стучит , как работает нормально двигатель. Села, завела, только тронулась, стук оч хорошо слышно.. Ничего не понимаю, толи не хотят люди думать, работать, разбираться🤷 печально😩 3 машины было у меня и ни разу я не сталкивалась с тем, чтоб не устранили проблему. Это вот в последние годы.. Не хочет народ работать😓", "d": "13 апреля 2025", "n": "Елена Г.", "a": null}, {"r": 5, "t": "Отличный сервис. Быстро и качественно отремонтировали стартер по приемлемой цене. Остался доволен и буду советовать другим.", "d": "27 марта 2025", "n": "Алексей К.", "a": null}, {"r": 5, "t": "Пол года ездил с проблемой перезаряда \nЗаезжал на други станции \nГоворили что все нормально с генератором \nКак итог \nПриехал на эту станцию по ремонту \nОперативно нашли проблему \nИ сказали что проблема в реле напряжения \nЗаменили некачественную деталь \nИ проблема ушла \nЗнаю толк в своей работе \nИ подход к клиентам", "d": "28 февраля 2025", "n": "Михаил Ж.", "a": null}, {"r": 5, "t": "Делают быстро ) запчасти почти всегда в наличии ) оплатит можно как угодно! Делали и стартера и генераторы нормально уже км прошли все пашет )", "d": "25 февраля 2025", "n": "Алена Б.", "a": null}, {"r": 5, "t": "Отлично 👍", "d": "14 февраля 2025", "n": "Закир И.", "a": null}, {"r": 5, "t": "Добрый всем день. Обратился первый раз в данную компанию. Машина, тойота венза. Проблема была в не понятном стуке в районе двигателя. На предыдущей станции предположительно сказали это может быть цепь или катализатор) хотя пробег у машины 78т. Ну да ладно!!! Сейчас о хорошем) приехал утром к ребятам без записи. В течении получаса машину загнали на диагностику, озвучили в чем может быть проблема. Всё согласовали и приняли решение делать. Все запчасти у ребят были в наличии. В общем оставил машину до вечера. Мне заранее позвонили, приехал, проверил, вуаля! Всё работает и шепчет👍👍👍 в общем главное устранили болячку которая меня очень бесила. К тому же еще и попутно после диагностики сделали что не беспокоило и не было видно. Но повторюсь, это было согласовано! В общем рекомендую данную станцию. Ребятам отдельно спасибо! И всем добра!!!🤝", "d": "30 января 2025", "n": "Сергей Л.", "a": null}, {"r": 5, "t": "Помогли в нестандартном вопросе.\nИскал пружинки для щеток стартера Рено. Нашли!!! 👍\nДля сравнения: обзвонил, объехал пару похожих фирм, ничем не помогли", "d": "27 января 2025", "n": "иван и.", "a": null}, {"r": 5, "t": "С 2016 года обращаюсь к данным мастерам, раньше привозила им генераторы от тракторов на ремонт, сейчас обратилась с генератором на легковой авто. Работы провели быстро, дело свое знают. Так что обращайтесь с любым авто , помогут !!!", "d": "24 января 2025", "n": "Инара Т.", "a": null}, {"r": 5, "t": "У меня была проблема с электрикой. Здесь быстро нашли причину и устранили неисправность. Всем рекомендую!", "d": "19 января 2025", "n": "Владислав Е.", "a": null}, {"r": 5, "t": "Отличная компания. Стартер сняли с Короллы, отремонтировали и отдали машину в течение 1,5 часов. Всё быстро и качественно, приветливый и грамотный персонал. Спасибо!!!\nВсем рекомендую!", "d": "18 января 2025", "n": "Сан С.", "a": null}, {"r": 5, "t": "Хочу поделиться мнением о данной авто мастерской,хороший отзывчивый персонал, делают всё быстро и качественно,, Рекомендую данное заведение", "d": "18 января 2025", "n": "Городской ж.", "a": null}, {"r": 5, "t": "Хочу поделиться впечатлениями о автомастерской \"Новая Энергия\"! Отличный сервис, профессиональные мастера и доступные цены. Быстро и качественно устранили проблему с моим автомобилем. Рекомендую всем!", "d": "16 января 2025", "n": "Константин М.", "a": null}, {"r": 5, "t": "Делал полика, сделали быстро и качественно всё объяснили и показали , вежливые и опытные ребята", "d": "15 января 2025", "n": "Кирилл З.", "a": null}, {"r": 5, "t": "Были в первый раз, меняли масло, сделали быстро, а главное муж и наша красавица довольны, теперь не едем, а летаем! Андрею спасибо 👍👍", "d": "15 января 2025", "n": "Жанат S.", "a": null}, {"r": 5, "t": "Отличный сервис ,приятный персонал,вежливые ребята ,все объяснят расскажут .Оперативно устранили все неполадки в автомобили ,дали гарантию.Спасибо ,теперь только к Вам !", "d": "14 января 2025", "n": "Елена В.", "a": null}, {"r": 5, "t": "Приехал с проблемой подшипников. Ребята все починили, довольно быстро и все подробно объясняют. Под конец работы дали гарантию на год👍", "d": "13 января 2025", "n": "Алексей Б.", "a": null}, {"r": 5, "t": "Приятный сервис с приятными ценами и сотрудниками. Оперативно обнаружили и устранили проблему, до этого уже меняли стартер, дали гарантию - вопросов нет. Мастеру Андрею отдельная благодарность! Отец ремонтируется не первый раз, получает скидку, как пенсионер, доволен как слон))", "d": "12 января 2025", "n": "Татьяна М.", "a": null}, {"r": 5, "t": "Я обращался в сервис с проблемой трансмиссии на моем автомобиле. В других СТО мне предлагали заменить коробку, что было бы очень дорого. Однако здесь специалисты проявили внимательность и тщательно проверили все, нашли причину неисправности и исправили её. Теперь я точно знаю, к кому можно обратиться за помощью!", "d": "10 января 2025", "n": "А Г.", "a": null}, {"r": 5, "t": "Идеальная Автомастерская которую я только видел. Дали гарантию на 2 года ещё 20000км пробега постоянные акции. Советую, отдельное благодарствую сотруднику Андрею очень профессионально подсказал что да как!", "d": "9 января 2025", "n": "TW1sti77 ᅠ.", "a": null}, {"r": 5, "t": "Самый лучший автосервис который я встречал когда либо! Все починили очень быстро и качественно всем рекомендую.", "d": "7 января 2025", "n": "Роман С.", "a": null}, {"r": 5, "t": "Когда я посетил автомастерскую, я был приятно удивлён высоким уровнем обслуживания. Мастера оказались настоящими профессионалами своего дела: быстро диагностировали проблему и предложили несколько вариантов её решения. В процессе ремонта мне подробно объяснили, что именно делается с автомобилем, что добавило доверия. Цены оказались вполне разумными, а время выполнения работ не затянулось. В целом, я остался доволен своим опытом и могу смело рекомендовать эту автомастерскую другим.", "d": "6 января 2025", "n": "федя М.", "a": null}, {"r": 5, "t": "Хорошая автосервис со всем помогли советую обошлось дёшево", "d": "5 января 2025", "n": "Надир Г.", "a": null}, {"r": 5, "t": "Спасибо большое! Выручили с тухнущим светом и невдекватной работой элусилителя руля. был у вас дважды и дважды все прошло супер :)", "d": "4 января 2025", "n": "Ruslan", "a": null}, {"r": 5, "t": "Идеальная Автомастерская Дали гарантию на 2 года ещё 20000км пробега постоянные акции", "d": "4 января 2025", "n": "Демикс", "a": null}, {"r": 5, "t": "Заменили стартер на автомобиле и дали гарантию !", "d": "3 января 2025", "n": "Алексей", "a": null}, {"r": 5, "t": "Отличная автомастерская , лучшие продукты и продавцы, все хорошо", "d": "2 января 2025", "n": "Denis", "a": null}, {"r": 5, "t": "Все качествено очень профессиональный сотрудники очень бысто сарентировали помогли благодору", "d": "30 декабря 2024", "n": "артём", "a": null}, {"r": 5, "t": "Мой шуруповёрт вихрь недавно сломался.Оказалось сгорел мотор.Принёс его в эту мастерскую через день шуроповерт уже был готов.", "d": "28 декабря 2024", "n": "Никита л.", "a": null}, {"r": 5, "t": "Обратился в этот автосервис для ремонта генератора и остался очень доволен качеством предоставленных услуг. Но они также выполняют ремонт ДВС (кроме дизельных двигателей). Что особенно впечатляет - наличие качественного и специализированного инструмента и оборудования, а также опытный персонал, который гарантирует качество работ (гарантия 1 год или 20000 км пробега).\nОтдельно стоит упомянуть о том, что автосервис предлагает широкий выбор запчастей, включая бендиксы, подшипники, электромагниты, обгонные муфты и регуляторы генератора. Высокое качество запчастей и доступные цены делают их отличным выбором.\nКроме того, у автосервиса есть постоянные акции и программа лояльности, предусматривающая скидки для льготных категорий граждан (пенсионеры, инвалиды, многодетные семьи, участники и ветераны боевых действий). Это очень приятно и показывает, что компания заботится о своих клиентах.\nХочу выразить отдельную благодарность сотруднику Андрею и Владимиру. Эти ребята профессионалы своего дела и очень вежливы в общении. В общем, я остался очень доволен посещением сервиса и с уверенностью рекомендую его всем своим друзьям и знакомым.", "d": "27 декабря 2024", "n": "Александр С.", "a": null}, {"r": 5, "t": "Хочу поделиться своим опытом обращения в сервис по ремонту стартеров и генераторов. Ребята действительно знают своё дело! Я обратился к ним с проблемой в отопителе, и быстро получил квалифицированную помощь. \n\nСервис предлагает широкий спектр услуг: от ремонта ходовой части до планового технического обслуживания, что очень удобно. Кроме того, у них есть специальное оборудование и инструменты, что говорит о высоком уровне профессионализма. Особо хочу отметить опытный персонал — Андрей, Владимир и Алексей проявили себя как настоящие эксперты в своём деле.\n\nОтдельно стоит упомянуть о гарантии на работы — 1 год или 20 000 км пробега, что внушает доверие. В наличии большой ассортимент запчастей, так что не придётся долго ждать нужные детали. \n\nТакже приятно, что у них есть программы лояльности и скидки для льготных категорий граждан. Это действительно важно и показывает, что бизнес заботится о своих клиентах.\n\nЕсли вам нужны бендиксы, подшипники, электромагниты или регуляторы генератора, смело обращайтесь сюда. Это надёжный сервис, который я могу порекомендовать!", "d": "25 декабря 2024", "n": "Наталья Т.", "a": null}, {"r": 5, "t": "Все быстро и четко, стартер на машине отремонтировали за один день, сами сняли и поставили. Рекомендую!", "d": "6 декабря 2024", "n": "Васили Б.", "a": null}, {"r": 5, "t": "Вышел из строя генератор. В этот же день отремонтировали, сделали все быстро и качественно.", "d": "26 ноября 2024", "n": "Евгений", "a": null}, {"r": 5, "t": "Хочу поделиться своим опытом обращения в автомастерскую [Новая Энергия]. Недавно у моей машины возникла проблема с генератором на Ауди ку 7, и я решил обратиться за помощью к профессионалам.\nПервое, что мне понравилось, это оперативность сотрудников мастерской. Они быстро приняли мою машину и объяснили, какие работы будут проводиться. Также мне понравилось, что все работы выполнялись качественно и аккуратно.\nОсобенно хочу отметить профессионализм мастеров. Они знают свое дело и выполняют свою работу на высоком уровне. Мне также понравилось, что они всегда готовы ответить на все мои вопросы и объяснить, что они делают.\nЦены на услуги в мастерской оказались вполне приемлемыми. Я считаю, что они соответствуют качеству работы. Также хочу отметить, что мне предоставили гарантию на выполненные работы.\nВ целом, я остался доволен своим опытом обращения в автомастерскую [Новая Энергия]. Рекомендую ее всем, кто ищет качественное обслуживание своего автомобиля.", "d": "25 ноября 2024", "n": "Александр Г.", "a": null}, {"r": 5, "t": "Проходил ТО в этом автокомплексе, всё сделали быстро. Поменяли масло, фильтры, проверили тормоза. Всё по делу, без навязывания лишнего ремонта. Теперь буду сюда заезжать регулярно", "d": "15 ноября 2024", "n": "Юрий Г.", "a": null}, {"r": 5, "t": "Генератор сдох, думал, что придется менять полностью. В СТО починили всё за пару часов: заменили щетки, подшипники и кольца. Работает как новенький. Обошлось дешевле, чем ожидал", "d": "14 ноября 2024", "n": "Дима Б.", "a": null}, {"r": 5, "t": "У меня начались проблемы с мотором, шумел и не тянул. В автокомплексе провели диагностику, оказалось, что проблемы с клапанами. Всё починили, машина снова тянет как надо. Спасибо за качественную работу!", "d": "12 ноября 2024", "n": "Юрий М.", "a": null}, {"r": 5, "t": "После поездки по плохим дорогам подвеска начала стучать. Приехал в автокомплекс, провели диагностику, заменили амортизаторы и стойки. Машина снова как новая, никаких звуков.", "d": "11 ноября 2024", "n": "Станислав Е.", "a": null}, {"r": 5, "t": "Стартёр начал плохо срабатывать, приехал в СТО. Мастера разобрали, показали, что проблема в бендиксе. Заменили его, дали гарантию. Всё быстро и чётко", "d": "10 ноября 2024", "n": "Борис П.", "a": null}, {"r": 5, "t": "Приехал с проблемой в коробке, в других местах говорили менять её полностью. Здесь нашли причину, обошлось заменой регулятора. Сэкономил кучу денег! Теперь буду ремонтироваться только здесь", "d": "10 ноября 2024", "n": "Вадим З.", "a": null}, {"r": 5, "t": "Генератор сдох, приехал в СТО. Ребята заменили щетки и подшипники за час, всё работает отлично. Очень доволен, рекомендую!", "d": "10 ноября 2024", "n": "Игорь Б.", "a": null}, {"r": 5, "t": "Стартёр начал плохо крутить, обратился в этот автокомплекс. Разобрали, нашли неисправность — бендикс накрылся. Поменяли на месте, дали гарантию. В сервисе реально шарят, работают быстро и качественно", "d": "7 ноября 2024", "n": "Игорь Н.", "a": null}, {"r": 5, "t": "Был неприятный стук в подвеске, обратился в СТО. Все объяснили, показали, что именно стучало. Поменяли шаровые, амортизаторы и стойки стабилизатора. Всё сделали быстро и по адекватной цене. Машина снова как новая!", "d": "6 ноября 2024", "n": "Даниэль О.", "a": null}, {"r": 5, "t": "Проходил ТО, всё прошло гладко: заменили масло, проверили ходовую и тормоза. Вежливые мастера, всё объяснили и показали. По цене вполне окей", "d": "6 ноября 2024", "n": "Ростислав Т.", "a": null}, {"r": 5, "t": "Очень быстро и качественно!!!ребятам большой респект 👍👋🫷🏻Спасибо большое!!!", "d": "1 ноября 2024", "n": "Денис С.", "a": null}, {"r": 5, "t": "Приехал на замену масла и ТО. Всё сделали быстро, никаких лишних услуг не навязывали. Ребята в сервисе знают своё дело", "d": "30 октября 2024", "n": "Илья И.", "a": null}, {"r": 5, "t": "Заглох на трассе, еле доехал до сервиса. Генератор приказал долго жить. Мастера сняли его, показали стертые щетки и подшипники. Все заменили за два часа, дали гарантию на год. Машина теперь без проблем", "d": "24 октября 2024", "n": "Остап Б.", "a": null}, {"r": 5, "t": "Машина начала дергаться, приехал в сервис. Провели диагностику, нашли проблему с генератором, быстро починили. Гарантию дали, теперь катаюсь спокойно", "d": "23 октября 2024", "n": "Ростислав А.", "a": null}, {"r": 5, "t": "Стартер начал барахлить, приехал в этот автокомплекс. Починили за пару часов, заменили бендикс. Сейчас всё отлично работает, мастера знают своё дело", "d": "22 октября 2024", "n": "Павел Е.", "a": null}, {"r": 5, "t": "Была проблема с генератором, думал, менять придётся. А тут всё починили быстро и по делу, заменили щетки и подшипники. Теперь всё работает отлично, рекомендую сервис", "d": "22 октября 2024", "n": "Кирилл М.", "a": null}, {"r": 5, "t": "Приехал на ТО, нашли проблему с подвеской. Всё поменяли за день, цены нормальные, дали гарантию. Машина снова едет мягко и без стуков", "d": "22 октября 2024", "n": "Евгений И.", "a": null}, {"r": 5, "t": "Загорелась куча ошибок на приборке, генератор полетел. Приехал в автокомплекс, сняли и сразу сказали, что щетки стерлись. Через полтора часа всё готово, и обошлось недорого. Дали гарантию на год, теперь всё четко работает. Спасибо вам, ребята!", "d": "22 октября 2024", "n": "Марк А.", "a": null}, {"r": 5, "t": "Быстро качественно надежно два года назад делал стартер полет нормальный , единственное что не разрешают со своими запчастями , запчасти чуток цены поднялись у них , раньше из всех СТО у них было дешево. Зато быстро делают.", "d": "17 октября 2024", "n": "Александр Ч.", "a": null}, {"r": 5, "t": "Всё на высшем уровне. Проблему решили за пол дня", "d": "13 октября 2024", "n": "Владимир г.", "a": null}, {"r": 5, "t": "Рекомендую, приехал с проблемой по генератору. Оперативно перебрали за 2 часа,как новенький. Гарантия год. Персонал молодцы👍", "d": "12 октября 2024", "n": "Николай С.", "a": null}, {"r": 5, "t": "Большое спасибо мастерам СТО Новая Энергия.\nОтремонтировали мой автомобиль и сэкономили мне крупную сумму денег.", "d": "8 сентября 2024", "n": "Николай М.", "a": null}, {"r": 5, "t": "Всё очень круто,мастер Алексей спасибо, рекомендую", "d": "8 сентября 2024", "n": "Railon.v", "a": null}, {"r": 5, "t": "Хорошая организация, отвозил туда на ремонт генератор сделали быстро и качественно, а особенно хотелось бы отметить Алексея специалист знающий свою работу все объяснил показал рассказал, в общем рекомендую 🤝👍", "d": "5 сентября 2024", "n": "Сергей Д.", "a": null}, {"r": 5, "t": "Доброго времени суток. Не так давно обратилась к специалистам станции для полировки фар. Оказалось, что эта процедура будет бесполезной, так проблема более серьезная. Но, поправимая, заверил меня Александр. Оказалось необходимо было заменить линзы с отражателями. Мне не просто рассказали, но и показали разные варианты, их плюсы и минусы. В результате качественно и в короткий срок моей ласточке заменили линзы, отпалировали стекла фар. \nОгромная благодарность за вашу работу!", "d": "1 августа 2024", "n": "Вера В.", "a": null}, {"r": 5, "t": "Не отказались сами снять и поставить несмотря на сложный авто. Все сделали за 1день. Звонят все согласовывать дали гарантию на генератор 1год.\nУровень👍", "d": "14 июля 2024", "n": "Виталий", "a": null}, {"r": 5, "t": "Мастера своего дела .", "d": "13 июля 2024", "n": "Арсен Н.", "a": null}, {"r": 5, "t": "Привезла машину с подозрением на проблемы с генератором . Машину приняли , озвучили срок выявления и устранения проблемы 1-2 дня , в связи с большой загруженностью. Перезвонили через 3 часа , уведомив о том , что проблема не в генераторе , озвучив стоимость уже проделанных работ и рекомендацией к осмотру электрика (также предварительно озвучив сумму услуг) и сроком осмотра электрика на следующий день . По итогу перезвонили еще через час с выявленной проблемой , ремонтом и информацией о том , что машину можно приезжать и забирать :) спасибо , огромнейшее спасибо , за устранение неполадок в столь кратчайший срок и более чем адекватную стоимость ! Девочки , отзыв больше для Вас : можно обращаться с уверенностью в том , что тебе не навешают доп услуг с баснословной стоимостью :)", "d": "8 июля 2024", "n": "Юлия В.", "a": null}, {"r": 5, "t": "Продиагностировали, починили генератор! Все работает как часы! Профессиональный подход и человеческое отношение!", "d": "6 июля 2024", "n": "Артём К.", "a": null}, {"r": 5, "t": "Спасибо ребятам за оперативность, все расходники в наличии, что ооочень удобно! Работа сделана в день обращения, а это редкость! Успехов вам и процветания!", "d": "5 июля 2024", "n": "Светланка Д.", "a": null}, {"r": 5, "t": "Всё как всегда на ВЫСОТЕ", "d": "21 июня 2024", "n": "Руслан К.", "a": null}, {"r": 5, "t": "Обратилась в \"Новую энергию\" когда машина ни с того ни с сего не завелась. По телефону у меня уточнили характер проблемы, через час приняли машину на диагностику. Менее чем через сутки отремонтировали стартер (запчасти у них в наличии), вернули машину, показали, где и что сломалось. Не умею писать отзывы на технические темы, поэтому огромное спасибо за оперативность, качество! Принимал, оформлял, и выдавал авто Алексей, ещё общалась с Андреем. Ребята, было приятно иметь с вами дело. Елена, Рав4", "d": "20 июня 2024", "n": "Елена Д.", "a": null}, {"r": 5, "t": "Ремонт стартера, всё очень быстро и с гарантией! \nРекомендую 👍👍👍", "d": "18 июня 2024", "n": "Ирина Т.", "a": null}, {"r": 5, "t": "Утром отдал генератор в ремонт, в обед забрал исправный. Молодцы шустро работают. Запчасти все в наличии были. И не дорого.", "d": "12 июня 2024", "n": "Александр Ж.", "a": null}, {"r": 5, "t": "Делал генератор и стартер , быстро качественно, с гарантией 👍", "d": "11 июня 2024", "n": "Егор Р.", "a": null}, {"r": 5, "t": "Недавно посетил сервис Новая Энергия из-за проблем с генератором на своей машине. Ребята оперативно выявили причину, провели качественный ремонт. Цены приемлемые, дали гарантию на работу. Вежливые и грамотные сотрудники, всё доступно объяснили. Спасибо за отличный сервис!", "d": "21 мая 2024", "n": "Тимур Ф.", "a": null}, {"r": 5, "t": "Обратился с проблемой коробки передач на своем RR. Ребята профессионально подошли к делу, нашли причину и исправили проблему. В отличие от других СТО, где советовали замену коробки, здесь работали точечно и эффективно. Теперь знаю, к кому обращаться в случае проблем!", "d": "20 мая 2024", "n": "Федор И.", "a": null}, {"r": 5, "t": "Машина начала гудеть, подумал, что дело в подшипниках. Записался на диагностику в Новую Энергию. Оказалось, что проблема была в муфте обгонной. Заменили быстро и недорого. Спасибо за профессионализм!", "d": "18 мая 2024", "n": "Герман М.", "a": null}, {"r": 5, "t": "Постоянно езжу в сюда на плановое ТО. Ребята все делают качественно и быстро. А еще нравится, что у них большой выбор запчастей в наличии, не нужно ждать доставки.", "d": "18 мая 2024", "n": "Иван Ф.", "a": null}, {"r": 5, "t": "Цены на услуги у них вполне адекватные. Не задирают, как в некоторых других сервисах.", "d": "14 мая 2024", "n": "Вадим Д.", "a": null}, {"r": 5, "t": "Профессиональный подход мастеров, оперативное решение проблемы с коробкой передач на моем автомобиле. Замена амортизаторов, шаровых и стоек стабилизатора прошла без проблем. Рекомендую этот сервис всем, кто ценит качество и надежность!", "d": "14 мая 2024", "n": "Андрей А.", "a": null}, {"r": 5, "t": "Алексей, мастер-приемщик, всегда на связи и готов ответить на любые вопросы. Спасибо за клиентоориентированность!", "d": "12 мая 2024", "n": "Борис К.", "a": null}, {"r": 5, "t": "Я пенсионерка, и для меня важно, чтобы ремонт машины был недорогим. В \"Новой Энергии\" предоставляют скидку льготным категориям граждан. Спасибо за заботу!", "d": "8 мая 2024", "n": "Диана Ч.", "a": null}, {"r": 5, "t": "У меня была проблема с электрикой. В здесь быстро нашли причину и устранили неисправность. Спасибо за профессионализм!", "d": "6 мая 2024", "n": "Илья П.", "a": null}, {"r": 5, "t": "Ребята – настоящие мастера своего дела! Сделали ремонт ходовой части быстро и качественно. Машина едет как по рельсам! Спасибо!", "d": "5 мая 2024", "n": "Анатолий Д.", "a": null}, {"r": 5, "t": "Владимир, автомеханик, – просто волшебник! Разбирается в машинах как никто другой. Спасибо ему за золотые руки!", "d": "4 мая 2024", "n": "Тарас З.", "a": null}, {"r": 5, "t": "У меня старенький автомобиль, поэтому запчасти найти не так просто. Но в Новой Энергии всегда есть то, что нужно. Спасибо, что выручаете!", "d": "3 мая 2024", "n": "Михаил Б.", "a": null}, {"r": 5, "t": "Рекомендую Новую Энергию всем своим друзьям и знакомым! Здесь работают настоящие профессионалы, которые любят свое дело.", "d": "2 мая 2024", "n": "Нестор С.", "a": null}, {"r": 5, "t": "Андрей, мастер-приемщик, – настоящий профессионал! Всегда вежливо и подробно объясняет, что нужно делать с машиной. Спасибо ему за внимательное отношение!", "d": "30 апреля 2024", "n": "Дмитрий Б.", "a": null}, {"r": 5, "t": "Ребята провели осмотр, выявили причину стуков и грохота, быстро и качественно заменили необходимые детали. Предложили оптимальные запчасти по цене и качеству. Очень довольна результатом, спасибо за профессионализм!", "d": "29 апреля 2024", "n": "Павел С.", "a": null}, {"r": 5, "t": "Полетел генератор, думал, что придется покупать новый. Но в здесь его отремонтировали, заменили регулятор и щетки. Работает как новый! Спасибо за экономию!", "d": "28 апреля 2024", "n": "Константин И.", "a": null}, {"r": 5, "t": "Гарантия на ремонт 1 год или 20 000 км пробега – это внушает доверие! Значит, ребята уверены в качестве своей работы.", "d": "27 апреля 2024", "n": "Виталий К.", "a": null}, {"r": 5, "t": "У меня накрылся стартер, машина вообще не заводилась. Приехал в \"Новую Энергию\", ребята быстро нашли причину, заменили бендикс, и все заработало как часы! Спасибо за оперативность и качественный ремонт!", "d": "26 апреля 2024", "n": "Макс С.", "a": null}, {"r": 4, "t": "Сервис хороший, только цены на запчасти накручивают как минимум в два раза больше чем в известных интернет магазинах. А так - все отлично.", "d": "31 марта 2024", "n": "Ростислав К.", "a": null}, {"r": 5, "t": "Отличный сервис, самое главное без обмана и накруток, говорят как есть", "d": "21 марта 2024", "n": "Руслан Н.", "a": null}, {"r": 5, "t": "Обратился в данный сервис с проблемой при запуске двигателя. В короткие сроки опередили причину, отремонтировали стартер, по цене устроило. Рекомендую.\nМитсубиси Галант 9.", "d": "28 февраля 2024", "n": "Pavel K.", "a": null}, {"r": 5, "t": "Уже второй раз обращаюсь. Всё быстро и качественно. Ремонт делали генератора и стартера.", "d": "11 февраля 2024", "n": "Мурат П.", "a": null}, {"r": 5, "t": "Владею субару импреза. Ремонтировал в данном месте года 2 назад генератор сегодня стартер. Все качественно, быстро, цены не завышают. Молодцы! Отличное специализированной сто!!!", "d": "23 января 2024", "n": "Антон П.", "a": null}, {"r": 5, "t": "Была необходима оперативная помощь, так как машина нужна всегда. Было сделано все четко, в срок, как и оговорено специалистом. Хотя изначально очередность без предварительной записи настораживала. Благодарю.", "d": "23 января 2024", "n": "Ganjuc R.", "a": null}, {"r": 5, "t": "Ремонтировали генератор Toyota Corolla. Пригнали авто в обед. Оперативно произвели дефектовку. Созвонились и согласовали ремонт. Сделали всё быстро. Вечером всё забрал. Запчасти старые отдали. Ездит уже пару недель. Всё в норме. Обращайтесь. Ребята молодцы.", "d": "22 января 2024", "n": "Илья Ж.", "a": null}, {"r": 5, "t": "Заехал к ребятам, думал неисправно работает генератор, сделали диагностику, генератор работает, все понравилось коллектив грамотный все четко грамотно объяснили, диагностика бесплатная рекомендую!!!!", "d": "18 января 2024", "n": "Рустам Г.", "a": null}, {"r": 5, "t": "Полтора года загнал Лансер, проблема в стартере, позвонили объяснили причину, что да как, сказали лучше восстановить родной и не дороже будет стоить чем самый дешёвый . восстановили, спасибо большое парням ставлю 5 звёзд.", "d": "5 января 2024", "n": "Артём З.", "a": null}, {"r": 5, "t": "Хороший сервис, отремонтировали генератор", "d": "4 января 2024", "n": "Sergey G.", "a": null}, {"r": 5, "t": "Молодцы. Хорошо, быстро и качественно делают. Не один раз выручали.", "d": "3 января 2024", "n": "Андрей М.", "a": null}, {"r": 5, "t": "Обслуживаю в данной мастерской два автомобиля, полностью все устраивает, профессионализм, уважение, порядочность, наличие з/ч на выбор, гарантия. Процветания вам и огромное спасибо за то что вы есть!!!", "d": "2 января 2024", "n": "Спартак М.", "a": null}, {"r": 5, "t": "Спасибо большое за работу! Работники даже задержались на работе, чтобы доделать машину!!!", "d": "29 декабря 2023", "n": "Raspi R.", "a": null}, {"r": 5, "t": "Обстоятельства были такими: выехав из Мегион в Тюмень, за Лангепасом загорелась лампочка аккумулятора. Не дотянув пары километров до Ульт-Ягуна встали по низкому заряду. В машине 5 человек, включая ребенка 7 лет.\nСначала попутчик на грузовой машине дотянул до Ульт-Ягуна, в течении минут 20 проезжающие остановились и дали контакты местного мастера СТО, который в свою очередь свел с водителем эвакуатора, который за очень разумную цену довез машину до Сургута, «Новая энергия» (ремонт автоэлектрики). На месте мастера в порядке живой очереди, но ооочень быстро приняли авто в осмотр. Уже через час был составлен отчет и обозначена стоимость ремонта (полетел генератор). Рекомендовали не растрачиваться на китайские аналоги, потому запчасти вышли не дешево. Однако еще через час генератор был собран и установлен!\nВсё это время севший аккумулятор стоял на зарядке! Внимательность специалистов к деталям поступившей проблемы - ОТДЕЛЬНАЯ ЖИРНАЯ ГАЛОЧКА в авторитетности компании!\nИтог: едва не сорвавшийся новогодний отпуск в Тюмени был спасен просто хорошими людьми и отличными специалистами своего дела!\nОтдельное спасибо Александру-эвакуаторщику из Сургута, Василию и Ирине из Ульт-Ягуна и мастеру СТО тоже из Ульт-Ягуна. Важно отметить, что все произошло в воскресный день.\nМир не без добрых людей! А честность - самая справедливая цена! Спасибо всем участникам нашего маленького приключения!", "d": "26 декабря 2023", "n": "Максим У.", "a": null}, {"r": 5, "t": "Хорошая станция всегда решают проблемы хорошо.", "d": "25 декабря 2023", "n": "Евгений А.", "a": null}, {"r": 5, "t": "Приезжал сюда с проблемой запуска авто, поменяли стартер на новый, щас все супер, сделали довольно оперативно объяснили в чем была проблема показали, честный сервис!", "d": "21 декабря 2023", "n": "Артем K.", "a": null}, {"r": 5, "t": "Мужики секут в авто 100%\nБыстро выявили проблему, сразу дали понимание, что к чему, левого ничего не пихали! От души, всё четко и по делу, буду ездить к вам 💪🏼", "d": "21 декабря 2023", "n": "danv4122", "a": null}, {"r": 5, "t": "Спасибо огромное ребятам, обратились с проблемой не заводилась машина Кио Рио, как оказалось проблема была в стартере, сделали быстро, качественно, дали рекомендации. Теперь обращаться буду только сюда!", "d": "16 декабря 2023", "n": "Людмила К.", "a": null}, {"r": 5, "t": "Данная компания неоднократно выручала меня и моих друзей реальной помощью. Профессиональный подход, главное - определяют причину, в большенстве случаев запчасти в наличии. Гарантийное обслуживание. Вежливое отношение к клиентам. Рекомендую всем, кто уважает свое ТС, и ценит четкость и решение проблем.", "d": "12 декабря 2023", "n": "Давид Щ.", "a": null}, {"r": 5, "t": "Очень понравился этот сервис, все поломки были исправлены в срок и без нареканий. Квалифицированные сотрудники, всё расскажут, покажут и объяснят! Всем советую! Ребятам дальнейшего процветания!", "d": "11 декабря 2023", "n": "Антон С.", "a": {"t": "Здравствуйте, благодарим вас за доверие 🤗", "d": "11 декабря 2023"}}, {"r": 5, "t": "Отличный сервис. Очень довольна работой. Справились с поломкой быстро. Отличные специалисты. Качество на высшем уровне.", "d": "10 декабря 2023", "n": "Анна О.", "a": {"t": "Спасибо за добрые слова о нашей работе 💛", "d": "11 декабря 2023"}}, {"r": 5, "t": "Сервис очень хороший! Общение очень доходчиво и доступно! Машину сделали раньше намеченного срока! Качественно! Что касается цены, ценник адекватный! Цена качество соответствует! Рекомендую! Спасибо ребятам!!!", "d": "10 декабря 2023", "n": "Алексей", "a": {"t": "Алексей, здравствуйте! Спасибо большое за добрые слова о нашей работе 😌 Рады были вам помочь!", "d": "11 декабря 2023"}}, {"r": 5, "t": "Все на высшем уровне, по условиям не хуже, чем у дилеров, а лучше тем, что не навязывают лишнее. Ремонтируюсь не первый раз, постоянно только положительные эмоции. Советую посетить данный автосервис, не пожалеете.", "d": "9 декабря 2023", "n": "Федор П.", "a": {"t": "Федор, добрый день! Огромное спасибо за доверие 🔥 Очень приятно, рады сотрудничать!", "d": "11 декабря 2023"}}, {"r": 5, "t": "Очень хороший и надежный автосервис. Рекомендую каждому. Сервисмены знают толк в ремонте. Найдут индивидуальный подход к каждому клиенту и вашему автомобилю.", "d": "7 декабря 2023", "n": "Семен А.", "a": {"t": "Семен, здравствуйте, благодарим, что уделили время и написали отзыв 😌 Мы работаем для вас ❤", "d": "11 декабря 2023"}}, {"r": 5, "t": "Отличный сервис, обращался сюда неоднократно, с разными проблемами, ребята знают свое дело! Спасибо большое", "d": "5 декабря 2023", "n": "Тарас З.", "a": {"t": "Тарас, здравствуйте, спасибо вам за приятный отзыв. Ждем вас в гости снова и снова 🤗", "d": "11 декабря 2023"}}, {"r": 5, "t": "Хорошее место, утром сдал машину, вечером забрал готовую, да еще и гарантию дали на произведенные работы. Опытные ребята за полдня всю ходовуху на ларгусе перебрали хаха Выявили проблему, порешали! Рекомендую от души!!!", "d": "4 декабря 2023", "n": "Степан А.", "a": {"t": "Спасибо, Степан, за отзыв, ждем вас в гости снова и снова 😉", "d": "11 декабря 2023"}}, {"r": 5, "t": "Много раз приезжала в этот автосервис и всегда отставалась довольна. Все быстро и по делу. Если что, обязательно вернусь к ним.", "d": "3 декабря 2023", "n": "Ангелина М.", "a": {"t": "Добрый вечер. Спасибо, Ангелина, за ваш отзыв 😌 Очень приятно ❤", "d": "11 декабря 2023"}}, {"r": 5, "t": "Качество на высшем уровне, запчасти в наличии, никаких задержек и отмазок. Персонал вежливый и компетентный, особый привет Андрюхе)) Спасибо тебе, всегда выручаешь!!!", "d": "2 декабря 2023", "n": "Михаил А.", "a": null}, {"r": 5, "t": "Был 2 раза, меняли масло и тормозные колодки, поправили движок! Цена радует, нареканий к работе нет, солярис теперь летает как из салона))", "d": "1 декабря 2023", "n": "Сергей Д.", "a": null}, {"r": 5, "t": "Профи в сфере ремонта генераторов, быстрая диагностика и постановка диагноза, вежливое обслуживание, довольно приемлемые цены. Если потребуется, то буду обращаться повторно только сюда! Алекскую отдельно спасибо за помощь и подход)", "d": "25 ноября 2023", "n": "Валерий У.", "a": null}, {"r": 5, "t": "Профессионалы своего дела!!! Привозил на ремонт генератор (не выдавал заряд), сделали быстро и качественно. Результатом очень доволен.", "d": "24 ноября 2023", "n": "Илья Д.", "a": null}, {"r": 5, "t": "Отремонтировали генератор быстро и качественно. Запчасти в наличии, поэтому не приходится долго ждать. Мастера грамотные, мне понравилось. Обращайтесь, если беда с генератором или стартером.", "d": "23 ноября 2023", "n": "Филипп Л.", "a": null}, {"r": 5, "t": "Владимиру салют)) Сделали полное ТО, нашли косяк в ходовой, исправили оперативно, дали рекомендации по уходу. Рекомендую ребят!", "d": "21 ноября 2023", "n": "Ярослав З.", "a": null}, {"r": 5, "t": "Прекрасный автосервис, добрые, отзывчивые мастера. Самое главное, что все они профессионалы! Отдельное спасбио Андрею, полностью все расскзаал и объяснил по ходовой на моей Весте. На выезде кайфанул, машина на плаву, ниче не стучит!", "d": "19 ноября 2023", "n": "Евгений В.", "a": null}, {"r": 5, "t": "Профессионалы своего дела! Всегда делают все качественно и в сжатые сроки. Так держать! В крайний раз оживили генератор на моем лансере)) Доволен на 100!", "d": "18 ноября 2023", "n": "Иван Д.", "a": null}, {"r": 5, "t": "Быстрая и качественная диагностика, оперативный ремонт, вежливые сотрудники! Мастера своего дела! Всем советую этот сервис!", "d": "16 ноября 2023", "n": "Виктор Е.", "a": null}, {"r": 5, "t": "Отремонтировали машину, согласовывали каждый шаг, выполнили работы согласно срока, вежливые сотрудники", "d": "13 ноября 2023", "n": "Виктория С.", "a": null}, {"r": 5, "t": "Обращался, у меня RR, была проблема с коробкой, нашли причину, всё исправили, причём! Обращался в разные СТО везде склоняли к замене «коробки» а это ну совсем дорого. Отнеслись как к своей машине всё проверили на 10 раз нашли причину, теперь точно знаю к кому обращаться!", "d": "7 ноября 2023", "n": "Михаил Г.", "a": null}, {"r": 1, "t": "Всем привет!!! Был на днях в этой конторе по названием Новая энергия)))... За персонал ничего сказать не могу ,но за человека с которым общался с менеджером а звать его Алексей Вячеславович!!!!! \nСуть: отдавали в эту компанию генератор на проф ремонт через СТО..... Ну ближе к теме!!! Шуршание , скрежет остались ну не факт я думаю что генератор так как я отдавал в эту компанию!!!! Думаю люди есть люди работу добросовестно сделали!!!! Поменяли как написано в накладной ... Может ролики )))).. ??? Заменил ролики , но свист и скрежет остались... Долго не думая я решил поехать в эту компашку.... Нашёл быстро ). Зашёл, и увидел мужчину за дальним столом за компом сидел, подумал менеджер и угадал.. \nЗвать его Алексей Вячеславович (менеджер). Огресивный, вспыльчивый,может нахамить!!! Это на заметку всем!!! \nЯ ему говорю вы можете просто послушать генератор образно определить шум идёт от него? Есть же всякие приспособления на дворе же 21 век.. Я же у вас делал этот генератор!!! На что пошла огрессия со стороны менеджера Алексея Вячеславовича... Я был в шоке!!! Я клиент оплатил стоимость ремонта генератора, приехав по гарантий!!!! А ТУТ ТАКОЕ... Ещё у менеджера рот не закрывается в след клиенту что то говорил пытаясь вызвать огрессию....Если что то не нравится все вопросы можете задать руководству...Так я не пойму а вы кто??? Менеджер по всем вопросам!!!! \nДа!!! Люди!!! Читайте наряд выполненных работ, и что там написано от и до))).. \nТак что мне сказал менеджер оставляйте авто на сколько не известно(((.. Но с обратной стороны заказ-наряда написано условие в течение 45 дней, я шокирован был....Коротко Я НЕ РЕКОМЕНДУЮ ЭТУ КОМПАНИЮ НИ КОМУ!!! За всю историю жизни в Сургуте я первый раз столкнулся с такой худшей компанией как НОВАЯ ЭНЕРГИЯ.... ВСЕМ СПАСИБО...", "d": "13 сентября 2023", "n": "Nurik N.", "a": {"t": "Добрый день!\nСпасибо, что уделили время и оставили отзыв! Сожалеем, что Вам не понравилось.\n Для улучшения нашей работы, подскажите, пожалуйста, дату и время Вашего визита.\nХорошего Вам дня!", "d": "6 марта 2024"}}, {"r": 1, "t": "ОБМАН И РАЗВОД на деньги в этом сервисе .Машина перестала заводится начинал крутить стартер и останавливался в самый нужный момент ,по признакам износ щёток. Но перед этим развалился ключ я его собрал и не обратил внимания что выпал чип его размеры как семечка . Привёз в сервис машину и оставил ,на второй день мне обещали посмотреть с утра чего не произошло . Позвонили во второй половине дня к 15 ч и говорят у вас щетки на 90 процентов изношены и втягивающий не работает ,хоя я её пытался завести она прокручивал из начально и вставала .Заменили это все и машина не завелась ,звонят и говорят ещё нужен автоэлектрик из-за чего сгорел стартер надо в машине искать ,и тогда я вспомнил что ключ развалился перед этим взял с собой запасной и поехал в сервис и чудо произошло машина завелась . Даже мастер прибежал который занимался машиной и спрашивает а что было ,получается что мастера вообще не соображают что делают просто меняют детали повезет или нет ,а клиент за это все платит .Попросил вернуть мой втягивающий старый который стоит более 3500р не вернули отдали что то похожее с мусора ржавое хотя я перед этим смотрел какой стоял у меня этот совсем не похож. ОБХОДИТЕ МИМО ОБМАН!!!", "d": "12 сентября 2023", "n": "Андрей К.", "a": null}, {"r": 5, "t": "Производили ремонт генератора. Работает.", "d": "5 августа 2023", "n": "Кирилл М.", "a": {"t": "Кирилл! Спасибо вам 😌 Мы рады, что вам всё понравилось.", "d": "5 августа 2023"}}, {"r": 5, "t": "Ребята молодцы ! Обратилась с проблемой не рабочего компрессора на кондиционер , ( Камри 40) так как компрессор восстановлению уже не подлежал , купила контрактный ! Ребята проверили всю систему все поменяли и заправили , времени ушло ну может пол дня и относительно не дорого ! Хотя могли бы сказать что нужно промыть систему менять радиатор и так далее ( как это делают многие другие ) и взять оплату в два раза больше ! Но сделали на совесть и все четко ! Спасибо большое ☺️ теперь аж мёрзну от холодка 🤪", "d": "4 августа 2023", "n": "Елена Л.", "a": {"t": "Елена, здравствуйте! Большое спасибо за ваш отзыв 🙏 Обращайтесь 💛", "d": "7 сентября 2023"}}, {"r": 5, "t": "Отличный сервис. Грамотный персонал. Качественный ремонт. Посоветовал друг.\r\nПропала зарядка на Форд Фокусе 1.\r\nПриехал сразу после обеда, оставил машину для снятия генератора.\r\nДумал проблема в реле напряжения, а оно оказалось в исправном состоянии. Зато всё остальное изношено.\r\nВсе нужные детали были в наличии.\r\nУтром забрал. Всё грамотно объяснили. Старые детали в коробочке в машине. На бумаге расписаны все работы с ценами отдельно и стоимость деталей отдельно. 1 год гарантии.\r\nАндрею отдельное спасибо =)", "d": "26 мая 2023", "n": "Максим М.", "a": {"t": "Добрый вечер! Благодарим вас за высокую оценку! Были рады знакомству 🤝", "d": "26 мая 2023"}}, {"r": 5, "t": "Сервис и коллектив  огооооонь ! 🔥 Проблемы с генератором и стартером мучали меня долго. Приехал к вам по рекомендации друзей,не пожалел ни капли! Отремонтировали и генератор и стартер сразу,цены адекватные,дали гарантию на ремонт,дали оценку других узлов авто,досконально показывают в чем была неисправность и какие запчасти нужны. Приветливый персонал,мужики работают на отлично,индивидуально. Всем работникам станции богатырского здоровья ✊️Кто пишет негативные отзывы - можете засунуть их куда поглубже 😉....\nХозяюшке станции огромная благодарность и низкий поклон за добросовестных и ответственных работников,каждому премия и побольше 👌 \nВ следующий раз в гости только к вам,на диагностику ГУРа.\nС уважением, владелец VOLVO.", "d": "25 мая 2023", "n": "Lankasta B.", "a": {"t": "Александр, здравствуйте. Благодарим за отзыв и оценку 🙏👌 Рады стараться ❤", "d": "26 мая 2023"}}, {"r": 1, "t": "Проблема в общении с потенциальным покупателем, пытаются решить что покупатель должен делать, при прошлом обращении при ремонте генератора обговорили замену ремня генератора, но про это забыли не стал писать отрицательный отзыв т.к. принесли свои извинения и сказали что могу приехать в любой другой день для замены. Но сегодня этот же менеджер при обращении наплевательски отнесся к потенциальному покупателю! \nДали номер директора для обращения к нему т.к. При вопросе когда будет руководитель ответа не последовало! Звонок был без результатным.\nВторой сотрудник с более лояльным отношением в лице Андрея был более лояльным! Сказал обращайтесь если что. На это я ему ответил что после обращения и общения с вашим менеджером Владимиром сложилось негативное впечатление при котором буду искать другие организации для решения своих вопросов с данными агрегатами авто! Жалею только о том что не записал разговор с сотрудником Владимиром для того что бы отправить их руководителю!", "d": "12 мая 2023", "n": "Вячеслав Т.", "a": {"t": "Добрый день, напишите данные зн , будем разбираться!", "d": "12 мая 2023"}}, {"r": 5, "t": "Грамотные специалисты. Индивидуальный подход к клиенту.", "d": "30 апреля 2023", "n": "Максим Х.", "a": {"t": "Максим, добрый день. Большое спасибо, что выбрали нас 🙏👌 Очень приятно, рады сотрудничать.", "d": "23 мая 2023"}}, {"r": 5, "t": "Сначала психанула плохой отзыв написала, возненавидела сто. Приехала в смену менеджера Алексея и авто слесаря Александра, все доделали, все заработало как положено. От менеджеров много очень зависит. С другим (не буду имя называть) общий язык совсем не нашелся.", "d": "26 февраля 2023", "n": "Анна Ж.", "a": {"t": "Здравствуйте, Анна! Спасибо вам большое, что уделили время и написали отзыв 😉 Будьте здоровы!", "d": "23 мая 2023"}}, {"r": 1, "t": "Отвратительно место, мастер приёмщик вообще не умеет разговаривать с людьми", "d": "18 февраля 2023", "n": "Ivan I.", "a": {"t": "Добрый день! Спасибо за оставленный Вами отзыв. Так быть, конечно, не должно, исправляемся!!!!!", "d": "23 мая 2023"}}, {"r": 5, "t": "Отличный сервис! Классные специалисты. Не первый раз обращаюсь! В этот раз причина поломки была не по их специальности. Но они предположили причину и не взяли денег. \nСпасибо огромное!!!", "d": "11 февраля 2023", "n": "Марина К.", "a": {"t": "Здравствуйте, Марина. Огромное спасибо, что выбрали нас 🙏👌 Ждем вас в гости снова и снова.", "d": "23 мая 2023"}}, {"r": 5, "t": "быстро качественно приемлимые цены!", "d": "30 января 2023", "n": "Алексей Р.", "a": null}, {"r": 5, "t": "Вчера был в данной компании очень отзывчивый коллектив, Я с другого города пропала зарядка на генераторе, ребята всё оперативно сделали все запчасти есть в наличии с момента как забрали машину и до момента отдачи мне её прошло 3 часа плюс-минус 10 минут дают гарантию на свои работы год либо 20.000 км рекомендую данную компанию очень хорошие специалисты всё сделали аккуратно Я когда увидел генератор подумал что мне поставили новый. спасибо большое за вашу работу. Постскриптум все заменённые запчасти положили в коробку как подтверждение выполнено работой.", "d": "25 января 2023", "n": "Дмитрий К.", "a": {"t": "Здравствуйте, Дмитрий! Спасибо вам за добрые слова 🔥 Будем рады видеть вас в числе наших постоянных клиентов.", "d": "23 мая 2023"}}, {"r": 5, "t": "Сервисом остался доволен. Привёз авто в обед среды, после обеда четверга были результаты дефектовки, к вечеру четверга авто было готово.", "d": "19 января 2023", "n": "Павел П.", "a": {"t": "Добрый вечер, огромное спасибо за отзыв и оценку 🤗 Будем вас ждать 💛", "d": "23 мая 2023"}}, {"r": 5, "t": "Сложную работу выполнили за 2 дня. Не ожидал, что можно все сделать так быстро.", "d": "9 января 2023", "n": "Фёдор Т.", "a": {"t": "Фёдор, добрый день! Спасибо вам, что уделили время и написали отзыв 🙏👌 Рады стараться!", "d": "23 мая 2023"}}, {"r": 5, "t": "Отличная компания! Все запчасти в наличии, быстрый и не дорогой ремонт, приветливый персонал. Рекомендую!", "d": "6 января 2023", "n": "Максим F.", "a": {"t": "Максим, здравствуйте! Благодарим вас за высокую оценку 🔥 Рады стараться.", "d": "23 мая 2023"}}, {"r": 5, "t": "Мастерская позволяет сэкономить. Починили мне стартер, а ремонт оказался в несколько раз дешевле покупки нового.", "d": "6 января 2023", "n": "Пётр Р.", "a": {"t": "Здравствуйте. Огромное спасибо за ваш отзыв и оценку 🙏👌 Приходите к нам ещё ❤", "d": "23 мая 2023"}}, {"r": 5, "t": "Стабильно качественный ремонт у ребят! Адекватные цены, с запчастями помогут с подбором. Рекомендую!", "d": "6 января 2023", "n": "Gancho B.", "a": {"t": "Добрый день, благодарим вас, что оценили 🙏👌", "d": "23 мая 2023"}}, {"r": 5, "t": "Сделали все при мне и по минимальной цене.", "d": "28 декабря 2022", "n": "Паша К.", "a": null}, {"r": 5, "t": "Хороший сервис,многое в наличии быстрый ремонт.", "d": "12 декабря 2022", "n": "Darius N.", "a": {"t": "Здравствуйте. Спасибо, Darius, за отзыв и оценку!!! Рады стараться 😁", "d": "23 мая 2023"}}, {"r": 1, "t": "Не кому не советую! Вводят в заблуждение по срокам ремонта только бы затянуть , привез генератор сказали будет готов 1-3 часа приехал через 3,5 часа никто и не начинал , в это время машина на подъемнике ! Короче злой капец", "d": "7 декабря 2022", "n": "Алексей А.", "a": null}, {"r": 5, "t": "Бесплатно сделали диагностику генератора! Это уже большой плюс!)", "d": "16 ноября 2022", "n": "Айдар С.", "a": null}, {"r": 1, "t": "Очень плохое обслуживание персонала.", "d": "4 ноября 2022", "n": "Салим С.", "a": null}, {"r": 1, "t": "Заезжал проверить авто на утечку токов. Посмотрели, что то там с понтом перепрошили, толку нет, сегодня машина опять высосала весь аккум. Заплатил при этом колосальные деньги. Вот так то.", "d": "26 октября 2022", "n": "Кирилл Н.", "a": null}, {"r": 5, "t": "Обращаюсь уже не первый раз. Быстро и качественно.", "d": "17 октября 2022", "n": "Dima A.", "a": null}, {"r": 5, "t": "Быстрый качественный ремонт, с гарантией. Накрутка на запчасти конечно драконовская, (зато в наличии) но всем нужно как-то зарабатывать, зато сам ремонт стоит оправданных денег. Отдавал генератор в ремонт, сделали за 2 часа, отдали чистый прям блестел, с салона так не блестел.", "d": "8 октября 2022", "n": "Виталик И.", "a": {"t": "Благодарим за отзыв!", "d": "20 октября 2022"}}, {"r": 1, "t": "Если вы думаете, что вам тут помогут, то глубоко заблуждаетесь. Отдал на ремонт стартер и генератор от Кайена. Стартер переделывали повторно, что тоже не помогло. Помогла замена стартера на новый. Теперь выясняется, что и генератор не заряжает совершенно новый аккумулятор. Добраться до генератора и стартера огромная проблема... большое спасибо вашей компании за все приятные сюрпризы (то не запускается из-застартера, то аккумулятор сядет), которые я испытывал из-за вашей криворукости", "d": "2 октября 2022", "n": "Житель Р.", "a": null}, {"r": 5, "t": "Сайт лежит", "d": "29 сентября 2022", "n": "Марат Г.", "a": null}, {"r": 5, "t": "Мастер приёмщик Владимир ,все грамотно объяснил ,сориентировал по цене на работы и на запчасти ,была проблем с Реле регулятора на генераторе ,оставила вечером и на следущий день уже было готова ,вообщем быстро и честно и четко ,да по ценам конечно отличается ,но зато делают на совесть ,не первый раз здесь делаем машину .в прошлом году сделали стартера ремонт ,так же все быстро и качественно ,советую обращаться качество и соотношение цены отличное .", "d": "14 сентября 2022", "n": "Джозефина В.", "a": null}, {"r": 1, "t": "Принёс стартер, сделали дефектовку, сказали что Щетки изношены и устал бендикс с подшипниками, озвучили сумму 5 с копейками, но по итогу запчастей не оказалось, странно конечно, ремонтировать генераторы и стартера и не иметь запчастей, по итогу в стелсе новый стартер обошёлся в 8 тыс руб., не ремонтируйте, лучше купить новый хоть и аналог.", "d": "28 августа 2022", "n": "Tony M.", "a": null}, {"r": 1, "t": "Несколько раз попыталсь развести на их запчасти и услуги, в итоге поставили свои запчасти т через время после ремонта генератор снова сломался \nНе рекомендую вообще ни разу, мерзкие менеджеры, халтурщики работники", "d": "24 августа 2022", "n": "Михаил Г.", "a": null}, {"r": 4, "t": "Цены конечно жесть, зато нашел то что нужно...", "d": "2 августа 2022", "n": "Александр J.", "a": null}, {"r": 1, "t": "Привёз генератор на ремонт, сказал менеджеру что стоит новое реле зарядки.. После диагностики сказали что не исправно реле зарядки и диодный мост.. Диодный мост сам заменил и все работает.. Как их мастер проверял я не знаю.. Насчитали за ремонт как за новый генератор. Дважды ходил и дважды не доволен.", "d": "7 июля 2022", "n": "Ал К.", "a": null}, {"r": 5, "t": "Все очень хорошо сделали. Качественно, быстро. Цены приемлимые, не завышенные. Хороший персонал. В общем, советую этот автосервис. Буду приезжать повторно.", "d": "3 июня 2022", "n": "No N.", "a": null}, {"r": 1, "t": "Не советую обратил с ремонтом стартера и генератора, вроде все сделали но на второй день перестал работать стартер привёз машину для гарантийного обслуживания 4 дня машина стояла у них они даже не взглянули. Искали любые причины чтобы не производить работы. В итоге обратился в другое место и выеснилось что дефектовку и ремонт произвели плохо. Разговаривать по поводу обслуживания или возврата денег не желают. Цены выше чем в других мастерских.", "d": "25 мая 2022", "n": "Николай П.", "a": null}, {"r": 4, "t": "В целом нормально. Из минусов, нет записи, нет кофе, ну и цены нормально завышены конечно!", "d": "24 апреля 2022", "n": "Михаил М.", "a": null}, {"r": 5, "t": "Ребята знают своё дело. Сделали дефектовку генератора, позвонили обговорили нюансы, на все интересующие меня вопросы ответили. Сделали качественно и очень быстро, рекомендую!", "d": "26 марта 2022", "n": "Григорий К.", "a": null}, {"r": 1, "t": "Не советую. Обратился в эту компанию, поскольку специализируются на ремонте стартеров и генераторов. Пригнал машину, а не снятый стартер! Описал, что при запуске слышен грохот и скрежет и авто не запускается. Вечером звонок - ремонт будет стоить 7900, согласился. На другой день сказали ещё и бендикс - уже 10000р. - ладно. На 3 день говорят маховик - ещё +13000р., тут я уже отказался. Приехал, осмотрел заменённые запчасти, а это втягивающее и бендикс в нормальном состоянии. По итогу 10т.р. за это, сказал ставить мои запчасти обратно поскольку неисправность в маховике. За эти манипуляции и неверно установленную неиспраность - изначально, заплатил 4500, а выставляли 5900. + ко всему машина простояла 5 дней, и в воскресенье не смог забрать авто, потому, что с руководством не было связи, чтобы решить вопрос по оплате. По итогу заказал маховик за 1,5 т.р. с Тюмени за 3 дня, а не за неделю у них и то венец только за 6т.р. + 7т.р. работа. Сейчас мой стартер работает как и было - исправно. Авто заводится. 4500р. на ветер. Бендикс проверяют только на авто, стенда нет! Жирный минус! Некомпетентность! Не советую!", "d": "25 марта 2022", "n": "Анатолий И.", "a": null}, {"r": 5, "t": "Ремонтировал стартер, работает на ура! Хороший сервис", "d": "5 марта 2022", "n": "Игорь Б.", "a": null}, {"r": 5, "t": "Делал у них 2 генератора на портер. Все отлично парни знают свое дело.", "d": "20 февраля 2022", "n": "Денис Т.", "a": null}, {"r": 5, "t": "Вынужден был обратиться по ремонту генератора, сделали быстро.", "d": "10 февраля 2022", "n": "Ваня Я.", "a": null}, {"r": 1, "t": "Обратились в данное заведение для замены подшипников в генераторе, обещали сделать до вечера, в итоге к машине за целый день никто не притронулся, хотя при нашем звонке нам наврали что машиной уже занимаются. За всё время нахождения там авто нам никто не позвонил не для согласования работ и даже не соизволили самостоятельно предупредить что не успевают. В очереди была вторая, вечером когда приехали забрать автомобиль без оказанного ремонта выяснилось что у них в очереди ещё были снятые стартера и генераторы на ремонт", "d": "21 января 2022", "n": "Кристина Б.", "a": null}, {"r": 5, "t": "Хороший сервис, заменили ремень генератора, все сделано быстро и аккуратно.", "d": "20 января 2022", "n": "Тимофей М.", "a": null}, {"r": 5, "t": "Стоял выбор между покупкой контрактного стартера или ремонта, решено было делать ремонт \nПодобрали запчасти привели внешний вид в идеал \nИ в кратчайшие сроки \nХочу выразить огромную благодарность за качественно проделанную работу", "d": "31 декабря 2021", "n": "Джерри П.", "a": null}, {"r": 5, "t": "Молодцы объяснили ,подобрали запчасти. Чтобы по минимму вложений.и хорошое качество.делаю свой ато сам.", "d": "9 ноября 2021", "n": "Валентин К.", "a": null}, {"r": 5, "t": "Приехал сюда от официалов, предложивших замену генератора за 35к. Ремонт в энергии обошёлся в 8к, дали год гарантии, времени ушло примерно 3ч. Сервис быстрый, менеджеры вежливые , клиентская с большим аквариумом), чай кофе, все дела. Рекомендую, молодцы ребята", "d": "9 октября 2021", "n": "Тм Н.", "a": null}, {"r": 1, "t": "Ремонтируют рабочие генераторы, без устранения причин обращения. Мне нужно было всего лишь поменять свечи, а мне сказали, нужно ремонтировать генератор. 13 000 руб. отдал, проблему не решили. После оплатил еще работу электрика, который диагностику делал и выявил причину неисправности. Решайте сами, нужны вам такие ремонтники. По поводу и без повода будут вам генератор ремонтировать.", "d": "10 сентября 2021", "n": "Slo t.", "a": null}, {"r": 1, "t": "Делают не верные выводы по диагностике, в данном случае генератора, цена на ремонт бешеная 14500", "d": "1 сентября 2021", "n": "Руслан Х.", "a": null}, {"r": 1, "t": "Не рекомендую \"Новую энергию\"!!! БЕРЕГИТЕ СЕБЯ, СВОЙ АВТОМОБИЛЬ И СВОИ НЕРВЫ!!!\nРУКОВОДИТЕЛИ НОВОЙ ЭНЕРГИИ - ВЕРНИТЕ ДЕНЬГИ!!!\n02.09.2020 обратился в данное горе предприятие с неработающим стартером - авто мицубиси лансер 9 2004гв. Машину отдал в 9-00. после 12-00 позвонили и сообщили о том что стартер не подлежит ремонту. В 14-00 Привез новый стартер, благо был в наличии. Не дождавшись звонка после 18-00 прибыл на СТО и ждал, спрашивал \"Когда же будет готово?\" и опять ждал... ждал... ждал... На часах 22-00 мне выгнали мой автомобиль! Следом бежит горе мастер и невнятно бормочет «Защита...». Менеджер переспрашивает: \"Забыл поставить?\" Конечно забыл! Время к 23-00 и вот я еду домой. Сумма затрат 2871р. Через пару дней стартер резко отбрасывает а то и вовсе не крутит. Потом удалёнка! 19.04.2021 еду на ваше СТО объясняю ситуацию. Оставил машину около 09-00 и та же история, звонков нет. После работы в 18-00 пешочком шлепаю в \"Новую энергию\" - добрый вечер!!! (ровно те же завтраки) Прождал до 20-00. Выходит менеджер и докладывает: \"Со стартером вес в порядке. Мастер ставит на место стартер\". Так причина то в чем? Ждем. Тем временем менеджер докладывает диагноз: СРОЧНО МЕНЯТЬ МАХОВИК!!! И вот наконец-то 22-30 мой лансер выезжает, человек из-за руля довольно говорит: \"Устранил\". Сумма затрат 1980 р. (скидку сделали). Доехал до заправки и история с работой стартера (вернее неисправность его) повторилась. Скрежет не своевременное срабатывание и т.п. Так и промучился до сегодняшнего дня 20.07.2021. Еле нашел б/у маховик (зарезервировал), поехал к другому Специалисту (с большой буквы). Оставил машину на 1,5 часа. Пришел забирать и Ура! Цена вопроса 1500!!! Все работает просто идеально! Не понадобился ни какой маховик!!! ГОРЕ МАСТЕРА ИЗ НОВОЙ ЭНЕРГИИ!!! криво поставили стартер вот его и закусывало. Поправили стартер и все дела!!! Вот такой в итоге диагноз!!! ВЕРНИТЕ ДЕНЬГИ!!! НЕ РЕКОМЕНДУЮ НОВУЮ ЭНЕРГИЮ!!!", "d": "20 июля 2021", "n": "Сергей З.", "a": {"t": "Добрый вечер!!!!Сожалею, что произошла такая неприятная ситуация!Позвоните мне завтра, я решу Вас вопрос-89227977572 (Эльвира)", "d": "20 июля 2021"}}, {"r": 5, "t": "Достойное сто , сегодня починили мне генератор на мой форд , рассказали показали , ребята работают оперативно, сделали как и обещали за день , Александру респект", "d": "2 июля 2021", "n": "Илья Ш.", "a": null}, {"r": 5, "t": "В 2020 году менял реле-регулятор на Джили МК Кросс. Быстро, качественно. Цена, конечно, куснула. Но это вопрос стоимости зап. частей.", "d": "28 мая 2021", "n": "Саша К.", "a": null}, {"r": 5, "t": "Ну что скажу только одно работают профи ,и мастер приёмщик Андрей очень вежливый приятный мужчина ,вечером пригнали Нисан альмеру думали сдох стартер ,в итоге с утра в 11 позвонили сказали Комплектующие сдохли щетки и бендзель в итоге сделали за 2,5 часа уже готово было о ценах очень приемлемо скажу вам чем в других сто ,обслуживание очень понравилось и к тому же сделали скидку ,что ещё больше обрадовало ,спасибо этому сто ,’буду теперь только к вам ,вообщем всем советую ,все понравилось .", "d": "14 мая 2021", "n": "Макар К.", "a": {"t": "Благодарим за приятный отзыв!!!!!!", "d": "14 мая 2021"}}, {"r": 5, "t": "Загорелся значек аккумулятора. Зарядка ее идёт. Ну в принципе ожидаемо - 10 лет без ремонта и замен. Обратился к ним - 3 часа диагностики, и два на ремонт. Ценник правда кусается, но думаю качественно сделанная работа должна быть хорошо оплачена. Рекомендую для тех кто не хочет сам лезть в дебри и искать где отремонтировать дёшево и сердито.", "d": "18 апреля 2021", "n": "Alexander T.", "a": null}, {"r": 5, "t": "13.03.2021. Загорелся индикатор аккумулятора и вылезла ошибка \"проверь заряд батареи\". Тойота Королла, 2008г. Замена деталей генератора. Хочу выразить большую благодарность Андрею и остальным сотрудникам сервиса за быстрый и качественный ремонт.", "d": "13 марта 2021", "n": "Исмаил Д.", "a": null}, {"r": 5, "t": "По моему мнению - хороший сервис. Умер генератор. Своими силами восстановили, но лампа заряда аккума все равно тускло горела. Позвонил, описал проблему, сказали: \"Привозите машину или генератор, на следующий день заберете\". Привёз машину в обед. Всё объяснили, год гарантии или 20000 пробега. Оставил машину. Вечером в этот же день позвонили, сказали, что регулятор тока похоже не родной, а мне его поменяли, ладно родной я себе оставил. Договорился привезти с утра. Привёз в десятом часу утра. Позвонили примерно в 11 сказали, что разобрали генератор, надо менять подшипники, назвали цену, я согласился. Потом позвонили опять, сказали, что вытекла смазка с обгонной муфты, надо менять муфту. Это конечно насторожило, но у меня пробег 230 000. И там все ещё родное. Ну, думаю, пришла пора и согласился. В итоге позвонили в обед этого же дня и сказали забирайте авто, все готово. Попросил не глушить автомобиль, т. к. на улице холодало. Приехал, подписал документ, забрал ключ от сигналки и пошёл в машину. Приятно был удивлён, что все запчасти замененные лежали на полу в машине, в коробочке. Машина была заведена как и просил. Открыл капот посмотреть - генератор начищен, обгонная муфта стоит новая. Посмотрел снятые подшипники - смазки там уже нет в обоих, один начал люфтить. Не зря поменял. Лампа заряда аккумулятора потухла. Всем доволен. Покатаемся посмотрим. Гарантия есть.", "d": "22 января 2021", "n": "Михаил З.", "a": null}, {"r": 1, "t": "Сдал в ремонт авто, была проблема с генератором. На следующий день мне позвонили и сказали, забирайте авто, мы по техническим причинам не можем отремонтировать. Приехал на такси, машину выгнали на улицу в - 35 (по телефону просил поставить на а/з), машину не поставили на а/з и она вся замерзла, я ее оставил, сказали скоро начнут чинить. Прошло еще сутки, позвонили, сказали можете забирать, сказал, что приеду позже, поставьте пожалуйста на а/з автомобиль. Приезжаю ближе к вечеру, на автозапуск конечно же не поставили (пошагово объяснял как это сделать), машина в итоге не завелась (хотя на ремонт изначально приехал своим ходом, проблема с зарядкой была). Я начал ругаться, авто закатили в бокс, ждали еще полчаса машину. Еще обсуждали между собой, что я начал ругать сотрудников, за то, что на а/з не поставили и заморозили авто. В итоге отдал приличную сумму за ремонт, убил много времени на ремонт, много денег на такси и нервов.\nНикому не советую и сам больше туда ни ногой.", "d": "27 декабря 2020", "n": "Иван П.", "a": {"t": "Добрый вечер!Я вчера присутствовала при выдаче Вашего автомобиля! С сотрудниками лично обсудила ситуацию по поводу оров Ваших и Вашей девушки!В данной ситуации каких-то недочетов в нашей работе Я не увидела!!!Генератор вам сделали и отзвонились по завершении работ, на автозапуск автомобиль поставили, автомобиль не запустился,в морозы такое бывает и мы не можем контролировать этот процесс!Оставить ваш автомобиль в боксе до вашего приезда мы тоже не имеем возможности, так как неизвестно было когда вы приедите!!!Но мы пошли к вам на встречу и «заталкали» ваш автомобиль, чтобы вы смогли завестись и уехать в теплой машине , что не в холодило в наш планировщик Работ !Если, Вы остались не довольны Нашим обслуживанием, то приношу Вам свои искренние извинения, за аномальные холода и несработавший автозапуск в Вашем автомобиле!", "d": "27 декабря 2020"}}, {"r": 1, "t": "На машине сгорел стартер. Позвонил узнать есть ли такой на мою модель, сказали нужен вин код или номер детали. Говорю готов продиктовать вин код. Ответ: по телефону не отвечаем, призжайте сюда к нам. Интересно как, если машина не находу? а если нет этой детали? Зазря с белого яра ехать туда обратно на такси? \nМенеджер разговаривает таким тоном, как будто оказывает мне великую услугу уже одним своим разговором со мной.", "d": "22 декабря 2020", "n": "Роман С.", "a": {"t": "Уважаемый,Роман! Прошу извинения, за столь некорректный тон в общении с Вами!Я с Вами абсолютно согласна!!!По этому поводу будет проведена беседа с нашим сотрудником, надеюсь подобного больше не повторится!с/у Волынина Эльвира", "d": "27 декабря 2020"}}, {"r": 2, "t": "Уже не советую ни кому, хотя по началу работали хорошо !!!\nРазобрали стартер от вольвы FH 12,оценили ремонт в 20 000 (якобы обмотка , я корь , реле стартера на выброс и подшипник ) и ещё ждать 10 дней запчасти .\n+1000 т.руб одади за диагностику и вернули как металлолом в коробке ((((\nОбратились к мастеру ранее работал у них ,ремонт с запчастями и в течени 3-х часов за 7000 тыс.руб.\n Уж извини", "d": "20 ноября 2020", "n": "Саня М.", "a": null}, {"r": 5, "t": "Обращаюсь не первый раз. Делают очень хорошо,дают гарантию на свои работы. Доволен как удав", "d": "14 ноября 2020", "n": "Vasy P.", "a": null}, {"r": 1, "t": "Я незнаю следите ли вы за отзывами, но завтра я поеду к вам третий раз, поменяли стартер в феврале, сгорел через 4 месяца, недели 2 назад, может 3 отдал на сто, к вам же поменяли по гарантии, в итоге опять сгорел, завтра поеду и надеюсь это последний раз", "d": "10 июля 2020", "n": "Сергей П.", "a": {"t": "Добрый день! У Вас после гарантийного ремонта, была рекомендация по замене маховика, так как на нем была выработка. В любом случае необходимо подъехать для выявления причины неисправности стартера. Уверен, что мы сможем решить эту проблему.", "d": "10 июля 2020"}}, {"r": 5, "t": "Привозил генератор от Lexus RX300,сделали за 5 часов, заменили щетки и якорь ВАЖНО новый якорь отцентровали на станке! В других фирмах этого не делают.\nВежливый и грамотный персонал.", "d": "4 июля 2020", "n": "Иван Х.", "a": null}, {"r": 5, "t": "У ребят в наличии был блок щеток на довольно редкую тут Омегу за грошовую цену.", "d": "30 июня 2020", "n": "Ренат Л.", "a": null}, {"r": 5, "t": "Молодцы ребята! Сделали быстро и качественно!", "d": "20 июня 2020", "n": "Владислав А.", "a": null}, {"r": 5, "t": "Достойно, все понравилось и вид из окна и сауна и басейн", "d": "15 февраля 2020", "n": "Павел Д.", "a": null}, {"r": 5, "t": "Ну что сказать?.. Круто, круто! Не знаю, кто тут понаписал отрицательные отзывы, но очень
