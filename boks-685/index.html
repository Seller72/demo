:root{--c1:#0b5d3f;--c2:#3cc47c;--c1d:#08452f;--tint:#eaf7f0;--ink:#16211c;--muted:#5f6b66;--line:#e2e8e5;--bg:#f7f9f8;--star:#f2a20c;--r:18px}

html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}

.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.15;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:700 16px Manrope,sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-main{background:var(--c2);color:var(--c1d)}
.btn-line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn-wa{background:#25d366;color:#fff}

.sec{padding:72px 0}
.sec h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin-bottom:10px}
.lead{color:var(--muted);font-size:17px;max-width:680px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c1);margin-bottom:10px}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo .mk{width:40px;height:40px;border-radius:12px;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.logo b{display:block;font-size:19px;font-weight:800;color:var(--c1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:600}
nav{display:flex;gap:20px;margin-left:auto}
nav a{text-decoration:none;font-size:15px;font-weight:600;color:#33403a}
nav a:hover{color:var(--c1)}
.hd-call{text-decoration:none;font-weight:800;font-size:17px;white-space:nowrap;color:var(--c1);text-align:right}
.hd-call small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.hd-call small b{color:#1a9b55}
.hd-call small b.cl{color:#d0482f}

.hero{background:radial-gradient(900px 420px at 85% 0,rgba(255,255,255,.14) 0,transparent 60%),linear-gradient(160deg,var(--c1d),var(--c1));color:#fff;padding:60px 0 70px}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;margin-bottom:18px}
.tag .st{color:#ffd166}
.hero .ext{font-size:16px;font-weight:600;opacity:.85;margin-bottom:6px}
.hero .ext::first-letter{text-transform:uppercase}
.hero h1{font-size:clamp(36px,5.4vw,60px);font-weight:800;margin-bottom:16px}
.rub{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.rub span{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
.hero-card{background:#fff;color:var(--ink);border-radius:22px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.22)}
.hc-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hc-row:last-child{border-bottom:0}
.hc-row .ic{font-size:20px;width:26px;flex:none}
.hc-row small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.hc-row a{text-decoration:none;font-weight:700}

/* prices */
.ptools{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;align-items:center}
.ptools input{flex:1 1 240px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:15px Manrope,sans-serif;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.plist{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcat{padding:12px 20px;background:var(--tint);font-weight:800;font-size:15px;color:var(--c1)}
.prow{display:flex;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
.prow b{font-weight:700;display:block}
.prow small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;white-space:pre-line}
.prow .pv{font-weight:800;white-space:nowrap;color:var(--c1)}
.pnote{font-size:13px;color:var(--muted);margin-top:12px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;font-weight:700;display:flex;gap:12px;align-items:center}
.svc .dot{width:12px;height:12px;border-radius:50%;background:var(--c2);flex:none}

/* info */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.box h3{font-size:18px;font-weight:800;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right;font-weight:700}
.hours tr.today td{color:var(--c1)}
.attrs h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px}
.attrs h4:first-child{margin-top:0}
.attrs .t{display:flex;flex-wrap:wrap;gap:6px}
.attrs .t span{background:var(--tint);color:var(--c1);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}

/* reviews */
.rv-top{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;margin-top:24px}
.score b{font-size:56px;font-weight:800;color:var(--c1);line-height:1}
.score .st{color:var(--star);font-size:18px;letter-spacing:2px}
.score small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.bars{display:grid;gap:6px;max-width:440px;font-size:14px}
.bar{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center}
.tr{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.tr span{display:block;height:100%;background:var(--star);border-radius:99px}
.rv-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.rv-tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.rv-tabs button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.rv-grid{columns:3 300px;column-gap:16px;margin-top:20px}
.rv{break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.rv.neg{border-color:#f0d3cb;background:#fffaf8}
.rv .rs{color:var(--star);letter-spacing:1px}
.rv .rs i{font-style:normal;color:#d7ddda}
.rv p{margin:8px 0 12px;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.rv .who{font-size:14px;font-weight:700}
.rv .who small{color:var(--muted);font-weight:500}
.rv .ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:14px;white-space:pre-line}
.rv .ans b{display:block;font-size:12.5px;color:var(--c1);margin-bottom:4px}
.more{text-align:center;margin-top:8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* contacts */
.ct-sec{background:linear-gradient(160deg,var(--c1d),var(--c1));color:#fff}
.ct-sec .eyebrow{color:#fff;opacity:.8}
.ct-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;margin-top:28px}

.ct-item small{display:block;opacity:.75;font-size:12.5px;font-weight:600}

.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.14);text-decoration:none;font-size:14px;font-weight:600}
.map{border-radius:var(--r);overflow:hidden;min-height:400px;background:rgba(255,255,255,.1)}
.map iframe{width:100%;height:100%;min-height:400px;border:0;display:block}

footer{background:#0d1512;color:#9aa9a2;padding:26px 0;font-size:13.5px}
.ft{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:16px;z-index:60;display:none;gap:10px}
.fab a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);text-decoration:none;font-size:24px;background:var(--c2)}
.fab a.w{background:#25d366}
.fab svg{width:28px;height:28px;fill:#fff}

@media(max-width:980px){
 nav{display:none}
 .hero-grid,.info-grid,.ct-grid{grid-template-columns:1fr}
 .svc-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
 .wrap{padding:0 16px}
 .sec{padding:52px 0}
 .hero{padding:38px 0 50px}
 .hd{gap:10px;height:62px}
 .logo small{display:none}
 .hd-call{margin-left:auto;font-size:15px}
 .svc-grid{grid-template-columns:1fr}
 .hero-btns .btn{flex:1 1 100%}
 .hero-card{padding:18px 16px}
 .rv-top{grid-template-columns:1fr;gap:16px}
 .prow{flex-direction:column;gap:4px}
 .fab{display:flex}
}
</style>
</head>

ак зеркало. Огромное спасибо за ваш профессионализм и внимательность к мелочам! Теперь только к вам.", "d": "10 декабря 2025", "n": "Владимир И.", "a": null}, {"r": 5, "t": "Ребята мастера своего дела!\nЗагонял две свои машины, одну на полный антихром, вторую на установку скрытого регистратора, оклейку броней зон риска и полный антихром, все просто шикарно. Быстро, качественно, надежно. Клиентоориентированность на высшем уровне! \nЗа качественными работами только к Вам!", "d": "10 декабря 2025", "n": "Юрий М.", "a": null}, {"r": 5, "t": "Хочу выразить благодарность Ждану и его профессиональной, дружной команде. \nСделали по кругу оклейку защитной плёнкой машину, так-же защитной плёнкой оклеили в салоне все глянцевые елементы, экраны. \nУстановил задний диффузор выхлопа.\nЗаменили лампочки проекции с логотипом марки автомобиля.\n Обклеили карпетом багажный отсек.\n Также настроили сигнализацию старлайн, так как в спящем режиме брала напряжение и акумулятор разряжался и автозапуск работал по 15 минут больше 2х раз не запускался двигатель. Теперь акумулятор держит заряд и запускать двигатель можно без ограничений.\nВсе эти работы выполнили в удобное для меня время, качественно, быстро и профессионально.\nРекомендую деталинг центр \"Бокс 685\".\n Ждан и его команда профиссоналы своего дела.", "d": "10 декабря 2025", "n": "Владимир З.", "a": null}, {"r": 5, "t": "Знаю этих ребят очень давно. Ответственные,порядочные пацаны.100% профессионалы своего дела. Рекомендую!", "d": "10 декабря 2025", "n": "Ильяс К.", "a": null}, {"r": 5, "t": "Всем рекомендую!\nПарни - красавчики! \nВсё честно, качественно и в срок.\nОтдельный респект руководителю Ждану 🤝.\nВернусь ещё…", "d": "10 декабря 2025", "n": "Валерий Д.", "a": null}, {"r": 5, "t": "Хочу поблагодарить команду бокс 685 за отличную работу \nДружный коллектив \nВсегда подскажут и помогут в решении вопросов связанных с автомобилями", "d": "10 декабря 2025", "n": "Apple U.", "a": null}, {"r": 5, "t": "Профессионалы своего дела , быстро качество и с гарантией.\nА обновленная клиентская зона вообще огонь", "d": "10 декабря 2025", "n": "Magomed M.", "a": null}, {"r": 5, "t": "Уже 4 года любые манипуляции с авто -пленка, шумка, тонировка , сигналка я делаю исключительно тут!\nСервис вышка , материалы всегда качественные ,на бабки тебя тут не разведут\nОчень рекомендую +", "d": "10 декабря 2025", "n": "N T.", "a": null}, {"r": 5, "t": "Месяц назад заезжал к ребятам. \nВидно ребята трудолюбивые и подход к работе ответственный, очень квалифицированные ребята и находят общий язык с клиентом.\nПо проделанной работе, вопросов не возникло, одно удовольствие и восхищение. \nСпасибо вам.", "d": "10 декабря 2025", "n": "Руслан М.", "a": null}, {"r": 5, "t": "Рекомендую! Делают все четко, аккуратно, качественно👍 отличная клиентская зона", "d": "10 декабря 2025", "n": "Андрей Ч.", "a": null}, {"r": 5, "t": "Большое спасибо за работу! Машина преобразилась, вид просто бомба. Качество оклейки на высоте, сразу виден профессиональный подход. Спасибо за оперативность и аккуратность!! Здоровья, процветания,и мирного неба!", "d": "13 ноября 2025", "n": "Иван Ч.", "a": null}, {"r": 5, "t": "Устанавливал сигнализацию всё очень хорошо сказали на следующий день заберёшь по итогу забрал в тот же день! 👍👍👍", "d": "6 ноября 2025", "n": "Олег Г.", "a": null}, {"r": 5, "t": "Ребята молодцы. Делают работу качественно и хорошо. Радует широкий спектр услуг и доброжелательность 🤗", "d": "1 октября 2025", "n": "Кристина", "a": null}, {"r": 5, "t": "сделали прекрасно, машина стала очень чётко выглядеть, плёнка хорошего качества, с отличным покрытием!\n\nесли хотите сделать, то сделайте тут, \nне дорого и делают на супер!", "d": "16 июля 2025", "n": "Miron E.", "a": null}, {"r": 5, "t": "Отличный сервис, быстро отремонтировали скол на лобовом стекле, цена адекватная, хорошее отношение, рекомендую!", "d": "21 мая 2025", "n": "Сергей И.", "a": null}, {"r": 5, "t": "Сегодня заехал в бокс 685 со сколом на лобовом стекле, машина рав4. Ребята оперативно все сделали. Если не приглядываться, то ничего и не видно, как будто не было скола. И сохранили обогрев стекла. Спасибо, молодцы ребята! Удачи вам в работе!", "d": "12 мая 2025", "n": "Юлай", "a": null}, {"r": 5, "t": "Коля хороший спец👍", "d": "3 мая 2025", "n": "Виталий", "a": null}, {"r": 5, "t": "Доброго времени суток. Обращался в данный сервис по устранению трещин на лобовом стекле. Работа произведена на высоком уровне и обслуживающий персонал оперативно и слаженно (качественно) справился с поставленной задачей! Большое спасибо ребятам за теплый прием✊🤝", "d": "1 апреля 2025", "n": "Артур Н.", "a": null}, {"r": 5, "t": "Отлично ! Быстро , качественно. Без потери времени людей и своего . Рекомендую!", "d": "1 марта 2025", "n": "Мария С.", "a": null}, {"r": 5, "t": "Не первый раз заезжаю, ребята делают как для себя, за что им спасибо большое)", "d": "16 февраля 2025", "n": "Евгений Д.", "a": null}, {"r": 5, "t": "Нигде не могли нормально настроить сигнализацию . Обратился к Николаю , настроил оперативно , в будущем буду обращаться  только к нему!", "d": "12 февраля 2025", "n": "Рамазан А.", "a": null}, {"r": 1, "t": "В декабре 2013 года в этом боксе ставил автосигналку, ставил Халабуда. Всё установил чётко , профи. И вот прошли годы... Решили в этом же боксе поменять старую сигнализацию. До Нового года позвонил, договорились, приехали, попали до мастера Евгения старую сигналку демонтировали — установили А 93. С нашей стороны мы оплатили услуги, и тут начались проблемы с использованием этой сигналки. Это ещё мягко сказано ...за свои деньги 29000₽ за установку и регулировку Такой г... До сих пор не можем эту сигналку отрегулировать как положено, приезжая не первый раз. Из пяти раз она возьми и начинает глючить ни с того ни сего. Мужики у Вас есть мастер который всё таки адекватно разберётся с этой проблемой.Сколько мы будем сюда кататься... Деньги уплачены, а проблема Весит... К Евгению много вопросов и ни одного ответа и теперь в сложившиеся ситуации нет доверия..как мастеру своего дела.", "d": "1 февраля 2025", "n": "Городской ж.", "a": null}, {"r": 5, "t": "Заехали на тонировку , сделали все четко 👍", "d": "24 января 2025", "n": "Всеволод В.", "a": null}, {"r": 5, "t": "Спасибо, всё сделали хорошо", "d": "21 января 2025", "n": "СПЕЦИАЛИСТ", "a": null}, {"r": 5, "t": "Качественный сервис, приятный коллектив!\nСвое дело знают на 5+ 👌\nРекомендую 🤝", "d": "14 января 2025", "n": "Илья М.", "a": null}, {"r": 5, "t": "Недавно обратился в этот автосервис для тонировки и установки сигнализации. Остался очень доволен! \nРабота выполнена быстро, аккуратно и с высоким качеством. Мастера явно знают свое дело, учли все мои пожелания🙏\nПонравился также сервис в целом: приятное общение, четкие сроки и адекватные цены. Машина выглядит просто отлично😍\nОбязательно вернусь сюда!💪", "d": "30 декабря 2024", "n": "Дато К.", "a": null}, {"r": 5, "t": "Хочу поделиться хорошими впечатлениями о выполненных работах по полировке и покрытию керамикой двух машин Toyota RAV4 и Lexus IS250. Машины отлично отполированы и сияют как новые. Отдельное спасибо Ждану за его подход к работе и советы как лучше сделать при обсуждениях работ с машиной и просто человеческое отношение.", "d": "26 декабря 2024", "n": "Андрей П.", "a": null}, {"r": 5, "t": "Быстро отремонтировали скол на лобовом стекле, есть зона ожидания с горячим чаем и кофе, парни молодцы, данное место рекомендую, большое спасибо за помощь 👍🤝", "d": "22 декабря 2024", "n": "Александр К.", "a": null}, {"r": 5, "t": "Качественно отремонтировали скол", "d": "12 декабря 2024", "n": "Ikram A.", "a": null}, {"r": 5, "t": "Спасибо большое Николаю! \nУстранил коряво установленный обходчик иммобилайзера, а в других сервисах рекомендовали только замена сигнализации!", "d": "11 декабря 2024", "n": "Сергей В.", "a": null}, {"r": 5, "t": "Ребята, знают своё дело, работают на качество, обращусь ещё.", "d": "5 декабря 2024", "n": "Игнат Р.", "a": null}, {"r": 5, "t": "Добросовестный владелец и приятные сотрудники. Позвонил и договорились за 5 минут. Все исправили и помогли!", "d": "25 ноября 2024", "n": "Рустам С.", "a": null}, {"r": 5, "t": "Быстро и четко сделали трещины на лобовом стекле, которые никто не брался делать, спасибо!", "d": "12 ноября 2024", "n": "Sergei", "a": null}, {"r": 5, "t": "Уже не первый раз обращаюсь к ребятам и всем советую! Работу выполняют на 5+ и что важно в оговоренные в сроки, дают полный расклад как обращаться с машиной после «ТЮНИНГА»😂!\nЗагонял к ним машину на полную оклейку кузова, тонировку и защиту лобового! \nА потом и отец не выдержал и загнали машину на восстановление фар и их оклейку - результат 🔥🔥🔥! \nСПАСИБО РЕБЯТА!!! Ждите еще!!!", "d": "9 ноября 2024", "n": "Алексей Ш.", "a": null}, {"r": 5, "t": "сервис по установке сигнализации на высшем уровне, отдельное спасибо автоэлектрику Николаю показал как правильно пользоваться сигнализацией всё настроил быстро и без проблем", "d": "3 ноября 2024", "n": "Максим Б.", "a": null}, {"r": 5, "t": "Клеил тонировку. Всё супер! Быстро, качественно и профессионально. Рекомендую.", "d": "19 октября 2024", "n": "Виталя Р.", "a": null}, {"r": 5, "t": "Тонировал Ниву короткую. Отлично получилось. Парни работают на совесть", "d": "5 октября 2024", "n": "Евгений Б.", "a": null}, {"r": 5, "t": "Клеил у ребят наклейку на капот с рисунком, подошли к работе проффесионально! Наклеили отлично! Буду обращаться ещё и всем рекомендую!", "d": "1 августа 2024", "n": "Денис К.", "a": {"t": "Спасибо большое за ответ,будем ждать вас снова.Всегда рады помочь.", "d": "14 августа 2024"}}, {"r": 5, "t": "Позвонил, сразу записали! Сделали четко! Без  пыли 🔥 рекомендую🤝", "d": "27 июля 2024", "n": "Виталий П.", "a": {"t": "Спасибо Большое за оставленный отзыв , стараемся делать красиво и держать качество на высоте)Работаем исключительно дорогими материалами и продвинутым оборудованием", "d": "14 августа 2024"}}, {"r": 5, "t": "Сделали быстро и качественно тонировку\nЛучшие мастера в городе", "d": "29 июня 2024", "n": "R R.", "a": {"t": "Стараемся, ведь любим нашу работу", "d": "14 августа 2024"}}, {"r": 5, "t": "Делал тонировку, все супер и быстро", "d": "22 июня 2024", "n": "Леонид В.", "a": null}, {"r": 5, "t": "Хороший сервис. Ребята быстро проконсультировали по делу. Заделали скол на лобовом, думаю прослужит долго. Доволен подходом и общением.", "d": "10 июня 2024", "n": "Дмитрий C.", "a": {"t": "Спасибо за оставленный отзыв , дальше больше)", "d": "14 августа 2024"}}, {"r": 5, "t": "Обращались за поклейкой бронепленки. Спасибо ребятам ! Профессионалы своего дела! Сделали всё качественно и быстро! Рекомендую!", "d": "2 июня 2024", "n": "Дамир Х.", "a": {"t": "Спасибо большое за отзыв , самое главное с гарантией на работу)", "d": "14 августа 2024"}}, {"r": 5, "t": "Пацаны знают свое дело, быстро и четко сделали свою работу, респект парням💪🏽", "d": "1 июня 2024", "n": "Искандар С.", "a": {"t": "Спасибо за отзыв, фонари получились злые , удачно попали в цвет. Нас мотивирует когда вы радуетесь)", "d": "14 августа 2024"}}, {"r": 5, "t": "Спасибо ребятам! Профессионалы своего дела. Приехал с большой трещиной на лобовом стекле. Быстро и качественно залили, теперь практически не заметно!", "d": "31 мая 2024", "n": "Тимур И.", "a": null}, {"r": 5, "t": "Делал полировку + покрытие керамикой, ЛКП как новое 🤤 машинка заиграла новыми красками 🔥\nБывает заезжаешь на услугу и при общении с мастером возникают сомнения по компетентности, а тут без воды - четко,качественно и по делу!", "d": "28 мая 2024", "n": "Данил", "a": {"t": "Рады возобновить былые чувства к своему автомобилю)", "d": "14 августа 2024"}}, {"r": 5, "t": "Обращаюсь не в первый,как всегда ребята молодцы.", "d": "25 мая 2024", "n": "Александр Д.", "a": null}, {"r": 5, "t": "Обратилась со сколом на стекле, выполнили все быстро и качественно. Большое спасибо ребятам за оперативность работы!", "d": "20 мая 2024", "n": "Ольга С.", "a": null}, {"r": 5, "t": "Заделали скол на лобовом стекле. Заполировали царапину на двери. Все отлично. Рекомендую.", "d": "18 мая 2024", "n": "Федор К.", "a": null}, {"r": 5, "t": "Тонировал машину , отзывчивые ребята помогли с выбором пленки и качественно заклеили . Рекомендую!!!", "d": "15 мая 2024", "n": "Maxim K.", "a": null}, {"r": 5, "t": "Обратился по тонировки. Молодцы!!!!всё сделали качественно и дёшево", "d": "14 мая 2024", "n": "Фирзат Ф.", "a": null}, {"r": 5, "t": "Тонировал задние фонари, подъезд чистый, хороший, клеят качественно, самый хороший центр по тонировке в Сургуте, рекомендую", "d": "12 мая 2024", "n": "Дмитрий П.", "a": null}, {"r": 5, "t": "Отдавал машину на полировку с нанесением керамики , сделали свою работу на 10/10, не думаю , что в городе кто-то сделает вам это лучше, обращайтесь , не пожалеете!!!", "d": "7 мая 2024", "n": "Дмитрий Б.", "a": null}, {"r": 5, "t": "Быстро и качественно \nСпасибо !", "d": "6 мая 2024", "n": "Захар Н.", "a": null}, {"r": 5, "t": "профессионалы своего дела,сделали все отлично,в короткие сроки👍🏻", "d": "30 апреля 2024", "n": "Малик М.", "a": null}, {"r": 5, "t": "Делал тонировку, все супер! , есть зона ожидания", "d": "29 апреля 2024", "n": "Andrey", "a": null}, {"r": 5, "t": "От души рекомендую этот сервис, скол на лобовом стекле сделали быстро и качественно, вежливо общались и всё объясняли✨", "d": "27 апреля 2024", "n": "Анна Б.", "a": null}, {"r": 5, "t": "Спасибо ребятам. Заехал на ремонт скола на стекле. Сделали качественно и быстро. Рекомендую👍👍👍", "d": "21 апреля 2024", "n": "Алексей Р.", "a": null}, {"r": 5, "t": "Сделали тонировку, антихром и оклеили зоны риска , работой доволен , рекомендую👋", "d": "21 апреля 2024", "n": "Нарек З.", "a": null}, {"r": 5, "t": "Заехал на полировку кузова, все понравилось 🔥\nРебята знают свое дело 👍🏽", "d": "21 апреля 2024", "n": "Иван И.", "a": null}, {"r": 5, "t": "Отличный сервис и качество. Обязательно еще обращусь 👍🏼", "d": "19 апреля 2024", "n": "Артур Р.", "a": null}, {"r": 5, "t": "Очень понравился сервис, ребята очень порадовали проделанной работой, манерой общения. Бокс чистый, приятный, работа выполнена в сроки, цены адекватные. Рекомендую!", "d": "9 апреля 2024", "n": "Максим И.", "a": null}, {"r": 5, "t": "Все сделано по желанию! Пацаны вам огромное спасибо! Не первый раз у вас как и всегда радуете! Дай бог вам здоровья счастья и больших процветание и успехов!", "d": "7 апреля 2024", "n": "Виталий М.", "a": null}, {"r": 5, "t": "Полностью доступное информирование, быстро отреагировали! Спасибо", "d": "7 апреля 2024", "n": "Тамара Л.", "a": null}, {"r": 5, "t": "Всем привет ! Все классно сделали . Все во время . Мастера своего дела. Порадовал трансфер до офиса . Спасибо . Буду рекомендовать", "d": "6 апреля 2024", "n": "Виктор П.", "a": null}, {"r": 5, "t": "Отличный сервис, сделали всё супер, профессионалы своего дела, подход к работе на высшем уровне, спасибо большое за проделанную работу", "d": "30 марта 2024", "n": "Ренат Ю.", "a": null}, {"r": 5, "t": "Отличный сервис, удобная зона ожидания.\nКачеством работы остался полностью доволен.\nРезультаты внешнего вида автомобиля превзошли все ожидания.\nУверенная 5+ ребятам", "d": "21 марта 2024", "n": "Илья L.", "a": null}, {"r": 5, "t": "Тонировал авто. Профессиональные, адекватные, порядочные люди. Ценник адекватный! Помогут делом, советом, если ситуация того требует. Сделали всё четко, быстро, качественно. Результатом остался более чем доволен! Всем советую, обращайтесь смело и будет вам счастье 🖐️", "d": "14 марта 2024", "n": "Роман А.", "a": null}, {"r": 5, "t": "После замены 1го стекла (пассажирского) необходимо было его затонировать, работник Ждан выполнил работу на отлично, подобрал тон и степень прозрачности, был вежлив и проявил себя как профессионал своего дела. Место огонь🔥 всем рекомендую!", "d": "1 марта 2024", "n": "oleg k.", "a": null}, {"r": 5, "t": "Заезжал на обклейку кузова пленкой. Во-первых, хочу начать со слов благодарности ребятам. Быстро, качественно, недорого. Настоящие молодцы, ребята сдержали все обещания. Во-вторых, отдельное огромнейшее спасибо Ждану. Я таких людей давно не встречал. Очень грамотный в своем деле, отзывчивый и очень добрый человек. Проконсультировал, дал рекомендации по дальнейшему обслуживанию, ответил на все интересующие вопросы. Теперь только к Вам!!! Рекомендую Всем!!!", "d": "28 января 2024", "n": "Максим И.", "a": null}, {"r": 5, "t": "Этот опыт обслуживания в автомастерской оставил меня в полном восторге. Не просто качественная керамическая обработка и ремонтные работы, а настоящая трансформация моей машины. Она снова стала не просто транспортным средством, а настоящим произведением искусства на колесах.\n\nНе могу не отметить профессионализм и внимание к деталям, которые продемонстрировали ребята в этой мастерской. Они не просто выполнили свою работу, они вложили частичку души в каждый элемент. Как результат – моя машина словно проснулась после долгого сна и снова загорелась яркими красками.\n\nОтношение к клиентам заслуживает отдельного упоминания. Вежливость, профессионализм и понимание потребностей клиента – все это сделало обслуживание максимально комфортным и приятным.\n\nВ целом, если вы ищете не просто мастерскую, а место, где ваш автомобиль будет обработан с любовью и заботой, это именно тот адрес, который однозначно стоит посетить. Благодарю эту команду за трансформацию моего автомобиля и за великолепный сервис!", "d": "27 января 2024", "n": "Сергей С.", "a": null}, {"r": 5, "t": "Вас супер, сделали скол", "d": "18 января 2024", "n": "zzz m.", "a": null}, {"r": 5, "t": "Все понравилось!", "d": "2 января 2024", "n": "Антон С.", "a": null}, {"r": 5, "t": "Огромное спасибо, Ждану! \nКак будто ничего и не было! \nВсем рекомедую!", "d": "21 декабря 2023", "n": "Анастасия Р.", "a": null}, {"r": 5, "t": "Всё четко! Рекомендую 💪🏻", "d": "19 декабря 2023", "n": "Ильгиз Ш.", "a": null}, {"r": 3, "t": "Установили GSM на a91, правда не с первого раза", "d": "6 декабря 2023", "n": "Александр С.", "a": {"t": "Здравствуйте. Как не с первого раза ? Просто не ано четко, быстро, дали рекомендации и сделали за приемлемую цену. Очень доволен результатом", "d": "29 апреля 2023", "n": "Алёша П.", "a": null}, {"r": 5, "t": "Заезжал тонировать передние стекла на камрюхе, сделали всё четко. Мастер помог подобрать пленку под ту что на задних стёклах, чтобы не отличалась. Оставил машину, уехал по своим делам, сделали быстро, качественно. Адекватный ценник. Приехал забрал машину, уехал довольный. Если буду тонироваться ещё, то только к ним.", "d": "29 апреля 2023", "n": "Андрей М.", "a": null}, {"r": 5, "t": "Сегодня был на тонировка. Всё сделали аккуратно и по времени ушло на всё не много. Обращаюсь к ним не первый раз. Всем как всегда доволен.", "d": "25 апреля 2023", "n": "Devont D.", "a": null}, {"r": 5, "t": "Затонировали мне машину,все понравилось высший класс.рекомендую.", "d": "22 апреля 2023", "n": "Сергей Х.", "a": null}, {"r": 5, "t": "Заезжал на тонировку, ребята сделали все отлично, быстро и за вменяемую цену. Пленка в наличии разная.", "d": "15 апреля 2023", "n": "Руслан Ш.", "a": null}, {"r": 5, "t": "Сегодня делала тонировку лобового стекла, в данном сервисе. Быстро, аккуратно и качественно!🔥 Цены доступные!👍🏼 Даже устранили на лобовом стекле косяки, после тонировки в другом сервисе. Очень понравилось обслуживание, персонал добрый и вежливый, запись в ближайшее удобное время, все нюансы по обслуживанию рассказали. Отдельное спасибо за приятный бонус!😉 Теперь только к Вам буду обращаться за услугами!😎", "d": "9 апреля 2023", "n": "City s.", "a": null}, {"r": 5, "t": "Очень приятное обслуживание, все быстро,  а главное качественно, детейлинг авто, это только в бокс 685", "d": "7 апреля 2023", "n": "Алина С.", "a": null}, {"r": 5, "t": "Здравствуйте всем, делала тонировку передних стёкол ,сделали всё на 10 балов очень качественно 👍, а самое главное очень деликатный подход к клиентам ))) и всё по карману ))) ещё была свидетелем к очень тонкой и кропотливой работы обклейки кузова и скажу очень ответственные ребята ... Если созрею сделать машине оклейку ,то только здесь!!!", "d": "7 апреля 2023", "n": "Марина К.", "a": null}, {"r": 5, "t": "Очень понравилось, работу сделал быстро. Думаю качественно. Рекомендую. Ремонтировал скол на лобовой.", "d": "4 апреля 2023", "n": "Тунгатар М.", "a": null}, {"r": 5, "t": "Ребята знают свое дело , быстро качественно .\nЕще чаем напоили .\nВ общем на высшем уровне 🔥🔥", "d": "26 марта 2023", "n": "Albo B.", "a": null}, {"r": 5, "t": "Всем рекомендую тонировать стекла своего авто только здесь!!! Очень качественно, с гарантией на работу и материал, стоимость не кусается, очень вежливое отношение, в общем - 5 звёзд!", "d": "21 марта 2023", "n": "Дмитрий С.", "a": null}, {"r": 5, "t": "Парень хорошо, добротно, аккуратно работает, рассказал нюансы, дал советы по пленке. Рекомендую", "d": "20 марта 2023", "n": "Aleksey B.", "a": null}, {"r": 5, "t": "тонировка полировка все понравилось, клиентская бомба", "d": "19 марта 2023", "n": "Артем О.", "a": null}, {"r": 5, "t": "Лучший тонированный центр,мастера своего дела!", "d": "18 марта 2023", "n": "Роман М.", "a": null}, {"r": 5, "t": "Суперское место, крутой специалист! Всё клёво сделал, затонировал чОтко! Рекомендую всем! Мега позитивный мастер и общительный!!!!", "d": "17 марта 2023", "n": "Сергей Д.", "a": null}, {"r": 5, "t": "Афигенно затонировали мою машину", "d": "16 марта 2023", "n": "Vadim B.", "a": null}, {"r": 5, "t": "Все огонь 🔥 \nПозвонил-записался-обсудили время цену -оставил- забрал лялю )) много моментов исправили попутно \n- все круто однозначно рекордную ! \n- зачернили резину молочь а приятно )) Ждан качество в мелочах ✅\n\n\nОклейка оптики в полиуретан (фары+туманки)\nЗащита зон под ручками\nПолировка глубокая\nЗащита кузова керамикой\nПолировка всех стекол\nАнтидождь везде включая люк\nТонировка 35%", "d": "6 марта 2023", "n": "Marsel X.", "a": null}, {"r": 5, "t": "Сделали тонировку всё понравилось , комфортная клиентская , одним словом молодцы", "d": "4 марта 2023", "n": "Вахрам Г. асавчики", "d": "12 января 2023", "n": "Николай Л.", "a": null}, {"r": 5, "t": "Все гуд \nКлеят четко,тонер бомба \nЛюбые сложности не помеха \nПроцветания🤙🏻✌🏻", "d": "5 января 2023", "n": "Николас К.", "a": null}, {"r": 5, "t": "Заезжал к пацанам наклеить спойлер на крышку багажника, и козырек на заднее стекло, сделали все как говорится по феншую, обговорили с мастером процесс работы, посоветовал как лучше сделать, в итоге я доволен, качество обслуживания высшее, подход к каждому клиенту индивидуальный и самое главное грамотный, Ждан опытный и понимающий в своем деле мастер, всем рекомендую этот сервис!", "d": "4 января 2023", "n": "Apple U.", "a": null}, {"r": 5, "t": "Рекомендую! Тонировку сделали быстро и отлично!\nПриветливый персонал! Приеду ещё!", "d": "28 декабря 2022", "n": "Алексей П.", "a": null}, {"r": 5, "t": "Произвели ремонт трещины на лобовом стекле.\nРаботой доволен, быстро аккуратно.\nВсем доволен, адекватный ценник.", "d": "22 декабря 2022", "n": "Ильшат Р.", "a": null}, {"r": 5, "t": "Огромное благодарность ребятам.\nВсё окуратно зделали.\nРекомендую!", "d": "21 декабря 2022", "n": "Bdr L.", "a": null}, {"r": 5, "t": "Отличный сервис! Не первый раз заезжаю на тонировку! Ребята работают на совесть! Постоянным клиентам делают скидку 😉", "d": "8 декабря 2022", "n": "Карина С.", "a": null}, {"r": 5, "t": "Отличные парни, все быстро, качественно и по-честному установили тонировку. Советую!!!", "d": "25 ноября 2022", "n": "Михаил Д.", "a": null}, {"r": 5, "t": "Отличный автоэлектрик, много где не могли решить проблему, тут же без проблем за 20 минут, и это 30 декабря)", "d": "23 ноября 2022", "n": "Алексей В.", "a": null}, {"r": 5, "t": "Качество обслуживания высшее,подход к клиентам индивидуальный и правильный ,качество материалов лучшее,цены приемлемые,теперь все машины на оклейку только сюда,Ждан,лучший в своем деле!", "d": "21 ноября 2022", "n": "Андрей М.", "a": null}, {"r": 5, "t": "Всё супер , спасибо", "d": "21 ноября 2022", "n": "Денис Л.", "a": null}, {"r": 5, "t": "Позвонил, сказали время, подъехал, закатали - быстро, четко, пожелали не гвоздя, не жезла.\nОтличный сервис ✊🏻😉", "d": "19 ноября 2022", "n": "Динар Б.", "a": null}, {"r": 5, "t": "Отличный сервис, отличные ребята!\nСпециалист Ждан заделывал большой скол на Volkswagen Jett, все взялось великолепно, полностью зачистил ржавчину, теперь даже не найти где этот скол был! \nЕщё ставил у них сигнализацию старлайн, со всех сторон работают великолепно, поставили лучшее оборудование, все отлично оформили, и все в течение дня: перед работой машину оставил, после работы забрал. \nОчень советую, не пожалеете!", "d": "8 ноября 2022", "n": "Данила М.", "a": null}, {"r": 5, "t": "Классные ребята, мастера своего дела👍🏼 сделали все четко! Ждите скоро весь зад будем тонировать 😁", "d": "28 октября 2022", "n": "Stasya F.", "a": null}, {"r": 5, "t": "Делал тонировку всё быстро цены приемлемые рекомендую 👍", "d": "25 октября 2022", "n": "Иван М.", "a": null}, {"r": 5, "t": "Заезжал на днях, сделали все быстро и качественно, рекомендую", "d": "1 сентября 2022", "n": "Динар Х.", "a": null}, {"r": 5, "t": "Заезжал на ремонт скола, все сделали быстро и почти не видно, сервис на высоте, комфортная зона ожидания.", "d": "25 августа 2022", "n": "Вячеслав Ш.", "a": null}, {"r": 5, "t": "Оклеили фары в броне плёнку. Быстро и качественно. Спасибо.", "d": "16 августа 2022", "n": "Dima A.", "a": null}, {"r": 5, "t": "Заезжал на тонировку, ребята знают свою работу, сделали всё на отлично.", "d": "16 августа 2022", "n": "Егоров М.", "a": null}, {"r": 5, "t": "Качественно и быстро, рекомендую!", "d": "15 августа 2022", "n": "Валерий А.", "a": null}, {"r": 5, "t": "Мастера своего дела, быстро и самое главное качественно делают свою работу. Рекомендую!", "d": "10 августа 2022", "n": "Р А.", "a": null}, {"r": 5, "t": "Лучшее место, теперь только сюда", "d": "9 августа 2022", "n": "Сёма К.", "a": null}, {"r": 5, "t": "Заехал затонировала лобовое стекло! Ждан мастер своего дела. Рекомендую", "d": "8 августа 2022", "n": "Игорь Ю.", "a": null}, {"r": 5, "t": "Делал у ребят «бронировку» передней части авто. Все сделали хорошо, рекомендую.", "d": "8 августа 2022", "n": "Alexandr M.", "a": null}, {"r": 5, "t": "Работают хорошо, качественно. Убрали скол! Ребята знают своё дело! Рекомендую всем! 👍👍👍👍👍", "d": "5 августа 2022", "n": "Кирилл Б.", "a": null}, {"r": 5, "t": "Очень быстро! Sportage в круг (без лобового) за 2,5 часа. Зона ожидания, чай, кофе.", "d": "3 августа 2022", "n": "Иван М.", "a": null}, {"r": 5, "t": "Спасибо за работу. Заехал убрать скол, сделали всё четко. Не первую машину уже делаю у них. Рекомендую.", "d": "2 августа 2022", "n": "Андрей К.", "a": null}, {"r": 5, "t": "Быстро и качественно! Рекомендую !", "d": "1 августа 2022", "n": "Данил Т.", "a": null}, {"r": 5, "t": "Заехал за пол часа до закрытия, за 15минут устранили звёздочку на лобовом, не первый раз заезжаю именно в этот бокс, работой доволен, качественно и быстро 👍", "d": "31 июля 2022", "n": "Rasul B.", "a": null}, {"r": 5, "t": "Спасибо ребятам качество на высоте приятная атмосфера , по тонировке , бронеплёнке к ним , сколы тоже делают , универсальные солдаты одним словом , молодцы!!!", "d": "31 июля 2022", "n": "Иван А.", "a": null}, {"r": 5, "t": "Отремонтировали скол на лобовой стекле быстро и качественно \nКомфортная зона ожидания", "d": "31 июля 2022", "n": "Михаил В.", "a": null}, {"r": 5, "t": "Порядочные пацаны, знающие своё дело, работу выполняют добросовестно и качественно! Обращался к ним неоднократно! Спасибо за оказанную услугу 🤝", "d": "25 июля 2022", "n": "Р В.", "a": null}, {"r": 5, "t": "Тонировал много машин у этих ребят, они знают своё дело, делают четко, гарантия тоже присутствует. Полностью рекомендую", "d": "21 июля 2022", "n": "Артём Б.", "a": null}, {"r": 5, "t": "Качественно и быстро , не обратили внимание на большое количество грязи 👍", "d": "17 июля 2022", "n": "Саша Л.", "a": null}, {"r": 5, "t": "Всё быстро и качественно, ребята молодцы, однозначно рекомендую!", "d": "17 июля 2022", "n": "Андрей", "a": null}, {"r": 5, "t": "Все сделали качественно, четко и быстро!!!", "d": "17 июля 2022", "n": "Антон Б.", "a": null}, {"r": 4, "t": "Качественно закатали пацаны, в день обращения!!!", "d": "16 июля 2022", "n": "Динар М.", "a": null}, {"r": 5, "t": "Хотела бы поблагодарить ребят, заделали скол на лобовом стекле, быстро, качественно и недорого. Так же у них есть уютная комната ожидания, можно попить чай, кофе. Буду рекомендовать своим друзьям, в следующий раз поеду к ним😃", "d": "22 июня 2022", "n": "Диана Ч.", "a": null}, {"r": 5, "t": "Попросил ребят наклеить бронепленку в багажнике (гофра протирала краску),все сделали быстро и качественно,советую.Раньше тонировал машину,не одну,делают качественно и красиво!", "d": "18 июня 2022", "n": "Александр В.", "a": null}, {"r": 5, "t": "Всё на высшем уровне🔥\nСделали быстро, работу выполнили качественно😁\nРебята знают своё дело🔝", "d": "29 мая 2022", "n": "Ilya P.", "a": null}, {"r": 5, "t": "Данный сервис произвёл глубокую детейлинг полировку на моём авто и покрыли в керамику, а также полирнули стекла и покрыли их в антидождь. Эффект был сразу на глазах потому что когда отдавал машину ЛКП было в ужасном состоянии, парни просто профессионалы в своём деле, сколы которые были на кузове подкрасили, зону под ручками на кузове забронировали плёнкой потому что как говорят они сами «красота в мельчайших деталях»! Дали гарантию год на произведённую работу)", "d": "25 мая 2022", "n": "Данила Н.", "a": null}, {"r": 5, "t": "Тонируюсь не первый раз. Ребята отлично справляются с поставленными задачами, вежливые. Быстро, качественно, приемлимые цены. 🔥", "d": "7 мая 2022", "n": "Di", "a": null}, {"r": 5, "t": "Затонировали быстро качественно , рекомендую", "d": "28 апреля 2022", "n": "Roma R.", "a": null}, {"r": 5, "t": "Тонировал w204 coupe. Единственные кому позвонил и без записи взяли, все сделано быстро, тонировал 50%, плёнки хорошие. Отдуши😀👍🏻", "d": "20 апреля 2022", "n": "Сергей И.", "a": null}, {"r": 5, "t": "Сделали все идеально, очень качественный подход к работе, уделяют внимание самым мелким деталям", "d": "19 апреля 2022", "n": "Алексей Д.", "a": null}, {"r": 5, "t": "Молодцы ребята !! Затонировали просто шикарно !", "d": "17 апреля 2022", "n": "Юлия Р.", "a": null}, {"r": 5, "t": "Настоящие профессионалы своего дела сделали максимально качественно и быстро спасибо ребятам за такую работу", "d": "15 апреля 2022", "n": "Данил П.", "a": null}, {"r": 5, "t": "Качественная работа, хороший сервис! Все понравилось", "d": "15 апреля 2022", "n": "Алик Х.", "a": null}, {"r": 5, "t": "Отличный сервис по тонирования стёкол, спасибо ребятам!!!", "d": "14 апреля 2022", "n": "Владимир Н.", "a": null}, {"r": 5, "t": "Самая офигенная тонировка только тут😍\nДелают быстро, качественно и самое главное на долго", "d": "14 апреля 2022", "n": "Айгуль Н.", "a": null}, {"r": 5, "t": "Ребята свое дело знают.Быстро,красиво, качественно", "d": "11 апреля 2022", "n": "Юрий Н.", "a": null}, {"r": 5, "t": "Спасибо ребятам быстро и качественно", "d": "9 апреля 2022", "n": "Сергей Ч.", "a": null}, {"r": 5, "t": "Быстро,качественно.", "d": "3 апреля 2022", "n": "Донат А.", "a": null}, {"r": 5, "t": "Отлично выполняют свою работу, всегда порекомендуют как и что лучше сделать по тем или иным работам. Молодцы, с большим опытом работы! P.S. отличная зона отдыха", "d": "27 марта 2022", "n": "Станислав", "a": null}, {"r": 5, "t": "Обращялся для установки автосигнализации старлайн S96v2 на VAG, Николай мастер своего дела все установлено и работает отлично, сохранено оба штатных ключа, мягкая посадка и все дела. Цена адекватная за такую работу, ВСЕМ РЕКОМЕНДУЮ!!!", "d": "20 марта 2022", "n": "Роман П.", "a": null}, {"r": 5, "t": "Пацаны мастера своего дела! Делают всё на совесть, советую всём?!!!!", "d": "1 марта 2022", "n": "Никита Ш.", "a": null}, {"r": 5, "t": "Ребята Мастера своего дела!!! Сделали тонировку, на фары заклеили плёнку, и самое главное отполировали и покрыли керамикой. И это небо и земля! что они сделали, я щас наверное просто любоваться буду своей машиной. Ребята спасибо вам огромное за вашу работу, успехов вам!!! Рекомендую всем", "d": "14 февраля 2022", "n": "Владимир С.", "a": null}, {"r": 5, "t": "Отличный сервис мастера своего дела. Все на высшем уровне. За тонировкой и бронепленкой фар только к ним.", "d": "12 февраля 2022", "n": "Евгений D.", "a": null}, {"r": 5, "t": "Установили сигнализацию. Спасибо большое за работу! Нашла вас по рекомендациям и отзывам, они делают своё дело! Рекомендую!!!", "d": "6 февраля 2022", "n": "Katrin S.", "a": null}, {"r": 5, "t": "Ребята работают с удовольствием, качественно и оперативно. Осталась очень довольна результатом! Рекомендую!", "d": "4 февраля 2022", "n": "Юлия Г.", "a": null}, {"r": 5, "t": "Делал тонировку и антихром, все сделанно на высшем уровне, парни лучшие в своем деле)", "d": "2 февраля 2022", "n": "Антон К.", "a": null}, {"r": 5, "t": "Установили спойлер и затонировали переднюю полусферу на высшем уровне, качество выполненной работы обрадовало. Спасибо за ваши услуги. Рекомендую!", "d": "31 января 2022", "n": "Денис m.", "a": null}, {"r": 5, "t": "Быстро и качественно. Спасибо", "d": "29 января 2022", "n": "Раиль В.", "a": null}, {"r": 5, "t": "Супер ребята. Качественно всё делают.", "d": "28 января 2022", "n": "kuzya n.", "a": null}, {"r": 5, "t": "Отличное качество и скорость работы", "d": "28 января 2022", "n": "The R.", "a": null}, {"r": 5, "t": "Делала автотонировку, все понравилось. Персонал очень доброжелательный, выполняют все просьбы клиента. Могу рекомендовать.", "d": "27 января 2022", "n": "Nastya", "a": null}, {"r": 5, "t": "Отличный сервис, работа выполнена очень качественно да ещё и с гарантией, ребята мастера своего дела и очень приветливы, есть где можно с комфортом провести время и ждать окончания работы. Рекомендую 👍🏻", "d": "13 января 2022", "n": "Теймур Т.", "a": null}, {"r": 5, "t": "Наверное самый лучший сервис в городе, работа $('nav').innerHTML=navItems.map(function(n){return '<a href="'+n[0]+'">'+n[1]+'</a>'}).join('');

var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], RU=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
var parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Yekaterinburg',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
var g=function(t){return (parts.find(function(p){return p.type===t})||{}).value};
var today=DAYS.indexOf(g('weekday')), now=(g('hour')==='24'?'00':g('hour'))+':'+g('minute');
function openNow(){
 if(D.schedule.is24)return [true,'круглосуточно'];
 var di=today, sh=D.schedule.days[DAYS[di]]||[];
 for(var i=0;i<sh.length;i++){var f=sh[i][0],t=sh[i][1];
  if(t<=f){ if(now>=f)return [true,'до '+t]; } else if(now>=f&&now<t)return [true,'до '+t]; }
 var prev=D.schedule.days[DAYS[(di+6)%7]]||[];
 for(i=0;i<prev.length;i++){if(prev[i][1]<=prev[i][0]&&now<prev[i][1])return [true,'до '+prev[i][1]]}
 for(i=0;i<sh.length;i++){if(now<sh[i][0])return [false,'откроется в '+sh[i][0]]}
 return [false,''];
}
var on=openNow();
if(tel){$('hdCall').href=tel;$('hdCall').innerHTML=esc(D.phones[0].text)+'<small><b'+(on[0]?'':' class="cl"')+'>'+(on[0]?'Открыто':'Закрыто')+'</b> '+esc(on[1])+'</small>'}else $('hdCall').classList.add('hidden');

/* первый экран */
var stars=function(n){var s='';for(var i=1;i<=5;i++)s+=i<=Math.round(n)?'★':'<i>★</i>';return s};
$('rTag').innerHTML=D.rating?'<span class="st">★</span> '+String(D.rating).replace('.',',')+' · '+D.ratingCount+' оценок в 2ГИС':'2ГИС';
$('ext').textContent=D.ext||''; $('h1').textContent=D.name;
$('rub').innerHTML=D.rubrics.slice(0,6).map(function(r){return '<span>'+esc(r)+'</span>'}).join('');
var hb=[]; if(tel)hb.push('<a class="btn btn-main" href="'+tel+'">Позвонить</a>');
if(D.whatsapp)hb.push('<a class="btn btn-line" href="'+wa('Здравствуйте! Пишу с сайта.')+'" target="_blank" rel="noopener">Написать в WhatsApp</a>');
hb.push('<a class="btn btn-line" href="'+route+'" target="_blank" rel="noopener">Маршрут</a>');
$('heroBtns').innerHTML=hb.join('');
function hoursShort(){if(D.schedule.is24)return 'Круглосуточно';var a=DAYS.map(function(d){var h=D.schedule.days[d];return h&&h.length?h.map(function(x){return x[0]+'–'+x[1]}).join(', '):'выходной'});
 if(a.every(function(x){return x===a[0]}))return 'Ежедневно '+a[0]; return 'Сегодня: '+a[today]}
$('heroCard').innerHTML=
 '<div class="hc-row"><span class="ic">📍</span><div><small>Адрес</small>'+esc(D.city+', '+D.address)+(D.addressComment?'<small>'+esc(D.addressComment)+'</small>':'')+'</div></div>'+
 '<div class="hc-row"><span class="ic">🕘</span><div><small>Режим работы</small>'+esc(hoursShort())+'<small>'+(on[0]?'Сейчас открыто ':'Сейчас закрыто ')+esc(on[1])+'</small></div></div>'+
 (D.phones.length?'<div class="hc-row"><span class="ic">📞</span><div><small>Телефон</small>'+D.phones.map(function(p){return '<a href="tel:'+p.value+'">'+esc(p.text)+'</a>'}).join('<br>')+'</div></div>':'');

/* цены или услуги */
if(D.prices&&D.prices.items.length){
 $('pLead').textContent='Прайс компании из 2ГИС: '+D.prices.items.length+' позиций. Точную стоимость уточняйте у администратора.';
 var cats=[]; D.prices.items.forEach(function(i){if(i.c&&cats.indexOf(i.c)<0)cats.push(i.c)});
 var cur='all';
 $('pChips').innerHTML=cats.length>1?'<button type="button" data-c="all" class="on">Все</button>'+cats.map(function(c){return '<button type="button" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join(''):'';
 function drawP(){var q=$('pSearch').value.trim().toLowerCase(),html='',last=null;
  D.prices.items.forEach(function(i){if(cur!=='all'&&i.c!==cur)return;if(q&&(i.n+' '+i.d).toLowerCase().indexOf(q)<0)return;
   if(i.c&&i.c!==last){html+='<div class="pcat">'+esc(i.c)+'</div>';last=i.c}
   html+='<div class="prow"><div><b>'+esc(i.n)+'</b>'+(i.d?'<small>'+esc(i.d)+'</small>':'')+'</div><div class="pv">'+esc(i.p)+'</div></div>'});
  $('pList').innerHTML=html||'<div class="prow"><div>Ничего не найдено</div></div>'}
 $('pChips').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;cur=b.dataset.c;[].forEach.call($('pChips').children,function(x){x.classList.toggle('on',x===b)});drawP()});
 $('pSearch').addEventListener('input',drawP); drawP();
 $('pNote').textContent=(D.prices.head?D.prices.head+'. ':'')+'Информация о ценах не является публичной офертой.';
 if(D.prices.items.length<8)$('pBlock').querySelector('.ptools').classList.add('hidden');
}else{
 $('pEyebrow').textContent='Услуги'; $('pTitle').textContent='Чем мы занимаемся';
 $('pLead').textContent='Стоимость зависит от задачи — уточняйте по телефону'+(D.whatsapp?' или в WhatsApp.':'.');
 $('pBlock').classList.add('hidden'); $('svcGrid').classList.remove('hidden');
 $('svcGrid').innerHTML=D.rubrics.map(function(r){return '<div class="svc"><span class="dot"></span>'+esc(r)+'</div>'}).join('');
}

/* режим работы и условия */
$('hours').innerHTML=D.schedule.is24?'<tr><td>Ежедневно</td><td>Круглосуточно</td></tr>':DAYS.map(function(d,i){var h=D.schedule.days[d];return '<tr'+(i===today?' class="today"':'')+'><td>'+RU[i]+'</td><td>'+(h&&h.length?h.map(function(x){return x[0]+'–'+x[1]}).join(', '):'Выходной')+'</td></tr>'}).join('');
$('hNote').textContent=D.schedule.comment||'';
if(D.attrs.length)$('attrs').innerHTML+=D.attrs.map(function(g){return '<h4>'+esc(g.name)+'</h4><div class="t">'+g.items.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>'}).join('');
else $('attrs').innerHTML+='<p class="pnote">Подробности уточняйте по телефону.</p>';

/* отзывы */
var R=D.reviews, S=D.stats, tot=0; for(var k in S)tot+=S[k];
$('sc').textContent=D.rating?String(D.rating).replace('.',','):'—'; $('scSt').innerHTML=stars(D.rating||0);
$('scCnt').textContent=D.ratingCount+' оценок · '+R.length+' отзывов с текстом';
$('bars').innerHTML=[5,4,3,2,1].map(function(s){return '<div class="bar"><span>'+s+' ★</span><div class="tr"><span style="width:'+(tot?S[s]/tot*100:0)+'%"></span></div><span>'+S[s]+'</span></div>'}).join('')+
 '<small style="color:var(--muted);font-size:12.5px">Оценки '+tot+' отзывов в 2ГИС</small>';
var nPos=R.filter(function(r){return r.r>=4}).length, nNeg=R.filter(function(r){return r.r<=3}).length, filt='all', shown=12;
$('rvTabs').innerHTML='<button type="button" data-f="all">Все ('+R.length+')</button><button type="button" data-f="pos">Положительные ('+nPos+')</button><button type="button" data-f="neg">Отрицательные ('+nNeg+')</button>';
function list(){return R.filter(function(r){return filt==='all'||(filt==='pos'?r.r>=4:r.r<=3)})}
function drawR(){var L=list();
 $('rvGrid').innerHTML=L.slice(0,shown).map(function(r){
  return '<div class="rv'+(r.r<=3?' neg':'')+'"><div class="rs">'+stars(r.r)+'</div><p>'+esc(r.t)+'</p><div class="who">'+esc(r.n)+' <small>· '+esc(r.d)+'</small></div>'+
   (r.a?'<div class="ans"><b>Ответ компании · '+esc(r.a.d)+'</b>'+esc(r.a.t)+'</div>':'')+'</div>'}).join('');
 $('rvMore').classList.toggle('hidden',L.length<=shown);
 [].forEach.call($('rvTabs').children,function(b){b.classList.toggle('on',b.dataset.f===filt)});
}
$('rvTabs').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(!b)return;filt=b.dataset.f;shown=12;drawR()});
$('rvMore').addEventListener('click',function(){shown+=24;drawR()});
$('rvAll').href=D.gis+'/tab/reviews'; drawR();

/* контакты */
var c='';
c+='<div class="ct-item"><span class="ic">📍</span><div><small>Адрес</small>'+esc(D.city+', '+D.address)+(D.addressComment?'<small>'+esc(D.addressComment)+'</small>':'')+'<br><a href="'+route+'" target="_blank" rel="noopener">Построить маршрут →</a></div></div>';
if(D.phones.length)c+='<div class="ct-item"><span class="ic">📞</span><div><small>Телефон</small>'+D.phones.map(function(p){return '<a href="tel:'+p.value+'">'+esc(p.text)+'</a>'}).join('<br>')+'</div></div>';
if(D.email)c+='<div class="ct-item"><span class="ic">✉️</span><div><small>Почта</small><a href="mailto:'+esc(D.email)+'">'+esc(D.email)+'</a></div></div>';
var soc=D.links.map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'}).join('');
if(soc)c+='<div class="soc">'+soc+'</div>';
$('ct').innerHTML=c;
$('map').src='https://yandex.ru/map-widget/v1/?ll='+D.point.lon+','+D.point.lat+'&z=16&pt='+D.point.lon+','+D.point.lat+',pm2rdm';
$('ftL').textContent='© '+new Date().getFullYear()+' '+D.fullName+', '+D.city;
var fab=''; if(tel)fab+='<a href="'+tel+'" aria-label="Позвонить">📞</a>'; if(D.whatsapp)fab+='<a class="w" href="'+wa('Здравствуйте! Пишу с сайта.')+'" target="_blank" rel="noopener" aria-label="WhatsApp">'+WA_SVG+'</a>';
$('fab').innerHTML=fab;
})();
</script>
</body>
</html>
