<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Автокомплекс — Легковой автосервис, Сургут</title>
<meta name="description" content="Автокомплекс: Легковой автосервис, Запчасти для иномарок, Ремонт бензиновых двигателей. Нефтеюганское шоссе, 23/2, Сургут.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#0b5d3f;--c2:#3cc47c;--c1d:#08452f;--tint:#eaf7f0;--ink:#16211c;--muted:#5f6b66;--line:#e2e8e5;--bg:#f7f9f8;--star:#f2a20c;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.15;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:700 16px Manrope,sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-main{background:var(--c2);color:var(--c1d)}
.btn-line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn-wa{background:#25d366;color:#fff}
.btn-soft{background:var(--tint);color:var(--c1)}
.sec{padding:72px 0}
.sec h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin-bottom:10px}
.lead{color:var(--muted);font-size:17px;max-width:680px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c1);margin-bottom:10px}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo .mk{width:40px;height:40px;border-radius:12px;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.logo b{display:block;font-size:19px;font-weight:800;color:var(--c1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:600}
nav{display:flex;gap:20px;margin-left:auto}
nav a{text-decoration:none;font-size:15px;font-weight:600;color:#33403a}
nav a:hover{color:var(--c1)}
.hd-call{text-decoration:none;font-weight:800;font-size:17px;white-space:nowrap;color:var(--c1);text-align:right}
.hd-call small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.hd-call small b{color:#1a9b55}
.hd-call small b.cl{color:#d0482f}

.hero{background:radial-gradient(900px 420px at 85% 0,rgba(255,255,255,.14) 0,transparent 60%),linear-gradient(160deg,var(--c1d),var(--c1));color:#fff;padding:60px 0 70px}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;margin-bottom:18px}
.tag .st{color:#ffd166}
.hero .ext{font-size:16px;font-weight:600;opacity:.85;margin-bottom:6px}
.hero .ext::first-letter{text-transform:uppercase}
.hero h1{font-size:clamp(36px,5.4vw,60px);font-weight:800;margin-bottom:16px}
.rub{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.rub span{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
.hero-card{background:#fff;color:var(--ink);border-radius:22px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.22)}
.hc-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hc-row:last-child{border-bottom:0}
.hc-row .ic{font-size:20px;width:26px;flex:none}
.hc-row small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.hc-row a{text-decoration:none;font-weight:700}

/* prices */
.ptools{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;align-items:center}
.ptools input{flex:1 1 240px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:15px Manrope,sans-serif;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.plist{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcat{padding:12px 20px;background:var(--tint);font-weight:800;font-size:15px;color:var(--c1)}
.prow{display:flex;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
.prow b{font-weight:700;display:block}
.prow small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;white-space:pre-line}
.prow .pv{font-weight:800;white-space:nowrap;color:var(--c1)}
.pnote{font-size:13px;color:var(--muted);margin-top:12px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;font-weight:700;display:flex;gap:12px;align-items:center}
.svc .dot{width:12px;height:12px;border-radius:50%;background:var(--c2);flex:none}

/* info */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.box h3{font-size:18px;font-weight:800;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right;font-weight:700}
.hours tr.today td{color:var(--c1)}
.attrs h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px}
.attrs h4:first-child{margin-top:0}
.attrs .t{display:flex;flex-wrap:wrap;gap:6px}
.attrs .t span{background:var(--tint);color:var(--c1);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}

/* reviews */
.rv-top{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;margin-top:24px}
.score b{font-size:56px;font-weight:800;color:var(--c1);line-height:1}
.score .st{color:var(--star);font-size:18px;letter-spacing:2px}
.score small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.bars{display:grid;gap:6px;max-width:440px;font-size:14px}
.bar{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center}
.tr{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.tr span{display:block;height:100%;background:var(--star);border-radius:99px}
.rv-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.rv-tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.rv-tabs button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.rv-grid{columns:3 300px;column-gap:16px;margin-top:20px}
.rv{break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.rv.neg{border-color:#f0d3cb;background:#fffaf8}
.rv .rs{color:var(--star);letter-spacing:1px}
.rv .rs i{font-style:normal;color:#d7ddda}
.rv p{margin:8px 0 12px;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.rv .who{font-size:14px;font-weight:700}
.rv .who small{color:var(--muted);font-weight:500}
.rv .ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:14px;white-space:pre-line}
.rv .ans b{display:block;font-size:12.5px;color:var(--c1);margin-bottom:4px}
.more{text-align:center;margin-top:8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* contacts */
.ct-sec{background:linear-gradient(160deg,var(--c1d),var(--c1));color:#fff}
.ct-sec .eyebrow{color:#fff;opacity:.8}
.ct-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;margin-top:28px}
.ct{display:grid;gap:12px;align-content:start}
.ct-item{display:flex;gap:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:16px 18px}
.ct-item .ic{font-size:22px;flex:none}
.ct-item small{display:block;opacity:.75;font-size:12.5px;font-weight:600}
.ct-item a{text-decoration:none;font-weight:700}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.14);text-decoration:none;font-size:14px;font-weight:600}
.map{border-radius:var(--r);overflow:hidden;min-height:400px;background:rgba(255,255,255,.1)}
.map iframe{width:100%;height:100%;min-height:400px;border:0;display:block}

footer{background:#0d1512;color:#9aa9a2;padding:26px 0;font-size:13.5px}
.ft{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:16px;z-index:60;display:none;gap:10px}
.fab a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);text-decoration:none;font-size:24px;background:var(--c2)}
.fab a.w{background:#25d366}
.fab svg{width:28px;height:28px;fill:#fff}

@media(max-width:980px){
 nav{display:none}
 .hero-grid,.info-grid,.ct-grid{grid-template-columns:1fr}
 .svc-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
 .wrap{padding:0 16px}
 .sec{padding:52px 0}
 .hero{padding:38px 0 50px}
 .hd{gap:10px;height:62px}
 .logo small{display:none}
 .hd-call{margin-left:auto;font-size:15px}
 .svc-grid{grid-template-columns:1fr}
 .hero-btns .btn{flex:1 1 100%}
 .hero-card{padding:18px 16px}
 .rv-top{grid-template-columns:1fr;gap:16px}
 .prow{flex-direction:column;gap:4px}
 .fab{display:flex}
}
</style>
</head>

</div></section>

 {"r": 5, "t": "Впервые столкнулся с проблемой в автомобиле, не заводилась просто и все. Стартер поменяли быстро и нормально стало!)", "d": "17 июля 2023", "n": "ВАЛЕРИАН Н.", "a": {"t": "ВАЛЕРИАН, добрый день, большое спасибо за ваш отзыв, ждём вас в гости снова!", "d": "23 июля 2023"}}, {"r": 5, "t": "Фильры воздушные забирал вообще за копейки относительно средних цен на рынке.", "d": "16 июля 2023", "n": "Дима Б.", "a": {"t": "Дима, добрый день! Спасибо большое за отзыв и высокую оценку. Рады работать для вас ❤", "d": "23 июля 2023"}}, {"r": 5, "t": "После работы с ходовой, машина заметно изменилась к лучшему. Все неполадки были устранены, и я чувствую себя намного увереннее на дороге.", "d": "15 июля 2023", "n": "сергей м.", "a": {"t": "Сергей! Спасибо большое, что оценили 💛 Рады сотрудничеству!", "d": "23 июля 2023"}}, {"r": 5, "t": "Цены вполне адекватны, особенно учитывая качество предоставляемых услуг. Понимаешь на что тратишь свои деньги!", "d": "14 июля 2023", "n": "Олег Б.", "a": {"t": "Добрый вечер, большое спасибо, что выбираете нас. И, конечно же, ждем вас снова 🌸", "d": "23 июля 2023"}}, {"r": 5, "t": "Я настоятельно рекомендую данный автосервис всем, кто ищет надежное и честное место для ремонта своей машины. Здесь можно быть уверенным в качестве выполняемой работы.", "d": "13 июля 2023", "n": "Гриша Н.", "a": {"t": "Добрый день. Большое спасибо, очень приятно получать обратную связь 💛 Будем вас ждать 🙏🏼", "d": "14 июля 2023"}}, {"r": 1, "t": "Продали паленый датчик температуры, пришел возвращать, а они не возвращают , говорят надо мне экспертизу какую-то делать и только после этого, а то что в машине горит ошибка по датчику новому их никак не волнует.\n13.07.2023\nКуплен был оригинал 02.07.2023!!", "d": "13 июля 2023", "n": "Иван П.", "a": {"t": "Добрый день! Существует определенный порядок возврата электротехнических товаров. Предоставьте акт деффектовки и заказ-наряд установки датчика и денежные средства будут возвращены в полном объеме.", "d": "14 июля 2023"}}, {"r": 5, "t": "Хорошо что в наличии еще и различных полезных запчастей хватает, что может существенно ускорить ремонт)", "d": "12 июля 2023", "n": "Орест А.", "a": {"t": "Здравствуйте! Благодарим за высокую оценку 💛 Будем стараться и дальше 😉", "d": "23 июля 2023"}}, {"r": 5, "t": "СТО показало, что с машиной все хорошо, поставили новые фильры и масло, в остальном ничего не меняли и не чинили.", "d": "10 июля 2023", "n": "Бекжан Т.", "a": {"t": "Роман, спасибо вам за теплые слова! Приходите к нам ещё 🌸", "d": "23 июля 2023"}}, {"r": 5, "t": "Отличный коллектив, все быстро оформили\nЖдём запчасти", "d": "9 июля 2023", "n": "Максим В.", "a": {"t": "Добрый вечер. Спасибо, Максим, за отзыв 💛 Рады стараться 🌸", "d": "23 июля 2023"}}, {"r": 5, "t": "Столько автосервисов пришлось объехать чтоб найти наконец-то нормально место…", "d": "9 июля 2023", "n": "Nurbek N.", "a": {"t": "Здравствуйте, Остап! Спасибо вам, что уделили время и написали отзыв!!! Ждем вас в гости снова и снова 🤗", "d": "23 июля 2023"}}, {"r": 5, "t": "Уровень обслуживания на высоте! Автомобиль был возвращен в идеальном состоянии, как новый!", "d": "5 июля 2023", "n": "Александр Ю.", "a": {"t": "Спасибо вам большое за добрые слова о нашей работе ❤ Будем рады вам всегда 🙏🏼", "d": "5 июля 2023"}}, {"r": 5, "t": "С сервисом знаком далеко уже не первый день, проверенное и надежное место, которое заслуживает высокой оценки!", "d": "4 июля 2023", "n": "Андрей Р.", "a": null}, {"r": 5, "t": "Мастера хороший", "d": "2 июля 2023", "n": "Зафар А.", "a": null}, {"r": 5, "t": "Толковые и вежливые сотрудники работают, которые на любые вопросы ответить могут понятным языком в случае чего, все честно.", "d": "30 июня 2023", "n": "Влад А.", "a": {"t": "Добрый вечер. Спасибо вам большое, что оценили 🔥 Приходите ещё 💛", "d": "30 июня 2023"}}, {"r": 5, "t": "После ремонта стартера нормально все заводиться стало! Ваще немного денег с меня взяли)", "d": "28 июня 2023", "n": "Женек Р.", "a": null}, {"r": 5, "t": "Приехал так сказать без приглашения, повезло что очереди не было и смогли меня сразу принять и подсказать по ремонту!!", "d": "28 июня 2023", "n": "Роман Н.", "a": null}, {"r": 1, "t": "Не отвечают на звонки. Еле дозвонился взяли трубку сказали ало ало и бросили. Это самое отвратительное СТО!!!", "d": "27 июня 2023", "n": "Курбан К.", "a": {"t": "Добрый день. У нас бывает большой поток клиентов, что нет возможности ответить на телефонный звонок. Подскажите, пожалуйста, как это может охарактеризовать сто с негативной стороны?", "d": "30 июня 2023"}}, {"r": 5, "t": "Стартер поменяли и машина сразу завелась нормально. Фиг знает че там с ним произошло, надеюсь что такого не будет больше.", "d": "26 июня 2023", "n": "Борис К.", "a": null}, {"r": 5, "t": "Нормальный оборудованный автосервис, к компетентности мастеров у меня тоже вопросов нет.", "d": "26 июня 2023", "n": "Толя М.", "a": {"t": "Добрый вечер, Толя. Благодарим за приятный отзыв. Приходите в гости ещё!", "d": "23 июля 2023"}}, {"r": 1, "t": "Отношение к клиенту ровным счётом никакое, приехал на замену шланга высокого давления Гур, слесарь не смог открутить старый шланг, предложил снять насос ГУР естественно за доп плату в виде 3500₽ и \"попробовать открутить\" тоесть не факт что будет сделано то, что мне нужно, а уже сумма за замену вырастет до 6000₽\nРазвернулся уехал от таких горе мастеров...", "d": "24 июня 2023", "n": "Кирилл К.", "a": {"t": "Добрый день, Кирилл. Свяжитесь, пожалуйста, с руководителем, 89503163803", "d": "24 июня 2023"}}, {"r": 5, "t": "Для моей машины нашлись запчасти подходящие, так что ремонт завершился быстро без задержек всяких.", "d": "23 июня 2023", "n": "Дима И.", "a": {"t": "Добрый вечер, Дима. Спасибо, очень приятно получать обратную связь 💛 Были рады помочь.", "d": "24 июня 2023"}}, {"r": 5, "t": "движок после ремонта работает как новый, пока не сталкивался ни с какими проблемами.", "d": "23 июня 2023", "n": "Владимир Г.", "a": {"t": "Добрый вечер, огромное спасибо за ваш отзыв и оценку. Мы рады, что вам всё понравилось!", "d": "23 июля 2023"}}, {"r": 5, "t": "Обороты больше не плавают, все исправили. По крайней мере после первой недели с момента ремонта.", "d": "21 июня 2023", "n": "Саша П.", "a": null}, {"r": 5, "t": "Помогли с восстановлением генератора, а то я уже планировал новый покупать. Так что сэкономили деньги мне)", "d": "17 июня 2023", "n": "Леонид З.", "a": null}, {"r": 5, "t": "Обслуживаюсь уже почти 8 лет, всё устраивает. Парни молодцы!", "d": "17 июня 2023", "n": "Анатолий Р.", "a": {"t": "Здравствуйте! БЛАГОДАРИМ за отзыв!!!", "d": "17 июня 2023"}}, {"r": 5, "t": "Хоть в одном сервисе нашего города нашлись запчасти нужные, да к тому же по приемлемой цене, очень рад был.", "d": "15 июня 2023", "n": "Костя Х.", "a": null}, {"r": 1, "t": "07.06.2023 обращался к авто электрику. Машина начала заводиться через раз. Приговор специалиста - замена датчика тормоза. Датчик сразу купил из наличия, замена вашими силами (вы же типо профессионалы). В результате через час машина опять не заводится... Пришлось бросить работу (ощутимо потерял в деньгах, но главное подвёл хороших людей) и срочно возвращаться на СТО. Но мастер был занят другой машиной (деньги то мной уже уплачены, зачем ему мои проблемы). \nВывод: \n- низкое качество запасных частей;\n- низкое качество диагностики и уровень квалификации сотрудника;\n- скотское отношение к клиенту... \nСкажу честно, разочарован! Обращался ранее к вам несколько раз. \nНичего не сохнет так долго, как подмоченная репутация! Более к вам не поеду никогда и всем знакомым скажу, обходить ваше заведение десятой дорогой!", "d": "10 июня 2023", "n": "Nikolay M.", "a": null}, {"r": 1, "t": "На платной диагностике сказали что умерла дроссельная заслонка и нет в наличии! Через несколько дней самостоятельно нашел причину поломки !!! Хорошо хоть не заказал дроссельную заслонку!!!", "d": "9 июня 2023", "n": "Андрей Т.", "a": null}, {"r": 1, "t": "Шаражмонтаж.\nНеуважительное отношение к клиенту.\nРукой махнули на то что матиз не хотят брать в работу. Не нужно судить человека по его машине. Я могу вашу забегаловку купить и всех распустить... \nНе советую.\nА ещё и левак делают на СТО мимо кассы...", "d": "7 июня 2023", "n": "Иван М.", "a": {"t": "Добрый вечер. Будьте добры, позваните, пожалуйста, по номеру 89503163803.", "d": "7 июня 2023"}}, {"r": 5, "t": "Большой ассортимент запчастей. На сто все сделали быстро и качествено!", "d": "6 июня 2023", "n": "Дамир Н.", "a": {"t": "Добрый вечер, Дамир! Благодарим за приятный отзыв о нашей работе. ❤ Всегда рады помочь 🤗", "d": "6 июня 2023"}}, {"r": 1, "t": "Всё очень дорого и обслуживание и запчасти не рекомендую генератор просто снять 2 гайки открутить 2600 тр", "d": "6 июня 2023", "n": "Zahar A.", "a": {"t": "Здравствуйте. Zahar Andres. Вам была проделана следующая работа: с/у генератора - 1800 руб. (Согласно нашему прайсу с/у генератора от 1500 до 5000 руб. В зависимости от марки автомобиля, сложности работы); а так же с/у реле генератора (800 р. Согласно нашему прайсу с/у реле генератора 1500 руб.).\nПожалуйста, не вводите в заблуждение других клиентов. Благодарим, что выбрали нас!", "d": "6 июня 2023"}}, {"r": 1, "t": "Все очень дорого не советую", "d": "6 июня 2023", "n": "₽₽₽₽₽", "a": {"t": "Здравствуйте. Будьте добры по-подробнее.", "d": "6 июня 2023"}}, {"r": 5, "t": "Отлично, быстро!", "d": "3 июня 2023", "n": "Сергей В.", "a": {"t": "Добрый вечер. Спасибо вам большое за такой приятный отзыв 🙏👌 Будем вас ждать ❤", "d": "4 июня 2023"}}, {"r": 5, "t": "Спасибо огромное электрику Зафару.\nИсправил всё, что поломали в масломаркт и сделал это за час. Другие мастера гадали и руки разводили. Благодарююююю", "d": "27 мая 2023", "n": "Анастасия Т.", "a": {"t": "Здравствуйте! Огромное спасибо, что уделили время и написали отзыв. Обязательно передадим слова благодарности мастеру. 💛 Будем рады видеть вас в числе наших постоянных клиентов.", "d": "27 мая 2023"}}, {"r": 1, "t": "Не рекомендую! \nОтношение неуважительное с опре  5, "t": "Движок оживили за вполне адекватные деньги и короткие сроки!)", "d": "22 июля 2022", "n": "Егор Л.", "a": {"t": "Здравствуйте, Егор! Спасибо, очень приятно получать обратную связь 😌 Мы стараемся ❤", "d": "22 июля 2022"}}, {"r": 5, "t": "Реально надежный автомобильный сервис, к которому лично у меня никаких претензий не имеется.", "d": "20 июля 2022", "n": "Олег М.", "a": null}, {"r": 5, "t": "Всё очень хорошо", "d": "17 июля 2022", "n": "Дмитрий З.", "a": {"t": "Благодарим за отзыв!", "d": "17 июля 2022"}}, {"r": 5, "t": "Очень быстро нашли проблему и устранили поломку, и очень удобно что в наличии имеются автозапчасти. Спасибо всем большое. Рекомендую👍", "d": "17 июля 2022", "n": "Надя С.", "a": {"t": "Благодарим за отзыв!", "d": "17 июля 2022"}}, {"r": 5, "t": "Обращался по поводу кузовного ремонта, сделали отлично, мне понравилось", "d": "14 июня 2022", "n": "I7 T.", "a": {"t": "Благодарим Вас за отзыв!", "d": "15 июня 2022"}}, {"r": 5, "t": "Обращался на станцию технического обслуживания Корея авто расположенного по адресу Югорский тракт 13 хотел бы выразить свою благодарность за честность, и профессионализм мастера Абдулле и Сергею всё говорят по факту ничего лишнего!!! Рекомендую!!!", "d": "31 мая 2022", "n": "Дмитрий Т.", "a": null}, {"r": 1, "t": "Советую на профсоюзов 39/2 обратиться!!!", "d": "1 мая 2022", "n": "Ринат Х.", "a": null}, {"r": 5, "t": "Классный сервис. Всё быстро и профессионально.", "d": "26 апреля 2022", "n": "Диляра Ф.", "a": null}, {"r": 5, "t": "Запчасти в наличии по больше чем в других магазинах!", "d": "8 апреля 2022", "n": "Normatjon S.", "a": null}, {"r": 5, "t": "Прекрасный сервис, меняли сцепление всё сделали хорошо , девушки на ресепшене хорошие , улыбчивые 👍", "d": "1 февраля 2022", "n": "Виктория С.", "a": null}, {"r": 1, "t": "Вырезал катализатор, сделали хорошо спору нет. Делал как раз весной поменял заодно и колёса просто перекинуть... На данный момент сопутсвующий урон превышает похвалы. На заднем правом колесе закрутили 2 болта против резьбы... Хорошо это обнаружилось на СТО другом, а если на дороге?) Решил поменять масло...И вуаля болты на броне тоже сорваны. Может мне \"повезло\" Попасть к мастеру с \"золотыми\" руками. Люди поберегите нервы и деньги)", "d": "1 ноября 2021", "n": "Leroy", "a": {"t": "Здравствуйте предоставьте пожалуйста заказ-наряд на выполненные работы и ваш номер телефона", "d": "1 ноября 2021"}}, {"r": 1, "t": "День добрый... обратился в данный сервис с проблемой по электрике. Позвонил администратору..дали номер электрика Зафара..договорился с ним через 2 дня с момента звонка ... заказал эвакуатор ...заплатил 2500 рублей.. оставил ключи у администратора... вечеров позвонил электрику.. спросил как обстоят дела с ремонтом... он сказал что все получается он делает...постарается сегодня сделать если нет то на следующий день... в этот день он не позвонил..и на следующий день до обеда была тишина..решил приехать лично посмотреть ... подъезжаю к сервису и каково было моё удивление ..МАШИНА КАК СТОЯЛА ТАК И СТОИТ НА ТОМ ЖЕ МЕСТЕ!??!?? Спросил где электрик его на месте не было...подождал ещё пол часа своего времени... подъехал Зафар и спокойно говорит мол я не делал...хотя за день до этого сказал что занимается и все получается у него!!!! КЛЮЧИ ОТ МОЕЙ МАШИНЫ БЫЛИ С НИМ!!! ЭТОвообще как?!?! Ключи от чужой машины катает с собой... сказал что сейчас загонит и приступит... это было 12 часов... позвонил в 17.00 спрашиваю ну как получается? Он говорит что ещё даже не загонял!!! Соответственно машину я не захотел делать у данных специалистов... Вопрос кто вернёт мне деньги за эвакуатор? Спасибо", "d": "12 октября 2021", "n": "Андрей В.", "a": null}, {"r": 5, "t": "Большое количество запчастей в наличии. Для тех, у кого нет времени ждать! Рекомендую", "d": "11 октября 2021", "n": "Beton R.", "a": null}, {"r": 5, "t": "Нужны были запчасти по наличию, ждать доставки не было возможности, быстро нашли хороший аналог, тут же за час заменили! Комната ожидания с телевизором и камерой рабочей зоны, где ты онлайн наблюдаешь за ремонтом! Персонал культурный, без гонора, я остался доволен!", "d": "9 октября 2021", "n": "ГвОзДи", "a": null}, {"r": 5, "t": "Заказывал фильтры на свою киа, все отлично, поменяли сразу", "d": "9 октября 2021", "n": "Сергей С.", "a": null}, {"r": 5, "t": "Отличный сервис, заехал быстро, осмотрели, обслужили, что нужно заменили, главное качественно и не дорого, рекомендую!!!", "d": "17 сентября 2021", "n": "Гасилов Э.", "a": null}, {"r": 1, "t": "Передний рычаг не закрепили, а на авто мать с дочкой ездили. Менеджеру смешно, как я перепугался", "d": "15 сентября 2021", "n": "Ильнур Ш.", "a": null}, {"r": 1, "t": "По телефону сказали цена замены гофры 1500. В результате пришлось оплачивать отдельно сварщику 1400 и 1700 за снятие/установку. Везде цена от 1500 до 2500, решил сэкономить, заплатил в 2 раза больше, 3100. Развели и доказывают, что ничего не говорили. Кто любит чувствовать себя идиотом, сюда! По работе вопросов нет.", "d": "8 сентября 2021", "n": "Alexander N.", "a": null}, {"r": 1, "t": "Написано что работают до 21:00, но я приехал в 20:40, а двери уже закрыты, продавец увидел что я стою у двери, но прошёл мимо", "d": "5 сентября 2021", "n": "У Р.", "a": {"t": "Прошу уточнить дату и время приезда в наш магазин, так как не можем подтвердить ваше обращение на нашу торговую точку в данное время описанное вами.", "d": "6 сентября 2021"}}, {"r": 1, "t": "Не в коем случае не пользуйтесь услугами горе слесарей, после замены прокладки под клапаной крышкой и ремня грм, спустя 1 месяц и 50км пробега, застучал двигатель масло льет как не лило раньше, притензии не принимают, при осмотре сказали все менять что меняли. Это просто пизд.... Ц! Меня уливляет, что гарантия 2 недели, а не на работы либо путь в км. Подскажите как с этой горе компании добиться, устранение косяков ремонта проведеного в этом сервисе??????", "d": "31 августа 2021", "n": "Виталий П.", "a": {"t": "Вам был предложен вариант для решения проблемы, вы
