е\". По итогу выходишь со стрижки, как с каторги.\nА тут, я присел, меня приподняли, подстригли, опустили спинку, уложили на этом кресле и подравняли бороду. Кайф, захотелось взять барбера Артёма и убежать далеко-далеко, чтоб он стриг только меня.\nСама обстановка приятная, приятно-тёмное помещение, подсвеченное диодными лампами. Особенные виды открываются, когда стригут бородку...\nБарберы общительные и не против светской беседы, легко идут на контакт.\nА ещё, Артём завлёк меня и мне выдернули волосы из ноздрей. Блаженство...Только ради этого приду еще!\nИ как бы не звучало странно, я полюбил этих мужчин и приду в MR.in.BLACK ещё и ещё.", "d": "24 июля 2022", "n": "Алексей Р.", "a": null}, {"r": 5, "t": "Направление? Какое направление ?\nСколько раз сюда ходил, всегда было классно 👍🏼😁", "d": "25 июня 2022", "n": "Евгений O.", "a": null}, {"r": 5, "t": "Спасибо большое за прекрасную стрижку. Подстригли именно так как я хотел. Всем рекомендую 👍", "d": "16 апреля 2022", "n": "Андрей Ц.", "a": null}, {"r": 5, "t": "Лучшее место в Сургуте. Отличные мастера", "d": "14 января 2022", "n": "Турал К.", "a": null}, {"r": 5, "t": "Самый очешуительный барбершоп в городе, все мастера на уровне, администратор профессионал свое дела!", "d": "14 января 2022", "n": "Omar I.", "a": null}, {"r": 5, "t": "Отличные ребята , дружный обстановка) парни красавчики )", "d": "14 января 2022", "n": "Антон К.", "a": null}, {"r": 5, "t": "Лучшие мастера этого города! \nХожу к мастеру уже года 2, всегда могу ему доверить свою прическу.Зимой согреют чаем , в невыносимую жару прохладный напиток !\nАтмосфера кайфовая, всегда можно пообщаться.", "d": "11 ноября 2021", "n": "Альберт", "a": {"t": "Благо дарим за визит Альберт, всегда рады вас видеть)", "d": "28 ноября 2021"}}, {"r": 5, "t": "Оч классно постригли, быстро и качественно! Обслуживание приятное, место комфортное, обязательно зайду снова!", "d": "5 октября 2021", "n": "Руслан Х.", "a": {"t": "Спасибо за обратную связь, всегда рады вас видеть
