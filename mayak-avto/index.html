null}, {"r": 3, "t": "Сделали все хорошо, но простоял в очереди к сварщику 5 часов.", "d": "29 августа 2023", "n": "Анатолий", "a": null}, {"r": 1, "t": "Это самое ужасное СТО, во первых мы приехали вечером на тросу, попросили охранников оставить машину на территории и на след. день приехать чинить, они очень нагло общались и грубили \nВо вторых когда мы снова приехали, механики вообще лентяи и ничего не знают, не могли решить элементарную проблему, развели руками просто\nПриехали на другое сто там решили все за час \nВывод: никогда больше туда не приедем, и не посоветуем, самое ужасное СТО, персонал просто по хамски себя ведет, так еще и не профессионалы", "d": "26 августа 2023", "n": "Полли Р.", "a": null}, {"r": 1, "t": "Позвонил, узнал стоимость замены кулисы, сказали 2000₽ с чем то, в итоге заехал на подъемник и мне стали считать каждую снятую деталь в итоге сумма ремонта стала выходить около 8000₽, не рекомендую заезжать на это сто так как цены крутят как хотят, а ремонтируют не качественно!!!!\nДиспетчера и ремонтники не умеют общаться с посетителями!", "d": "20 августа 2023", "n": "Сабир А.", "a": null}, {"r": 5, "t": "Четкое место в магазине девушка молодец подсказала помогла", "d": "19 августа 2023", "n": "Игорь Л.", "a": null}, {"r": 1, "t": "Раньше было немного лучше", "d": "17 августа 2023", "n": "Марат К.", "a": null}, {"r": 1, "t": "Становишься в очередь на развал, ждёшь 3 часа, а в очереди перед тобой появляются новые машины которых ранее в записи не было, но говорят что были.., волшебство..", "d": "16 августа 2023", "n": "Николай Ч.", "a": null}, {"r": 1, "t": "Хотел узнать наличие масла для замены. Позвонил 4 раза, но все время скидывают звонок. Обратная связь в магазине не работает! Видимо клиенты не нужны. Дозвонился без проблем в масломарт и автомолл. Свой выбор я уже сделал.", "d": "16 августа 2023", "n": "Дядя-Гриня Л.", "a": null}, {"r": 5, "t": "А мне кажется мастер выполнил свод работу хорошо ,заменялся датчик кислорода 1 на нисан альмера ,оформление и замена 20-30 минут и все готова и поехала сбросила ошибку чек и машина сразу перестала дергаться ,имя мастера к сожалению не знаю 🤷‍♀️,спасибо но мастер четкий и опытный ,нисан альмера серебристый .мастеру привет 🤝", "d": "30 июля 2023", "n": "Джозефина В.", "a": null}, {"r": 5, "t": "Делал тут развал-схождение на автомобиле. Все понравилось, хоть и сделали со второго раза, но механик хороший вежливый и главное - адекватный. Цена вменяемая. По необходимости приеду еще!", "d": "21 июля 2023", "n": "Станислав", "a": null}, {"r": 2, "t": "Грубое отношение диспетчера. Зажрались!!!", "d": "13 июля 2023", "n": "мансур а.", "a": null}, {"r": 1, "t": "Отказали в ремонте. Время потеряно. Не смог поднять машину на подьемнике изза порогов. Лентяй.", "d": "5 июля 2023", "n": "Иван М.", "a": null}, {"r": 1, "t": "Телефон для красоты указан? Весь день звоню, никто не отвечает, трубку сбрасывают. Обратите внимание на отзывы!", "d": "27 июня 2023", "n": "Анна К.", "a": null}, {"r": 2, "t": "Меняю тут только масло в ДВС и АКПП.\n\nПо железу не катайтесь сюда. Банально когда колодки ставят, ничего не смазывают, о чем тут ещё говорить", "d": "25 июня 2023", "n": "SerG M.", "a": null}, {"r": 1, "t": "Не дозвониться. На звонки не отвечают и бывает сбрасывают!", "d": "11 июня 2023", "n": "Роман Щ.", "a": null}, {"r": 1, "t": "Диспетчера трубку вообще не берут((( не дозвониться", "d": "28 мая 2023", "n": "Дмитрий В.", "a": null}, {"r": 1, "t": "Плотников Евгений такое ощущение что работает первый день . Очень долгое обслуживание !", "d": "6 мая 2023", "n": "Lili L.", "a": null}, {"r": 1, "t": "Заезжали поменять датчик, поменяли,после выяснилось, что проблема в проводке, отремонтировали. Выехав с сто, через час опять загорелась та же ошибка, подъехали к мастеру, он говорит - записывайтесь снова. За работу не отвечают. В результате не заинтересованы.", "d": "3 апреля 2023", "n": "Лилия З.", "a": null}, {"r": 1, "t": "Сгорал предохранитель на бензонасос 21099\nМашина нужна была срочным образом, на тросу пригнал на маяк на профсоюзов, там все было занято, отправили на мира, я притащил машину сюда, подошел к диспетчеру, объяснил ситуацию, она направила к электрику, нашел электрика ему объяснил то сказал что мне нужен диагност, нашел диагноста, ему объяснил, тот сказал нужно прозвонить и поменять провод, я говорю ну так сделайте, на что он ответил, я этим не занимаюсь да и электрик это не сделает, и я удивился диагност отвечает за электрика, в итоге машину не сделали, просто так на тросу пригнал машину с ауры)", "d": "12 марта 2023", "n": "Ахмед Г.", "a": null}, {"r": 1, "t": "Ноги моей не будет больше в этом месте, первое это кассир, она же диспетчер, наглая хамка, не верите- заедьте, посмотрите! Насчет слесаря, заезжал на диагностику ходовой, посоветовал поменять все, что можно, а причина была в шеркании колодок о диск, о чем фломастер- мастер промолчал.", "d": "7 марта 2023", "n": "Garik H.", "a": null}, {"r": 1, "t": "Приезжал ручник делал через пару дней , опять все сломалось , с датчиком бензина также", "d": "4 марта 2023", "n": "Ильдар Г.", "a": null}, {"r": 1, "t": "Девушка диспетчер, если вам не нравится ваша работа, если вы работаете только из-за того, что надо работать, попытайтесь найти себе другую работу без того, чтобы открывать свой рот. Не умеете и не хотите учиться – не стоит даже продолжать. Разговор по телефону: \n\"-Добрый день, скажите сколько машин в очереди на мойку? \n-Девушка я не знаю, думаете я их считать должна что-ли?\"\nНу выйди посчитай 🤣 \nУже не в первый раз так звоню поинтересоваться о прайсе и работе... Больше никогда не буду рассматривать Ваше заведение с этим животным 😉✌️", "d": "25 февраля 2023", "n": "Калерия Ц.", "a": null}, {"r": 5, "t": "Спасибо автослесарю Евгению за ответственное отношение к работе!", "d": "19 января 2023", "n": "Александр В.", "a": null}, {"r": 1, "t": "Самый конечный сервис в Сургуте !!!\nЧто диспетчер, что электрики !! Какие-то неадекватные!", "d": "12 января 2023", "n": "Тимур М.", "a": null}, {"r": 5, "t": "Жигули мои чинят стабильно хорошо, но дорого!)", "d": "11 января 2023", "n": "Данила М.", "a": null}, {"r": 5, "t": "По записи точно по времени заехал поменяли стойку амортизатора. Замена масла двигателя так же на отлично, быстро и четко!", "d": "11 января 2023", "n": "Evgenii M.", "a": null}, {"r": 1, "t": "Оставлял машину на ремонт и заодно дифектовку ходовой, надификтовали замену все сайлентблоков , но поехал менять в другое сто , как итог деньги на ветер , всё нормальное , а стук от умершего амортизатора . Туда приходят тренироваться за ваши деньги, обходите стороной.", "d": "28 декабря 2022", "n": "Mihail C.", "a": null}, {"r": 1, "t": "Самые рукожопые слесаря в маяке.два раза меняли хомут на пыльнике шруса и опять слетел.", "d": "25 декабря 2022", "n": "Алексей Г.", "a": null}, {"r": 1, "t": "Не туда написал, удалить", "d": "22 декабря 2022", "n": "Андрей И.", "a": null}, {"r": 1, "t": "Заранее за неделю записался, приезжаю по времени а мне говорят нет мест придётся ждать минимум часа 2. И это уже не первый раз. Никому не советую этот сервис.", "d": "17 декабря 2022", "n": "Алик А.", "a": null}, {"r": 5, "t": "Несколько раз был здесь по обслуживанию авто,плохого ничего не могу сказать,все сделали быстро и недорого.", "d": "3 декабря 2022", "n": "Дмитрий Ш.", "a": null}, {"r": 1, "t": "С каждым обращением все меньше и меньше  желания обращаться сюда. Это не делаем, это не к нам, клиентоориентированость пропала совсем. Девушка диспетчер вообще некомпитетнта", "d": "18 ноября 2022", "n": "Иван К.", "a": null}, {"r": 1, "t": "Сам сервис неплохой, претензий нет пока что, но вот автомойка убогая, зачем делать место под 2 авто, когда автомойщики трут вдвоем одну?\nЛадно бы на качество работали, так моют также как и везде.", "d": "14 ноября 2022", "n": "Григорий Д.", "a": null}, {"r": 1, "t": "На ресепшене и на телефоне сидят какие то женщины у которых нет клиентоориентированности от слова совсем! Грубые и еще туповатые! Руководство маяка с такими сотрудниками вам скоро хана !", "d": "2 ноября 2022", "n": "Азиз А.", "a": null}, {"r": 5, "t": "Отличный автосервис! Самый лучший в городе! Обслуживаю свой авто только в Маяк-Авто. Всегда всё быстро и четко! Ребята профессионалы своего дела! Девушки (диспетчера) всегда внимательны и приветливы.Удачи Вам и процветания!", "d": "1 ноября 2022", "n": "Самира Д.", "a": null}, {"r": 1, "t": "Что там за овца на телефоне сидит? Вы вообще читаете отзывы?", "d": "29 октября 2022", "n": "Николай М.", "a": null}, {"r": 1, "t": "Диспетчер вообще не клиентоориентирован. 27.10.22", "d": "27 октября 2022", "n": "Изнурёнков С.", "a": null}, {"r": 1, "t": "После развала-схождения машину тянет вправо и тоже самое знакомый сказал.", "d": "18 октября 2022", "n": "Радик А.", "a": null}, {"r": 1, "t": "Был на диагностике двигателя на мира, Был разачарован ,от его высокамерия", "d": "11 октября 2022", "n": "✴", "a": null}, {"r": 5, "t": "Чисто, просторно. Парковка большая. Удобное расположение. Мастер супер, всё понятно и рассказал, и объяснил проблему.", "d": "25 сентября 2022", "n": "Раиса Г.", "a": null}, {"r": 5, "t": "Оперативно, по деньгам всё тоже приемлимо. Обслуживание не назойливое, одним словом был приятно удивлен!", "d": "24 сентября 2022", "n": "Ибрагим Н.", "a": null}, {"r": 1, "t": "Отдал Машину на диагностику двигателя заплатит 1200 причину поломки мастер похоже нашёл в гугле, заехал в другой сервис нашли реальную проблему и в течении пяти минут устранили", "d": "21 сентября 2022", "n": "Vild V.", "a": null}, {"r": 4, "t": "Удобный сервис с большим количеством подъемников, работу делают отлично, цены довольно низкие, есть свой магазин прямо в здании, где огромное количество запчастей в наличии, а если нет какой-то запчасти - можно заказать. Единственный минус, который заметил - огромные очереди, если без записи, поэтому если что-то срочное - лучше заехать в другое место, а если нет - позвонил, записался, и все нормально.", "d": "12 сентября 2022", "n": "Влад К.", "a": null}, {"r": 5, "t": "Рекомендую", "d": "25 августа 2022", "n": "Carlo G.", "a": null}, {"r": 1, "t": "Крахаборы, такую шарагу ещё надо найти. За информацию даже стараются содрать. Они думают,что клиенты не дружат с головой,но в век цивилизации,они рассчитались. Народ,не ходите туда,если вы себя чуток хотя бы уважаете.", "d": "23 августа 2022", "n": "Мурза М.", "a": null}, {"r": 1, "t": "Место Дырявое ! За свое дело не могут отвечать !", "d": "22 августа 2022", "n": "Батыр А.", "a": null}, {"r": 1, "t": "Диспетчер отвратительная! Вечно недовольное хамло!", "d": "12 августа 2022", "n": "Анастасия В.", "a": null}, {"r": 3, "t": "Пользовался услугами промывка форсунок и чистка дроссельной заслонки. Очень удивило что в чистку дроссельной заслонки не входит жидкость для чистки. Мастер сказал купить его у них в магазине. Использовал мастер процентов 5-10 от объёма баллона. И таких полных баллонов у него столе очень много. Вопрос, почему в стоимость услуги не входит эта жидкость для чистки? Судя по всему таким образом увеличивают продажи в магазине. Администрацию автосервиса прошу дать обратную связь по этой ситуации. В общем и целом работой доволен, но навязывание покупок оставляет не приятный осадок.", "d": "8 августа 2022", "n": "Фёдор М.", "a": null}, {"r": 5, "t": "Сделали быстро", "d": "5 августа 2022", "n": "Олег Д.", "a": null}, {"r": 1, "t": "Сегодня решил заехать сюда, вместо магнит автомойки, было по пути. Помыли машину на по@уй еще и дороже чем там. Ужасная мойка, больше не заеду", "d": "4 августа 2022", "n": "مجرد م.", "a": null}, {"r": 5, "t": "Сегодня мыли авто, все отлично", "d": "17 июля 2022", "n": "Сергей М.", "a": null}, {"r": 3, "t": "Загнала машину с одной проблемой…. В итоге методом тыка поменяли мне 2 детали которые стоят 10000. Посмотрим как починят", "d": "16 июля 2022", "n": "Снежанна А.", "a": null}, {"r": 1, "t": "Сегодня отдавали автомобиль на комплексную мойку. Помыли плохо, под детскими креслами вообще не помыли (автокресла были отстегнуты). Дверь багажника с внутренней стороны вообще не мыли. Когда мойщиеу показывала на грязные места, постоянно огрызался и хамил. В общем не рекомендую здесь мыть авто. Ужас. Никакой компетентности и тем более клиентоориентированности!", "d": "16 июля 2022", "n": "Ирина К.", "a": null}, {"r": 5, "t": "Делал 07.07.22 развал-схождения на микроавтобусе, порекомендовали мастера Сергея. \nПо работе без нареканий все доходчиво объяснил, выполнил регулировку и выдал отчёт на бумаге со всеми параметрами до и после регулировки. Был первый раз в этой СТО по рекомендации. Диспетчер вежливая, все быстро оформили. \nЗаодно на мойку заскочил, очереди небыло. Экспресс с пеной без протирки 700р.", "d": "8 июля 2022", "n": "Антон А.", "a": null}, {"r": 5, "t": "Отличный мастер по развалу/схождению Сергей. Все грамотно и подробно о возможных проблемах рассказал. И отрегулировал наклон стоек, в других местах где был даже не делали этого хотя было отклонение.", "d": "2 июля 2022", "n": "Вячеслав А.", "a": null}, {"r": 1, "t": "Поставил машину на мойку, сидим ждём в комнате ожидания, смотрим телевизор, до закрытия 14 минут, заходит диспетчер выключает телевизор, и говорит мы закрываемся -подождите снаружи (только что на... й не послали) \nЕсли бы мыли за бесплатно я бы понял, но за деньги. \nК мойке вопросов нет, ребята молодцы, но диспетчера менять нужно.", "d": "22 июня 2022", "n": "Евгений Б.", "a": null}, {"r": 1, "t": "За работу девушки на приёмке. Приехал, попросил заменить жидкости и на диагностику. Жидкости заменил один мастер, спросил про диагностику, он сказал что не делает, надо к другому мастеру. Подошли вместе и уже мастер сказал приемщице, что машине нужна диагностика, на что девушка ответила, хорошо, но перед вами ещё одна машина. Я -ОК, пока выезжаю, жду? Девушка -да. Проходит минут 30, подхожу узнать у неё что там с моей очередью, на что она отвечает - а вы же не записаны на диагностику... Уехал в итоге, не стал даже на другое время записываться", "d": "19 июня 2022", "n": "Сергей А.", "a": null}, {"r": 1, "t": "Цены космические! Замена гидрокомпенсаторов с маслом на лансер 9 20.000👎", "d": "15 июня 2022", "n": "Иван Г.", "a": null}, {"r": 5, "t": "Заезжал на развал-схождение и как всегда убедился что это самый лучший сервис в городе в котором работают профессионалы! Всем советую!", "d": "13 июня 2022", "n": "Тимофей Ю.", "a": null}, {"r": 3, "t": "Масло тут меняю. Вроде норм. Электрики правда такие себе, в ютуб залипают, спрашиваю, компрессор глянете, перестал вкл, нет, говорят и дальше ютуб смотрят 😁", "d": "12 июня 2022", "n": "Sr S.", "a": null}, {"r": 1, "t": "Поменял масло, масло перелил, выше уровня! Я говорю вроде 5.5, он если не знает должен был проверить! Капот закрыл слесарь не хлапком а сверху надовив рукой! Взяли денег за съем защиты ДВС, в итоге не сняли а сорвали задние болты!\nВ итоге очень не доволен заменой бесплатной масла ДВС!", "d": "12 июня 2022", "n": "Фарит Г.", "a": null}, {"r": 5, "t": "Диагностика по записи. Быстро качественно и не дорого.", "d": "12 июня 2022", "n": "Дмитрий А.", "a": null}, {"r": 5, "t": "Очень ответственный персонал, сколько раз приезжал к них с различными проблемами, всегда находили причину и все устраняли) Мне нравится данная компания. Отдельное Спасибо слесарям. Красавцы. Рекомендую!!!", "d": "1 июня 2022", "n": "Дмитрий Ш.", "a": null}, {"r": 5, "t": "Ремонтом всегда доволен, специалисты не подводят. Человеческое отношение без завышения цен и скрытых операций с авто.", "d": "30 мая 2022", "n": "Олег С.", "a": null}, {"r": 5, "t": "Заезжал на прошивку после удаления катализатора к Евгению, результатом очень доволен, машину теперь не узнать, просто валит", "d": "21 мая 2022", "n": "Alladin K.", "a": null}, {"r": 5, "t": "Заезжаю в Маяк на развал к Сергею, отличный специалист и грамотный человек. Мойка там тоже достойная и не дорогая. Успехов и процветания вам.", "d": "20 мая 2022", "n": "Павел И.", "a": null}, {"r": 1, "t": "Плохо сделали схождение Рул кривой стоит", "d": "20 мая 2022", "n": "ЛАДА V.", "a": null}, {"r": 5, "t": "Был на мойке как-то раз, помыли хорошо, качественно, быстро. По времени приняли четко, правда кена показалась высоковата, но это уже лично мое мнение.", "d": "16 мая 2022", "n": "themxnikita", "a": null}, {"r": 2, "t": "За слесарей поставил бы 5, обслуживание на ресепшене отвратное. Вечно недовольная мадам, занятая до нельзя (хотя бесконечно бегает курить). Трубку не берут, дозвонится, определиттся по времени не возможно", "d": "15 мая 2022", "n": "Jack D.", "a": null}, {"r": 5, "t": "Масло поменяно - 10% за мастера спорта ,👍", "d": "15 мая 2022", "n": "Алекс Ф.", "a": null}, {"r": 1, "t": "Диспетчера нужно менять! \nПриехал в СТО на замену подшипников ступицы и замену масла ДВС. В итоге после замены подшипников, ещё ждал очередь на замену масла! Диспетчер работу не организовывает.", "d": "15 мая 2022", "n": "alev666", "a": null}, {"r": 1, "t": "Ужас бляяя \nБольше в жизни не приеду в эту контору", "d": "4 мая 2022", "n": "KENT", "a": null}, {"r": 1, "t": "Срабатывает вентилятор каждые 3 минуты.., на морозе.. \"ДИАГНОСТ\" УВЕРЯЛ ЧТО ТАК И ДОЛЖНО БЫТЬ... Не рекомендую туда ездить", "d": "10 апреля 2022", "n": "Александр М.", "a": null}, {"r": 1, "t": "Полное дно, от клиентоориентированности до качества оказания услуг.", "d": "29 марта 2022", "n": "Максим F.", "a": null}, {"r": 1, "t": "Маяк авто обычное не сертифицированное СТО.", "d": "18 марта 2022", "n": "Жека М.", "a": null}, {"r": 1, "t": "Дилетанты! Заехал на lexus rx300 поменять ГРМ! В итоге попал на двигатель. Я бы всем советовал обходить стороной это место!", "d": "15 марта 2022", "n": "Дмитрий И.", "a": null}, {"r": 1, "t": "Отказались обслуживать.по причине якобы низкий автомобиль", "d": "24 февраля 2022", "n": "Павел П.", "a": null}, {"r": 1, "t": "Диагностик вообще не понятный человек.", "d": "23 февраля 2022", "n": "Мухтар С.", "a": null}, {"r": 1, "t": "Самое конченое Сто в Сургуте приезжаешь делать но они тебя и слушать не хотят начинают искать какие то другие неисправности потом в конце надо то поменять это поменять хотя это я все менял недавно !!!! Аферисты одним словом избегайте это СТО В КОВЫЧКАХ 10 ОЙ ДОРОГОЙ НЕ КОМУ НЕ СОВЕТУЮ!!!!!!!!", "d": "4 февраля 2022", "n": "Анзор Б.", "a": null}, {"r": 1, "t": "Не рекомендую, зря потраченное время и деньги на бесполезную диагностику.", "d": "29 января 2022", "n": "Farukh U.", "a": null}, {"r": 2, "t": "Мойка не качественная\nВсё в разводах, в салоне вообще не загораживаются как мыть", "d": "25 января 2022", "n": "Валерия С.", "a": null}, {"r": 1, "t": "По телефону цена одна,а по факту другая.Не кому не советую эту контору.", "d": "23 января 2022", "n": "Глеб К.", "a": null}, {"r": 1, "t": "Вообщем плавали обороты, менял датчики ничего не помогало, приехав в данное сто сказали надо сделать диагностику, вердикт плата на эбу отгорела, надо менять, купил эбу ничего не поменялось, случайным образом ещё раз поменял датчик на дросселе и все прошло(просто попался бракованный датчик) печально что не смогли этого определить, и сейчас у меня 1 эбу лежит пылится", "d": "23 января 2022", "n": "Coddy W.", "a": null}, {"r": 1, "t": "Шарага та еще. Как дорогой ремонт, готовы жопу вылизать а как какая то мелочь то все мастера у них на год вперед заняты…", "d": "22 января 2022", "n": "Джейхун А.", "a": null}, {"r": 1, "t": "Сто дно персонал дно", "d": "14 января 2022", "n": "Роберт Б.", "a": null}, {"r": 5, "t": "Очень хорошее место для ремонта, вкусный буфет, хорошая мойка!", "d": "25 декабря 2021", "n": "Руся К.", "a": null}, {"r": 5, "t": "Спасибо огромное стенду 11 и стенду 12 , делал ходовую запчасти брал у них. Сегодня в была неисправность начали плавать обороты ездить было невозможно. Заехал в 12:00 сделали диагностику и сразу же устранили проблему. С сервиса выпал в 12:30! Большое человеческое спасибо!!!!!!", "d": "19 декабря 2021", "n": "Ера", "a": null}, {"r": 2, "t": "Были проблемы с ручным тормозом, в ходе диагностики в данном сто рекомендовали заменить трос ручного тормоза. Без проблем, трос куплен( 5к), работы проводились здесь же. В ходе замены троса выяснилось что проблема не в троссе, а в одном из суппортов. На вопрос работника, что за гении сказал мне менять тросс, ответил что гении работает в соседнем боксе. 😄", "d": "11 декабря 2021", "n": "di f.", "a": null}, {"r": 2, "t": "Решил поменять задние сайлентблоки передних рычагов на автомобиле, позвонил сказали стоимость от 1200 а окончательную определяет мастер при осмотре , взял запчасти приехал на осмотр , проверили QR код сказали позовут , минут через пять мастер махнул заезжай заехал объяснил ситуацию мастеру он объявил 1500 за каждый и тут рядом к подъёмнику подъезжает автомобиль из которого выходит мужчина и мастер у него спрашивает сколько стоит замена сайлентблока тот ответил сразу 1750 , на что я мастеру сказал что это дорого он пытался с начальством цену обсудить но видимо снижать никто не хотел и я уехал . И вот в чём пертензия , разве нельзя было сразу избежать всей этой цепочки чтобы назвать точную цену , я потратил время чтобы выяснить окончательную цену хотя я так понял у них любой сайлентблок стоит 1750 зачем же тогда говорить по телефону от 1200? На будующее отбили всякую охоту даже звонить им.", "d": "4 декабря 2021", "n": "Вячеслав П.", "a": null}, {"r": 1, "t": "Отвратительное отношение к клиентам! Набрали лентяев, которые вообще работать не хотят! Приехала в 18.45 сделать компьютерную диагностику (дело 3 минут: подключить компьютер и посмотреть ошибку). Сначала 5 минут ждала диспетчера, которой не было на месте. Когда она подошла, выяснилось, что на таком огромном сервисе только 1 человек умеет делать диагностику.. Так и тот тупо НЕ ЗАХОТЕЛ, хотя был свободен (ни одной машины не было в сервисе)! Начал отмазываться и вешать лапшу на уши, что \"на такую машину делать диагностику очень доооолго.. Я только подключаться буду полчаса\".. Предложил оставить машину - аж НА 2 ДНЯ! \"послезавтра наверно посмотрю\".. Либо он такой \"хороший специалист\", либо лентяй - и то, и то - днище полное! Первый раз заезжала и последний! Никому не советую сюда обращаться!! \n*После этого, кстати, позвонила в соседний сервис (АвтоТехпомощь86) - так мастер САМ приехал ко мне, всё за 5 минут продиагностировал, нашёл неисправность! Т.к. Магазины уже были закрыты - утром ещё и привез запчасти (новую катушку) и за 10 минут всё починил!\nВот это я понимаю - отличный специалист! Не то что здесь!", "d": "2 декабря 2021", "n": "Евгения Г.", "a": null}, {"r": 1, "t": "Приехал на замену помпы\nМетки на грм выстовели неправильно Машина чувствовала себя отвратительно \nНа следующий день приехал с просьбой исправить сделали ещё хуже и начали скидывать на то что это что то другое \nПоехал к другому мастеру он выставил метки и проблема исчезла \nНа фото выставлено вмт и как видим на два зуба смещен ремень грм", "d": "1 декабря 2021", "n": "Рафик Е.", "a": null}, {"r": 5, "t": "Через раз заводилась машина. Завёз в сервис, автоэлектрик Александр, быстро выявил проблему. Быстро все наладил, теперь езжу и радуюсь. Спасибо Александру и тому кто снимал и устанавливал стартер", "d": "30 ноября 2021", "n": "Василий Р.", "a": null}, {"r": 2, "t": "заезжал провести осмотр подтека антифриза из системы, незнал что можно просто глазами посмотреть и сказать думаю здесь течет, епа мать а вдруг он в движок уходит,даже незнают что для эфективного осмотра создают давление определенное для выявления... ,осмотр 490р,не жалко, то что хоть я своими глазами посмотрел и сделал выводы для себя,незнаю парни, не говорю что все....,но учите физику что с жидкостью что с шлангами и резинками происходит на горячую(расширяется), на холодную(уменьшаются), т, е, вывод от сюда сами понимаете. если антифриз течет я и сам его увижу!!!", "d": "24 ноября 2021", "n": "пирали т.", "a": null}, {"r": 5, "t": "Езжу только к ним. Очень удобно территориально. Парковка всегда свободна. Широкая. Заезд в боксы то же. Сколько раз там была только приятные очень мастера. Всегда помогут и заехать и контролируют. Помогают. За это отдельное спасибо. Очень приветливые. \nНарод пишет и про отсутствие терминала. Не правда. Всегда платила им, проблем не было с этим. Про очереди, то же. Вот честное слово, всегда без записи приезжала(правда дневное время) и всегда больше 15 минут не ждала. \nУдачи вам процветания. \nОсобая благодарность мужчине в их же авто магазине. Супер отзывчивый! Всегда поможет. От и до всё рассказал и посоветовал. Спасибо Вам большое и всего хорошего.", "d": "23 ноября 2021", "n": "Екатерина С.", "a": null}, {"r": 5, "t": "Работают быстро и качественно.Цены нормальные а не как у официалов", "d": "21 ноября 2021", "n": "Эдуард Г.", "a": null}, {"r": 1, "t": "Без QR кода не ремонтируют, даже если он у меня будет больше к ним не приеду", "d": "18 ноября 2021", "n": "Эдуард С.", "a": null}, {"r": 1, "t": "Не советую не кому данное сто, ужасный персонал", "d": "14 ноября 2021", "n": "Иван И.", "a": null}, {"r": 5, "t": "Отзывчивый и приятный персонал. РЕБЯТА ПРОФЕССИОНАЛЫ СВОЕГО ДЕЛА", "d": "10 ноября 2021", "n": "Юлия С.", "a": null}, {"r": 1, "t": "По факту ничего не делают, бегаешь по всему сто сам, проще ехать на антисервис", "d": "10 ноября 2021", "n": "Руслан М.", "a": null}, {"r": 1, "t": "Сто полный отстой, забегаловка полные, обслуживающий персонал не соответствуют своим должностным обязоностя, хомят, грубят.\nНИКОМУ НЕ СОВЕТУЮ!!!!!", "d": "10 ноября 2021", "n": "Александр Н.", "a": null}, {"r": 1, "t": "Самое неадектное сто, у мастеров руки из жопы не закрутили колесо так что оно болталось хорошо обратил внимания на шум так ещё и настроили фары что я ехал и слепил встречный транспорт", "d": "9 ноября 2021", "n": "Виктор П.", "a": null}, {"r": 1, "t": "Ужасное СТО. Вообще никому не советую. Даже звезду 1 тяжело ставить. Это подобие забавы сервиса.", "d": "9 ноября 2021", "n": "Nv N.", "a": null}, {"r": 1, "t": "Заехали на развал схождения сказали что рулевая рейка наебнута не делаем ,хорошо там же сразу на осмотр заехали всё на отлично было между прочем у нас две машины были утром заехали на первой машине сделали а вечером на второй машине заехали говорить мастер что у тебя посажена не делаем а что мастер под настроением работает после все этого как хороший отзыв написать 👎👎👎👎👎👎 не рекомендую развал!", "d": "7 ноября 2021", "n": "Huseyn", "a": null}, {"r": 1, "t": "КАТЕГОРИЧЕСКИ НЕТ!!!\nНЕ РЕКОМЕНДУЮ!!!\nСервис ужасный! Если вы ходите «убить» свой автомобиль, то вам сюда !!!\nЗа немалые деньги Вам не то чтобы ничего не сделают, а ещё и добавят проблем с вашим железным другом !\nИменно так у меня и произошло !\nРазговор с руководителем о проблеме тоже ничего не дал, он и слушать меня не посчитал нужным !\nГлавная их цель «выкачать» с вас побольше денег!!! И все!\nА потом уже это ваши проблемы!!! \nПоэтому объезжайте это место!", "d": "30 октября 2021", "n": "Мила Б.", "a": null}, {"r": 2, "t": "Отвратительное СТО! Поменяли моторчик омывателя - вместе с моторчиком теперь и гудок до кучи не гудит, поменяли жгутик стеклоподьемника- стекло, как конек-горбунок опускается, помогать руками надо, чтобы закрыть! Не рекомендую никому!", "d": "15 октября 2021", "n": "Надежда П.", "a": null}, {"r": 1, "t": "Ужасный сервис очередь не определённая, скрываются от налоговой терминалы не работают, в течении года не разу не работал терминал на кассе, и в неделю 2 3 раза не работает терминал в автозапчастях, менял жидкость в гур с промывкой в итоге гур загудел отвратительный сервис, в налоговую сообщил об их нарушении. ДАЖЕ ВОАГУ НЕ ПОЖЕЛАЮ СЮДА ПРИЕЗЖАТЬ НА СВОИХ АВТО.", "d": "14 октября 2021", "n": "Сургутянин х.", "a": null}, {"r": 1, "t": "Сказали что в очереди 5 машин , простоял 2 часа , по факту заехало раза в три больше машин ! \nЕсли вы не считаете машины по записи то зачем дезинформировать своих клиентов !", "d": "18 сентября 2021", "n": "Серёга К.", "a": null}, {"r": 2, "t": "Трижды обращался на мира, шевроле нива 2018 г , и каждый раз возникали сложности.\n\nПервый: меняли оба сальника на полуоси (сальники приобретал в автотехнике), после замены один из сальников потёк, купил в маяке второй комплект, вынудили оплатить дважды работу за замену, со слов слесаря:-\"Директор сказал, т.к. сальник приобретался не у нас, то оплачивать должен дважды\".\n\nВторой: менял трансмиссионное масло во всех механизмах, после, при осмотре на яме, обнаружил течь масла с раздатки, сливная пробка была не затянута .\n\nТретий: менял сальник на полуоси и сальник переднего привода, осмотрели вместе со слесарем на подъёмнике машину, обговорили объём работ, просил поменять масло в коробке и в мосту (т.к. там менялись сальники) в итоге поменяли масло везде (+ 2 литра масла по 660 р за литр), правда некий Сергей Сергеевич в диспетчерской сделал скидку около 700 р, после моего повествования о случае с двойной оплатой замены сальника из второго случая.\n\nБудьте внимательны при обращении в этот сервис, фиксируйте через диспетчера объём работ который Вам необходим (чтобы не делали лишнего), мелкие расходники приобретайте у них, чтобы не платить дважды за их замену, по возможности проверяйте работу и сливные пробки после замены масла.", "d": "7 сентября 2021", "n": "Фёдор И.", "a": null}, {"r": 1, "t": "Позвонил, записался на замену стеклоподьемника на туарег I, по телефону электрик сказал от полутора до трёх тысяч, что нужно половинить дверь, я согласен, по факту приехал эта же услуга от 7000 рублей. Больше ни ногой сюда. Заехал за ними в сервис ресурс-авто, цена вопроса 3600.", "d": "4 сентября 2021", "n": "Константин К.", "a": null}, {"r": 1, "t": "Приехал откуда-то поменять масло, говорят со сегодня 19 и работает Везде написано в Интернете что 20 работает я рассчитывал на это теперь придется на завтра ещё приехать.....", "d": "1 сентября 2021", "n": "MEHRANGEZ E.", "a": null}, {"r": 5, "t": "Отличный сервис и хорошие мастера", "d": "9 августа 2021", "n": "Артём М.", "a": null}, {"r": 1, "t": "31.07 заезжал на замену пружин. В ходе работы снимали дворник,чтобы снять пластик. Пластик сломан. А дворник на место не вернули.", "d": "2 августа 2021", "n": "Marsel", "a": null}, {"r": 5, "t": "Все устраивает, не большие очереди, достойное техническое обслуживание, приветливый персонал.", "d": "16 июня 2021", "n": "Денис К.", "a": null}, {"r": 1, "t": "Простояли более 2 часов так и не заехали на ремонт!!!", "d": "30 мая 2021", "n": "Николай М.", "a": null}, {"r": 1, "t": "Неприемлемое обслуживание диспетчера девушки.\nПриезжал 29.05.21 по поводу замены дисков тормозных с колодками и гранаты наружные.", "d": "29 мая 2021", "n": "Владимир К.", "a": null}, {"r": 5, "t": "Много раз обслуживался со своей старой чушлайкой. Ни разу не сталкивался с тем, что пишут в отрицательных отзывах. Живую очередь можно ждать долго, поэтому либо по записи приезжаю, что и сдвигает живую очередь, либо оставляю ключи и описываю проблему. Все чинят без предоплаты, оплату делал по факту!", "d": "20 мая 2021", "n": "Руслан М.", "a": null}, {"r": 1, "t": "Меняли масло в феврале ,как нам сказали родное нужно заменить на shell так как родное сажевое ,оплатил промывку двиг ,замену масла ,фильтра через 2000 км масло выгорело и ниже минимума стало специалисты едрен батон второй раз заезжали и всегда геморрой после них", "d": "14 мая 2021", "n": "Валерий Т.", "a": null}, {"r": 1, "t": "Организация работ никакая, сам платишь, сам бегаешь, сам просишь", "d": "3 мая 2021", "n": "12701", "a": null}, {"r": 1, "t": "29 апреля 2021г.\nСургут, тюменская область. Ул. Мира 52\nПрождали 2 с лишним часа, по телефону нам посчитали работу в 8500 рублей несколько дней назад, а сегодня нам за эти же работы зарядили 19100 рублей. Разницу видите?\nНа кассе работала женщина по Фамилии Сидоренко, «спасибо» вам за испорченное настроение, и за обман, теперь мы будем всем советовать к вам в маяк авто Не ехать.\nСделаем антирекламу в Инстаграме, и тик токе, и всеми усилиями добьёмся чтобы вы там не работали, Зажрались!\nРазговаривать Не умеете с клиентами, язвите, \nНе советуем посещать это сервис 👎👎👎 \nКуда начальство смотрит?????", "d": "29 апреля 2021", "n": "Veniamin V.", "a": null}, {"r": 3, "t": "30 декабря работник на развал/схождении начал что-то придумывать на ходу про пневмоподвеску и аргументировать этим невозможность правильно выставить Показания. \nПо медлительности движений я понял, что очень ему не хочется пачкаться под авто. \nЯ уехал. \nНа другом СТО выставили. \n\nПроведите курс повышения квалификации для «развальщика».", "d": "27 апреля 2021", "n": "• А.", "a": null}, {"r": 1, "t": "Мойка гавно, за такие деньги лучше поехать на другую мойку", "d": "23 апреля 2021", "n": "Азат И.", "a": null}, {"r": 1, "t": "Худший сервис что работу свою совсем не знают, постоянно косяки, элементарно фильтр ставят не той стороной, и машина потом потеет, чинят одно ломают другое чтоб снова к ним приехали, позовчера порвался ремень генератора, приехала на замену поменяли ролики ремень, заодно помпу и ремень с роликами на двигателе и что в итоге? А то что два дня стоит стук и свист за километр и обратившись к другим специалистам оказывается они ролики не той стороной поставили и они разбивают что-то там ( я особо не понимаю что) , и плотно затянули детали, и за эту работу они взяли 5600₽!!! Без стоимости запчастей, буду писать жалобу на них, надоело !", "d": "22 апреля 2021", "n": "Оля З.", "a": null}, {"r": 5, "t": "Добрый день. Производил ремонт своего коня (Хайлендер 2012 года).Замена свечей,промывка впускного коллектора,дроссельной заслонки,замена воздушного фильтра ... Всё сделано на высоком профессиональном уровне,отдельное спасибо Владимиру который выполнял данные работы и спецам по замене масла.Однозначно рекомендую)))))", "d": "22 марта 2021", "n": "Александр С.", "a": null}, {"r": 2, "t": "Сделали диагностику, сказали на тнвд проблема, в итоге, проблема совсем в другом 15 тыс на ветер. Серьёзные вещи нужно не там ремонтировать уж точно", "d": "17 марта 2021", "n": "Максим М.", "a": null}, {"r": 5, "t": "Хотелось бы отметить человека ,которые меняет масло ,очень грамотный ,всё объяснил ,сделал ,как я попросил ,понравилось теперь на замену жидкостей только сюда 👍", "d": "16 марта 2021", "n": "Илья Ф.", "a": null}, {"r": 5, "t": "Большое спасибо Вашим сотрудникам мастерам с 10-11 подъёмникам Александру и Сергею, мастеру по промывке радиаторов и автоэлектрику Сергею отдельное за его терпение! Специалисты своего дела, производят ремонт ответственно качественно и в срок! Не отмахиваются от клиентов все объясняют и ничего лишнего не навязывают! Произвели у них осмотр трёх машин, и ремонт двух!", "d": "14 марта 2021", "n": "Алена Б.", "a": null}, {"r": 2, "t": "В общем знакомство с СТО \"Маяк-Авто\" началось еще в 2016 году, как итог я обслуживался на данном сто почти 5 лет. На разных машинах (ВАЗ 2107, toyota ED, Exiv, Мазда 3) с различными вопросами, кроме автоэлектрика (это я сам сделать могу в 90% случаев). В основном на Технологической. И вот уже почти год, как езжу на Мира 52. Все было в общем-то хорошо всегда, и претензий к качеству нет. Спасибо всем мастерам за Ваш труд. Прям от души спасибо. Я всем рекомендовал это СТО и всегда заступался... \nНО \nВсе поменялось 18.02.2021. У меня на данный момент готовы документы для отправки досудебной претензии, и даже готов юрист заняться вопросом, стоит только сообщить о готовности запустить машину по возмещению ущерба. Но руководствуясь ст. 1095, 1096, 1097 ГК РФ, ст. 15 ЗоПП, суммы, которые получится взыскать, ну в среднем за полгода, может год - в районе 15-20 тысяч рублей (сам ущерб + маоралка), плюс 30-40т за услуги представителя и на усмотрение суда штраф в размере 50% от присужденной суммы (ст. 13 ЗоПП). На стадии претензии эта сумма конечно будет в разы меньше, всего в районе 5-7т.р., но это в добровольном порядке в котором устно уже было получено отрицательное решение. \n\nВ чем суть? 17.02.2021 вечером была произведена замена патрубков термостата и котла подогрева врезаного в печку. Патрубок с обратки печки на котел был заломан так, что циркуляция была плохой. 18.02.2021 антифриз вытек с утра. Машина на эвакуаторе уехала на это же самое СТО. Где сообщили, что причиной всему не некачественная работа, а патрубок китайский. И более того, директор обвинил в том, что я нарушил конструкцию ТС тем, что купил не оригинальный патрубок, а аналог! Я был конечно максимально развеселен этой информацией, не смотря на всю печаль ситуации. НО патрубок вернули на место по моему настоянию, так как он не имел никаких повреждений. Выдавило кстати с соединения термостата. И о чудо, этот негодяй патрубок выполняет функции без проблем. Так все еще виноват патрубок?! Возмещать ущерб отказались, сказали, что я сам виноват во всем. Была попытка благотворительности от слесаря, мол нашей вины нет, но х. с тобой, выезжай так, бесплатно сделаю тебе. В благотворительности я не нуждаюсь, если вина не признана СТО, то и оплата должна быть произведена. Мало ли, уеду, а на меня в полицию заявят?! Оплатил. \nПосле данной ситуации от безысходности воспользовался только еще один раз данным сервисом, для замены сгоревшего котла подогрева... Как понятно из выше сказанного, влетел я на покупку котла (3404 руб), эвакуатор (2500), работа по замене патрубка термостата (750), замена патрубка котла (500), антифриз (670), замена котла (500). \n\nСо всеми случаются разные ситуации, нужно их уметь принимать и признавать. Но это, как оказалось не в правилах СТО \"Маяк-Авто\". \nА потому, придется искать новое СТО для обслуживания и ремонта ТС.", "d": "23 февраля 2021", "n": "Александр", "a": null}, {"r": 1, "t": "Никогда не меняйте масло в АКПП в этом СТО. О том что уровень масла надо проверять при определённой температуре масла они вообще не знают. Как мне сказали сколько слили столько и залили. Это колхоз а не сервис. Даже на щупе указано при какой температуре проверять масло но им на это наплевать.", "d": "8 февраля 2021", "n": "Николай Ю.", "a": null}, {"r": 1, "t": "По живой очереди можно даже не дожидаться. Второй в очереди, а по факту заедешь десятый. И это без учета тех, кто на замену ГСМ. Весь день потерян в очереди. И это в любом филиале.", "d": "6 февраля 2021", "n": "Евгений С.", "a": null}, {"r": 5, "t": "Очень доволен работой, притащил машину \"просто мертвую\" на веревке. Притащил в воскресенье, машину оставили на понедельник, как и оговаривали этот момент с деспечером. Деспетчер вежлево общалась, выслушала проблему, машину приняла быстро. В понедельник около 10 часов дня машина уже была на ходу и не дорого. Встретился с мастером, он все четко по полочкам разложил и рассказал, что было с авто. Очень доволен работой, заслужили свои 5 звездочек. Жаль имена деспетчера и мастера не спросил. Буду пользоваться услугами Маяка на Мира 52.", "d": "1 февраля 2021", "n": "Леонид Ф.", "a": null}, {"r": 5, "t": "Обращался несколько раз, в принципе все понравилось, претензий к ремонту нет, делают быстро", "d": "17 января 2021", "n": "Кирилл В.", "a": null}, {"r": 1, "t": "Диспетчер записывает в очередь, а потом забывает загнать машину. Приходится напоминать ругаться через час полтора. Надо возле диспетчера стоять напоминать . И всегда своих знакомых сначала без очереди, потом клиентов .", "d": "7 января 2021", "n": "Расул А.", "a": null}, {"r": 2, "t": "Это СТО как конфета , обертка хорошая, а начинка протухла .Очередь не соблюдается , сам слышал как мастер говорил , чтоб пропустили его знакомого! Отсутствует запись , что очень напрягает. Мойка на 2-! Ощущение от персонала , что руководитель в отпуске или просто не читает отзывы .", "d": "3 января 2021", "n": "Chamet R.", "a": null}, {"r": 5, "t": "Хороший сервис! Ни раз выручали !", "d": "3 января 2021", "n": "Dmitrij T.", "a": null}, {"r": 1, "t": "Встал в очередь на автомойку, передо мной было 4 машины. Простоял 4 часа.", "d": "14 ноября 2020", "n": "Дмитрий С.", "a": null}, {"r": 5, "t": "Много тут плохих отзывов, а я не согласен с ними, друг менял масло и попался хороший мужик всё грамотно объяснил, и не навязывал ничего лишнего. Я заменил антифриз, и уже другой мастер менял, я не пожалел, быстро, качественно и без обмана и прочей лапши. СТО большое и чистое, думаю буду ездить туда теперь.", "d": "7 ноября 2020", "n": "Hools H.", "a": null}, {"r": 1, "t": "Ужасное обслуживание. Нет порядка в записи, мастера хамят, работать не хотят, администратор безобразно работает. Приезжала 29.10. В этот день автоэлектрик работал и админ, уволила бы", "d": "29 октября 2020", "n": "Алексий Ч.", "a": null}, {"r": 5, "t": "Не знаю как в остальном, но в этом сервисе на Мира пару недель назад меня буквально спасли - приняли без очереди и быстро отремонтировали мне пробитое колесо! Вежливое обслуживание, чистое и просторное помещение ремонтной зоны! Рекомендую!", "d": "28 октября 2020", "n": "Евгений П.", "a": null}, {"r": 5, "t": "отличное СТО, постоянно меняю масло в двигателе и другие тех.жидкости, респект Денчику. особая благодарность Назарову Евгению - профессиональный сотрудник, заменил датчик давления масла, справился с ,,секреткой,, на колесе при замене задних колодок. Григорию Владиславовичу огромная благодарность за дружный и отзывчивый колектив. процветания, стабильности и много благодарных клиентов！", "d": "12 октября 2020", "n": "Роман П.", "a": null}, {"r": 1, "t": "Заехал на геометрию колес ,, !!!отстой!!!", "d": "4 октября 2020", "n": "Алексей С.", "a": null}, {"r": 2, "t": "Здравствуйте! Мы сегодня мыли машину в вашем заведении , это кошмар как долго ( салон и кузов ) около 2 часов !!! При чем было куча молодежи , один трёт стоит другие бесятся , мешают ... не удивительно , что и очереди вообще не было... решите вопрос ...", "d": "20 сентября 2020", "n": "Юлия Ж.", "a": null}, {"r": 4, "t": "Весь день звоню трубку не берут! Сервис сам не плохой,езжу на советском автопроме,проблем с ремонтом пока не было у них! Только ждать долго! Толком не записаться по телефону!", "d": "8 сентября 2020", "n": "Anton K.", "a": null}, {"r": 1, "t": "В 19:30 СТО уже не работает и не принимает людей.", "d": "20 августа 2020", "n": "Юра Ч.", "a": null}, {"r": 3, "t": "Плохой сервис, интересует только выгодная работа, а на мелочи, которые образуют цельную картину не обращают внимания", "d": "20 августа 2020", "n": "Евген Н.", "a": null}, {"r": 5, "t": "Очень понравилось. Попросил сделать диагностику ходовой на приоре, + ещё некоторых отдельных элементов, все сделали за 500 рублей, персонал вежливый, подскажет, расскажет. Также плюсом будет наличие магазина, где цены не кусаются, для моей машины все было, а менял я многое) Вообщем рекомендую!!!", "d": "19 августа 2020", "n": "Костя И.", "a": null}, {"r": 2, "t": "Записалась на 14:00\nМашину пригнала в 13:30. Услуга занимет по времени 20-40 минут. Свободных мастеров нет. Ну ладно, оставила ключи, пришла забирать в 14:55.\nСделали?\nНет, до вас очередь не дошла... Вы вооон за той машиной!!!\nА как же запись?\nНу мастер не успевает... \nСпасибо огромное, за потраченное в пустую время, думаю это был мой последний визит  к вам", "d": "11 августа 2020", "n": "Татьяна Ш.", "a": null}, {"r": 1, "t": "Отворительно!!!!! СТО ничего не умеет и ничего не может в общество диагностики электрики. Ул Профсоюза. Конечно не всех.", "d": "7 августа 2020", "n": "Тохиржон Х.", "a": null}, {"r": 1, "t": "Фигня полная \nЭлементарно не могли диагностику сделать или прошивать машину\nТолку нет вообще туда ехать", "d": "4 августа 2020", "n": "Джими К.", "a": null}, {"r": 3, "t": "мыли машину долго, около 2х часов. \nизнутри стекла не протирали, в салоне пыль в некоторых местах даже не пытались убрать.", "d": "1 августа 2020", "n": "Ira L.", "a": null}, {"r": 5, "t": "Быстро недорого... в общем все чётко...отдельно благодарен Александру с 11 подъемника.... все ньюансы рассказал... красавчик капитальный....", "d": "30 июля 2020", "n": "Сергей В.", "a": null}, {"r": 1, "t": "Из за глупого деспечера простоял 5 часов так и не чего не сделав.", "d": "19 июля 2020", "n": "Михаил Б.", "a": null}, {"r": 1, "t": "Приехал заменить помпу,делов на 15 минут,подошёл записался в «очередь» время было 13-15,спросил сколько ждать,мне ответила диспетчер что перед вами 2 машины,минут 30,а пока пойдите и купите помпу, что бы все было быстрее.Пошел купил,сейчас время 16-10 а я все же жду,Прошло 3 часа,вернулся спрашиваю в чем дело,она недовольно мне отвечает если хотите что бы было быстрее надо заранее записываться,мы сначала обслуживаем запись.Уважаемое руководство,все понимаю,обстоятельства возможно такие и много работы.Но сидеть 3 часа?Вы серьезно?И смотреть как Работяги просто сидят курят на улице,не по одному а по два-три человека.Я не против Маяка,я уже 8 лет с Маяком,но с этого дня против и не ногой именно в маяк на мира.", "d": "24 июня 2020", "n": "Gennadiy S.", "a": null}, {"r": 1, "t": "Трубку не берут уебаны", "d": "6 июня 2020", "n": "Daniil D.", "a": null}, {"r": 1, "t": "Стоишь в очереди около 10 машин, а весь персоонал стоит на улице курит каждые 10 минут.", "d": "17 мая 2020", "n": "SCORP D.", "a": null}, {"r": 5, "t": "Делал развал, специалист толковый, так же после делал балансировку, этот же спец, что и на тазвале. Все подсказал и рассказал, хотя и сам все понимаю. Работа устроила на 5!", "d": "17 мая 2020", "n": "GAL G.", "a": null}, {"r": 2, "t": "Оценка не к сервисному блоку, а к агрессивно настроенной девушке в буфете. Забыл убрать пустую банку из под колы которую у них купил, вернувшись на следующий день в автосервис, мне на подходе сотрудники сообщили, что меня девушка из буфета очень негативно отреагировала на мое упущение, увидев меня она в очень грубой форме сообщила мне об этом. Не приятно, забыл-бывает, но я все-таки клиент и в подобном тоне не должны вестись диалоги.", "d": "7 марта 2020", "n": "Вадим З.", "a": null}, {"r": 1, "t": "Не заводится автомобиль, понял что по электрике. Позвонил диспетчеру описал проблему, ответ привозите посмотрим в порядке живой очереди к электрику. По приезду этот же диспетчер, посылает меня поговорить с электриком самому. Электрик по моему описанию выдает(даже не смотря авто), что это сто пудово сингналка. А ими он не занимается и смотреть не будет... машина стоит на входе на эвакуаторе. В результате увез в другое сто, оказалась причина в банальной неисправности реле стартера.", "d": "17 февраля 2020", "n": "Андрей Е.", "a": null}, {"r": 1, "t": "Очень обидно !!!! Первый раз вроде все нормально было второй раз подгонял машину, мастер сказал что надо менять (заменить) всё купил у них в магазин.... Потом когда приехал домой думал давай посмотрю как там ноги запчастей !!!! Смотрю ГЛАВНЫЙ ДЕРЖАТЕЛЬ ТОТ СТАРЫЙ СТОИТ И ТОЛЬКО ТАМ РОЛИКИ НОВЫЙ!!! НО ЭТО ВСЁ Я КОМПЛЕКТ НОВЫЙ КУПИЛ!!!\nТАК ЧТО БУДЬТЕ ВНИМАТЕЛЬНО КОГДА ЧТО ТО МЕНЯЕТЕ!!!", "d": "11 февраля 2020", "n": "Саид Б.", "a": null}, {"r": 5, "t": "Хорошие ребята соответствуют слову специалист", "d": "9 февраля 2020", "n": "Хасан У.", "a": null}, {"r": 2, "t": "Хотел сделать \"хороший\" шиномонтаж. Вианор до 19:00. Маяк работает до 20:00.\nПриехал в 19:37, администратор сказала что делать ничего не будут. В итоге пустое сто и 15 человек с телефонами. Можно гасить свет и писать что работаете до 19.30... 1,5ч потратил впустую.\nЗавтра из вредности поеду в другое место", "d": "16 января 2020", "n": "Ал", "a": null}, {"r": 5, "t": "У меня только положительные моменты на данном СТО. Цены ниже чем у других. Мастер Сергей Кравценюк (сейчас не работает на данном СТО) - отличный специалист, только к нему обращался. Вчера 11.01.2019 приехал с троением двигателя на диагностику! До этого был на другом СТО и мне приговорили двигатель на капитальный ремонт, не работали 2 и 3 цилиндры. Думаю дай заеду на Маяк все-таки. Отмечаю очень грамотную работу диагноста, предложил мне чаю, я сел на лавку, смотрю ковыряется, зовет меня через 30 минут... Иду как на расстрел.. Форсунка! Сразу иду в магазин покупаю форсунку, при мне меняют ее.. и о боги! Поломка устранена. Все кто хаит это СТО, ребят присмотритесь к другому мастеру, там есть толковые ребята.", "d": "12 января 2020", "n": "Вадим В.", "a": null}, {"r": 1, "t": "Начнём с магазина, продают китайскую подделку как оригинальную деталь за приличную цену. Приезжал с одной проблемой, уезжал все с этой же проблемой, приходилось по несколько раз приезжать, чтоб они исправляли свои косяки, очень часто. После ремонта появлялись новые проблемы, вставало все это в приличную копейку. Не советую маяк авто никому, обман на запчастях и на ремонте машины, все мои знакомые твердили, что там обманывают, не верил, теперь сам убедился в этом. Так что берегите и время и деньги и проезжайте это место стороной.", "d": "5 января 2020", "n": "Ринат М.", "a": null}, {"r": 1, "t": "Девушка менеджер хамка, не умеет информацию доносить", "d": "29 декабря 2019", "n": "Александр", "a": null}, {"r": 5, "t": "Все сделали отлично, быстро и качественно, цены приемлимые, обращаюсь не первый раз, рекомендую !", "d": "13 декабря 2019", "n": "Максим К.", "a": null}, {"r": 1, "t": "Если решили оставить все деньги в этом сто, и что бы повесили лапшу вам на уши, и сказать что все плохо с машиной то это в маяк, ради интереса поехал с проблемой что утекает антифриз, зная что бочок треснут, в итоге от мастера услышал все начиная с замены патрубков заканчивая помпой и термостатом, 10 их 10 шарашка эта", "d": "10 декабря 2019", "n": "Артем А.", "a": null}, {"r": 1, "t": "Удалили прошлый отзыв напишу ещё раз. Приезжал в сентябре на мойку и замену масла. Оставил Машину и попросил позвонить после всех работ. Через 4 часа перезвонили и пригласили за машиной. По приходу решил проверить лежит ли золотое кольцо в машине в пепельнице оказалось что нет. После того как позвали мойщика он замешкался нервничал вначале даже ходил. Но после позвал пройти с ним и вывалил с пылесоса все что он собрал там было куча мелочи и мое золотое кольцо. \nУважаемая администрация не нужно удалять Сообщения а нужно их отрабатывать и писать обратную связь. \nПосле этой ситуации к вам доверия нету. Но если Администрации возьмёт на свой контроль то доверие вернётся!!!", "d": "1 декабря 2019", "n": "Ильфар С.", "a": null}, {"r": 5, "t": "Езжу с открытия, очень нравится, быстро, качественно и не дорого!", "d": "30 ноября 2019", "n": "Саят К.", "a": null}, {"r": 5, "t": "Нормальное СТО, всё сделали хорошо", "d": "23 ноября 2019", "n": "Ruslan S.", "a": null}, {"r": 5, "t": "Быстро, надёжно, качественно, цены приемлемые для народа. Обращаюсь периодически, т.к. машинка уже старенькая иномарка.", "d": "22 ноября 2019", "n": "Андрей Б.", "a": null}, {"r": 5, "t": "Приехал, сделал печку, уехал. На все про все 40 минут и 1500 рублей. Считайте что одним постоянным клиентом у вас больше)", "d": "28 октября 2019", "n": "Александр У.", "a": null}, {"r": 1, "t": "Тупо час стоишь ждешь , пока помоют 1 машину ! По 10 раз мойщик прошёл по кругу. Зачем не ясно. Такое чувство что тупо тянет время. Короче на мойку очень не советую ехать", "d": "24 октября 2019", "n": "Антон Т.", "a": null}, {"r": 1, "t": "Отстоял в очереди из 2х машин на автомойка ровно полтора часа. За это время помыли 1 машину. Уехал.", "d": "21 октября 2019", "n": "Сергей Н.", "a": null}, {"r": 5, "t": "Как то пару месяцев назад заезжал на вашу мойку, не понравилось единственное, что работал один человек, но зато качественно все помыл, претензий нету 👌", "d": "18 октября 2019", "n": "Sega N.", "a": null}, {"r": 1, "t": "Очень не компетентные сотрудники почти 30/40 минут ждал в итоге сказали другому заезжай ,не понятно от куда заезд от куда выезд с мойки .", "d": "5 октября 2019", "n": "Руслан Х.", "a": null}, {"r": 5, "t": "Мастер Дмитрий сделал отличный и качественный ремонт на ВАЗ 2114 ходовой части большое спасибо за быструю и качественную работу", "d": "29 сентября 2019", "n": "Андрей З.", "a": null}, {"r": 1, "t": "Была русская машина, ездил постоянно на ремонт. Пересел на иностранное авто, что то боязно. Так масло поменять да колодки то можно заехать, цены как построили новое здание стали повыше, установка защиты 650₽", "d": "10 сентября 2019", "n": "Честный О.", "a": {"t": "Здравствуйте, спасибо за отзыв.Установка брони на автомобиль импортного производства 630 руб. Цены у нас не менялись с 2015 года.", "d": "10 сентября 2019"}}, {"r": 5, "t": "После почти года поисков остановили свой выбор на данном СТО, если заранее записываться на ремонт, то никаких проблем. Особенно большая благодарность Александру с 11 подъемника (рекомендую его всем знакомым) и Сергею автоэлектрику. Помимо прочего удобное месторасположения, хороший авто магазин и зона ожидания. Раз довелось помыть машину здесь же после ремонта и качеством мойки так же остались довольны, возможно это потому, что в тот день очереди на мойку особо то и не наблюдалось и мойщику спешить было не куда, но факт остается фактом, помыли машину и убрали салон автомобиля на совесть.", "d": "19 августа 2019", "n": "Варламов", "a": null}, {"r": 1, "t": "Менял прокладку клапанной крышки. Замена была со снятием впускного коллектора. После замены все было хорошо. Но когда я приехал домой поставил машину и через два часа сел и поехал загорелся чек, начали плавать обороты на холостых. Так как время было позднее приехал на следующий день мне сказали, что машина не новая и сломаться могла все что угодно оплачивайте компьютерную диагностику.", "d": "11 августа 2019", "n": "Ваня В.", "a": null}, {"r": 5, "t": "мыл машину у вас, все понравилось. спасибо", "d": "9 июля 2019", "n": "Каричев Р.", "a": null}, {"r": 5, "t": "Сегодня менял свечи и стойки стабилизатора, консервативные цены, опытный, общительный автослесарь Александр. Приняли перед закрытием, выполнил ремонт качественно! Так держать!\nПорядок и чистота на рабочем месте.\nИз минусов- заметил переполненный контейнер с металлоломом, демонтированные запчасти вот вот начнут вываливаться из контейнера слесарям на ноги, а это уже нарушение техники безопасности и охраны труда!", "d": "3 июля 2019", "n": "Алекс Т.", "a": null}, {"r": 2, "t": "Масло как текло, так и течет, вместо прокладки гбц сказали сальник, вместо стойки рулевые наконечники поменяли, как приехал, так и уехал)", "d": "1 июля 2019", "n": "Василий Г.", "a": {"t": "Здравствуйте, обратитесь в отдел качества по номеру 89224027222.Очень не понятен Ваш отзыв.", "d": "1 июля 2019"}}, {"r": 4, "t": "Очень понравилось обслуживание по замене масла - быстро , аккуратно ! Также хочу отметить Масалова Александра , человек знает свою работу, все подсказал , отремонтировал авто ! Спасибо большое!", "d": "1 июля 2019", "n": "Санечка А.", "a": null}, {"r": 5, "t": "Добрый день, Сегодня 31.05  Производилась замена масла и расходников в данном автосервисе, замена произошла в кратчайшие сроки, что приятно удивило, так как постоянный клиент на вашем сервисе и обычно это занимает около часа, особенно  Хочу выделить специалиста Дениса !!! Отличный специалист все подсказал рассказал как делается и в чем могут быть проблемы,Спасибо огромное!!!!", "d": "31 мая 2019", "n": "Ivan S.", "a": null}, {"r": 5, "t": "Купил масло, тут же заменил. Впечатления положительные. Чисто везде, магазин, зона ожидания, доброжелательный персонал", "d": "24 мая 2019", "n": "Алмаз А.", "a": null}, {"r": 5, "t": "Несколько раз обращалась, все устраивает, иногда конечно что-то то выходит дороже, чем у конкурентов за стеной, иногда дешевле но в целом здесь мне нравится больше. Мастера отзывчивые всегда, в ходе работ могут, что-то подсказать, один раз бонусом подтянули ручник. Главное тут работают честно и не раскручивают на ремонт того, что не ломалось)", "d": "6 мая 2019", "n": "Ирина Л.", "a": null}], "prices": null, "gis": "https://2gis.ru/surgut/firm/70000001036118749", "theme": {"c1": "#1d3557", "c1d": "#13243d", "c2": "#ffb703", "tint": "#eef2f8"}};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var T=D.theme; ['c1','c2','c1d','tint'].forEach(function(k){if(T[k])document.documentElement.style.setProperty('--'+k,T[k])});
var WA_SVG='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>';
function wa(t){return D.whatsapp?'https://wa.me/'+D.whatsapp+(t?'?text='+encodeURIComponent(t):''):null}
var tel=D.phones.length?'tel:'+D.phones[0].value:null;
var route='https://yandex.ru/maps/?rtext=~'+D.point.lat+','+D.point.lon+'&rtt=auto';

/* шапка */
$('mk').textContent=D.name.charAt(0).toUpperCase();
$('hName').textContent=D.name; $('hExt').textContent=D.ext||D.rubrics[0]||'';
var navItems=[['#prices',D.prices?'Цены':'Услуги'],['#info','Режим работы'],['#reviews','Отзывы'],['#contacts','Контакты']];
$('nav').innerHTML=navItems.map(function(n){return '<a href="'+n[0]+'">'+n[1]+'</a>'}).join('');

/* открыто сейчас (время Сургута) */
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], RU=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
var parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Yekaterinburg',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
var g=function(t){return (parts.find(function(p){return p.type===t})||{}).value};
var today=DAYS.indexOf(g('weekday')), now=(g('hour')==='24'?'00':g('hour'))+':'+g('minute');
function openNow(){
 if(D.schedule.is24)return [true,'круглосуточно'];
 var di=today, sh=D.schedule.days[DAYS[di]]||[];
 for(var i=0;i<sh.length;i++){var f=sh[i][0],t=sh[i][1];
  if(t<=f){ if(now>=f)return [true,'до '+t]; } else if(now>=f&&now<t)return [true,'до '+t]; }
 var prev=D.schedule.days[DAYS[(di+6)%7]]||[];
 for(i=0;i<prev.length;i++){if(prev[i][1]<=prev[i][0]&&now<prev[i][1])return [true,'до '+prev[i][1]]}
 for(i=0;i<sh.length;i++){if(now<sh[i][0])return [false,'откроется в '+sh[i][0]]}
 return [false,''];
}
var on=openNow();
if(tel){$('hdCall').href=tel;$('hdCall').innerHTML=esc(D.phones[0].text)+'<small><b'+(on[0]?'':' class="cl"')+'>'+(on[0]?'Открыто':'Закрыто')+'</b> '+esc(on[1])+'</small>'}else $('hdCall').classList.add('hidden');

/* первый экран */
var stars=function(n){var s='';for(var i=1;i<=5;i++)s+=i<=Math.round(n)?'★':'<i>★</i>';return s};
$('rTag').innerHTML=D.rating?'<span class="st">★</span> '+String(D.rating).replace('.',',')+' · '+D.ratingCount+' оценок в 2ГИС':'2ГИС';
$('ext').textContent=D.ext||''; $('h1').textContent=D.name;
$('rub').innerHTML=D.rubrics.slice(0,6).map(function(r){return '<span>'+esc(r)+'</span>'}).join('');
var hb=[]; if(tel)hb.push('<a class="btn btn-main" href="'+tel+'">Позвонить</a>');
if(D.whatsapp)hb.push('<a class="btn btn-line" href="'+wa('Здравствуйте! Пишу с сайта.')+'" target="_blank" rel="noopener">Написать в WhatsApp</a>');
hb.push('<a class="btn btn-line" href="'+route+'" target="_blank" rel="noopener">Маршрут</a>');
$('heroBtns').innerHTML=hb.join('');
function hoursShort(){if(D.schedule.is24)return 'Круглосуточно';var a=DAYS.map(function(d){var h=D.schedule.days[d];return h&&h.length?h.map(function(x){return x[0]+'–'+x[1]}).join(', '):'выходной'});
 if(a.every(function(x){return x===a[0]}))return 'Ежедневно '+a[0]; return 'Сегодня: '+a[today]}
$('heroCard').innerHTML=
 '<div class="hc-row"><span class="ic">📍</span><div><small>Адрес</small>'+esc(D.city+', '+D.address)+(D.addressComment?'<small>'+esc(D.addressComment)+'</small>':'')+'</div></div>'+
 '<div class="hc-row"><span class="ic">🕘</span><div><small>Режим работы</small>'+esc(hoursShort())+'<small>'+(on[0]?'Сейчас открыто ':'Сейчас закрыто ')+esc(on[1])+'</small></div></div>'+
 (D.phones.length?'<div class="hc-row"><span class="ic">📞</span><div><small>Телефон</small>'+D.phones.map(function(p){return '<a href="tel:'+p.value+'">'+esc(p.text)+'</a>'}).join('<br>')+'</div></div>':'');

/* цены или услуги */
if(D.prices&&D.prices.items.length){
 $('pLead').textContent='Прайс компании из 2ГИС: '+D.prices.items.length+' позиций. Точную стоимость уточняйте у администратора.';
 var cats=[]; D.prices.items.forEach(function(i){if(i.c&&cats.indexOf(i.c)<0)cats.push(i.c)});
 var cur='all';
 $('pChips').innerHTML=cats.length>1?'<button type="button" data-c="all" class="on">Все</button>'+cats.map(function(c){return '<button type="button" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join(''):'';
 function drawP(){var q=$('pSearch').value.trim().toLowerCase(),html='',last=null;
  D.prices.items.forEach(function(i){if(cur!=='all'&&i.c!==cur)return;if(q&&(i.n+' '+i.d).toLowerCase().indexOf(q)<0)return;
   if(i.c&&i.c!==last){html+='<div class="pcat">'+esc(i.c)+'</div>';last=i.c}
   html+='<div class="prow"><div><b>'+esc(i.n)+'</b>'+(i.d?'<small>'+esc(i.d)+'</small>':'')+'</div><div class="pv">'+esc(i.p)+'</div></div>'});
  $('pList').innerHTML=html||'<div class="prow"><div>Ничего не найдено</div></div>'}
 $('pChips').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;cur=b.dataset.c;[].forEach.call($('pChips').children,function(x){x.classList.toggle('on',x===b)});drawP()});
 $('pSearch').addEventListener('input',drawP); drawP();
 $('pNote').textContent=(D.prices.head?D.prices.head+'. ':'')+'Информация о ценах не является публичной офертой.';
 if(D.prices.items.length<8)$('pBlock').querySelector('.ptools').classList.add('hidden');
}else{
 $('pEyebrow').textContent='Услуги'; $('pTitle').textContent='Чем мы занимаемся';
 $('pLead').textContent='Стоимость зависит от задачи — уточняйте по телефону'+(D.whatsapp?' или в WhatsApp.':'.');
 $('pBlock').classList.add('hidden'); $('svcGrid').classList.remove('hidden');
 $('svcGrid').innerHTML=D.rubrics.map(function(r){return '<div class="svc"><span class="dot"></span>'+esc(r)+'</div>'}).join('');
}

/* режим работы и условия */
$('hours').innerHTML=D.schedule.is24?'<tr><td>Ежедневно</td><td>Круглосуточно</td></tr>':DAYS.map(function(d,i){var h=D.schedule.days[d];return '<tr'+(i===today?' class="today"':'')+'><td>'+RU[i]+'</td><td>'+(h&&h.length?h.map(function(x){return x[0]+'–'+x[1]}).join(', '):'Выходной')+'</td></tr>'}).join('');
$('hNote').textContent=D.schedule.comment||'';
if(D.attrs.length)$('attrs').innerHTML+=D.attrs.map(function(g){return '<h4>'+esc(g.name)+'</h4><div class="t">'+g.items.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>'}).join('');
else $('attrs').innerHTML+='<p class="pnote">Подробности уточняйте по телефону.</p>';

/* отзывы */
var R=D.reviews, S=D.stats, tot=0; for(var k in S)tot+=S[k];
$('sc').textContent=D.rating?String(D.rating).replace('.',','):'—'; $('scSt').innerHTML=stars(D.rating||0);
$('scCnt').textContent=D.ratingCount+' оценок · '+R.length+' отзывов с текстом';
$('bars').innerHTML=[5,4,3,2,1].map(function(s){return '<div class="bar"><span>'+s+' ★</span><div class="tr"><span style="width:'+(tot?S[s]/tot*100:0)+'%"></span></div><span>'+S[s]+'</span></div>'}).join('')+
 '<small style="color:var(--muted);font-size:12.5px">Оценки '+tot+' отзывов в 2ГИС</small>';
var nPos=R.filter(function(r){return r.r>=4}).length, nNeg=R.filter(function(r){return r.r<=3}).length, filt='all', shown=12;
$('rvTabs').innerHTML='<button type="button" data-f="all">Все ('+R.length+')</button><button type="button" data-f="pos">Положительные ('+nPos+')</button><button type="button" data-f="neg">Отрицательные ('+nNeg+')</button>';
function list(){return R.filter(function(r){return filt==='all'||(filt==='pos'?r.r>=4:r.r<=3)})}
function drawR(){var L=list();
 $('rvGrid').innerHTML=L.slice(0,shown).map(function(r){
  return '<div class="rv'+(r.r<=3?' neg':'')+'"><div class="rs">'+stars(r.r)+'</div><p>'+esc(r.t)+'</p><div class="who">'+esc(r.n)+' <small>· '+esc(r.d)+'</small></div>'+
   (r.a?'<div class="ans"><b>Ответ компании · '+esc(r.a.d)+'</b>'+esc(r.a.t)+'</div>':'')+'</div>'}).join('');
 $('rvMore').classList.toggle('hidden',L.length<=shown);
 [].forEach.call($('rvTabs').children,function(b){b.classList.toggle('on',b.dataset.f===filt)});
}
$('rvTabs').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(!b)return;filt=b.dataset.f;shown=12;drawR()});
$('rvMore').addEventListener('click',function(){shown+=24;drawR()});
$('rvAll').href=D.gis+'/tab/reviews'; drawR();

/* контакты */
var c='';
c+='<div class="ct-item"><span class="ic">📍</span><div><small>Адрес</small>'+esc(D.city+', '+D.address)+(D.addressComment?'<small>'+esc(D.addressComment)+'</small>':'')+'<br><a href="'+route+'" target="_blank" rel="noopener">Построить маршрут →</a></div></div>';
if(D.phones.length)c+='<div class="ct-item"><span class="ic">📞</span><div><small>Телефон</small>'+D.phones.map(function(p){return '<a href="tel:'+p.value+'">'+esc(p.text)+'</a>'}).join('<br>')+'</div></div>';
if(D.email)c+='<div class="ct-item"><span class="ic">✉️</span><div><small>Почта</small><a href="mailto:'+esc(D.email)+'">'+esc(D.email)+'</a></div></div>';
var soc=D.links.map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'}).join('');
if(soc)c+='<div class="soc">'+soc+'</div>';
$('ct').innerHTML=c;
$('map').src='https://yandex.ru/map-widget/v1/?ll='+D.point.lon+','+D.point.lat+'&z=16&pt='+D.point.lon+','+D.point.lat+',pm2rdm';
$('ftL').textContent='© '+new Date().getFullYear()+' '+D.fullName+', '+D.city;
var fab=''; if(tel)fab+='<a href="'+tel+'" aria-label="Позвонить">📞</a>'; if(D.whatsapp)fab+='<a class="w" href="'+wa('Здравствуйте! Пишу с сайта.')+'" target="_blank" rel="noopener" aria-label="WhatsApp">'+WA_SVG+'</a>';
$('fab').innerHTML=fab;
})();
</script>
</body>
</html>
