<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Маяк-авто — СТО, Сургут</title>
<meta name="description" content="Маяк-авто: Легковой автосервис, Автосигнализации, Ремонт стартеров и генераторов. проспект Мира, 52, Сургут.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#0b5d3f;--c2:#3cc47c;--c1d:#08452f;--tint:#eaf7f0;--ink:#16211c;--muted:#5f6b66;--line:#e2e8e5;--bg:#f7f9f8;--star:#f2a20c;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.15;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:700 16px Manrope,sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-main{background:var(--c2);color:var(--c1d)}
.btn-line{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn-wa{background:#25d366;color:#fff}
.btn-soft{background:var(--tint);color:var(--c1)}
.sec{padding:72px 0}
.sec h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin-bottom:10px}
.lead{color:var(--muted);font-size:17px;max-width:680px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c1);margin-bottom:10px}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo .mk{width:40px;height:40px;border-radius:12px;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.logo b{display:block;font-size:19px;font-weight:800;color:var(--c1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:600}
nav{display:flex;gap:20px;margin-left:auto}
nav a{text-decoration:none;font-size:15px;font-weight:600;color:#33403a}
nav a:hover{color:var(--c1)}
.hd-call{text-decoration:none;font-weight:800;font-size:17px;white-space:nowrap;color:var(--c1);text-align:right}
.hd-call small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.hd-call small b{color:#1a9b55}
.hd-call small b.cl{color:#d0482f}

.hero{background:radial-gradient(900px 420px at 85% 0,rgba(255,255,255,.14) 0,transparent 60%),linear-gradient(160deg,var(--c1d),var(--c1));color:#fff;padding:60px 0 70px}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:44px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;margin-bottom:18px}
.tag .st{color:#ffd166}
.hero .ext{font-size:16px;font-weight:600;opacity:.85;margin-bottom:6px}
.hero .ext::first-letter{text-transform:uppercase}
.hero h1{font-size:clamp(36px,5.4vw,60px);font-weight:800;margin-bottom:16px}
.rub{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.rub span{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
.hero-card{background:#fff;color:var(--ink);border-radius:22px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.22)}
.hc-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hc-row:last-child{border-bottom:0}
.hc-row .ic{font-size:20px;width:26px;flex:none}
.hc-row small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.hc-row a{text-decoration:none;font-weight:700}

/* prices */
.ptools{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;align-items:center}
.ptools input{flex:1 1 240px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:15px Manrope,sans-serif;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.plist{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcat{padding:12px 20px;background:var(--tint);font-weight:800;font-size:15px;color:var(--c1)}
.prow{display:flex;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
.prow b{font-weight:700;display:block}
.prow small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px;white-space:pre-line}
.prow .pv{font-weight:800;white-space:nowrap;color:var(--c1)}
.pnote{font-size:13px;color:var(--muted);margin-top:12px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.svc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;font-weight:700;display:flex;gap:12px;align-items:center}
.svc .dot{width:12px;height:12px;border-radius:50%;background:var(--c2);flex:none}

/* info */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.box h3{font-size:18px;font-weight:800;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours tr:last-child td{border-bottom:0}
.hours td:last-child{text-align:right;font-weight:700}
.hours tr.today td{color:var(--c1)}
.attrs h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px}
.attrs h4:first-child{margin-top:0}
.attrs .t{display:flex;flex-wrap:wrap;gap:6px}
.attrs .t span{background:var(--tint);color:var(--c1);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}

/* reviews */
.rv-top{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;margin-top:24px}
.score b{font-size:56px;font-weight:800;color:var(--c1);line-height:1}
.score .st{color:var(--star);font-size:18px;letter-spacing:2px}
.score small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.bars{display:grid;gap:6px;max-width:440px;font-size:14px}
.bar{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center}
.tr{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.tr span{display:block;height:100%;background:var(--star);border-radius:99px}
.rv-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.rv-tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--ink)}
.rv-tabs button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.rv-grid{columns:3 300px;column-gap:16px;margin-top:20px}
.rv{break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.rv.neg{border-color:#f0d3cb;background:#fffaf8}
.rv .rs{color:var(--star);letter-spacing:1px}
.rv .rs i{font-style:normal;color:#d7ddda}
.rv p{margin:8px 0 12px;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.rv .who{font-size:14px;font-weight:700}
.rv .who small{color:var(--muted);font-weight:500}
.rv .ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:14px;white-space:pre-line}
.rv .ans b{display:block;font-size:12.5px;color:var(--c1);margin-bottom:4px}
.more{text-align:center;margin-top:8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* contacts */
.ct-sec{background:linear-gradient(160deg,var(--c1d),var(--c1));color:#fff}
.ct-sec .eyebrow{color:#fff;opacity:.8}
.ct-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;margin-top:28px}
.ct{display:grid;gap:12px;align-content:start}
.ct-item{display:flex;gap:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:16px 18px}
.ct-item .ic{font-size:22px;flex:none}
.ct-item small{display:block;opacity:.75;font-size:12.5px;font-weight:600}
.ct-item a{text-decoration:none;font-weight:700}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.14);text-decoration:none;font-size:14px;font-weight:600}
.map{border-radius:var(--r);overflow:hidden;min-height:400px;background:rgba(255,255,255,.1)}
.map iframe{width:100%;height:100%;min-height:400px;border:0;display:block}

footer{background:#0d1512;color:#9aa9a2;padding:26px 0;font-size:13.5px}
.ft{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:16px;z-index:60;display:none;gap:10px}
.fab a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);text-decoration:none;font-size:24px;background:var(--c2)}
.fab a.w{background:#25d366}
.fab svg{width:28px;height:28px;fill:#fff}

@media(max-width:980px){
 nav{display:none}
 .hero-grid,.info-grid,.ct-grid{grid-template-columns:1fr}
 .svc-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
 .wrap{padding:0 16px}
 .sec{padding:52px 0}
 .hero{padding:38px 0 50px}
 .hd{gap:10px;height:62px}
 .logo small{display:none}
 .hd-call{margin-left:auto;font-size:15px}
 .svc-grid{grid-template-columns:1fr}
 .hero-btns .btn{flex:1 1 100%}
 .hero-card{padding:18px 16px}
 .rv-top{grid-template-columns:1fr;gap:16px}
 .prow{flex-direction:column;gap:4px}
 .fab{display:flex}
}
</style>
</head>

 к3 . Все аккуратно профессионально. Дал советы при следующем ТО. Я доволен", "d": "1 ноября 2026", "n": "Виктор М.", "a": null}, {"r": 5, "t": "Приезжал на установку перфорированных тормозных дисков. Установили быстро и качество, сервисом доволен!", "d": "31 октября 2026", "n": "Иван Е.", "a": null}, {"r": 5, "t": "Быстро определили поломку и качественно выполнили ремонт. Довольна результатом.", "d": "29 октября 2026", "n": "Алена Ш.", "a": null}, {"r": 1, "t": "Приехал к электрику проверить провод датчика температуры, а он просто говорит я НЕ ХОЧУ...\nПозвали старшего, а он говорит если электрик не хочет я его что палкой заставлю? Больше сам не поеду и другим скажу!", "d": "23 октября 2026", "n": "Александр С.", "a": null}, {"r": 5, "t": "Отличное качество работ. Понравилось!", "d": "20 октября 2026", "n": "Шамиль Н.", "a": null}, {"r": 4, "t": "В целом нормально но постоянно проблемы с терминалом. И работают только за наличку. Один раз приехал ни кто не предупредил объявлений то же ни где небыло. Администратор на повышенных тонах типа я всех предупреждаю но по факту нет. И пришлось идти до Союза чтобы снять деньги", "d": "18 октября 2026", "n": "Сергей Ю.", "a": null}, {"r": 1, "t": "Отвратительное отношение к Клинтам со стороны диспетчера", "d": "14 октября 2026", "n": "Дмитрий М.", "a": null}, {"r": 5, "t": "Качество и сервис обслуживания на 5 🎖", "d": "7 сентября 2026", "n": "Елена С.", "a": null}, {"r": 5, "t": "Спасибо большое мастерам, починили моего коняшу, лампочки все поменяли, щуп починили 😁 удачно попала, все отлично 👍", "d": "29 августа 2026", "n": "Анжела М.", "a": null}, {"r": 1, "t": "Позвонил записаться, мне отвечают «я откуда знаю когда освободятся мастера»администратор хамит, в итоге выключила, так и не записался 🤣", "d": "27 августа 2026", "n": "Фарид Я.", "a": null}, {"r": 1, "t": "Наверное самое отстойное СТО.Приехал,объяснил проблему.Сказали пригонять авто,я потратился на эвакуатор,ждал два дня очереди.В итоге слесаря сказали,что заниматься авто не будут,и работы много,и желания нет.", "d": "14 августа 2026", "n": "Руслан С.", "a": null}, {"r": 3, "t": "Ручники регулировать не умеют в том году поменял полностью троса колодки ручника отрегулировал на троечку,сказал троса китайские.в этом году менял расходники заодно попросил ручник подтянуть подтянул сказал что слабый был но по факту ничего не поменялось.сам снял панель где ручник, подтянул тросик стало на пятеру и тянуть есть еще куда.", "d": "10 августа 2026", "n": "Е.Ф.С", "a": null}, {"r": 1, "t": "самый худший автосервис! заехали поднять машину и посмотреть номер двигателя, на что получили отказ. сервис, занимающиеся машинами, отказались её просто ПОДНЯТЬ. не знаю ни одного человека, который хорошо отзывался о маяке.", "d": "1 августа 2026", "n": "лиа", "a": null}, {"r": 5, "t": "Хорошое СТО\nОтличные специалисты\nОтдельное спасибо диагносту", "d": "31 июля 2026", "n": "Джими", "a": null}, {"r": 1, "t": "Черт меня дёрнул сюда попасть!\nНо по порядку:\nНадо было поменять подшипники задней полуоси Сузуки Джимни. Работа не сложная, особенно, учитывая, что полуоси я привез не в машине, а отдельно, снятые с машины.\nПо телефону диспетчер этой конторы соединила со слесарем Владимиром (2-й подъемник). С ним договорились по 2,5 тысячи рублей за ось, итого 5 тысяч рублей. Это дорого, для примера работа по замене такого подшипника на Ниве стоит 3,3 тысячи рублей у них, но это когда на машине заезжают, проводится полная разборка задней полуоси. Так как другие варианты были заняты, а мне горело сделать быстрее, согласился на 5 тысяч. Привез детали и запчасти 25.07.2026, 26.07.2026 звонит Владимир, говорит с тебя 7 тысяч. Я спрашиваю, на 5 тысяч же договаривались. Нет говорит, у нас даже на Ниву замена 3,3 стоит (но это с полной разборкой и сборкой).\n\nКороче говоря, этот Маяк-avto - \"шарашкина контора\", в которой свое слово не держат, цены задирают, клиента обманывают, прейскуранта на работы нет.\nПосле скандала меня Вова со второго подъемника обозвал \"мydaком\". Сам такой! Здоровья тебе - Вова.", "d": "26 июля 2026", "n": "Konst M.", "a": null}, {"r": 5, "t": "Ранее за ремонт машины выставили в другом сто счёт 50 тысяч, но 25.07 посчастливилось попасть к Петру, осматривали Киа Сид, за 30 минут выявили проблему, осмотрели, отремонтировали, Петр это тот специалист которому не только можно доверить машину, но и свою жизнь 🙃", "d": "25 июля 2026", "n": "Надежда М.", "a": null}, {"r": 1, "t": "К", "d": "18 июля 2026", "n": "Вагиф А.", "a": null}, {"r": 1, "t": "Менял ступичный подшипник, через 2 дня заскрипело колесо, находился рядом с другим сто заехал, мастер сказал у вас ступица ржавая и подшипник старый, я ему объяснил что 2 дня назад меняли в сто на мира в Маяке, сказал что не затянули Гайку на гранате и подшипник не меняли...", "d": "23 июня 2026", "n": "Viacheslaw G.", "a": null}, {"r": 2, "t": "Заезжал на замену колодок, попытались обмануть. У меня в машине сервисный режим для замены колодок включается по нажатию трех кнопок, когда я загнад машину, активировал сервесный режим это же сказал мастиру на экране тоже появилась надпись что активирован сервисный режим. По окончанию работ так же выключил сервисный режим. Когда пошел оплачивать услуги в закез наряде увидел строку (перевод тормозной системы в сервисный режим цена 800 руб). Я касиру сообщил что данная услуга не оказывалась. Нужно отдать должное что за несказаную услугу деньги вернули сразу и без всяких вопросов. (Мастера знали что данная услуга не оказывалась, но всеми путями пытались за эту услугу взять деньги). Будте бдительны и всегда проверяйте заказ наряд.", "d": "16 июня 2026", "n": "Tima Б.", "a": null}, {"r": 5, "t": "Хочу выразить свою благодарность коллективу автосервиса!!! Произвели замену основного радиатора. В соседнем ресурс авто сто ценник в 2 раза выше и по факту отказались от работы", "d": "12 июня 2026", "n": "Максим Т.", "a": null}, {"r": 1, "t": "Записался в очередь, оставил свой номер телефона, отъехал, думал позвонят как очередь будет подходить, приехал и моя очередь оказывается прошла. На вопрос, зачем вы записываете номер телефона был дан ответ, что если машина стоит а вас нет, то мы позвоним. Диспетчер отвечает на отвали, никакой клиентоориентированности. Говорит, что если вы отъехали, никто вам звонить не будет. Зачем тогда вообще нужен этот журнал с очередью, если с тем же успехом можно простоять и в живой очереди", "d": "8 июня 2026", "n": "Муслим У.", "a": null}, {"r": 5, "t": "Приятно заезжать на сервис который выполняет свою работу как положено, а не начинают навязывать свои услуги в отличие от другого автосервиса в нашем городе!\nРаботу выполнили быстро, исправили все ошибки другого сервиса. Спасибо !", "d": "5 июня 2026", "n": "Кристина", "a": null}, {"r": 1, "t": "Не советую делать тут развал , Выставили руль криво звоню объясняю что руль криво выставлен они мне у вас на развал гарантии нет . вот так до того как к ним обратиться руль был ровный , теперь езжу с кривым рулём 🥺", "d": "4 июня 2026", "n": "Илья А.", "a": null}, {"r": 5, "t": "Лучший сервис", "d": "30 мая 2026", "n": "Дмитрий У.", "a": null}, {"r": 5, "t": "Прикольный сервис , все быстро и четко , надо записываться , магазин при сервисе очень удобно , мастера знают своё дело", "d": "28 мая 2026", "n": "Артем М.", "a": null}, {"r": 3, "t": "13.05 замена сальника коленвала, масла мкп. \nПлюсы: вроде ездит машина, все ок; оперативно\nМинусы: через день обнаружил, чего вдруг начало масло давить сразу с двух сальников приводов. Проверил уровень масла - пробка сбоку на мкп - масло было залито больше нужного, видимо 3л вместо 2.4л, т.к. полупустую банку масла не вернули. На фото виден водопад избытка масла с учетом, что авто еще под наклоном.\nКакие выводы? Либо мастеру пофиг, либо такая квалификация, либо сильно запарился. Прошу сто проработать этот вопрос, если увидите отзыв) до этого машину чинил - все было ок\n\nП.с. если в процессе замены запчасти обнаружат еще что-либо к замене, то вы это узнаете, если будете сами расспрашивать. Никто ничего не скажет, тем более звонить в процессе ремонта вам не будут. Это просто конвеер по замене запчастей на новые :)", "d": "28 мая 2026", "n": "Антон Т.", "a": null}, {"r": 5, "t": "Движок сделали спасибо мотористу", "d": "25 мая 2026", "n": "Вячеслав Р.", "a": null}, {"r": 1, "t": "Долго ждать, не квалифицированные мастера, такое чувство будто за большие деньги заезжаешь к Петровичу в гараж", "d": "20 мая 2026", "n": "Said", "a": null}, {"r": 1, "t": "Обратился в данное сто с проблемой гур на тл 200,потёк шланг, сделал опресовку ,они установили обратно после сталоо подклинивать ,обратился повторно даже не посмотрели ст.механик сказал что надо купить оригинал. Поехал в сто Северавтосервис промыли клапан и всё решилось", "d": "20 мая 2026", "n": "Городской ж.", "a": null}, {"r": 1, "t": "Кто придумал вам давать телефон?! \nОторвите ему руки, зачем они ему нужны, если он ими телефон поднять не может!", "d": "18 мая 2026", "n": "Никита Н.", "a": null}, {"r": 1, "t": "Непонятно зачем телефон данному заведению, ни в одном филиале не поднимают трубку, либо поднимают и сразу сбрасывают…", "d": "3 мая 2026", "n": "Яна Ш.", "a": null}, {"r": 3, "t": "Ну что за странное правило, что нельзя записаться к ОПРЕДЕЛЁННОМУ мастеру?! Для чего директор это придумал?! Может он и прав по своему, но, при всём уважении к Вашему сервису, я обслуживался у вас 8 лет только из-за одного мастера и ни к кому кроме него записываться не хочу т.к. с ним уже сложились доверительные отношения и я знаю, что он всё сделает на совесть. Уверен, что и другие мастера хорошие и у них есть \"свои\" клиенты, которые предпочитают именно их.\nС недавних пор на кассе стали отказывать в записи к определённому мастеру, ссылаясь на распоряжение директора. Как постоянный клиент, который много лет обслуживал сначала один, затем два автомобиля и советовал всем именно Ваш сервис, я в недоумении с этих правил. Из принципа буду пытаться искать другой сервис, нового \"своего\" мастера и обслуживаться у него.\nБолее чем уверен, что это правило рано или поздно уберут и неизвестно кто к тому времени будет директором и будет ли ещё эта надменная мадам работать на кассе, но вернусь ли я или подобные мне клиенты, это уже большой вопрос.", "d": "13 апреля 2026", "n": "Алексей С.", "a": null}, {"r": 5, "t": "Был проездом в Сургуте. Побежало масло с АКПП, приехал на СТО без записи, через 20 минут уже ремонтировали. Отремонтировали, оплатил всего 1100 рублей. Течь устранили. Большое спасибо!!!", "d": "11 апреля 2026", "n": "Тимур А.", "a": null}, {"r": 1, "t": "Отвратный сервис! Максимум колесо накачать и то б проверила, машину угробили и вину переклвдывают друг на друга и на саму машину! Замена расходников , шаровой обошлось ремонтом ещё на 25 тр, так как пришлось новые запчасти ,эвакуатор заказывать, плюс чуть детей не угробили!!!три часа ожидания ,замена запчестнй итог выехали и чеки все загорелись, вернулись датчик абс не правильно поставили,но через две недели колесо оторвалось, еще и форсунки топливные пришлось менять, после замены масла и прокладок ,газовал мастер так ,что в гараже чуть не задохнулись , забыв на трубу гофру одеть!", "d": "6 апреля 2026", "n": "Анна К.", "a": null}, {"r": 5, "t": "Очень хороший сервис, вежливый мастер, указал на дефекты о которых я не знал, сделал свою работу быстро и качественно, респект таким специалистам", "d": "1 апреля 2026", "n": "Максим А.", "a": null}, {"r": 4, "t": "Демократичные цены, запчасти в наличии.", "d": "26 марта 2026", "n": "Руслан Р.", "a": null}, {"r": 1, "t": "хочу чтобы со мной связалось начальство, за хамское отношение админа к своим клиентам", "d": "17 марта 2026", "n": "🖤", "a": null}, {"r": 5, "t": "Всё очень Быстро и Грамотно!!", "d": "17 марта 2026", "n": "Рaдион К.", "a": null}, {"r": 5, "t": "Качество обслуживания, цена. Грамотные специалисты (но не все).", "d": "3 марта 2026", "n": "Ви Н.", "a": null}, {"r": 1, "t": "Приехали, чтоб просто заменить датчик. Машину и ключи оставили мастеру. Зона ожидания просторная, есть кофемашина. Грязно только. Долго возился мастер, не мог поменять. Пару часов ожидания и ....машина даже не завелась. Видимо новый датчик бракованный. Вернул старый датчик на место и тут фиаско... Мастер оставил ключи в машине, а она вдруг заблокировалась, сама представляете. Так ещё и нас обвинили, что это мы виноваты. А мастер включил тормоза и не знает как это так могло произойти, что уж он там навинтил..... Кошмарное место просто. Ещё час ожидания пока приедут специалисты вскрывать машину. Так ещё и я должна за это заплатить. Безобразие! Руки растут не из того места что ли. Справку ,что новая запчасть бракованная или не рабочая они не выдают. Результата ноль, одни убытки, так ещё и за работу насчитали не маленькую сумму. Машина после вмешательства данного \"мастера\" стала серьезно моросить. И они ответственности не несут за это ..А всего то нужно было поменять датчик. Посещать данное место не советую....", "d": "2 марта 2026", "n": "Алена З.", "a": null}, {"r": 1, "t": "По телефону оператор называет одну сумму,по приезду мастер называет уже другую.Оказывается тут можно как на рынке,потому уже после общения одновременно с оператором и мастером-сумма уже третья.И что самое интересное,деньги берут даже за взгляд мастера в сторону твоей машины.А если ремонт начнёшь там,то можно в ломбард идти сразу.Лицо у слесаря всегда такое,будто он в рабстве и я пришла забрать его деньги,душу и квартиру.Лицо полное презрения и ненависти к тебе и твоему авто.Оператор смотрит на тебя как на кулёк с ...ом и общается сквозь зубы.Полное отсутствие культуры на этом Сто, клиентоориентированности ноль.В современной реалии и борьбе за конкуренцию вы играете в опасную игру с таким отношением и самое главное это -С ОТСУТСТВИЕМ РЕАКЦИИ НА НЕДОВОЛЬСТВА ЛЮДЕЙ СО СТОРОНЫ РУКОВОДСТВА.", "d": "26 февраля 2026", "n": "Справедливость", "a": null}, {"r": 1, "t": "Не соблюдается очередь , говорят если в машине никого нет не вызывают , а вдруг отошли или в этот момент внутри были какая разница , у вас же есть номер телефона для чего номер тогда ,можно позвонить . Называют одну цену мастер потом говорит другую или не говорит умалчивает а потом в итоге посмотрел на колесо 1000₽ , дотронулся 1000₽ образно говоря и т.п . Также недовольные именно Пожи у мастеров необоснованно , как будто ты приезжаешь ,забираешь у них деньги и уезжаешь. Тебе платят деньги и ты должен быть заинтересован в этом а не вести себя так будто у тебя их приехали забрать. Это говорит о лыдло-хан(м)стве людей .", "d": "22 февраля 2026", "n": "Имя Г.", "a": null}, {"r": 5, "t": "Попала к крутому мастеру делали привод быстро акуратно и качественно и поадекватным ценам что непугает а радует очень приятные мастера особенно Евгений Плотников и Пётр который делал мне авто машинка рада ездит легко", "d": "2 февраля 2026", "n": "Снежана В.", "a": null}, {"r": 1, "t": "Ужасно дорого и все обманывают. Больше это место не зайду. В других приемлемая цена. Не советую этот сервис", "d": "24 января 2026", "n": "Наталья ч.", "a": null}, {"r": 1, "t": "этот сервис обдиралово ужас дорого. у меня проблема была с печкой. Я попросил чё подсказку в чем проблема и с меня взяли за осмотр 1 минута 700р.ужас .пипец какой то больше не буду в этот сервис. в других бесплатно за подсказку а тут я в шоке. сожалел. не советую всем", "d": "23 января 2026", "n": "Роман А.", "a": null}, {"r": 1, "t": "Из 3х обращений хорошо сделали только один хорошо поменяли задние фонари меняли термостат завоздушили систему меняли прокладку выпуск выпуск хватило на три дня", "d": "21 января 2026", "n": "Павел", "a": null}, {"r": 5, "t": "Оперативно провели диагностику на Ауди. Вежливо общаются и рассказывают, в чем может быть неполадка. Спасибо.", "d": "9 января 2026", "n": "Ольга Д.", "a": null}, {"r": 1, "t": "Началось всё еще три года назад, порвался ремень грм на гранте, приехали за час до закрытия, нас приняли. За ремень и работу вышло около 12 тысяч! Думаю ладно, машина нужна, а по итогу этот ремень порвался после 20 тыс км. Второй раз приезжал на замену лампочек ближнего дальнего света. Был лютый мороз, не стал морозиться и заехал к ним на замену. Взяли 400 рублей, что проще чем поменять лампочки? Через пару месяцев одна лампочка переодически не светила, так как фишку вставили криво и она оплавилась. Пришлось еще и фишку менять после них. Последний гвоздь в крышку гроба этого сто был, когда я полтора часа добирался до них с 25ого чтобы не перегреть машину, так как отлетела помпа. По итогу женщина из будки хамским тоном зарядила мне 500 рублей за стоянку авто до утра следующего дня, хотя я был согласен поменять помпу у них. Даже если эта сто останется единственная в городе, я вызову эвакуатор до Тюмени и сделаю машину там.", "d": "27 декабря 2025", "n": "Владислав Б.", "a": null}, {"r": 5, "t": "Нормально, чтобы не унижаться перед знакомыми мастерами!) 👆", "d": "23 декабря 2025", "n": "Ефрейтор С.", "a": null}, {"r": 1, "t": "Запчасти в два раза дороже, навешивают допработы, пользуясь незнанием клиента. Сказали менять тяги, рычаги, наконечники с двух сторон, замена дисков и колодок. На другом сто говорят, что меня налюбили и менять надо только один наконечник с правой стороны. Если не разбираетесь в авто- едьте в другое место.", "d": "6 декабря 2025", "n": "Pax R.", "a": null}, {"r": 5, "t": "Супер", "d": "25 ноября 2025", "n": "АНДРЕЙ", "a": null}, {"r": 1, "t": "По телефону говорят одну цену , по факту совсем другая цена . \nОтвет на претензию говорят « если не нравится , не приезжайте больше сюда» \nВот такое вот отношение к клиентам!", "d": "24 ноября 2025", "n": "Д Б.", "a": null}, {"r": 5, "t": "Спасибо за отличную работу . \nМашину сделали в кратчайшие сроки и на совесть ! \n10 пост Сергей . \nОт Омичей спасибо .", "d": "8 ноября 2025", "n": "Mari F.", "a": null}, {"r": 5, "t": "Здравствуйте! Мастера 👍", "d": "3 ноября 2025", "n": "Натали Е.", "a": null}, {"r": 5, "t": "Каму как мне все нравится.", "d": "30 октября 2025", "n": "Александр Е.", "a": null}, {"r": 1, "t": "Отвратительное обслуживание. Заменили масло в двигателе, после замены, масло течёт, неправильно установили фильтр, отказываются устранять свои ошибки. До этого, поменяли колодки,тоже неправильно, скрип, вибрация. Деньги берут не маленькие,а гарантии никакой, хамское обслуживание. Естественно после такого обслуживания, на Маяк больше ни ногой и другим не советую.", "d": "4 октября 2025", "n": "Елена Я.", "a": null}, {"r": 5, "t": "Приняли сразу по живой очереди, мастер супер молодец поменял шаровые опоры на Мерседес спринтере\nОчень доволен работой👍🏻👌🏻", "d": "28 сентября 2025", "n": "Аслан Б.", "a": null}, {"r": 5, "t": "Очень Благодарен Тронзу Сергею Владимировичу за его профессианолизм,сделал диагностику машины и устронил все проблемы, до этого ходил в другие места и ни кто не мог найти данную проблему в автомобиле ,спасибо большое!!!!", "d": "25 сентября 2025", "n": "Курманали Ш.", "a": null}, {"r": 5, "t": "Хороший сервис, мастера своего дела! Хорошие специалисты и отношение к посетителям!", "d": "22 сентября 2025", "n": "Dmitry B.", "a": null}, {"r": 3, "t": "В последнее время это сто - рулетка. \nВ начале лета 2025\nБыли серьезные проблемы с двигатеьем:записали, позвонили на ремонт пригласили по раньше, и диагност и мастер по ремонту - отлично справились, моторчик шепчет.\n Но в середине сентября потек тосол - вышла со строя помпа поменяли... По ощущения было впечатление что делал стажер со вторым мастером... После ремонта буквально на второй день опять лужа под машиной-каким то чудом вышел со строя насос омывателя а еще засвистел ремень генератора - оказался \"вдруг\" не натянутым до конца... Еще и в масле каком то... подтянули ремень сами да и насос поменяли на \"коленке\" сами... Но сложилось впечатление что кто то специально поднапакостил...\nОчень хочется верить что совпало\nРаньше маяк на майской был фаворитом по качеству...Всегда сюда обращались, но теперь - как попадешь...", "d": "19 сентября 2025", "n": "Miha Z.", "a": null}, {"r": 1, "t": "Не отвечают на звонки, 2 дня немогу дозвонится", "d": "16 сентября 2025", "n": "Дима И.", "a": null}, {"r": 1, "t": "2 декабря 2024 года приехала на сто, на ремонт рулевой рейки и развала, как только мне сдали работу , больше на сто я не ездила, сегодня заехала на другое сто из за сломанной гранты , мастре у меня в машине находит доски!! Которые оставили на сто МАЯК , из за этой доски мне не могли сделать развал, а если и делали он уходил очень быстро, это по вашему работа? Спустя год я узнала что вы забыли у меня в машине, или специально сделали, это хорошо что не было никаких серьезных проблем, или вы видите что девочка заезжает к вам , и её можно обмануть ?\nЧеки работ у меня есть", "d": "31 августа 2025", "n": "Лена L.", "a": null}, {"r": 5, "t": "Обращаюсь редко, но всегда работа выполняется на отлично.", "d": "25 августа 2025", "n": "Алексей К.", "a": null}, {"r": 1, "t": "На звонки не отвечают, смысл тогда от телефона. На загруженность не нужно оталкиваться, в Вашем случаи и штат можно иметь для такой сети СТО", "d": "8 августа 2025", "n": "Ruslan G.", "a": null}, {"r": 1, "t": "Клиентоориентированность на нуле !\nРемонт произвели , но после этого еще хуже стало !\nМастер который мне делал авто , только и ходит на перекур и в интернете смотрит как менять деталь !\nНикогда сюда не едьте ((((\nНе в коем случае", "d": "2 августа 2025", "n": "Владислав", "a": null}, {"r": 5, "t": "Всё супер! \nВсё время обращаюсь к вам \nСамое офигенное это фиксированные цены ты понимаешь за что платишь деньги", "d": "29 июля 2025", "n": "Александр С.", "a": null}, {"r": 1, "t": "Если хотите сберечь нервы и деньги обходите этот сервис стороной!\nРаботают либо молодые не опытные либо люди с завышенной самооценкой . Которые вместо нормальной консультации , думают лишь бы ка к деньги слизать и мат на мате показать что ты ничего не знаешь , как будто не к представителям своей профессии пришел , а к мужикам с улицы .\nДелали подвеску слизали все болты так что только аргоном все разрешилось.", "d": "27 июля 2025", "n": "Илья", "a": null}, {"r": 1, "t": "Научите сотрудников общаться с клиентами! И если у них есть недовольства или нет желания устранять нполадки, можно просто сказать что машины определенных марок они не обслуживают!", "d": "18 июля 2025", "n": "Нюта Д.", "a": null}, {"r": 5, "t": "Ребята молодцы)", "d": "16 июля 2025", "n": "Великая К.", "a": null}, {"r": 5, "t": "Иван отличный мастер, не первый раз к нему попадаю и всегда отлично помогает решить проблему с машиной", "d": "16 июля 2025", "n": "Павел Т.", "a": null}, {"r": 1, "t": "Диагност говорит что двигатель изношен, тогда как всего лишь датчик поменять надо было. Масло не в состоянии поменять, потому что не могут выкрутить болты из щитка картера. Диспетчеру позвонить на заранее записанный номер телефона клиента и напомнить о его записи по времени религия не позволяет. Персонал явно набирали по объявлению.", "d": "10 июля 2025", "n": "Городской ж.", "a": null}, {"r": 1, "t": "Забыли закрутить рулевой наконечник, а если ДТП? Молодцы просто…", "d": "6 июля 2025", "n": "Андрей З.", "a": null}, {"r": 1, "t": "Приехал поменять масло в муфте Халдекс и редукторах авто марки Haval. По телефону объявили цену ₽550 за узел, когда приехал принимать отказались с комментарием \"у китайцев все сложно\"! Что именно сложно в стандартной по сути процедуре, в стандартных узлах, не сказали.", "d": "6 июля 2025", "n": "SpO i.", "a": null}, {"r": 1, "t": "Сервис отвратительный, как и админы в нем. Чинила у них машину, изначально с мастером обговорили ход работы и точную стоимость работ, приезжаю забирать, мне говорят сумму на 11000 больше, начала разбираться в чем дело, никаких дом работ не проводили, а стоимость выросла очень значительно, мастер, который делал машину, конечно же загасился от всех и не выходил на связь. К слову сделали ходовку мне не очень хорошо, пришлось ехать в другой сервис и переделывать работу этого гения с 20 летним стажем. На днях папе пришлось заехать в это чудо место, так как ситуация была экстренная и это было ближайшее сто, где было свободное время. Мастер якобы нашел причину стука в машине, взял за свои услуги 11 тысяч, не успели выехать с сто, как стук опять появился))) конечно же пошли к этому ремонтнику выяснять в чем дело, он начал говорить, что у вас вообще все старое, уже все гремит. К слову машина полностью обслужена и не старая, все поломки устраняются сразу же при первых звуках. Ну и как итог, хотели предложить нам еще раз загнать машину к ним в сервис, только вот уже за 20000 рублей. С проблемой стука поехали в другой сервис, причину нашли сразу же и цена вопроса 7000 вышла. Не рекомендую данный сервис, мастера аппелируют своим большим стажем, а по факту ничего не могут нормально сделать, девушки на кассах просто отвратительно общаются с клиентами, постоянно пытаются развести на сумму чека побольше.", "d": "30 июня 2025", "n": "Вероника Ф.", "a": null}, {"r": 1, "t": "Единица тупо за вашу женщину администратора. Это точно не ее место. К ребятам претензий нет", "d": "26 июня 2025", "n": "Махач А.", "a": null}, {"r": 1, "t": "Женщина, стоявшая у кассы, была очень грубой, нам только и не хватало, чтобы нас избили. У этой женщины нарушена психология.", "d": "17 июня 2025", "n": "berhan y.", "a": null}, {"r": 1, "t": "Самый ужасный диспетчера который есть на свете зачем они вообще там сидят если не умеют разговаривать с людьми не дают договаривать и бросают трубку", "d": "15 июня 2025", "n": "Dilmurod K.", "a": null}, {"r": 5, "t": "По работе бываю там с клиентами. В боксе чисто, признак хорошего отношения к клиентам и к своей работе! Деловая активность высокая, все подъемники заняты. Ребята знают что делают, лишнего не навешивают.", "d": "14 июня 2025", "n": "PolEV N.", "a": null}, {"r": 1, "t": "На станции работают обманщики. Позвонила и по телефону узнала цену на частичную замену масла в коробке, администратор озвучила 910 руб, звонила два раза . Приехала и привезла с собой две канистры масла по 4л . Меняла впервые и тонкостей пока не знала . Но мастер решил не стоит за копейки заморачиваться и решил развести . Хорошо хоть во время озвучил, иначе бы не заплатила . Уже глаз дёргается , что считают все женщины дурочки . Он решил сделать с промывкой за 2700 . А у меня кто спросил нужна мне эта промывка? Добросовестный мастер уточнит , что хватит на частичную замену одной канистры, а не будет желать сделать процедуру, которая мне не нужна . Или как минимум спросит у меня . Вообщем очень не довольна . Уехала и больше там даже не хочу бывать . А директору своей СТО рекомендую провести инструктаж со своими работниками , дабы те не занимались обманом клиентов.", "d": "10 июня 2025", "n": "Лиана М.", "a": null}, {"r": 1, "t": "Мне нужно было проверить свечи, однако мне сказали, что это полная диагностика, стоимость которой 3000. Мне не нужна была диагностика. Да даже если и так, то это дорого для диагностики. Дурдом", "d": "9 июня 2025", "n": "Валерия З.", "a": null}, {"r": 1, "t": "Попался молодой парень, попросил проверить почему руль дёргается на скорости. Заменили рулевую рейку, потом сказал что резьба какая-то срезана и надо менять колодку рулевую, потом развальные болты, в итоге кучу денег отдал, но ничего не починил. Ужасный сервис", "d": "8 июня 2025", "n": "Андрей Р.", "a": null}, {"r": 1, "t": "Неадекватный персонал.", "d": "6 июня 2025", "n": "Евгений", "a": null}, {"r": 5, "t": "Живая очередь, развал схождение сделано.", "d": "24 мая 2025", "n": "Иван Н.", "a": null}, {"r": 4, "t": "Увольте уже Ванилина с 1го подёмника \nОн руко поп колхозный.", "d": "23 мая 2025", "n": "Гюлендам Д.", "a": null}, {"r": 1, "t": "Это ужас просто, хамство, ладно трубку не брать, но они еще и сбрасывают, раз 40 звонил.", "d": "23 мая 2025", "n": "Алексей К.", "a": null}, {"r": 5, "t": "Не знаю почему такие плохие отзывы, видимо раз на раз не приходится 😅\nТрубку взяли быстро, записали на диагностику двс на следующий день, то есть долгих ожиданий не было) посмотрели все что только можно было, проверяли тщательно, я осталась очень довольна, ценник вообще хороший, внутри чистенько, сами мастера тоже в чистой одежде ! То есть в грязи никто в вашу машину не сядет😅 в общем вполне достойное сто\nРазводить на ремонт не стали, как во многих других сто нашего города ☺️", "d": "22 мая 2025", "n": "🥄", "a": null}, {"r": 1, "t": "Работа по замене масла в ДВС 1100р - это перебор! Откручивали фильтр, всё залили маслом, не вытерли за собой как положено! За что такие деньги!? \nРаботают на поток, вникать и искать реальную причину неисправности даже не пытаются т.к. это время, а время - деньги.\nРекомендуют менять полностью исправные детали! \nДеньги на ветер! И к сожалению большинство сервисов сейчас так работают.", "d": "22 мая 2025", "n": "Олег И.", "a": null}, {"r": 1, "t": "последнее время вообще не дозвониться, сбрасывают.", "d": "20 мая 2025", "n": "Фархад У.", "a": null}, {"r": 5, "t": "Быстро, качественно", "d": "12 мая 2025", "n": "Ольга Т.", "a": null}, {"r": 5, "t": "Хорошее СТО. Делают работу хорошо за разумную цену. Цены на запчасти также в разумных пределах, но на что то средняя цена, а на что-то ,явно, завышенная и, если в процессе ремонта, обнаруживается ещё одна несправность, то чтобы не бегать искать где подешевле, приходиться покупать запчасти, там же на СТО, подороже. В итоге ценник за ремонт, может быть другим нежели предполагалось в начале. Но зато всё быстро делается. Я в целом доволен этим СТО.", "d": "11 мая 2025", "n": "ДмитГен С.", "a": null}, {"r": 5, "t": "Большое спасибо персоналу СТО \"Маяк\" за качество обслуживания и профессионализм. Особая благодарность Назарову Евгению! Классный специалист знающий своё дело.", "d": "10 мая 2025", "n": "Евгений К.", "a": null}, {"r": 1, "t": "Не дозвониться", "d": "28 апреля 2025", "n": "Николай С.", "a": null}, {"r": 5, "t": "Шиномонтаж качественный", "d": "27 апреля 2025", "n": "Владимир С.", "a": null}, {"r": 1, "t": "Первый раз заехал больше не приеду одно название СТО.", "d": "12 апреля 2025", "n": "Олег С.", "a": null}, {"r": 5, "t": "Не первый раз обращаюсь к ребятам, всегда быстро и качественно делают свою работу + запчасти всегда рядом👍", "d": "3 апреля 2025", "n": "Сергей Д.", "a": null}, {"r": 5, "t": "Всегда меняю там масло. Адекватный персонал, делают быстро и качественно!", "d": "2 апреля 2025", "n": "Иван С.", "a": null}, {"r": 5, "t": "Сработали быстро и качественно, молодцы", "d": "31 марта 2025", "n": "Павел Б.", "a": null}, {"r": 5, "t": "Хочу выразить свою благодарность Евгению и Сергею!\nСпециалисты оперативно нашли проблему и также оперативно её решили!\nУспехов!", "d": "30 марта 2025", "n": "Алина В.", "a": null}, {"r": 5, "t": "Быстро поменяли масло. Вежливые и тактичные. Спасибо за сервис", "d": "25 марта 2025", "n": "Виктория", "a": null}, {"r": 5, "t": "Каждый год меняю моторное масло в Маяк-авто, все замечательно. Вежливый персонал, грамотные ребята.", "d": "21 марта 2025", "n": "Галина С.", "a": null}, {"r": 5, "t": "Приехал на СТО по рекомендации друзей и не пожалел. Мастера очень компетентные, все объяснили и быстро сделали диагностику. Ремонт обошелся недорого, а качество просто отличное. Обязательно вернусь снова!\nОтдельная благодарность, авто электрику, диагносту и слесарям в правом боксе )))", "d": "18 марта 2025", "n": "Serg B.", "a": null}, {"r": 5, "t": "Сегодня приезжала ремонтировать свою машину по ходовой части. Мне очень понравилось сделали всё качественно, быстро. Спасибо большое мастерам Сергею работающему на 11 подъёмнике и Сергею который делал развал-схождение. Так же хочется отметить девочек диспетчером знающих свое дело.", "d": "16 марта 2025", "n": "Светлана Д.", "a": null}, {"r": 5, "t": "Обслуживаю не первое авто . не было нареканий , максимально быстро и качественно проводится осмотр и ремонт. Запчастей если нет в наличии то очень быстро привозят . диспетчера очень вежливы и доброжелательны а главное компетенты", "d": "15 марта 2025", "n": "артем з.", "a": null}, {"r": 5, "t": "Хороший сервис, регулярно приезжаю с разными проблемами, решают отлично и быстро.\nОтдельное спасибо Вячеславу, профессионал своего дела", "d": "15 марта 2025", "n": "Sergey S.", "a": null}, {"r": 5, "t": "Сегодня был в этом сто понравилась качественная работа сотрудников была перебрена ходовая часть и замена тормозной системой с обслуживанием очень доволен всем машина прадо 150 огромная благодарность сотрудникам этого сто очень отзывчивые сотрудники сто рекоменд", "d": "14 марта 2025", "n": "эркин м.", "a": null}, {"r": 3, "t": "Раньше было лучше", "d": "13 марта 2025", "n": "Вадим В.", "a": null}, {"r": 5, "t": "Отличный сервис . отличные специалисты. Проводят ремонт быстро и качественно", "d": "12 марта 2025", "n": "Сергей Л.", "a": null}, {"r": 1, "t": "Поменяли фары криво. Зазор оставили с палец.", "d": "11 марта 2025", "n": "Олег С.", "a": null}, {"r": 5, "t": "Отличный сервис для То автомобиля. \nХороший персонал, большой выбор технических жидкостей и комплектующих.", "d": "11 марта 2025", "n": "Алексей Р.", "a": null}, {"r": 5, "t": "Лучший доступный сервис в городе. Все в наличии. Отзывчивый и внимательный персонал. Всегда учитывают пожелания клиента. Подскажут как лучше поступить.", "d": "10 марта 2025", "n": "Александр Р.", "a": null}, {"r": 5, "t": "Сто маяк уже много лет посещаю , почему я постоянно туда езжу, потому что ребята умеют своё дело, делают быстро и качественно также цена адекватно, особенно хочу выделить мастера Слава очень хорошо знает свою работу как своего делает, ещё Серёга электрик, ребятам очень благодарен за качественную работу, огромное спасибо за качественную работу, дай бог здоровья ребятам и общему колективу, берегите себя и удачи вам.", "d": "9 марта 2025", "n": "Азамат К.", "a": null}, {"r": 3, "t": "Автозапчасти стоят втридорого... сам автосервис хороший, ребята молодцы", "d": "9 марта 2025", "n": "Сергей П.", "a": null}, {"r": 5, "t": "Уже более 10 лет являюсь клиентом сто маяк. Есть опыт обслуживания и в других сервисах разного уровня, но здесь адекватный ценник за услуги, и не навязывают лишнее. Особенно хочу выделить Сергея и Евгения -профессионалы своего дела.", "d": "9 марта 2025", "n": "Николай В.", "a": null}, {"r": 5, "t": "Мастеру Ивану огромное спасибо проверенный человек езжу только к нему, быстро найдет проблему и быстро устранит", "d": "8 марта 2025", "n": "Артём X.", "a": null}, {"r": 5, "t": "Приезжал раньше. Больше не поеду туда. Обманывают как могут!", "d": "8 марта 2025", "n": "Эльдар М.", "a": null}, {"r": 5, "t": "Очень хорошее СТО машину ремонтирую там всегда у мастера Ивана умный знает что делать и как делать все посмотрит обо всем предупредит ремонтируюсь только у него.", "d": "7 марта 2025", "n": "Денис Ф.", "a": null}, {"r": 5, "t": "Хорошее СТО, удобное расположение. Поменяли прокладку под теплообменником. Мастер Слава сделал всё быстро и качественно. Обслуживаю авто только там. Рекомендую 👌", "d": "7 марта 2025", "n": "Мария П.", "a": null}, {"r": 5, "t": "Здравствуйте!\nЗнакомые порекомендовали и я рада, что нашла хороших специалистов. \nВежливый диспетчер. Мастера компетентные. В магазине есть всё необходимое. \nБлагодарю Всех за качественную работу!", "d": "5 марта 2025", "n": "Наталья К.", "a": null}, {"r": 1, "t": "👎👎👎👎что ещё сказать👎👎👎👎сосут бабки не советую на мира 52 ,,маяк авто,,полное дно", "d": "4 марта 2025", "n": "Артём Б.", "a": null}, {"r": 1, "t": "Пишу спустя некоторое время, как муж забрал машину. Первое: обслуживание ужас! Девушку уволить срочно!!!! Специалисты тоже не знают своё дело, лишь бы деньги содрать. Директор даже не хочет быть в интересе, чтоб был сервис на лучшем уровне. Не рекомендую данную шарашку!!!!", "d": "4 марта 2025", "n": "Дарья Б.", "a": null}, {"r": 1, "t": "Обманули развели на бабки не советую сто маяк на мира 👎👎👎👎гребут деньги за все их соседи на профсоюзной в 1000 раз лучше и профессиональнее работают, \nСто на мира не советую....👎👎👎👎", "d": "4 марта 2025", "n": "Artyom B.", "a": null}, {"r": 5, "t": "На компьютерную диагностику только сюда", "d": "2 марта 2025", "n": "Макс Г.", "a": null}, {"r": 1, "t": "Не надо туда ехать! Ужас полный! От начала до конца, прибывания там, все плохо!", "d": "26 февраля 2025", "n": "Joking M.", "a": null}, {"r": 4, "t": "Все в рабочем режиме, замена расходников", "d": "23 февраля 2025", "n": "Виталий Н.", "a": null}, {"r": 5, "t": "Масло поменяли без каких либо навязываний, оперативно и качественно", "d": "22 февраля 2025", "n": "Игорь К.", "a": null}, {"r": 1, "t": "Это просто ... ! Сначала читали отзывы, думали ладно нам просто нужно разместить везитницы на приёмке. Приехал спросил с кем переговорить и началось ... Короче 2 дня они переводили стрелки и звонки в 2 филиала и в итоге мы отказались от этой идеи. Контора у \"НИКАНОРА\"", "d": "19 февраля 2025", "n": "Авто З.", "a": null}, {"r": 1, "t": "Невежда ! Поголовно", "d": "7 февраля 2025", "n": "Ислам П.", "a": null}, {"r": 5, "t": "Мужики тут отзывчивые, можно постоять над душой 😁 и поспрашивать, что да как )\nСпасибо им за ответы, терпение и качественную работу. Рекомендую данный сервис. \nSubaru 😎", "d": "31 января 2025", "n": "Дмитрий", "a": null}, {"r": 1, "t": "Электрик не электрик, не чего не может, не чего делать не буду, зачем они его держут не понятно", "d": "30 января 2025", "n": "Михаил Б.", "a": null}, {"r": 5, "t": "Спасибо. Отличный сервис. Внимательно отнеслись, разобрались с проблемой, грамотно устранили неисправность, дали рекомендации на будущее. В отличии от 5-звездных, которые отказали в ремонте, хотя были заявлены модели в описании объявления. Машина Ваз 21140. Благодарю, рекомендую. Хорошего дня.", "d": "23 января 2025", "n": "Александр Т.", "a": null}, {"r": 1, "t": "Печальнейшее место в городе куда не стоит заезжать ! С автосервисом у них мало общего.", "d": "7 января 2025", "n": "Эльдар К.", "a": null}, {"r": 1, "t": "Диспетчера на месте очень трудно найти, машину делали долго, с перерывом на обед, колодки задние меняли почти 2 часа\nВ грязной форме работник сел в машину", "d": "6 января 2025", "n": "Татьяна Т.", "a": null}, {"r": 1, "t": "Диспетчерша хабалк*!\nНикакого уважения к клиентам", "d": "5 января 2025", "n": "Сургут C.", "a": null}, {"r": 1, "t": "Крайне не доволен сервисом, не нашли причину стука в ходовой, хоть и деньги за это взяли. Заменили детали которые не нужно было заменить. В другом сервисе все быстро нашли и починили.", "d": "5 января 2025", "n": "Якуб", "a": null}, {"r": 1, "t": "Обслуживание очень плохое \n20 минут рабочего времени \nОтказались осмотреть машину \n👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎👎", "d": "4 января 2025", "n": "Закир", "a": null}, {"r": 1, "t": "отвратительный сервис и честно говоря, писать этот отзыв для меня как раз-таки форма эмоциональной разрядки, потому что за все визиты в этот \"автосервис\" накопилось столько негатива, что хватит на целую книгу.  \n\nНачало истории:\nЭтот автосервис находится в очень удобном месте – это единственная причина, по которой я снова и снова попадаю в эту ловушку. Давно уже решил, что больше туда ни ногой, но, увы, жизнь иногда вынуждает.  \n\nПро подушки двигателя:\nИстория началась с замены подушек двигателя. Поменяли, и сразу началась сильная вибрация по всему кузову. Поехал при приёме сказал \"мастеру\" – \"это нормально, притрется\", – сказали мне. Притерлось так, что в итоге просто оборвало болты крепления!  \n\nКогда обратился в другой сервис, мастера там в шоке развели руками: установлено задом наперед, и только часть болтов была на месте. Из-за этого при трогании с места рычаг КПП буквально болтался вперед-назад. В нормальном сервисе проблему исправили, и по стоимости это вышло в три раза дешевле, чем я изначально заплатил в \"автосервисе\" на маяке.  \n\nНо итог этой истории таков – мой автомобиль теперь в черном списке у нормальных СТО. Мастера отказались больше с ним работать, сказав: Мы не хотим переделывать косяки после вашего \"сервиса\".  \n\nМасляный эпизод:  \nПоследний визит был просто\"маслом в огонь\". Приехал на замену масла.  оказалось, что за промывку двигателя мастер хотел взять двойную цену, хотя кассир сказала, что это включено в стоимость. На этом моменте я уже понял, что ничего хорошего ждать не стоит, но надежда еще теплилась.  \n\nЗалили масло, промывка была сделана в полторы минуты – мастер сказал, что \"пять-семь минут ждать не будет, и так сойдет\". Видимо, у него были планы на вечер поважнее моего двигателя.  \n Про фильтры:  \nДостал два масляных фильтра, хотел уточнить у мастера, какой лучше поставить зимой, а какой летом – летом планировалась дальняя поездка, зимой машина почти стоять будет.", "d": "22 декабря 2024", "n": "Hater", "a": null}, {"r": 5, "t": "Заменили ремень ГРМ и помпы на ваз 2114. 124 мотор за 1.5 часа +есть комната ожидания, магазин запчастей 👍", "d": "15 декабря 2024", "n": "Andrey D.", "a": null}, {"r": 1, "t": "Конечнный сервис, от диспетчера Марины, которая не знает ничего и хамит, до электрика, который отказался оказать услугу по замене лампочек, обьяснив это, мол я не умею!\r\nПосле них уехал в автомол, там все сделали за 15 минут", "d": "8 декабря 2024", "n": "Городской ж.", "a": null}, {"r": 5, "t": "Делали не первый раз развал-схождение у Сергея, лучший специалист! Все подробно расскажет, объяснит. Знает свое дело, все быстро и качественно! Мастер своего дела.", "d": "30 ноября 2024", "n": "Дарина", "a": null}, {"r": 5, "t": "Хорошо и быстро работают ребята. Профессионалы.", "d": "17 ноября 2024", "n": "Артём М.", "a": null}, {"r": 5, "t": "Диспетчера - слов не хватает. Две мадам и обе хамят, все их не устраивает. Без очереди пропускают знакомых, интересуешься почему так происходит, в ответ только хамство.\nТак что думайте сами, стоит ли портить настроение.", "d": "14 ноября 2024", "n": "Серёга М.", "a": null}, {"r": 1, "t": "Ужасная контора. Приехал с проблемой что печка не греет. Заменили блок управления печки , взяли 8000 хотя блок мне менять не нужно было. В итоге печка не греет. Пошел общаться с, руководством. Механик сказал мы тебе заменим корпус печки и ты заплатишь нам 20000 руб. Хотя корпус печки здесь не при чем. Директор сказал мне лицо сломает за то что я ругаю его контору. В итоге никакого результата от их работы, берут кучу денег и грубости от руководства .  У них даже оценка стоит двойка. При чем записыыют на услуги только за две недели либо приезжаешь по живой очереди и стоишь в очереди минимум три часа плюс ремонт минимум два часа.", "d": "31 октября 2024", "n": "николай к.", "a": null}, {"r": 3, "t": "Диагностику ходовой сделали хорошо два молодых пацана помогают друг другу.Далее покупка запчастей кстати не особо дорого у них же под заказ в течении 2 часов.Началась работа мастера уже другой, и вечная тема запчасти не те надо брать лучше,ответьте мне откуда я могу знать какие покупать если я машину ремонтирую раз в два года какие были в наличии те и купил тем более вам за работу деньги платят крутите потихоньку и молчите 3 часа -16000 руб за работу сразу скажу цена нормальная ,вопрос остался меняли ручник колодки троса ,сразу было замечено что плохо держит ответ запчасти плохие покаталйся появится,не улучшился плюс что-то скрежет прийдется заезжать опять когда можно было сразу его подтянуть.ничего плохого не скажу работа была не сложная замена расходников,а вот с ручником прийдется снова время тратить.", "d": "31 октября 2024", "n": "Федор Е.", "a": null}, {"r": 1, "t": "Не советую! Самый ужасный автосервис! Откуда берут таких мастеров безалаберных ! \nОбслужили машину как попало, делаешь замечания еще и в черный список добавляют", "d": "30 октября 2024", "n": "Светлана В.", "a": null}, {"r": 1, "t": "Отвратительное обслуживание! Не могу посоветовать это СТО и сам больше не поеду туда! Потрачены деньги и испорченные нервы! Работа была сделана не в полном объеме,с грубыми нарушениями! Мастера делают одновременно по несколько машин и соответственно качества здесь ждать не стоит. Элементарная замена масла не может производится как положено! Как можно перепутать масло которое заливаешь в двигатель конкретной машины? Не уверен,хотя бы спроси!!! Ещё и выставляет тебя после,не хорошим человеком,потому что не захотел лить не то масло которое купил у них же! Это больше всего возмущает!!!! Делал большое ТО в машине,заплатил не мало денег,работа была сделана не полностью,с обидами за свои косяки!!! А потом и думай,не подсунули ли тебе свинью из-за их же косяков и обид!!!\nНа это СТО теперь за бесплатно не поеду!!!", "d": "27 октября 2024", "n": "Павел М.", "a": null}, {"r": 1, "t": "Я бы вообще не ставил звезду, менял масло на машине , думал о чем то хорошем но то что сделали я сам мог бы, не советую в этот сервис. 👎🏿￼", "d": "23 октября 2024", "n": "Абдуракиб А.", "a": null}, {"r": 1, "t": "Менял ремни генератора и гура, ремни после выезда с сто засвистели, была гарантия на работу так как не прошло 14 дней , приехал подтянуть ремни, бесплатно подтягивать отказались, не рекомендую данное сто", "d": "22 октября 2024", "n": "Music L.", "a": null}, {"r": 1, "t": "Не советую", "d": "5 октября 2024", "n": "Антон К.", "a": null}, {"r": 1, "t": "На сход развале сидит дол**еб который не может нормально ничего объяснить так как он якобы не обязан и ему все равно что и как там у тебя будет после его выполнения работы ( с его слов ) потом заявляет что не будет делать автомобиль так как не хочет. Так б л ять зачем он там вообще сидит \nХочу не хочу буду не буду как будто к нему домой приехал", "d": "30 сентября 2024", "n": "Сергей К.", "a": null}, {"r": 5, "t": "Спасибо 🙏🏻 🙏🏻🙏🏻", "d": "22 сентября 2024", "n": "Эльза К.", "a": null}, {"r": 1, "t": "Вот так я ездила больше месяца. Заезжала к ним, снять броню т к отвалилась петля и нужна была сварка. В тот день у них не было мастера кто мог бы это сделать. Я забрала броню с собой. Итог не поставили обратно болты и гайки. Директор сказал : Ну вы же броню забрали, не стали устанавливать Да забрала но ребята гайки то нужно обратно прикручивать. Директор предложил поставить броню бесплатно. Вы шутите, или не понимаете что с вашей станции машина выехала в не исправном состоянии. И в какой момент я просто могла улететь с дороги.\nИскренне надеюсь что вам вернётся в полном объёме ваше скотское отношение к клиентам.", "d": "14 сентября 2024", "n": "Елена С.", "a": null}, {"r": 1, "t": "Они могут сломать машину, читайте отзывы людей!!! \nОбходите стороной!!!", "d": "14 сентября 2024", "n": "Ив И.", "a": null}, {"r": 1, "t": "Пишу в надежде что отзыв дойдет до руководства, и примут правильное решение. В последнее время очень понизилось качество обслуживания клиентов:\n1. Операторы не правильно записывают ( записался на определенный день, время и к мастеру. Первоочередно нужно было заменить маслообменик, вторично поменять колодки в круг. Записали только на колодки, по приезду мастер говорит что не может меня принять, потому что он занимается коробкой на другом авто, и если бы меня правильно записали он бы вообще меня не загонял в бокс).\n2. Был на СТО 08.09. диагност на выходном, что бы поменять задние колодки нужно программно отключать электронный ручник, соответственно нужен диагност. Записался к конкретному мастеру на конкретное время/дату + что бы был диагност для отключения ручника. По приезду мне другой оператор сказал что руководство запретило записывать к конкретному мастеру. поэтому ждите кто освободится, с чем я абсолютно не согласен( в других мастерах не уверен как в том к кому записывался)", "d": "11 сентября 2024", "n": "Артур Г.", "a": null}, {"r": 1, "t": "Время ожиданий вас вызовет мастер итак 2.5 часа простоял и уехал. Зазывают только \"своих\"", "d": "10 сентября 2024", "n": "Ринат Ш.", "a": null}, {"r": 1, "t": "Есть безолаберные мастера!!!! Их даже мастерами на назовёшь, подобрали бл*ть с улицы под балконом фриков, что забывают элементарно колеса закрутить!!! После замены тормозного цилиндра, накули колесо, наживили только как оказалось болты, сказали все готово!\nПоехал по делам, на развороте переднее колесе которое якобы закрутили, отъ*бнуло, порвало мне крыло, помяло тормозной диск и разъ*бало колесо которое стоит столько, сколько этот «мастер» в месяц не получает!!!! Фрик сутулый!", "d": "28 августа 2024", "n": "Nikita A.", "a": null}, {"r": 1, "t": "Не маяк авто а МАНЬЯК АВТО \nСТО ПОЛНОЕ ДНИЩЕ  КАК И СПЕЦИАЛИСТЫ . \nНе умеют делать из-за этих МУДАЗВОНОВ машина встала на трассе и вышло дорогостоящий ремонт,  так как  эти люди у которых руки растут с ЗАДНЕГО ПРОХОДА  не все на места ставят и считают , что  гайки нет смысла ставить и затягивать .", "d": "28 августа 2024", "n": "Алексей Д.", "a": null}, {"r": 4, "t": "Хорошо работают. Большое СТО. Единственный минус - мало деталей в наличии.", "d": "21 августа 2024", "n": "Анна Е.", "a": null}, {"r": 1, "t": "Ужасное сто сняли деньги с карты два раза возвращать отказываются.", "d": "13 августа 2024", "n": "олег о.", "a": null}, {"r": 5, "t": "Всё внимательно проверил электрик, объяснил куда лучше ехать на диагностику.", "d": "12 августа 2024", "n": "Наталья Д.", "a": null}, {"r": 5, "t": "Качественный сервис. Позитивные сотрудники. Все виды работ.  Доступно и в черте города.", "d": "3 августа 2024", "n": "Евген и.", "a": null}, {"r": 5, "t": "Лучшие спецы! По цене и качеству лучшее СТО в городе!", "d": "27 июля 2024", "n": "Владислав К.", "a": null}, {"r": 1, "t": "Не советую этот сервис. Купил масло и фильтр в магазине \"масла и смазки\" с бесплатной заменой на этом сервисе. Приехал и началось! Диспетчер взяла чек на замену и сказала, ожидайте к вам подойдёт мастер. Прождал 2 часа-движений никаких. Захожу, спрашиваю _вы про меня не забыли?_. Диспетчер объявила по громкой_замена масла_и сказала _сейчас подойдёт мастер_. Подошол мастер \"Денис\" спросил какая машина. Говорю, Ниссан Патфайндер. ОТВЕТ УБИЛ!!! ЭТО СЛОЖНЫЙ АВТОМОБИЛЬ,НА-УЙ ДАЖЕ СМОТРЕТЬ НЕ БУДУ. Поворачиваюсь к диспетчеру,говорю -у вас СТО или как, хочу работаю, хочу не работаю. Кто старший в этом заведении?-. Не отрывая взгляда от компа диспетчер сказала -я, замены масла не будет езжайте в другой сервис- и швырнула мне чек в окно. ! НЕ СОВЕТУЮ! НЕ ТРАТЬТЕ СВОЕ ВРЕМЯ И НЕРВЫ!!!!", "d": "25 июля 2024", "n": "Тарас М.", "a": null}, {"r": 5, "t": "Заехал чтобы убрали развал а ему мешает газовый редуктор с улицы что ли понабрали", "d": "23 июля 2024", "n": "Абдурахман Е.", "a": null}, {"r": 1, "t": "Начнем с того что записи свободные только через 2 недели , ок дождались записались, нет проблем , при записи уточнялось что требуется ремонт и замена гранат , но почему-то никто не соизволил сказать о том что запчасти под заказ и их нет в наличии , скажите пожалуйста зачем я ждал запись 2 недели , теперь еще запчасти столько же ждать? \nЧто за свинское отношение к работе ?\nМастер тоже , стоял с максимально свинским лицом и так же общался , как будто мы приехали делать свое авто за бесплатно, уважаемые это ваша работа и ваш хлеб , а кто зерно не садит - тот хлеб не выпекает , прошу администрацию довести до своих сотрудников что надо предупреждать о не наличии запчастей в вашем сервисе , мне ехать в дальнюю дорогу и теперь что мне делать ? В общем администрация может не причем, но сотрудники явно свиньи.", "d": "23 июля 2024", "n": "Данил А.", "a": null}, {"r": 1, "t": "Загоняла машину на диагностику в данный сервис. прождала в очереди 4 часа, но это ничего, по сравнению с тем, что мне написал мастер. Приехала с проблемой, о которой знала, нужно было понять, что заменить и машина просела, точно же понятно, что что-то не так. «Специалист» нашел проблему другую, а про мою ничего не сказал. После того, как спросила , что же в итоге у меня с (заниженной *опо¡)?? Ответ был сказан- все ок. Можно сальник поменять ….. занавес ! !!! \n\nРаботают на поток. Не советую данную организацию. Надежда на то, что из 8/10 специалистов , один такой… не понимаю того, когда видят женщин и думают, что мы ничего не понимаем! Так вот не забывайте, что существует бумеранг ♥️", "d": "22 июля 2024", "n": "VedmaTarot", "a": null}, {"r": 5, "t": "Диагностику провели успешно, нашли причину и её устранили. Хороший специалист, рекомендую", "d": "21 июля 2024", "n": "Ильдус М.", "a": null}, {"r": 1, "t": "Не советую… потеряете много времени ожидая живую очередь… организация процесса нулевая… \nК мастерам претензий ноль.\nРуководство, подумайте над клиентоориентированием", "d": "20 июля 2024", "n": "Iluha Z.", "a": null}, {"r": 1, "t": "На звонки не отвечают ВООБЩЕ !!!\nЗвоню 2 дня подряд …", "d": "20 июля 2024", "n": "Вовчик Г.", "a": null}, {"r": 4, "t": "Спасибо мастеру, за его честность и не взялся за работу,которую не сможет сделать тем самым сохранил мое время и нервы.Оказалось надо было меня помпу и к тому же была утечка антифриза в салон. После,как все было осмотрено мне сразу сказали,что проблема есть,но я не возьмусь так как будет дорого и без машины останусь надолго. Таких мастером единицы и спасибо за человечность!\nМинус ставлю,потому что при виде за рулем женский пол некоторые задирают нос (мастера), но потом понимают,что можно не ожидая получить такой ответ,что становиться стыдно перед коллегами. \nЗа рулем водитель,а не разделение полов!", "d": "13 июля 2024", "n": "Елена С.", "a": null}, {"r": 5, "t": "Хочу выразить благодарность электрику диагносту Евгению за обнаруженную не исправность и ее устранение! Проблема была в следующем загорелся чек и неисправность АБС 4 wd аск, (митсубиси аутлендер3 2013г.в) заехал в сервис ( ни в гаражи)на диагностику определили неисправность датчика АБС ( правый) после его замены неисправность осталась, сказали значит неисправен датчик в ступичном подшипнике , заменил ступичный подшипник проблема осталась в итоге потратил 9.000₽ в пустую нужно снова к диагносту он в отпуске, поехал в маяк авто на мира , ни буду разказывать как Евгений нашел причину , но она оказалась банальной магистраль газового оборудования перетерла провода АБС , запаял и все заработало, еще раз большое спасибо советую этого мастера 👍👍👍", "d": "12 июля 2024", "n": "Денис Х.", "a": null}, {"r": 1, "t": "Администратор хамит ,агрессивная,размена с наличных нет и это не ее проблемы,переходит на личности.Вы работаете с людьми,за свои деньги получаешь порцию негатива это просто ужас.Мое предложение руководству- пора что то или кого менять.", "d": "1 июля 2024", "n": "Евгения R.", "a": null}, {"r": 5, "t": "Не первый раз пользуюсь услугами вашего автосалона на ул. Мира. Мастера все отличные, знающие своё дело на пять. Особая благодарность электрику (ФИО к сожалению не знаю).", "d": "1 июля 2024", "n": "Татьяна Ш.", "a": null}, {"r": 1, "t": "Приехал поменять задние колодки, в очереди 14 машин. Хотел оставить машину на ремонт, даже ключи не взяли, хотя у остальных автолюбителей ключи взяли с удовольствием. Отвратительное отношение к посетителям.", "d": "27 июня 2024", "n": "Руслан Ф.", "a": null}, {"r": 2, "t": "Всегда проезжал делали всё хорошо, советы Дова дельные.\nНо вчера приехал регулировать клапана, приехал к 6:40 утра чтобы двигатель остыл к открытию. \nНо нас продержали до 10:40 и когда я подошёл и спросил долго ли нам ждать мне сказать у вас двигатель горячий (слова диспетчера) типо специалист подходил и трогал двигатель. Принтом к машине не кто на подходил да и я в 8:40 меня патрубки который проложен на инжектор и уже двигатель был остывший. \nДиспетчер спорила и поднимала тон типо я слепой делетант. \nЛобовое стекло накрыл тряпкой чтобы в салоне небыло жарка в машине спола девушка а я был у ворот и ждал когда специалист подойдёт. Продолжал с 6:40 и до 10:30\nСпециалист которые сделал регулировка сказал что нам нужно к мотористу типо в двигателе что-то звонит а это звон шол из выхлопа \nКогда я хотел оплате, меня просили оплатить переводом и я отказал переводом, и сказал что у меня кредитка и мне похабно перед лицом кинули терминал, я оплатить но на вопрос где гарантия на работу мне сказали езжай уже отсюда. \nБлин просто как-то не хотелось менять СТО но после такого, все-таки придётся поменять СТО.", "d": "16 июня 2024", "n": "Eison R.", "a": null}, {"r": 1, "t": "Записалась на диагностику развала хождения. Мастер сказал по итогу, что у меня все идеально, но порекомендовал записаться на диагностику ходовой.\nЗаписалась к проверенным ребятам на диагностику ходовой, сказали, что меня обманули и даже без диагностики видно, что у меня неправильный развал схождение.\nВообще неприятно, когда видят девушку, понимают, что она ни в зуб ногой в теме автосервис и вешают лапшу.", "d": "7 июня 2024", "n": "Екатерина М.", "a": null}, {"r": 1, "t": "Отвратительное СТО все мастера себя считают царями тем более электрик который на заданный вопрос не отвечает . Прошу руководство обратить внимание на это . И не кому не посоветую", "d": "26 мая 2024", "n": "Рустам О.", "a": null}, {"r": 4, "t": "Чинят то хорошо, чинюсь почти всегда здесь, да только отношение паршивое, из-за чужого плохого отзыва на меня быкуют слесари, мол ты оставил, так че сюда ездишь ( спутали мою жигули с другой которая ниже в отзывах есть ) теперь недовольные ходят, в общем клеветав чистом виде, а работают правда нормально", "d": "24 мая 2024", "n": "Иван В.", "a": null}, {"r": 1, "t": "Никто не перезвонил", "d": "22 мая 2024", "n": "Владислав Х.", "a": null}, {"r": 1, "t": "Полнейшее разочарование в этом сервисе.Чтобы загнать Жигули на ремонт,мастер вышел посмотрел сказал зачем тебе это надо,потом это проблематично и в конце концов сказал я делать не буду,на... такой сервис нужен.", "d": "20 мая 2024", "n": "Серёга Г.", "a": null}, {"r": 1, "t": "Ставлю одну звезду, только из-за того что, есть некоторые специалисты, которые реально работают на совесть, остальные колх*зники натуральные и доверять свой автомобиль таким колхозникам не рекомендую!", "d": "15 мая 2024", "n": "City s.", "a": null}, {"r": 5, "t": "У меня сломалась машина и ближайшие СТО оказалось Маяк Авто. Хочу сказать спасибо большое за оперативность и помощь в ремонте моей машины. Диспетчера девочки вам спасибо за то что все объяснили и проконсультировали. Слесаря качественно делают работу. Теперь я Ваш постоянный клиент. Буду рекомендовать вас своим друзьям.", "d": "14 мая 2024", "n": "Елена Б.", "a": null}, {"r": 1, "t": "несколько лет назад на сто очень некрасиво развели на деньги и сделали дорогостоящий «ремонт», смысла в котором не было, думала что на мойке уж проблем не будет, но не тут-то было. \nстояла в очереди на мойку, в 18:07 заехала машина, которая была передо мной, сразу после вышел сотрудник и сообщил, что это последняя машина \nрежим работы до 19:00, мне кажется за час помыть две машины вполне возможно", "d": "11 мая 2024", "n": "Дарья", "a": null}, {"r": 5, "t": "Один из лучших сервисов в городе. Ремонтируюсь и обслуживаюсь только здесь на Мира 52.\nНе могу с полной уверенностью сказать про другие сервисы данной сети, но думаю и там всё на уровне.", "d": "8 мая 2024", "n": "City s.", "a": null}, {"r": 1, "t": "Не СТО, стадо, прикидывающихся автослесарями, баранов. Даже осмотр полный сделать нормально не могут. Только грубить и хамить умеют. Обосновать, почему забраковали запчасть не могут. Не связывайтесь, поберегите нервы и время!!!", "d": "6 мая 2024", "n": "Gera T.", "a": null}, {"r": 1, "t": "Очередь не соблюдается, какие-то левые с улицы приезжают и сразу в сто... Конечно они будут говорить что это по времени но так как они общаются видно что дружки или родственники", "d": "3 мая 2024", "n": "Николай К.", "a": null}, {"r": 5, "t": "Добрый день!\nМного лет обслуживаюсь на данном СТО Маяк. Персонал вежливый, записываюсь заранее по телефону, всегда вежливо и подробно объясняют и можно уточнить по цене. Езжу всегда к одним и тем же специалистам. Ничего лишнего только по делу. Рекомендую!!!\nВсе отрицательные отзывы считаю происками конкурентов!\nДевочки администраторы красотки, спасибо!", "d": "2 мая 2024", "n": "Дания М.", "a": null}, {"r": 1, "t": "Грубейший администратор, на телефонные звонки никогда не отвечают , просто сбрасывают , хамит , агрессивно отвечает на вопросы! \nПрошу руководство задуматься о компетентности своего сотрудника.", "d": "28 апреля 2024", "n": "Софья Н.", "a": null}, {"r": 2, "t": "Сервис нормально, но ставлю 3 звезды из за автоэлектрика. Не могли поставить туманки и заменить лампочки дальнего света. В другом месте установили все за 20 минут. Возможно просто делать не хотел.", "d": "27 апреля 2024", "n": "Илья С.", "a": null}, {"r": 1, "t": "Операторы не работают от слова совсем худший сервис \nНо электрик там профессионал", "d": "26 апреля 2024", "n": "Madison S.", "a": null}, {"r": 1, "t": "Научите хабального админа общаться с людьми. В следующий раз приеду и вытяну её через окошечко, поедет со мной на курсы по клиентоориентированности.", "d": "24 апреля 2024", "n": "Анастасия У.", "a": null}, {"r": 1, "t": "Не отвечают на телефон сбрасывают когда звонишь повлияйте на диспетчера как нибудь а то не видать вам заработка с таким отношением к людям", "d": "23 апреля 2024", "n": "Захар Л.", "a": null}, {"r": 1, "t": "Был на всех адресах сто маяк авто , элементарно не могли ошибку в тормозной системе . В итоге случайным образом сам и устранил . Слов нет, матом бы закрыл вопрос . Столько денег содрали . Мастера из попы", "d": "16 апреля 2024", "n": "Линар И.", "a": null}, {"r": 1, "t": "У электрика очень часто выходной на мира или его нет, диагност когда приехал на 2114 с подтраивающим движком мне сказал но это же ваз! Это нормальная работа. по диагностики ходовой- левые ворота с лева подъемник работает молодой парнишка который даже не знает что смотреть постоянно у кого то все спрашивает. Я понимаю что опыт приходит современем но с какого клиент должен страдать? Очередь не соблюдается. Сказали 6 машин по факту 2 часа прождал заехало больше 10", "d": "15 апреля 2024", "n": "Илюха Ч.", "a": null}, {"r": 1, "t": "У диспетчеров ужасное отношение, за очередью не следят, явно не понимают последовательность этапов при ремонте, убил 2 часа в очереди так и не заехал, хотя когда вставал в очередь передо мной было 3 машины))\nУ кого много свободного времени и кто готов его бесполезно потратить, советую данную шарагу!", "d": "6 апреля 2024", "n": "Дмитрий А.", "a": null}, {"r": 1, "t": "Позвонил, объяснил поломку, сказали подъезжайте. Вызвал эвакуатор привёз автомобиль. Подошёл к диспетчеру повторил тоже самое что по телефону ранее сказал, а мне в ответ мы такое не делаем, поговорите с автоэлектриком может быть. Вообщем в пустую выкинул деньги, в данном СТО максимум что можно сделать, давление в шинах проверить да болты на колёсах подтянуть. Не связывайтесь синими, не тратьте в пустую время и ресурсы. Больше ни ногой туда и всех знакомых предупрежу чтоб не ездили к ним!", "d": "31 марта 2024", "n": "Surgutjanin", "a": null}, {"r": 5, "t": "Подскажите, сколько стоит замена тормозной жидкости на киа сид 2010г.", "d": "29 марта 2024", "n": "Bruce L.", "a": null}, {"r": 5, "t": "Был у авто электрика, установил сигналы, быстро,грамотно, четко, объяснил все как есть. Вообщем я доволен 👍🏼", "d": "27 марта 2024", "n": "Вадим С.", "a": null}, {"r": 5, "t": "Мойка супер, чисто, быстро, качественно, культурно.", "d": "23 марта 2024", "n": "Сергей М.", "a": null}, {"r": 5, "t": "Хорошо отрегулировали клапана и в целом мастера хорошие", "d": "21 марта 2024", "n": "Дмитрий И.", "a": null}, {"r": 1, "t": "Меняли сальники каленвала и разпредвала,грм ремень, проехал до дома 10км. Смотрю течёт масло также. Приезжаю на следующий день говорю что масло течёт так же и вы говорили про гарантию, в итоге ни гарантии и ни чего! Г*вно а не сто!!!", "d": "19 февраля 2024", "n": "Роман К.", "a": null}, {"r": 1, "t": "Это просто п….ц а не сервис", "d": "15 февраля 2024", "n": "Илья С.", "a": null}, {"r": 1, "t": "Добрый день, хочу предостеречь от посещения данного сто. В январе меняли антифриз, термостат. Две недели назад заметили шум под капотом. Сегодня обратились в другое сто( так как думали проблема с двигателем ) а как оказалось при замене антифриза *мастер* сто Маяк уронил хомут от нагнеталя в диффузор вентилятора. Звонила директору, говорит прочему ним не приехали и типо все хорошо вытащили же. У меня машина 20 года , я даже боюсь подумать на какие финансы попала бы при поломке радиатора. Очень не советую данное СТО", "d": "10 февраля 2024", "n": "Людмила С.", "a": null}, {"r": 1, "t": "Годами обслуживался, всё нормально, но уже удобно было к конкретному специалисту, который уже что-то помнит про авто. А теперь звоню записаться, а говорят именно к конкретному нельзя, только время, а там к кому попадёт. Минус конкретный, да мастера тут всё с руками, но к кому угодно я могу в любом СТО попасть, а хочется к стабильному без нового. Придётся искать клиентоориентированное СТО", "d": "9 февраля 2024", "n": "Duma Z.", "a": null}, {"r": 1, "t": "Сотрудник то с кем то постоянно разговаривает, то уходит и потом его не найти. Очень долгое ожидание работы. ИТОГ. МАШИНА СТАЛА ТРОИТЬ ЕЩЕ БОЛЬШЕ ПРЕЖНЕГО. НИ НОГОЙ СЮДА.", "d": "7 февраля 2024", "n": "Ира Д.", "a": null}, {"r": 1, "t": "За лето менял задние ступичные подшипники 4 раза. Покупал детали там же в магазине, на втором этаже. Спустя 4000 км начинают гудеть. Это первый момент. Второй. Менял здесь в октябре передние стойки. И на следующий день поехал в Тюмень, потом обратно. В время поездки, когда сдавал задним ходом, слышался странный хруст. Думал на подкрылок, так как он был, на тот момент, обломан. Через некоторое время появилась нужда поднять авто на подъемнике. И как оказалось, эти «мастера» не до конца установили стойку стабилизатора. \nНе советую это место, потеряете время и деньги.", "d": "7 февраля 2024", "n": "Рус М.", "a": null}, {"r": 1, "t": "Я несколько лет обслуживаю свой автомобиль у одного и того-же авто слесаря, а тут на тебе! Я не хочу сказать что там есть плохие, хорошие слесаря, но почему я, потребитель, должен ждать какую-то живую очередь?! \nХочу задать вопрос директору:\nВы тоже записываетесь к врачу, заказываете столик в ресторане по живой очереди? \nПри удачном расположение данного СТО, как специально назло людям! Зачем тогда вообще запись скажите, если живая очередь?! \nЛюди в свои выходные специально планируют посещение СТО, а тут на тебе, прождать полдня и не попасть...", "d": "2 февраля 2024", "n": "Сергей В.
