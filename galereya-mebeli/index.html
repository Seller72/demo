.attrs .t span{background:var(--tint);color:var(--c1);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}

н! Размеры идеальны. Цвет - бомба. Остались довольны.", "d": "24 января 2025", "n": "Дина С.", "a": null}, {"r": 1, "t": "Обратите внимание что все положительные отзывы КУПЛЕННЫЕ, если провалится на страницу к тому кто его написал, то видно что этот человек оставляет свои отзывы по всей стране! Я этого сразу не увидела и повелась на хороший рейтинг. Заказала в этой фирме шкаф. Качество распила и сборки просто отвратительное!!!! Написала претензию, обещали переделать все полностью через пару недель, в итоге прошло 2 месяца, а они все обещаниями кормят!", "d": "23 января 2025", "n": "Иринка П.", "a": {"t": "Здравствуйте, Ирина! Мы доверяем мнению наших клиентов и внимательно следим за обратной связью. Очень расстроены Вашим комментарием. Приносим свои извинения за доставленные негативные эмоции. Уточните, пожалуйста, последние 4 цифры вашего номера телефона, номер сертификата, ФИО сотрудника, время посещения, чтобы мы смогли проверить всю информацию, оценили действия сотрудника и приняли соответствующие меры. Пока мы не разберемся в ситуации, пожалуйста, примите искренние извинения🙏", "d": "23 января 2025"}}, {"r": 5, "t": "Хороший выбор материалов и фурнитуры, приятно впечатлил наш заказ. Шкаф прикольный, особенно количество места в нем.", "d": "20 января 2025", "n": "Рома М.", "a": null}, {"r": 5, "t": "Что хотели - то и получили! Довольны на все сто. Кухня маме очень понравилась - цвет, дизайн, полочки, тумбы, все как она и хотела. Угодили!", "d": "17 января 2025", "n": "Роза Ш.", "a": null}, {"r": 5, "t": "Отличный салон. Покупали тумбу, стулья, стол и журнальный столик. Еще и скидке. Качество мебели отличное.", "d": "10 января 2025", "n": "Оля Е.", "a": null}, {"r": 5, "t": "Очень нравится этот магазин мебели, посоветовали друзья, приобретаем мебель теперь только здесь. Добросовестное отношение к работе и внимательное отношение к покупателям)", "d": "8 января 2025", "n": "Инна С.", "a": null}, {"r": 5, "t": "Мебель качественная👌доставка пунктуальная👏 К покупкам рекомендую данный магазин", "d": "6 января 2025", "n": "Люда О.", "a": null}, {"r": 5, "t": "Огромный выбор материала и расцветки под заказ. Вежливые консультанты, которые подскажут всю информацию.", "d": "3 января 2025", "n": "Кристина К.", "a": null}, {"r": 5, "t": "Огромный ассортимент красивой мебели, глаза разбегаются. В последний раз покупали стол, очень классный и функциональный для школьника.", "d": "30 декабря 2024", "n": "Руслана Е.", "a": null}, {"r": 5, "t": "Хорошие скидки, выбор, предложения. Практически всю мебель в новый дом покупали здесь, некоторое под заказ.", "d": "27 декабря 2024", "n": "Раиса Щ.", "a": null}, {"r": 5, "t": "Стенка понравилась, идеально \"вписалась\" в гостиную. Доставка приехала точно ко времени. И спасибо сборщику, собрал быстро и качественно.", "d": "20 декабря 2024", "n": "Стас В.", "a": null}, {"r": 5, "t": "Долго искали шкаф в спальню и шкаф в прихожую. Выбор хороший, можно заказать под свои хотелки. Но лично нам понравилось то, что было в наличии, поэтому и получили мы эти шкафа довольно быстро.", "d": "16 декабря 2024", "n": "Раиса Ш.", "a": null}, {"r": 5, "t": "Учли все пожелания. Доставили и собрали все в срок. Мебель была сделана по замерам. Все подошло идеально.", "d": "9 декабря 2024", "n": "Надя К.", "a": null}, {"r": 5, "t": "льшой выбор качественной мебели по доступным ценам. Быстрая доставка. Палочка-выручалочка магазин.", "d": "4 декабря 2024", "n": "Галя П.", "a": null}, {"r": 5, "t": "Недавно переехали, покупали здесь тумбу под ТВ и письменный стол. Очень внимательное отношение к покупателям, подробные консультации. Подберут действительно то, что нужно, а не то, что дороже.", "d": "2 декабря 2024", "n": "Лена С.", "a": null}, {"r": 5, "t": "Самый лучший магазин, огромный выбор мебели в наличии и на заказ, рекомендую👌", "d": "29 ноября 2024", "n": "Полина С.", "a": null}, {"r": 5, "t": "Обращались за двухярусной кроватью + стол в детскую. Дизайн проект предложили в нескольких вариантах и абсолютно бесплатно. Дочки выбрали, нам сделали, теперь не нарадуемся. Огромное спасибо!", "d": "27 ноября 2024", "n": "Вера Х.", "a": null}, {"r": 5, "t": "Хороший магазин, большой выбор, качественная мебель на любой вкус и кошелёк. Есть скидки, которые делают покупку еще более приятной.", "d": "25 ноября 2024", "n": "Лада Г.", "a": null}, {"r": 5, "t": "Заказывала шкаф-купе 2 недели назад, вчера привезли. Вся работа в срок, отличное качество! Отдельное спасибо мастерам по установке, все сделали быстро, аккуратно и чисто. Будем рекомендовать вас друзьям.", "d": "20 ноября 2024", "n": "Лия А.", "a": null}, {"r": 5, "t": "Хорошего качества мебель и не дорого. Рекомендую.", "d": "18 ноября 2024", "n": "Алина С.", "a": null}, {"r": 5, "t": "Жалоб нет, начиная от консультации и заканчивая получением и сборкой нашей кухни в квартиру. Очень функциональная и удобная.", "d": "15 ноября 2024", "n": "Инесса Г.", "a": null}, {"r": 5, "t": "Хороший магазин, рекомендую👍 Заказывали офисную мебель, изготовили даже раньше оговоренных сроков. Все понравилось, качество материала не из дешевых.", "d": "13 ноября 2024", "n": "Павел О.", "a": null}, {"r": 5, "t": "Приятно общаться с продавцами: вежливы, тактичны, индивидуально подходят к потребностям покупателя.", "d": "11 ноября 2024", "n": "Даниил П.", "a": null}, {"r": 5, "t": "Уже приобрели кухню, диван, гардеробную по индивидуальным размерам. Сейчас в процессе шкаф и комод. Спасибо за качество❤️", "d": "8 ноября 2024", "n": "Люда К.", "a": null}, {"r": 5, "t": "Как по мне, лучшее соотношение цены и качества. Мебель добротная.", "d": "6 ноября 2024", "n": "Влад П.", "a": null}, {"r": 5, "t": "Долгое время покупаем здесь мебель различного типа, и по качеству нареканий нет.", "d": "4 ноября 2024", "n": "Гриша Т.", "a": null}, {"r": 5, "t": "Заказывали шкаф-купе для двоих детей. Справились с работой в обозначенные сроки. Также понравилось то, что учли все пожелания в дизайне. Мы довольны.", "d": "1 ноября 2024", "n": "Лиля Н.", "a": null}, {"r": 5, "t": "Очень довольны компанией. Заказывали кухню для родителей. Изготовили в срок, качество отменное, уже месяц, как установили, и за это время косяков не нашли. Рекомендую!", "d": "28 октября 2024", "n": "Оксана Ц.", "a": null}, {"r": 5, "t": "Спасибо за нашу долгожданную кухню, жена довольна. Доставка и сборка - всё вовремя и без проблем.", "d": "26 октября 2024", "n": "Марк П.", "a": null}, {"r": 5, "t": "Магазину - 5 звезд! Прекрасный персонал! Мебель на любой вкус и ценовую категорию.", "d": "24 октября 2024", "n": "Макс Х.", "a": null}, {"r": 5, "t": "Отличный магазин. Хорошая мебель и ценник приемлемый. Давно здесь покупаем мебель, и до сих пор все в отличном состоянии.", "d": "22 октября 2024", "n": "Ирина А.", "a": null}, {"r": 5, "t": "Заказывала макияжный уголок в спальню - трюмо с выдвижным пуфиком и большим складывающимся зеркалом. Быстро определились с моими пожеланиями и нарисовали несколько вариантов. Долго выбирала между 2мя и выбрала, как мне кажется, лучший. Большое спасибо вашим сотрудникам за помощь! Срок изготовления приемлемый - не за пару дней конечно, но и не несколько месяцев.", "d": "19 сентября 2024", "n": "Римма К.", "a": null}, {"r": 5, "t": "Делал здесь нестандартный для мебельщиков заказ. Стол, но не стол, со скрытым крепежом внутри корпуса на анкерах внутрь стенки. Сверху стола шкафчик, но не шкафчик) Некая выдвижная система, которая маскируется под цвет стен и почти незаметна в закрытом состоянии. С задачей справились отлично, хоть время ожидания было и повыше, но я вообще без претензий. Получил именно то, что и хотел, спасибо!", "d": "18 сентября 2024", "n": "Александр Т.", "a": null}, {"r": 5, "t": "Брали здесь по советам друзей шкаф-купе. Отличный магазин с классными и профессиональными консультантами. Порадовала, что попали на скидку на эти же шкафы) Что позволило взять вариант получше, но за меньшие деньги.", "d": "15 сентября 2024", "n": "Маша Т.", "a": null}, {"r": 5, "t": "Недавно покупали у вас несколько офисных стульев для работы. Все очень быстро оформили и сделали скидку за оптовый заказ. По бумагам всё четко и быстро. Закрывашки привезли сами через 2 дня, удобно.", "d": "14 сентября 2024", "n": "Карина С.", "a": null}, {"r": 5, "t": "Покупали в подарок маме небольшой шкафчик в спальню + макияжный столик. Мама при выборе присутствовала) Менеджеры все сделали по ее запросам и пожелания, за что им спасибо! Рады, что обратились к вам.", "d": "13 сентября 2024", "n": "Кристина Б.", "a": null}, {"r": 5, "t": "Заказывали в Madeyra детскую - предложили много отличных вариантов из имеющихся, но они, увы, не подошли. Делали зарисовки на компьютере дизайнера - наконец-то выбрали) Изготовили все быстро, меньше месяца. Теперь чадо радуется новой и функциональной детской комнате. Кровать получилась на втором ярусе, который можно превратить в первый через несколько лет, поставит уже взрослую кровать.", "d": "11 сентября 2024", "n": "Ира Ш.", "a": null}, {"r": 5, "t": "Обновляли немного гостиную комнату и решили выкинуть старую советскую антресоль. Она конечно задавал стиль всей комнате, но старила ее) Теперь радуемся новому и современному шкафу с 3 распашными дверьми. По центру сделали зеркало антиблик - не мешает просмотру ТВ.", "d": "8 сентября 2024", "n": "Ксения Б.", "a": null}, {"r": 5, "t": "Заказывал здесь шкаф в спальню под стиль комнаты. Помогли подобрать и цвет и габариты и функционал. Спасибо за профессиональную консультацию. Порадовало, что сделали скидку почти на половину стоимости шкафа! У них была акция, о которой я и не знал)", "d": "4 сентября 2024", "n": "Герман Э.", "a": null}, {"r": 5, "t": "Брали шкаф-купе в гостиную. У нас после полной мебелировки и небольшой перестановки образовался пятачок на 2 метра, который хотели полезно заполнить. Нам сделали вместительный шкаф в потолок с зеркальными дверьми, почти без рамок) Если заходить и смотреть прямо - создается впечатление очень длинной комнаты. Спасибо вам за помощь с выбором и проект!", "d": "3 сентября 2024", "n": "Ксения Т.", "a": null}, {"r": 5, "t": "Увидели акцию у Madeyra на шкафы-купе и решили заказать в спальню. У нас был обычный шкафчик маленького размера, в который едва помещались все нужные вещи. Сдвинули кровать ближе к краю комнаты и выделили побольше места под шкаф. По приезду в компанию нам предложили несколько вариантов. Остановились на угловом шкафе, о котором даже на задумывались. Спасибо вам за сервис!", "d": "1 сентября 2024", "n": "Полина С.", "a": null}, {"r": 5, "t": "Мебель качественная, у нас уже вся семья, родственники и друзья только здесь мебель и заказывают. Ценник очень приятный и на скидки всегда можно нарваться. Рекомендую!", "d": "30 августа 2024", "n": "Наталия К.", "a": null}, {"r": 5, "t": "Ребенку здесь заказали компьютерный стол. Сроки изготовления нас устроили. Но нас удивили и сделали стол раньше! Стол полностью соответствует заказанному! Ребёнок в восторге!", "d": "29 августа 2024", "n": "Елена А.", "a": null}, {"r": 5, "t": "В Madeyra заказали шкаф-купе и были приятно удивлены 40 % скидке! Шкаф красивый, двери открываются хорошо. Бегуночки качественные, не экономят на своих клиентах ребята! Будем вас советовать!", "d": "28 августа 2024", "n": "Дина Л.", "a": null}, {"r": 5, "t": "Заказывали книжные шкафы в гостиную. Сделали быстро, материал качественный. Сборка лёгкая. Шкафы с массивностью книг справляются. 5 из 5!", "d": "27 августа 2024", "n": "Рита Е.", "a": null}, {"r": 5, "t": "Заказывал кухню в дом. Квадратура большая, не понимали с женой, как лучше все сделать. Менеджер нам помогла, нарисовала нам план, замерщик тоже не заставил себя долго ждать. Изготовление заняло 2,5 месяца, долговато кончено, но когда мы увидели конечный результат, то поняли почему. Кухня как с картинки, а главное она очень функциональная! Все на своём месте, абсолютно все мелочи продуманы. А ещё и скидку сделали! Обязательно вернемся к вам еще.", "d": "26 августа 2024", "n": "Виталий А.", "a": null}, {"r": 5, "t": "У меня практически вся квартира обставлена мебелью, произведённой в этом производственном цехе. Мебель качественная, долговечная. Рекомендую!", "d": "25 августа 2024", "n": "Борис В.", "a": null}, {"r": 5, "t": "Нужен был шкаф для встраиваемой техники на кухню. До этого все отдельно стояло. В Madeyra сделали все на высшем уровне. Все работники очень вежливые и приветливые,идут вам на встречу, если неожиданно захотели что-то поменять. Шкаф огонь.", "d": "24 августа 2024", "n": "Людмила К.", "a": null}, {"r": 5, "t": "Здесь нам дедали напольную и подвесную тумбы в ванную. Качество шикарное. Ничего не разбухло, все стоит как новенькое, а мебели уже 3 месяца. Буду обращаться ещё!", "d": "23 августа 2024", "n": "Люба О.", "a": null}, {"r": 5, "t": "Нужна была не дорогая мебель на дачу. Стол и шкаф. Обратились в этот цех и нам сделали все в лучшем виде. Рекомендую!", "d": "22 августа 2024", "n": "Даниил М.", "a": null}, {"r": 5, "t": "Купили квартиру и нужна была срочно кухня. Цены везде просто космос! Вообще не могли себе ничего позволить. Узнали, что здесь дают 30% скидку и конечно же рванули сюда! Замерщик приехал на следующий день и кухня стояла у нас через 2 месяца. Качество на высоте! Ребят рекомендую, как ответственных и исполнительных!", "d": "21 августа 2024", "n": "Зоя П.", "a": null}, {"r": 5, "t": "Открывал кофейню, нужны были столы комфортабельные 15 штук. Долго меня мурыжили многие фабрики и цеха и только здесь мой заказ сразу приняли в работу. Сделали все в обозначенные сроки! Брака нет! Советую!", "d": "20 августа 2024", "n": "Давид Ф.", "a": null}, {"r": 5, "t": "Нужен был шкаф в детскую комнату. Заказали в Madeyra, посоветовала коллега. Приехал мастер в оговоренное время, сделал все замеры. С менеджером обсудили все ньюасы и наши пожелания и вот уже через месяц шкаф стоит у нас! Очень вместительный! Полки все хорошо закреплены. Думали упадут полки под тяжестью книг, но нет. Все на месте. 5 звезд этой компании!", "d": "19 августа 2024", "n": "Инга Н.", "a": null}, {"r": 5, "t": "Решила поменять кое-что в жизни, кроме прически и цвета волос, и выбрала - меняю кухню! Просмотрела и проездила по множеству компашек. То цены не устраивают, то делают по шаблонам и не могут отклониться от размеров (это прям было странно), то пятое, то десятое. Уже отчаялась и решила повременить с кухней, как заехали в Madeyra. Тут нас покорили тем, что набросали аж 6 вариантов через специальную программу на ПК менеджера. Сидели мы там около 3х часов, но все не зря! Каждое утро заваривая себе чай я радуюсь новой кухоньке. Цена, кстати, не космос - закладывали с мужем большую сумму, но вышло поменьше. Благодарна вашей организации за персональный подход к каждому клиенту!", "d": "18 августа 2024", "n": "Лиана В.", "a": null}, {"r": 5, "t": "Делали ремонт в квартире, косметический, и нечаянно заляпали часть шкафов и столешницу на кухне. Это знак, подумала я! Ну капец, подумал муж 😂 Приехали в Madeyra за новой кухонькой и подобрали просто отличный вариант. Даже решилась поменять свой бежевый на ярко оранжевый - ни о чем не жалею. Спасибо менеджерам за грамотную консультацию при выборе и установщикам, при монтаже!", "d": "17 августа 2024", "n": "Виолетта Ф.", "a": null}, {"r": 5, "t": "Обновляла кухню на что-то посовременнее вариантов из 2005) Madeyra сумели предложить несколько вариантов на наш кошелек и даже сделали скидку. Огромное спасибо за это! Теперь с мужем пьем утренний кофе на новенькой кухне и никак не нарадуемся!", "d": "15 августа 2024", "n": "Таня П.", "a": null}, {"r": 5, "t": "Оформляли кухню в новую квартиру у этой компании. Понравился подход менеджеров - предлагают скидку на итоговый проект и делают зарисовки по хотелкам клиентов в спец.программе на компьютере при вас же. Проекты, правда, нам не подошли, уже приехали с готовым решением, которые очень удачно воплотили! Кухня получилось такой, как и надо! Спасибо!", "d": "14 августа 2024", "n": "Рената М.", "a": null}, {"r": 5, "t": "У нас прорвало стояк отопления у соседей сверху, верхние ящики по 1 из стенок взбухли. Погрустили, да решили заказать такие же. Менять всю кухню для нас дорого, но заменить 4 ящика вполне по карману. Привезли кусок ящичка в Madeyra как образец. Цвет совпал идеально! Повезло, что я всегда храню бумаги и проекты на крупные покупки, взяли размеры со старой кухни. Спасибо за профессионализм!", "d": "13 августа 2024", "n": "Надежда Н.", "a": null}, {"r": 5, "t": "Меняла кухню в квартире матери. Советская мебель, конечно, антиквариат и раритет, но от всего старого приходит время отказываться. Мне сделали 4 проекта в разных стилях одной ценовой категории - показала матери и не понравился ни 1 :) Спасибо менеджеру, что нарисовали еще раз уже с учетом пожеланий мамы. Скрипя сердце согласилась и теперь хвастается подружкам новой кухонькой)", "d": "12 августа 2024", "n": "Вероника Л.", "a": null}, {"r": 5, "t": "Заказывала кухню в Madeyra по совету подругу - сделали все в срок по договору, без косяков. Проект понравился, выбрали предложенный менеджером вариант. Цена устроила, вместе со скидкой в 30% (у них сейчас акция вроде как). Будем заказывать у вас еще шкафы, как деньги накопим)", "d": "11 августа 2024", "n": "Камилла Б.", "a": null}, {"r": 5, "t": "Заказывала кухню в частный дом. Сама кухонька всего в 12 квадратов, но как же органично удалось все вписать, даже проход остался широким. Спасибо вам за грамотных спецов и менеджеров!", "d": "10 августа 2024", "n": "Камилла М.", "a": null}, {"r": 5, "t": "Заказывали здесь кухню в квартиру, всё очень понравилось! Нам сделали дизайн проект в подарок в 3х вариантах, за что очень благодарны! Также проставили скидку в 30% на весь гарнитур, и за это спасибо! Кухня вышла именно такой, как я хотела.", "d": "9 августа 2024", "n": "Юлия Ж.", "a": null}, {"r": 5, "t": "Нужно было изготовить 1 шкаф на кухню, чтобы потом смонтировать туда вытяжку. Обращались во многие цеха, то маленькие заказ, то нет у них такой плёнки как у нас. И только в Madeyra взялись за наш заказ. Мы им отправили параметры вытяжки, они сделали под нее вырез и даже обработали его! Шкаф идеально встал уже в смонтированую кухню. Спасибо вам!", "d": "8 августа 2024", "n": "Настя С.", "a": null}, {"r": 5, "t": "Нужны были шкафы в офис. По цене, материалу и внешнему виду устроила мебель в Madeyra. Каркас крепкий, много бумаг выдержит. Сборку осуществили быстро. Шкафы хорошие, а главное не дорогие. Рекомендую!", "d": "6 августа 2024", "n": "Владислав А.", "a": null}, {"r": 5, "t": "Делали ремонт у дочки в комнате и решили обновить мебель, дочь то уже выросла. Выбор пал на Madeyra, так как ранее заказывали у них стол. Ждали мы около 1 месяца кровать, шкаф, стол, комод. Собирал я сам. Никаких сколов, никакого брака. Мебель идеальная.", "d": "5 августа 2024", "n": "Зинаида Д.", "a": null}, {"r": 5, "t": "У нас уже был готов проект кухни. Изготавливать решили здесь, друзья уж очень расхваливали. И мы вообще не пожалели. Все стыки ровные, болтик к болтику! Все вырезы под технику сделаны ровно, все обработано! Я просто в диком восторге. Ребята очень вежливо общаются и цены не кусаются!", "d": "4 августа 2024", "n": "Ольга Я.", "a": null}, {"r": 5, "t": "Заказали здесь шкаф-купе в коридор. На дверях нам нужны были зеркала с подсветкой. Шкаф нам делали около месяца. Привезли, собрали. Глаз оторвать не могли. Прихожка сразу преобразилась! Молодцы ребята.", "d": "3 августа 2024", "n": "Семен Б.", "a": null}, {"r": 5, "t": "Стала счастливой обладательницей красивой и функциональной кухни! Заказали здесь и сразу островной стол, как я давно о нем мечтала. И получился он именно такой! Материал качественный! Цена тоже порадовала! Однозначно рекомендую Madeyra! Ребята там просто профессионалы своего дела!", "d": "2 августа 2024", "n": "Инга К.", "a": null}, {"r": 5, "t": "Грамотные продавцы, видно, что профессионалы, и любой нестандарт делают! Качество меня очень даже устроило, хотя я и придирчивая в этом плане. Так что рекомендую от души.", "d": "24 июля 2024", "n": "Анфиса М.", "a": null}, {"r": 5, "t": "Впечатления положительные. Из достоинств нашей покупки (кухонный гарнитур) хотелось бы отметить то, что все сделали очень быстро и качественно, получилось так как мы и задумывали, цвета подобрали идеально.", "d": "22 июля 2024", "n": "Даниэль И.", "a": null}, {"r": 5, "t": "Отличная компания. Мебель супер. Рекомендую.", "d": "21 июля 2024", "n": "Ульяна А.", "a": null}, {"r": 5, "t": "Заказали туалетный столик. Он был выполнен великолепно, учли все наши пожелания. И сделан в указанные сроки. Я осталась довольна!", "d": "20 июля 2024", "n": "Марина А.", "a": null}, {"r": 5, "t": "Очень нравятся качество продукции, ассортимент (можно выбрать мебель любого стиля, для любого дома или квартиры), варианты расцветок, оперативность и вежливость менеджеров. Всем точно рекомендую.", "d": "19 июля 2024", "n": "Инесса Б.", "a": null}, {"r": 5, "t": "И я теперь обладательница своей любимой кухни, спасибо) Сотрудники действительно слышат, чего ты хочешь, и предлагают достойные варианты😊", "d": "18 июля 2024", "n": "Лариса П.", "a": null}, {"r": 5, "t": "Выбор огромный мебели, подбираешь под свой вкус и размер, что делает покупку еще более удобной. Именно здесь удалось найти шкаф для нашего нестандартного размера прихожки.", "d": "17 июля 2024", "n": "Лилия Ш.", "a": null}, {"r": 5, "t": "Приобретала здесь комод на прошлой неделе. Цены очень хорошие, смотрится шикарно и пользоваться удобно)", "d": "16 июля 2024", "n": "Раиса Ж.", "a": null}, {"r": 5, "t": "Продавцы хорошие, поняли ситуацию и реально помогли с подбором мебели для спальни и прихожей. От оформления заказа до сборки мебели у нас все прошло хорошо, без каких-либо неприятных моментов.", "d": "14 июля 2024", "n": "Галя О.", "a": null}, {"r": 5, "t": "Все отлично, вежливые продавцы. Быстрая доставка. Хорошо проконсультировали. Шкаф хороший.", "d": "13 июля 2024", "n": "Анастасия Х.", "a": null}, {"r": 5, "t": "Магазин очень нравится. Приятно удивляют цены. Они реально по карману) Персонал вежливый, всегда подскажут, никогда не навяжут ненужную вам вещь. Здесь куплены шкаф, кровать и стенка под заказ. Все полностью оправдало мои ожидания.", "d": "12 июля 2024", "n": "Алевтина М.", "a": null}, {"r": 5, "t": "Мы покупали в прихожую шкаф, очень понравилось и обслуживание и прихожая, доставка была даже раньше срока, спасибо вам!", "d": "11 июля 2024", "n": "Валерия И.", "a": null}, {"r": 5, "t": "Кровать для двоих детей очень понравилась, в других магазинах предлагали цену дороже. Все хорошо упаковано, без брака, аккуратно сложено. Собирали сами, все детали на месте и даже с запасом, докупать ничего не пришлось.", "d": "9 июля 2024", "n": "Ева М.", "a": null}, {"r": 5, "t": "Очень ответственный подход к делу. Спасибо! Мы остались довольны. Столешница отличного качества, с размером не подвели.", "d": "8 июля 2024", "n": "Тамара Щ.", "a": null}, {"r": 5, "t": "Кухня понравилась и мне, и супруге. Всё сделали, как обещали. Был небольшой недочет, но вопрос решили.", "d": "7 июля 2024", "n": "Георгий П.", "a": null}, {"r": 5, "t": "Мастера своего дела т.е знают тонкости корпусной мебели. Цена хорошая и изготавливают в высшем качестве. Спасибо большое!", "d": "4 июля 2024", "n": "Саша Е.", "a": null}, {"r": 5, "t": "Прекрасная работа! Великолепная кухня. Я очень довольна! Теперь всем вас рекомендую.", "d": "3 июля 2024", "n": "Валентина П.", "a": null}, {"r": 5, "t": "Творчески подходят к любой просьбе, за что отдельный плюс. Спальный гарнитур прекрасен) И по ширине идеально подошел в нашу комнату.", "d": "2 июля 2024", "n": "Ирина О.", "a": null}, {"r": 5, "t": "Качественно делают свою работу. Мебель отличного качества.", "d": "1 июля 2024", "n": "Денис В.", "a": null}, {"r": 5, "t": "Хорошая мебель, которая проверена нашей семьей временем.", "d": "29 июня 2024", "n": "Ева К.", "a": null}, {"r": 5, "t": "Не смотря на нашу маленькую площадь, сделали идеальную для хозяйки кухоньку. Очень функциональная и красивая. Я очень довольна.", "d": "27 июня 2024", "n": "Лина Ф.", "a": null}, {"r": 5, "t": "Офисную мебель сделали быстро, привезли в удобное время. Столы отличные, комоды с качественными направляющими. 5 баллов.", "d": "26 июня 2024", "n": "Герман А.", "a": null}, {"r": 5, "t": "Заказываем мебель родителям не первый раз. Все хорошо.", "d": "25 июня 2024", "n": "Олеся Т.", "a": null}, {"r": 5, "t": "Заказывал много разной мебели домой - кухня, детская, шкафы - в разное время. Цена приемлемая, качество высокое. Буду заказывать еще.", "d": "24 июня 2024", "n": "Святослав В.", "a": null}, {"r": 5, "t": "Мебель качественная, одним словом покупкой осталась довольна вся наша семья.", "d": "23 июня 2024", "n": "Лилия П.", "a": null}, {"r": 5, "t": "Покупала мебель в детскую. В плане качества претензий не возникает, все отлично. Брака нет.", "d": "22 июня 2024", "n": "Жанна К.", "a": null}, {"r": 5, "t": "Купили комод, просто суперский, сборка лёгкая, все отверстия на месте, фурнитура полный комплект, мы очень довольны, вписался полностью в наш интерьер.", "d": "21 июня 2024", "n": "Эльвира А.", "a": null}, {"r": 5, "t": "Добротная мебель, разумные цены, профессиональные консультанты и просто приятные люди!", "d": "19 июня 2024", "n": "Альбина А.", "a": null}, {"r": 5, "t": "Покупали мебель для дачи, шкаф и детскую кровать, доставили все четко по сроку.", "d": "15 июня 2024", "n": "Ева М.", "a": null}, {"r": 5, "t": "Обращались трижды. Сначала мебель для гостиной, потом для коридора и вот теперь мебель в комнату. Всё чётко, по заказу ставят максимальные сроки, по факту всё гораздо быстрее.", "d": "14 июня 2024", "n": "Фёдор А.", "a": null}, {"r": 5, "t": "Заказывали гостиную. Привезли за три недели, собирали сами. Все подошло по размеру.", "d": "13 июня 2024", "n": "Люба Г.", "a": null}, {"r": 5, "t": "Мебель классная! Глаз радуется! Не в первый раз тут заказываем мебель под заказ, все как новое, фурнитура отличная. Рекомендую)", "d": "11 июня 2024", "n": "Вера Л.", "a": null}, {"r": 5, "t": "Покупали стенку и шкаф в детскую комнату для девочки. Цена-качество, все устроило. Мебель изготовили точно в срок.", "d": "10 июня 2024", "n": "Алиса А.", "a": null}, {"r": 5, "t": "Процветания вашей компании. Заказала шкаф в спальню, команда сработала на отлично. Всем рекомендую!", "d": "9 июня 2024", "n": "Дина А.", "a": null}, {"r": 5, "t": "Я очень довольна своим приобретением встроенного шкафа-купе по индивидуальному проекту. Все ожидания достигнуты. В момент сборки шкафа была приятно удивлена качеством материалов. Места для хранения много, шкафы удобные.", "d": "7 июня 2024", "n": "Валерия И.", "a": null}, {"r": 5, "t": "Отличная мебельная компания. Работают профессионалы. Заказывала кухню, остались очень довольны качеством. Кухня была выполнена в кротчайший срок.", "d": "5 июня 2024", "n": "Кира М.", "a": null}, {"r": 5, "t": "Заказывала торговое оборудование для магазина, все изготовили в срок. Качество отличное. Будем сотрудничать. Спасибо.", "d": "27 мая 2024", "n": "Елена Я.", "a": null}, {"r": 5, "t": "Выполнены все работы на самом лучшем уровне. Качественные материалы, фурнитура, индивидуальный подход к клиенту, только усиливает положительное впечатление от команды", "d": "26 мая 2024", "n": "Влад А.", "a": null}, {"r": 5, "t": "Спасибо вам, вчера получили наш шкаф в спальню, отличный! Жене понравился.", "d": "25 мая 2024", "n": "Семен М.", "a": null}, {"r": 5, "t": "Помогли грамотно и функционально смоделировать кухню, прислушались ко всем пожеланиям. Очень профессиональный монтаж.", "d": "20 мая 2024", "n": "Наталия П.", "a": null}, {"r": 5, "t": "Хорошая мебель. Можно заказать, большой выбор и в наличии и под заказ. Есть доставка и сборка мебели. Это очень упрощает покупку.", "d": "19 мая 2024", "n": "Лилия Г.", "a": null}, {"r": 5, "t": "Качество 🔥🔥🔥 по доступной цене. Наконец-то нашли идеальную компанию по изготовлению мебели.", "d": "17 мая 2024", "n": "Инесса О.", "a": null}, {"r": 5, "t": "Очень довольна вашей работой! Все чётко, аккуратно, спасибо🌼Кухня - мечта любой хозяйки!", "d": "15 мая 2024", "n": "Инна Л.", "a": null}, {"r": 5, "t": "Давно мечтала о комфортном рабочем месте. Теперь оно у меня есть. Спасибо.", "d": "13 мая 2024", "n": "Ярослава К.", "a": null}, {"r": 5, "t": "Пользовалась услугами этой компании трижды, потому что понравилось, что советуют, подсказывают нюансы, заказ выполняют быстро, если возникают вопросы, сразу все решается.", "d": "12 мая 2024", "n": "Клавдия С.", "a": null}, {"r": 5, "t": "Все выполнили качественно, отлично, занесли и быстро собрали на месте. Никаких нареканий и минусов нет. Шкаф - бомба.", "d": "11 мая 2024", "n": "Александра И.", "a": null}, {"r": 5, "t": "Работу выполняют четко, без кормления завтраками. Все в срок, и по плану клиента. Спасибо за новое преображение нашей гостиной.", "d": "9 мая 2024", "n": "Люда Г.", "a": null}, {"r": 5, "t": "Четкое понимание и воплощение моего желания в реальность. Приятно удивлен.", "d": "8 мая 2024", "n": "Юра Г.", "a": null}, {"r": 5, "t": "Заказала прихожую с гардеробной вместе. Выполнили все мои задумки на высшем уровне.", "d": "7 мая 2024", "n": "Зоя Б.", "a": null}, {"r": 5, "t": "Изготовили прекрасную детскую для дочки 3 лет. Все очень красиво, в красивых и нежных тонах. Я осталась очень довольна!", "d": "6 мая 2024", "n": "Клавдия З.", "a": null}, {"r": 5, "t": "Ребята профессионалы своего дела! Всегда все в срок и качественно, адекватные цены. Спасибо 😘", "d": "5 мая 2024", "n": "Надежда О.", "a": null}, {"r": 5, "t": "Заказали гардеробную и прихожую. Качество, цена, сервис - 5 баллов из 5.", "d": "4 мая 2024", "n": "Клавдия Д.", "a": null}, {"r": 5, "t": "Заказали нестандартный шкаф, все аккуратно, под размер и как пожелали в цвете.", "d": "30 апреля 2024", "n": "Даша Л.", "a": null}, {"r": 5, "t": "Заказывали детскую для двух подростков. Все красиво, аккуратно, каждому нашлось максимум места.", "d": "29 апреля 2024", "n": "Оксана С.", "a": null}, {"r": 5, "t": "Отличное качество материала. Работу сделали качественно и раньше срока. Спасибо за маленькую, но такую вместительную гардеробную.", "d": "28 апреля 2024", "n": "Елизавета О.", "a": null}, {"r": 5, "t": "Всё красиво! Качественно! Профессионально! от дизайн проекта до установки!", "d": "26 апреля 2024", "n": "Лина С.", "a": null}, {"r": 5, "t": "Заказывала мебель в комнату, все получилось отлично, красиво, качественно!👍", "d": "24 апреля 2024", "n": "Евгения М.", "a": null}, {"r": 5, "t": "Очень довольны качеством работ. Прекрасно подобрали материал и фурнитуру для нестандартного шкафа.", "d": "23 апреля 2024", "n": "Эрика Я.", "a": null}, {"r": 5, "t": "Отличный магазин. Обширный выбор разнообразной мебели для дома и офиса. Цены на любой кошелек.", "d": "22 апреля 2024", "n": "Анфиса А.", "a": null}, {"r": 5, "t": "Хорошее соотношение цены и качества мебели. Обслуживание очень внимательное.", "d": "21 апреля 2024", "n": "Даша А.", "a": null}, {"r": 5, "t": "Заказывали мебель в прихожую. Вышло и не дорого, и очень симпатично)", "d": "20 апреля 2024", "n": "Гриша Ц.", "a": null}, {"r": 5, "t": "2 месяца назад приобрели здесь кухню. Кухня качественная и очень красивая, до сих пор проблем не было.", "d": "19 апреля 2024", "n": "Зинаида С.", "a": null}, {"r": 5, "t": "Очень приятно было к вам обращаться, кухня очень стильная, большая, удобная! Обязательно вернемся еще за обновками.", "d": "17 апреля 2024", "n": "Инга А.", "a": null}, {"r": 5, "t": "Заказывали в детскую мебель, подобрали все идеально - от размера до дизайна. Дочка оценила по достоинству.", "d": "15 апреля 2024", "n": "Валерия Е.", "a": null}, {"r": 5, "t": "Кухонька понравилась. По качеству никаких нареканий, крепежи отлично держат, ничего не скрипит и даже подтягивать не надо. Советую к приобретению!", "d": "14 апреля 2024", "n": "Кристина Т.", "a": null}, {"r": 5, "t": "Спасибо, жена в восторге. Кухня понравилась. Уложились по срокам к дню рождения.", "d": "12 апреля 2024", "n": "Вова С.", "a": null}, {"r": 5, "t": "Очень зашел именно индивидуальный подход, потому что хотелось конкретно особую мебель, по нашей задумке. И спасибо дизайнерам, которые смогли воплотить в жизнь все именно так, как нам мечталось. Кухня шикарная.", "d": "8 апреля 2024", "n": "Руслан Б.", "a": null}, {"r": 5, "t": "Кухня понравилась, готовить на ней одно удовольствие. За один день все собрали, подключили всю бытовую технику.", "d": "7 апреля 2024", "n": "Зоя П.", "a": null}, {"r": 5, "t": "Заказали детскую по картинке из интернета, сделали идеально, согласно нашим размерам.", "d": "5 апреля 2024", "n": "Клавдия Я.", "a": null}, {"r": 5, "t": "Кухня отличная, не смотря на маленькую площадь, поместилось все. Доставили в удобное время к нам в область.", "d": "4 апреля 2024", "n": "Сергей Ф.", "a": null}, {"r": 5, "t": "Заказала кухню, сделали прямо как я хотела. И цвет шикарный!", "d": "2 апреля 2024", "n": "Мария В.", "a": null}, {"r": 5, "t": "Очень довольна работой салона, грамотно составили проект нашей будущей кухни и воплотили его так, как он и был спроектирован.", "d": "1 апреля 2024", "n": "Роза Б.", "a": null}, {"r": 5, "t": "Заказывали изготовление и доставку шкафа, привезли вовремя, но в комплекте попался брак. Позвонили, заменили, извинились. По качеству нет замечаний.", "d": "30 марта 2024", "n": "Ангелина Т.", "a": null}, {"r": 5, "t": "Все замечательно: от консультации до сборки! Отдельное спасибо за скорость исполнения заказа!!!", "d": "28 марта 2024", "n": "Полина Г.", "a": null}, {"r": 5, "t": "Помогли нам подобрать цвета, дизайн фурнитуры для нашего нового шкафа-купе. Шкаф супер, спасибо за доброжелательность и внимание к клиенту.", "d": "27 марта 2024", "n": "Мария К.", "a": null}, {"r": 5, "t": "Дважды обращалась в этот магазин, заказывала две кухни (в частный дом и квартиру). Очень довольна результатом, качество кухонь на высоте, с учетом того, что они разные и по функционалу, и по цене.", "d": "25 марта 2024", "n": "Алла С.", "a": null}, {"r": 5, "t": "Купили стенку, небольшая по размеру, но функциональная, все есть что нужно. Огромное спасибо продавцам за помощь в выборе😊", "d": "23 марта 2024", "n": "Алла К.", "a": null}, {"r": 5, "t": "Отличный дизайн, широкая цветовая палитра, сборщики приезжают вовремя, работают качественно. Процветания компании)))", "d": "22 марта 2024", "n": "Галя Д.", "a": null}, {"r": 5, "t": "Спальня и кухня в эксплуатации уже два года, претензий к качеству нет. Сейчас обратились за обновлением кухни для свекрови.", "d": "21 марта 2024", "n": "Кирилл Р.", "a": null}, {"r": 5, "t": "Заказывали сыну мебель в спальню! Всё быстро изготовили и привезли ! Менеджер, доставщик и сборщик все настолько чуткие и приятные люди, что осталось незабываемое впечатление!", "d": "20 марта 2024", "n": "Карина В.", "a": null}, {"r": 5, "t": "Ассортимент широкий, есть из чего выбрать, но мы изготавливали спальню по индивидуальному размеру.", "d": "19 марта 2024", "n": "Лидия Б.", "a": null}, {"r": 5, "t": "Хороший магазин и обслуживание на высшем уровне. Менеджер помог с выбором, посоветовал шикарную спальню хорошего качества и по довольно приятной цене.", "d": "18 марта 2024", "n": "Маша И.", "a": null}, {"r": 5, "t": "Несколько раз приобретал здесь готовую и заказывал по эскизам мебель различного назначения. Качество изготовления неплохое, но ценник получился выше среднего.", "d": "17 марта 2024", "n": "Вадик Ф.", "a": null}, {"r": 5, "t": "Хорошее соотношение цены и качество по Нефтеюганску. Не впаривают более дорогие модели при выборе эконом-вариантов.", "d": "16 марта 2024", "n": "Тимур А.", "a": null}, {"r": 5, "t": "Периодически покупаем мебель здесь в офис, нормальная мебель, претензий нет.", "d": "14 марта 2024", "n": "Макар Х.", "a": null}, {"r": 5, "t": "Заказывал много разной мебели домой - кухня, детская, шкафы - в разное время. Цена приемлемая, качество высокое, без сколов и других косяков.", "d": "11 марта 2024", "n": "Даниил Т.", "a": null}, {"r": 5, "t": "Мебель качественная, одним словом покупкой кухни осталась довольна вся наша семья.", "d": "9 марта 2024", "n": "Таисия Д.", "a": null}, {"r": 5, "t": "Купили кухню и 2 детские кровати. Всё доставили и установили быстро. Сборщики мебели молодцы, отлично всё собрали.", "d": "7 марта 2024", "n": "Настя Л.", "a": null}, {"r": 5, "t": "Очень довольны покупкой мебели (шкаф и кухонный гарнитур с большим количеством шкафов для хранения). Консультанты внимательные, помогли сделать выбор по потребностям.", "d": "6 марта 2024", "n": "Антонина Б.", "a": null}, {"r": 5, "t": "Большое спасибо крутым консультантам, что помогли выбрать нам с супругом спальню мечты👍😁", "d": "5 марта 2024", "n": "Роза С.", "a": null}, {"r": 5, "t": "Хорошая не дорогая мебель в наличии. Есть скидки. Удобный расчет.", "d": "3 марта 2024", "n": "Кристина С.", "a": null}, {"r": 5, "t": "Прекрасный магазин, качество, проверенное временем. Уже сколько раз покупаем мебель и себе, и близким, проблем не возникало до сих пор.", "d": "2 марта 2024", "n": "Фёдор К.", "a": null}, {"r": 5, "t": "Недавно приобрели кровать дочке на заказ, все привезли в срок, собрали при нас.", "d": "1 марта 2024", "n": "Валентин С.", "a": null}, {"r": 5, "t": "Недорого. Прилично. Выбор имеется. Жене на годовщину заранее заказывал угловую новую кухню.", "d": "29 февраля 2024", "n": "Ростислав Б.", "a": null}, {"r": 5, "t": "Хорошие скидки на изготовление по индивидуальным размерам, выручали не раз с мебелью.", "d": "28 февраля 2024", "n": "Лилия А.", "a": null}, {"r": 5, "t": "Отношение к клиентам очень внимательное, покупали спальный гарнитур и шкаф для 6-летней дочки. Дизайн выбирала сама, по итогу результат превзошел все наши ожидания. Правда, немного задержались по срокам.", "d": "27 февраля 2024", "n": "Алла М.", "a": null}, {"r": 5, "t": "Компетентные менеджеры, грамотные конструкторы, ответственные замерщики и сборщики воплотили наши мечты в реальность! 😍😍😍Детская получилась уютной, дочке понравилось.", "d": "26 февраля 2024", "n": "Лера Ю.", "a": null}, {"r": 5, "t": "Кухонный гарнитур получился очень красивым и качественным. Срок производства, доставка и сборка исполненный согласно договора и очень порадовала цена.", "d": "25 февраля 2024", "n": "Лия Б.", "a": null}, {"r": 5, "t": "Отличная работа, начиная от замера, изготовления в срок, доставки и сборки. Качество на высшем уровне. Заказывали шкаф в спальню.", "d": "23 февраля 2024", "n": "Елизавета К.", "a": null}, {"r": 5, "t": "Приобретал гардеробную в квартиру, все понравилось. Огромное спасибо сборщикам за помощь в сборке, собрали за 1 рабочий день нашу красавицу!)", "d": "22 февраля 2024", "n": "Анатолий Б.", "a": null}, {"r": 5, "t": "Понравилось все от консультации до качества мебели! Планируем открытие нового филиала - за мебелью только к вам!", "d": "21 февраля 2024", "n": "Вадим В.", "a": null}, {"r": 5, "t": "Большой выбор корпусной мебели и всегда можно заказать что-то индивидуально)", "d": "20 февраля 2024", "n": "Юлия Т.", "a": null}, {"r": 5, "t": "Отличная команда профессионалов в своем деле, закупали мебель для кол-центра, изготовлено качественно и в срок.", "d": "19 февраля 2024", "n": "Антон С.", "a": null}, {"r": 5, "t": "По нашим размерам изготовили шкаф-купе, сделали приятную скидку. Единственное, очень долго ждали изготовление, но в целом результат хороший😊😊😊", "d": "18 февраля 2024", "n": "Нина Т.", "a": null}, {"r": 5, "t": "Не в первый раз мебель здесь покупаем, гостиную уже полностью обставили. Нам нравится, недорого и современно.", "d": "17 февраля 2024", "n": "Оля Л.", "a": null}, {"r": 5, "t": "Добросовестный персонал и современное производство, сооьветствнно и конечный результат", "d": "7 февраля 2024", "n": "Игорь К.", "a": null}, {"r": 5, "t": "Компания не раскрученная, но мебель делают качественно. Заказывал у них шкаф-купе", "d": "6 февраля 2024", "n": "Ярик Б.", "a": null}, {"r": 5, "t": "За разумные деньги изготовили и собрали отличную стенку в зал. Спасибо", "d": "4 февраля 2024", "n": "Людмила М.", "a": null}, {"r": 5, "t": "Спасибо менеджеру на приеме заказов – помогла определиться с выбором кухонной мебели. Изготовили быстро, качество отличное", "d": "3 февраля 2024", "n": "Вячеслав В.", "a": null}, {"r": 5, "t": "Заказывали здесь кухонный гарнитур. Все этапы – замеры, изготовление и монтаж выполнили в срок. Результат радует, спасибо", "d": "3 февраля 2024", "n": "Надя П.", "a": null}, {"r": 5, "t": "Хорошая компания. Ухитряются делать качественную мебель по разумным деньгам. Так держать…", "d": "31 января 2024", "n": "Герман Л.", "a": null}, {"r": 5, "t": "Кухню изготовили и установили четко по договору, качество радует, молодцы", "d": "30 января 2024", "n": "Алина Ф.", "a": null}, {"r": 5, "t": "Заказывали здесь шкаф-купе. Учли все наши пожелания по оформлению, расположению полок, цвету. Спасибо", "d": "29 января 2024", "n": "Кирилл Н.", "a": null}, {"r": 5, "t": "Если не считать небольшую задержку при изготовлении кухонной мебели, все нормально. Качество, сервис, цена – все на уровне", "d": "28 января 2024", "n": "Валентин М.", "a": null}, {"r": 5, "t": "Спасибо большое администрации компании за то, что пошли навстречу и сделали льготы по оплате", "d": "27 января 2024", "n": "Вика М.", "a": null}, {"r": 5, "t": "Работают здесь хорошие мастера. Изготовили для нас красивую мебель в детскую, учли все наши пожелания", "d": "26 января 2024", "n": "Оксана П.", "a": null}, {"r": 5, "t": "По нашим пожеланиям изготовили и смонтировали модульную стенку в зал. Получилось красиво и функционально, спасибо", "d": "24 января 2024", "n": "Раиса Л.", "a": null}, {"r": 5, "t": "Изготовили для нас два шкафа – в прихожую и спальню. Учли все наши пожелания, качеством довольны, спасибо", "d": "22 января 2024", "n": "Леся Т.", "a": null}, {"r": 5, "t": "Небольшой цех, но мебель делают качественную. Знаю по опыту", "d": "21 января 2024", "n": "Павел А.", "a": null}, {"r": 5, "t": "Обращались в несколько мест, только здесь нам обещали изготовить мебель в детскую быстро и по нашим эскизам. Свое слово сдержали, спасибо", "d": "20 января 2024", "n": "Фёдор С.", "a": null}, {"r": 5, "t": "Даже по телефонному разговору с менеджером видно, что компания солидная. Будем заказывать у них кухню", "d": "19 января 2024", "n": "Жанна К.", "a": null}, {"r": 5, "t": "Реально добросовестная компания. В оговоренный срок привезли и установили кухонный гарнитур, претензий к качеству нет", "d": "17 января 2024", "n": "Богдан Я.", "a": null}, {"r": 5, "t": "Достойная компания, уважительно относятся к заказчику. Кухню изготовили качественно и в срок", "d": "16 января 2024", "n": "Анатолий Е.", "a": null}, {"r": 5, "t": "Понравилось отношения к клиентам. Учли все наши пожелания при изготовлении мебели для детской комнаты. Спасибо", "d": "14 января 2024", "n": "Алиса М.", "a": null}, {"r": 5, "t": "Качеством кухонной мебели довольны, сервис понравился, спасибо", "d": "12 января 2024", "n": "Роза С.", "a": null}, {"r": 5, "t": "Кухню изготовили в срок, качеством довольны, спасибо", "d": "11 января 2024", "n": "Вероника Н.", "a": null}, {"r": 5, "t": "У нас кухня нестандартная, готовые решения не вписываются. Ребята изготовили мебель по нашим эскизам и размерам, получилось красиво и добротно", "d": "10 января 2024", "n": "Алиса П.", "a": null}, {"r": 5, "t": "Готового шкафа под наш коридор не нашли, здесь обещали изготовить по нашим размерам и эскизам. Свое слово сдержали, все отлично, спасибо", "d": "9 января 2024", "n": "Лада П.", "a": null}, {"r": 5, "t": "Компания ответственная, заказывали у них стенку и шкаф-купе. Все в срок, качество хорошее, будем обращаться", "d": "8 января 2024", "n": "Арсений Ж.", "a": null}, {"r": 5, "t": "Спасибо за сервис и красивый кухонный гарнитур", "d": "7 января 2024", "n": "Лиза Г.", "a": null}, {"r": 5, "t": "Компания добросовестная, качество, сервис и цены приятные. Знаем по опыту сотрудничества", "d": "6 января 2024", "n": "Арина Т.", "a": null}, {"r": 5, "t": "В свое время заказывали здесь изготовление стенки. Качество и сервис понравились, так что в ближайшее время будем у них заказывать кухонную мебель", "d": "5 января 2024", "n": "Анастасия Т.", "a": null}, {"r": 5, "t": "В прошлом месяце приобрели в этой компании стенку в прихожую. Качеством довольны, сервис понравился", "d": "4 января 2024", "n": "Лидия К.", "a": null}, {"r": 5, "t": "Несколько раз заказывали здесь мебель. Делают все добросовестно, цены адекватные, спасибо", "d": "3 января 2024", "n": "Екатерина Е.", "a": null}, {"r": 5, "t": "Спасибо за красивую и добротную стенку в зал. Цена разумная", "d": "30 декабря 2023", "n": "Рита Б.", "a": null}, {"r": 5, "t": "Заказывали у ребят изготовление стенки в прихожую. Сроки выдержали, качество как хотели, спасибо", "d": "29 декабря 2023", "n": "Валентин Б.", "a": null}, {"r": 5, "t": "Компанию порекомендовали соседи, за что им спасибо. Изготовили по нашим эскизам мебель в детскую, получилось красиво и добротно", "d": "28 декабря 2023", "n": "Таисия С.", "a": null}, {"r": 5, "t": "Спасибо за быстрое изготовление и монтаж заказанного шкафа в спальню. Получилось красиво и функционально, молодцы", "d": "27 декабря 2023", "n": "Антонина Д.", "a": null}, {"r": 5, "t": "Спасибо за быстрое изготовление и монтаж мебели в детскую комнату. Получилось красиво, прочно и функционально", "d": "24 декабря 2023", "n": "Лина Х.", "a": null}, {"r": 5, "t": "Заказывали в компании мебель в детскую комнату, сделали в срок, качество хорошее, спасибо", "d": "23 декабря 2023", "n": "Евгения Ж.", "a": null}, {"r": 5, "t": "Надежная компания, рекомендуем. Заказывали у них кухонный гарнитур, все сделали как надо. Цены средние по региону", "d": "22 декабря 2023", "n": "Злата Р.", "a": null}, {"r": 5, "t": "В компании заказывали кухонную мебель. Изготовили и установили в обещанный срок, все красиво и функционально, спасибо", "d": "21 декабря 2023", "n": "Галина Т.", "a": null}, {"r": 5, "t": "Ответственная и профессиональная компания, рекомендуем. Изготовили по нашим эскизам прекрасную кухонную мебель", "d": "20 декабря 2023", "n": "Ростислав Б.", "a": null}, {"r": 5, "t": "Компанию порекомендовали соседи, они раньше уже обращались к ним. Не разочаровали в обещанный срок изготовили шкаф-купе, качеством довольны", "d": "18 д <script>

}else{
